<script>
'use strict';
/* =====================================================================
   ALPHABET GRAB — say a word in the category, grab its first letter.
   Single file, vanilla JS. Teacher referees every word.
   ===================================================================== */

/*BANK-START*/
const CATS = [];
/*BANK-END*/

// Value of a letter when a category has no word bank: how hard it is to START an English word with it.
const CLASSIC = {
  S: 1, C: 1, P: 1, B: 1, M: 1, A: 1, T: 1, D: 1, R: 1, F: 1,
  H: 2, G: 2, L: 2, W: 2, E: 2, I: 2, N: 2, O: 2,
  K: 3, J: 3, U: 3, V: 3, Y: 3,
  Q: 4, Z: 4,
  X: 5,
};
const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const TEAM_PALETTE = [
  { name: 'Red',    c: '#ef4444' },
  { name: 'Blue',   c: '#3b82f6' },
  { name: 'Green',  c: '#16a34a' },
  { name: 'Orange', c: '#f59e0b' },
  { name: 'Purple', c: '#a855f7' },
  { name: 'Teal',   c: '#0d9488' },
];
const LEVELS = ['A1', 'A2', 'B1'];
const UNDO_DEPTH = 30;
const MUTE_KEY = 'alphabetgrab:mute';
const THEME_KEY = 'arschul:theme';
const SAVE_KEY = 'alphabetgrab:save';
const SETUP_KEY = 'alphabetgrab:setup';
const DEFAULT_SETUP = {
  teams: 2, names: ['', '', '', '', '', ''],
  mode: 'claim', time: 20, boards: 2, challenge: 'on', speed: 'off', level: 'A2',
  cats: [], free: [],
};

/* =====================================================================
   STORAGE
   ===================================================================== */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

/* =====================================================================
   CATEGORIES
   ===================================================================== */
const freeKey = label => 'free:' + label;
function catOf(key) {
  if (typeof key === 'string' && key.startsWith('bank:')) {
    const c = CATS.find(x => x.id === key.slice(5));
    if (c) return { key, label: c.label, icon: c.icon || '', bank: c };
    return { key: freeKey(key.slice(5)), label: key.slice(5), icon: '✏️', free: true };
  }
  const label = String(key || '').replace(/^free:/, '') || 'Anything';
  return { key: freeKey(label), label, icon: '✏️', free: true };
}
function levelIdx(lvl) { const i = LEVELS.indexOf(lvl); return i < 0 ? LEVELS.length - 1 : i; }
function bankWords(c, L, level) {
  if (!c || !c.words || !c.words[L]) return [];
  const max = level === 'ALL' ? 99 : levelIdx(level);
  return c.words[L].filter(w => levelIdx(w[1]) <= max).map(w => w[0]);
}
function valueFromCount(n) { return n >= 6 ? 1 : n >= 4 ? 2 : n >= 2 ? 3 : n === 1 ? 4 : 5; }
/** Letter values and default bans for one board. */
function boardSpec(key, level) {
  const c = catOf(key);
  const values = {}, banned = {};
  if (c.bank) {
    for (const L of ABC) {
      const n = bankWords(c.bank, L, level).length;
      values[L] = valueFromCount(n);
      if (n === 0) banned[L] = true;
    }
  } else {
    for (const L of ABC) values[L] = CLASSIC[L];
  }
  return { values, banned };
}

/* =====================================================================
   WORDS
   ===================================================================== */
function cleanWord(raw) { return String(raw || '').normalize('NFC').replace(/\s+/g, ' ').trim().slice(0, 40); }
function plain(w) { return String(w || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
/** The letter a typed word claims: first letter after any leading a / an / the. Null if there is none. */
function headLetter(w) {
  let s = plain(w).replace(/^[^a-z]+/, '');
  const m = s.match(/^(a|an|the)\s+(?=[a-z])/);
  if (m) s = s.slice(m[0].length);
  const ch = s.charAt(0);
  return /[a-z]/.test(ch) ? ch.toUpperCase() : null;
}
function wordKey(w) {
  let s = plain(w).replace(/[^a-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/^(a|an|the) (?=\S)/, '');
  return s.replace(/ /g, '');
}
/** Parse what the teacher typed: a single letter claims without logging a word. */
function parseEntry(raw) {
  const w = cleanWord(raw);
  if (!w) return null;
  if (/^[A-Za-z]$/.test(w)) return { L: w.toUpperCase(), word: '' };
  const L = headLetter(w);
  return L ? { L, word: w } : { L: null, word: w };
}

/* =====================================================================
   STATE
   ===================================================================== */
let S = null;          // the whole game; plain JSON so it can be saved, snapshotted and restored
let UNDO = [];         // JSON strings of earlier S values
let setup = loadSetup();
const ui = { word: '', msg: null, endArmed: 0, adjust: false, mod: false, peek: false, challenge: false, flash: null, banner: null, dupConfirm: '' };
const CLK = { deadline: 0, lastSec: null };

function loadSetup() {
  const raw = store.get(SETUP_KEY, null) || {};
  const o = Object.assign({}, DEFAULT_SETUP, raw);
  o.teams = Math.min(6, Math.max(2, parseInt(o.teams, 10) || 2));
  o.names = Array.from({ length: 6 }, (_, i) => String((raw.names || [])[i] || '').slice(0, 20));
  if (!['claim', 'race'].includes(o.mode)) o.mode = 'claim';
  if (![0, 10, 20, 30].includes(o.time)) o.time = 20;
  o.boards = Math.min(6, Math.max(1, parseInt(o.boards, 10) || 2));
  if (o.challenge !== 'off') o.challenge = 'on';
  if (o.speed !== 'on') o.speed = 'off';
  if (!['A1', 'A2', 'ALL'].includes(o.level)) o.level = 'A2';
  o.free = (Array.isArray(o.free) ? o.free : []).map(cleanWord).filter(Boolean).slice(0, 12);
  o.cats = (Array.isArray(o.cats) ? o.cats : []).filter(k =>
    (k.startsWith('bank:') && CATS.some(c => 'bank:' + c.id === k)) || (k.startsWith('free:') && o.free.includes(k.slice(5))));
  if (!o.cats.length) {
    if (CATS.length) o.cats = ['bank:' + (CATS.find(c => c.id === 'animals') || CATS[0]).id];
    else { if (!o.free.length) o.free = ['Animals', 'Food and drink']; o.cats = o.free.slice(0, 2).map(freeKey); }
  }
  return o;
}
function saveSetup() { store.set(SETUP_KEY, setup); }

function T() { return S.teams.length; }
function B() { return S.board; }
function team(i) { return S.teams[i]; }
function isRace() { return S.settings.mode === 'race'; }
function timeMs() { return S.settings.time * 1000; }

/** Letters still open to team t on the current board. */
function openFor(t) {
  const b = B();
  return ABC.filter(L => !b.banned[L] && (isRace() ? !(b.claims[t] || {})[L] : !b.claims[L]));
}
function heldBy(t) {
  const b = B();
  if (isRace()) return Object.keys(b.claims[t] || {}).length;
  return Object.values(b.claims).filter(c => c.t === t).length;
}
function playable() { return ABC.filter(L => !B().banned[L]).length; }

function newGame() {
  const teams = Array.from({ length: setup.teams }, (_, i) => ({
    name: setup.names[i].trim() || TEAM_PALETTE[i].name, color: TEAM_PALETTE[i].c, score: 0,
  }));
  S = {
    v: 1, phase: 'intro',
    settings: { mode: setup.mode, time: setup.time, boards: setup.boards, challenge: setup.challenge === 'on', speed: setup.speed === 'on', level: setup.level },
    teams, queue: buildQueue(setup.cats, setup.boards, 0), b: 0, starterOffset: 0,
    board: null, turn: 0, last: null, paused: false,
    clock: { left: 0, running: false }, log: [],
  };
  UNDO = [];
  prepareBoard(0);
}
function buildQueue(cats, n, rot) {
  const list = cats.length ? cats : ['free:Anything'];
  return Array.from({ length: n }, (_, i) => list[(i + rot) % list.length]);
}
function prepareBoard(b) {
  const key = S.queue[b];
  const spec = boardSpec(key, S.settings.level);
  const starter = (b + S.starterOffset) % T();
  S.b = b;
  S.board = {
    key, values: spec.values, banned: spec.banned,
    claims: isRace() ? Object.fromEntries(S.teams.map((_, i) => [i, {}])) : {},
    turns: 0, passStreak: 0, starter, pts: S.teams.map(() => 0), endReason: '',
  };
  S.turn = starter; S.last = null; S.phase = 'intro'; S.paused = false;
  S.clock = { left: timeMs(), running: false };
}

/* =====================================================================
   CLOCK (wall-clock deadline; the saved state only keeps the time left)
   ===================================================================== */
const now = () => performance.now();
function clockLeft() {
  if (!S) return 0;
  return S.clock.running ? Math.max(0, CLK.deadline - now()) : S.clock.left;
}
function syncClock() { if (S && S.clock.running) S.clock.left = clockLeft(); }
function startTurnClock() {
  S.clock.left = timeMs();
  CLK.lastSec = null;
  if (S.settings.time > 0) { S.clock.running = true; CLK.deadline = now() + S.clock.left; }
  else S.clock.running = false;
}
function holdClock() { syncClock(); S.clock.running = false; }
function resumeClock() {
  if (S.settings.time <= 0 || S.phase !== 'play' || S.paused || ui.challenge) return;
  if (S.clock.left < 3000) S.clock.left = 3000;    // never resume straight into a timeout
  S.clock.running = true; CLK.deadline = now() + S.clock.left; CLK.lastSec = null;
}
function clockLoop() {
  if (!S || S.phase !== 'play' || !S.clock.running) return;
  const left = clockLeft();
  paintClock(left);
  const sec = Math.ceil(left / 1000);
  if (sec <= 5 && sec > 0 && sec !== CLK.lastSec) { CLK.lastSec = sec; sfx('tick'); }
  if (left <= 0) timeout();
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function snapshot() {
  syncClock();
  UNDO.push(JSON.stringify(S));
  if (UNDO.length > UNDO_DEPTH) UNDO.shift();
}
function commit() {
  syncClock();
  store.set(SAVE_KEY, { S, UNDO });
  render();
}
function say(s, t) { ui.msg = s ? { s, t: t || 'info' } : null; }

function startBoard() {
  if (!S || S.phase !== 'intro') return;
  if (!openFor(S.turn).length) { say('Open at least one letter first.', 'bad'); render(); return; }
  snapshot();
  S.phase = 'play';
  startTurnClock();
  sfx('pop');
  commit();
}

/** Check a claim without changing anything. Returns {ok, L, word, pts, base, err, dup}. */
function checkClaim(L, word) {
  const b = B(), t = S.turn;
  if (!L) return { ok: false, err: 'Start with a letter' };
  if (b.banned[L]) return { ok: false, L, err: L + ' is closed on this board' };
  if (isRace()) {
    if (b.claims[t][L]) return { ok: false, L, err: team(t).name + ' already has ' + L };
  } else if (b.claims[L]) return { ok: false, L, err: L + ' is already ' + team(b.claims[L].t).name + '’s' };
  const base = b.values[L] * 10;
  let pts = base, fast = false;
  if (S.settings.speed && S.settings.time > 0 && timeMs() - clockLeft() <= timeMs() / 2) { pts = Math.round(base * 1.5); fast = true; }
  let dup = null;
  if (word && isRace()) {
    const k = wordKey(word);
    for (let i = 0; i < T(); i++) for (const LL in b.claims[i]) if (b.claims[i][LL].w && wordKey(b.claims[i][LL].w) === k) dup = i;
  }
  return { ok: true, L, word, base, pts, fast, dup };
}

function claim(L, word, force) {
  if (!S || S.phase !== 'play' || S.paused || ui.challenge) return false;
  const c = checkClaim(L, word);
  if (!c.ok) { say(c.err, 'bad'); sfx('nope'); render(); return false; }
  if (c.dup != null && !force && ui.dupConfirm !== wordKey(word)) {
    ui.dupConfirm = wordKey(word);
    say('“' + word + '” was already said by ' + team(c.dup).name + '. Press Enter again to accept it.', 'bad');
    render(); return false;
  }
  ui.dupConfirm = '';
  snapshot();
  const t = S.turn, b = B();
  const rec = { t, w: word || '', p: c.pts };
  if (isRace()) b.claims[t][L] = rec; else b.claims[L] = rec;
  team(t).score += c.pts;
  b.pts[t] += c.pts;
  S.log.push({ b: S.b, t, L, w: word || '', p: c.pts });
  S.last = { t, L, w: word || '', p: c.pts, base: c.base, ch: (t + 1) % T() };
  b.passStreak = 0;
  ui.word = ''; ui.flash = L;
  say(c.fast ? 'Fast! +50%' : null, 'good');
  sfx('pop');
  endTurn();
  commit();
  return true;
}

function pass(isTimeout) {
  if (!S || S.phase !== 'play' || ui.challenge) return false;
  if (!isTimeout && S.paused) return false;
  snapshot();
  const name = team(S.turn).name;
  B().passStreak++;
  S.last = null;
  ui.word = ''; ui.dupConfirm = '';
  if (isTimeout) { ui.banner = 'TIME’S UP'; sfx('buzz'); say(name + ' ran out of time.', 'bad'); }
  else { sfx('pass'); say(name + ' passed.'); }
  endTurn();
  commit();
  return true;
}
function timeout() { if (S.clock.running) { S.clock.running = false; S.clock.left = 0; pass(true); } }

/** After a claim or pass: end the board or hand the turn on. */
function endTurn() {
  const b = B();
  b.turns++;
  let reason = '';
  if (isRace()) {
    const done = S.teams.map((_, i) => !openFor(i).length);
    if (done.some(Boolean) && b.turns % T() === 0) reason = 'done';
  } else if (!openFor(S.turn).length) reason = 'full';
  if (!reason && b.passStreak >= T()) reason = 'stuck';
  S.turn = (S.turn + 1) % T();
  if (reason) { endBoard(reason); return; }
  startTurnClock();
}
function endBoard(reason) {
  const b = B();
  b.endReason = reason;
  S.phase = 'boardEnd';
  S.clock.running = false;
  ui.word = '';
  sfx('board');
}

function nextBoard() {
  if (!S || S.phase !== 'boardEnd') return;
  snapshot();
  if (S.b + 1 >= S.settings.boards) { finishGame(); return; }
  prepareBoard(S.b + 1);
  ui.msg = null;
  commit();
}
function finishGame() {
  S.phase = 'end'; S.clock.running = false; S.paused = false; ui.challenge = false;
  ui.endArmed = 0;
  commit();
  sfx('fanfare');
  const top = standings().filter(r => r.place === 1);
  if (top.length && top[0].score > 0) top.forEach(r => confetti(r.color));
}
function armEnd() {
  if (!S || S.phase === 'end') return;
  const t = Date.now();
  if (ui.endArmed && t - ui.endArmed < 3000) { snapshot(); finishGame(); return; }
  ui.endArmed = t;
  render();
  setTimeout(() => { if (ui.endArmed === t) { ui.endArmed = 0; render(); } }, 3000);
}

/* ---------- challenge (fixed stakes, only the next team, only the last word) ---------- */
function canChallenge() {
  if (!S || !S.settings.challenge || !S.last || S.paused) return false;
  if (S.phase === 'play') return S.turn === S.last.ch;
  return S.phase === 'boardEnd';
}
function openChallenge() {
  if (!canChallenge() || ui.challenge) return;
  ui.challenge = true;
  if (S.phase === 'play') holdClock();
  render();
}
function closeChallenge() { ui.challenge = false; resumeClock(); commit(); }
function ruleChallenge(rejected) {
  if (!ui.challenge || !S.last) return;
  snapshot();
  const l = S.last, b = B();
  if (rejected) {
    team(l.t).score -= l.p; b.pts[l.t] -= l.p;
    team(l.ch).score += l.base; b.pts[l.ch] += l.base;
    if (isRace()) delete b.claims[l.t][l.L]; else delete b.claims[l.L];
    for (let i = S.log.length - 1; i >= 0; i--) { const e = S.log[i]; if (e.b === S.b && e.t === l.t && e.L === l.L) { S.log.splice(i, 1); break; } }
    if (S.phase === 'boardEnd') {          // the last word of the board was rejected: the board opens again
      S.phase = 'play'; S.turn = l.ch; b.endReason = ''; b.passStreak = 0;
      startTurnClock(); S.clock.running = false;
    }
    say(team(l.ch).name + ' wins the challenge: ' + l.L + ' is open again.', 'good');
    sfx('bad');
  } else {
    team(l.ch).score -= l.base; b.pts[l.ch] -= l.base;
    say('The word stands. ' + team(l.ch).name + ' loses ' + l.base + '.', 'bad');
    sfx('ok');
  }
  S.last = null;
  ui.challenge = false;
  resumeClock();
  commit();
}

/* ---------- teacher controls ---------- */
function togglePause() {
  if (!S || S.phase !== 'play' || ui.challenge) return;
  if (S.paused) { S.paused = false; resumeClock(); }
  else { holdClock(); S.paused = true; }
  commit();
}
function resumeHeld() { if (S && S.phase === 'play' && !S.paused && !S.clock.running) { resumeClock(); commit(); } }
function adjust(i, d) {
  if (!S) return;
  snapshot();
  team(i).score += d;
  commit();
}
function undo() {
  if (!UNDO.length) return false;
  S = JSON.parse(UNDO.pop());
  S.clock.running = false;          // undo never restarts the clock by itself
  S.paused = false;
  ui.challenge = false; ui.word = ''; ui.dupConfirm = ''; ui.endArmed = 0;
  say('Undone. Clock is stopped until the next turn or ▶ Resume.');
  document.body.classList.toggle('playing', S.phase !== 'end');
  commit();
  return true;
}
function setTurn(i) {
  if (!S || S.phase !== 'play' || S.turn === i || ui.challenge) return;
  snapshot();
  S.turn = i; S.last = null;
  startTurnClock();
  say(team(i).name + ' has the turn.');
  commit();
}

/** Standard competition ranking: 1, 1, 3 … */
function standings() {
  const rows = S.teams.map((t, i) => ({ i, name: t.name, color: t.color, score: t.score, letters: S.log.filter(e => e.t === i).length }));
  rows.sort((a, b) => b.score - a.score || a.i - b.i);
  rows.forEach((r, k) => { r.place = k > 0 && r.score === rows[k - 1].score ? rows[k - 1].place : k + 1; });
  return rows;
}

function rematch() {
  const old = S;
  const off = (old.starterOffset + 1) % old.teams.length;
  setup.teams = old.teams.length;
  newGame();
  S.teams.forEach((t, i) => { t.name = old.teams[i].name; });
  S.starterOffset = off;
  S.queue = buildQueue(setup.cats, S.settings.boards, (old.b + 1));
  prepareBoard(0);
  document.body.classList.add('playing');
  commit();
}
function toSetup() {
  S = null; UNDO = [];
  store.del(SAVE_KEY);
  document.body.classList.remove('playing');
  render();
}

/* =====================================================================
   SOUND (Web Audio, synthesised — no files, one shared context)
   ===================================================================== */
const snd = { ctx: null, muted: store.get(MUTE_KEY, false) === true };
function actx() {
  if (snd.muted) return null;
  try {
    if (!snd.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; snd.ctx = new C(); }
    if (snd.ctx.state === 'suspended') { const p = snd.ctx.resume(); if (p && p.catch) p.catch(() => {}); }
    return snd.ctx;
  } catch (e) { return null; }
}
function tone(freq, dur, o = {}) {
  const c = actx(); if (!c) return;
  try {
    const t = c.currentTime + (o.at || 0), vol = o.vol || 0.14;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq + o.slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.03);
    osc.onended = () => { try { osc.disconnect(); g.disconnect(); } catch (e) {} };
  } catch (e) { /* audio is optional */ }
}
const SFX = {
  pop()     { tone(520, 0.10, { type: 'triangle', slide: 260 }); tone(780, 0.12, { at: 0.06, type: 'triangle', vol: 0.1 }); },
  tick()    { tone(880, 0.06, { type: 'square', vol: 0.05 }); },
  buzz()    { tone(160, 0.45, { type: 'sawtooth', vol: 0.09, slide: -60 }); },
  pass()    { tone(330, 0.14, { type: 'sine', slide: -90 }); },
  nope()    { tone(220, 0.12, { type: 'square', vol: 0.06 }); },
  ok()      { [523, 659, 784].forEach((f, i) => tone(f, 0.2, { at: i * 0.08, type: 'triangle' })); },
  bad()     { [392, 311].forEach((f, i) => tone(f, 0.25, { at: i * 0.14, type: 'sawtooth', vol: 0.07 })); },
  board()   { [392, 523, 659, 784].forEach((f, i) => tone(f, 0.26, { at: i * 0.1, type: 'triangle' })); },
  fanfare() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.34, { at: i * 0.12, type: 'triangle' })); },
};
function sfx(name) { try { SFX[name](); } catch (e) {} }
function toggleSound() { snd.muted = !snd.muted; store.set(MUTE_KEY, snd.muted); paintUtil(); if (!snd.muted) sfx('pop'); }

/* =====================================================================
   THEME (same key and values as the shared leaf script, which takes over the toggle when it loads)
   ===================================================================== */
const THEME_FACE = { dark: '\u{1F319}', light: '☀️', system: '\u{1F5A5}️' };
const THEME_LABEL = { dark: 'Dark theme', light: 'Light theme', system: 'Match system theme' };
function readTheme() { try { return localStorage.getItem(THEME_KEY) || 'dark'; } catch (e) { return 'dark'; } }
function paintTheme(v) {
  let eff = v;

    h('div', { class: 'starts' }, teamTag(S.turn, team(S.turn).name + ' starts')),
    h('div', { class: 'strip' }, ABC.map(L => tileFor(L, { view: S.turn, onclick: toggleBan, noDots: true }))),
    h('div', { class: 'note' }, 'Click a letter to close or open it for this board. ' + playable() + ' letters open.'),
    h('div', { class: 'ctl' },
      h('select', { 'aria-label': 'Category for this board', onchange: e => changeCat(e.target.value) }, options),
      h('input', { id: 'introfree', class: 'field', style: 'max-width:240px', maxlength: 40, placeholder: 'or type another category',
        onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); const v = cleanWord(e.target.value); if (v) { if (!setup.free.includes(v)) { setup.free.unshift(v); setup.free = setup.free.slice(0, 12); saveSetup(); } changeCat(freeKey(v)); } } } })),
    h('div', { class: 'ctl' },
      UNDO.length ? h('button', { class: 'tool', type: 'button', onclick: undo }, '↶ Undo') : null,
      h('button', { class: 'big-btn', type: 'button', id: 'startboard', onclick: startBoard, disabled: !openFor(S.turn).length }, 'Start board ▶'),
      h('button', { class: 'tool danger' + (ui.endArmed ? ' armed' : ''), type: 'button', onclick: armEnd }, ui.endArmed ? 'Click again to end' : '⏹ End game'),
      ...utilButtons()),
    ui.msg ? h('div', { class: 'note warn' }, ui.msg.s) : null,
    h('div', { class: 'note' }, h('kbd', null, 'Enter'), ' starts the board'));
}

/* ---------- BOARD END ---------- */
const REASONS = {
  full: 'Every open letter has been grabbed.',
  stuck: 'Every team passed in a row, so the board is closed.',
  done: 'A team finished its alphabet and the round is complete.',
};
function renderBoardEnd() {
  const b = B(), c = catOf(b.key);
  const last = S.b + 1 >= S.settings.boards;
  const views = isRace() ? S.teams.map((_, i) => i) : [null];
  const left = isRace() ? [] : openFor(0);
  return h('div', { class: 'stage', style: 'justify-content:flex-start;padding-top:10px;overflow:auto' },
    h('div', { class: 'kicker' }, 'Board ' + (S.b + 1) + ' of ' + S.settings.boards + ' complete'),
    h('div', { class: 'big', style: 'font-size:clamp(2rem,5vw,3.6rem)' }, (c.icon ? c.icon + ' ' : '') + c.label),
    h('div', { class: 'note', style: 'font-size:.95rem' }, REASONS[b.endReason] || ''),
    h('div', { class: 'bpts' }, S.teams.map((t, i) => h('span', { class: 'chip', style: '--c:' + t.color }, t.name + ' ', h('b', { style: 'font-family:var(--font-display);font-weight:400' }, (b.pts[i] >= 0 ? '+' : '') + b.pts[i])))),
    views.map(v => h('div', null,
      v != null ? h('div', { style: 'font-weight:900;margin:4px 0' }, team(v).name) : null,
      h('div', { class: 'strip mini', style: '--tilepx:' + (isRace() && T() > 2 ? 'clamp(34px,3.6vw,48px)' : 'clamp(48px,5.6vw,74px)') },
        ABC.map(L => tileFor(L, { view: v == null ? 0 : v, noDots: true, noWords: isRace() && T() > 2 }))))),
    left.length ? h('div', { class: 'note' }, 'Nobody grabbed: ' + left.join(' ')) : null,
    renderMissed(left),
    h('div', { class: 'ctl', style: 'margin-top:6px' },
      h('button', { class: 'tool', type: 'button', onclick: undo, disabled: !UNDO.length }, '↶ Undo'),
      canChallenge() ? h('button', { class: 'tool', type: 'button', onclick: openChallenge }, '⚖ Challenge the last word') : null,
      h('button', { class: 'big-btn', type: 'button', id: 'nextboard', onclick: nextBoard }, last ? 'Results ▶' : 'Next board ▶'),
      ...utilButtons()),
    lecterns());
}
function renderMissed(left) {
  const c = catOf(B().key);
  if (!c.bank || !left.length) return null;
  const items = left.map(L => [L, bankWords(c.bank, L, S.settings.level).slice(0, 3)]).filter(x => x[1].length);
  if (!items.length) return null;
  return h('div', { class: 'peek', style: 'position:static;transform:none;margin:4px auto' }, h('div', { style: 'font-weight:900;margin-bottom:2px' }, 'You could have said:'),
    items.map(([L, w]) => h('span', null, h('b', null, L), w.join(', '))));
}

/* ---------- CHALLENGE ---------- */
function renderChallenge() {
  const l = S.last;
  const owner = team(l.t), ch = team(l.ch);
  return h('div', { class: 'overlay', onclick: e => { if (e.target.classList.contains('overlay')) closeChallenge(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-label': 'Challenge' },
      h('h2', null, '⚖ Challenge!'),
      h('p', null, ch.name + ' challenges ' + owner.name + '’s word for ' + l.L + ':'),
      h('div', { class: 'word' }, l.w || l.L),
      h('p', null, 'Does it fit “' + catOf(B().key).label + '”?'),
      h('div', { class: 'acts' },
        h('button', { type: 'button', class: 'act bad', id: 'reject', onclick: () => ruleChallenge(true) }, '✗ Reject the word',
          h('small', null, owner.name + ' −' + l.p + ', ' + ch.name + ' +' + l.base + ', ' + l.L + ' opens')),
        h('button', { type: 'button', class: 'act good', id: 'stands', onclick: () => ruleChallenge(false) }, '✓ The word stands',
          h('small', null, ch.name + ' −' + l.base))),
      h('div', { class: 'acts' }, h('button', { type: 'button', class: 'act plain', onclick: closeChallenge }, 'Cancel (Esc)'))));
}

/* ---------- END ---------- */
function wordListText() {
  const lines = [];
  for (let b = 0; b <= S.b && b < S.queue.length; b++) {
    const entries = S.log.filter(e => e.b === b && e.w);
    if (!entries.length) continue;
    lines.push('Board ' + (b + 1) + ': ' + catOf(S.queue[b]).label);
    entries.slice().sort((a, c) => a.L.localeCompare(c.L) || a.t - c.t).forEach(e => lines.push(e.L + '  ' + e.w + '  (' + team(e.t).name + ')'));
    lines.push('');
  }
  return lines.join('\n').trim();
}
function copyWords() {
  const text = wordListText();
  const done = () => { say('Word list copied.', 'good'); render(); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); return; }
  } catch (e) {}
  fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = h('textarea', { style: 'position:fixed;left:-9999px' }); ta.value = text; document.body.append(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove(); done();
}
function renderEnd() {
  const rows = standings();
  const places = [...new Set(rows.map(r => r.place))].slice(0, 3);
  const order = places.length >= 2 ? [places[1], places[0], places[2]].filter(p => p != null) : places;
  const heights = { 0: 210, 1: 165, 2: 130 };
  const podium = h('div', { class: 'podium' }, order.map(p => {
    const group = rows.filter(r => r.place === p);
    const rank = places.indexOf(p);
    return h('div', { style: 'display:flex;gap:8px;align-items:flex-end' }, group.map(r => {
      const c = tagColors(r.color);
      return h('div', { class: 'step', style: 'height:' + heights[rank] + 'px;background:' + c.bg + ';color:' + c.ink },
        h('div', { class: 'pl' }, ['1st', '2nd', '3rd', '4th', '5th', '6th'][p - 1]), h('div', { class: 'nm' }, r.name), h('div', { class: 'sc' }, r.score));
    }));
  }));
  const boards = [];
  for (let b = 0; b <= S.b && b < S.queue.length; b++) {
    const entries = S.log.filter(e => e.b === b);
    if (!entries.length) continue;
    boards.push(h('div', { class: 'panel' }, h('h3', null, 'Board ' + (b + 1) + ': ' + catOf(S.queue[b]).label),
      h('ul', null, entries.slice().sort((a, c) => a.L.localeCompare(c.L) || a.t - c.t).map(e =>
        h('li', null, h('i', { style: 'background:' + team(e.t).color }), h('b', null, e.L), e.w || '—')))));
  }
  const hasWords = S.log.some(e => e.w);
  return h('div', { id: 'end' },
    h('div', { class: 'logo' }, 'Alphabet ', h('span', null, 'Grab')),
    podium,
    h('table', { class: 'results' },
      h('thead', null, h('tr', null, h('th', null, 'Place'), h('th', null, 'Team'), h('th', null, 'Letters'), h('th', { style: 'text-align:right' }, 'Points'))),
      h('tbody', null, rows.map(r => h('tr', null, h('td', null, r.place), h('td', null, h('span', { class: 'swatch', style: 'display:inline-block;vertical-align:-3px;margin-right:6px;background:' + r.color }), r.name),
        h('td', null, r.letters), h('td', { class: 'num' }, r.score))))),
    ui.msg ? h('div', { class: 'note' }, ui.msg.s) : null,
    h('div', { class: 'setup-actions' },
      h('button', { class: 'tool', type: 'button', onclick: undo, disabled: !UNDO.length }, '↶ Undo'),
      hasWords ? h('button', { class: 'tool', type: 'button', onclick: copyWords }, '\u{1F4CB} Copy word list') : null,
      h('button', { class: 'big-btn', type: 'button', id: 'rematch', onclick: rematch }, 'Rematch'),
      h('button', { class: 'big-btn alt', type: 'button', id: 'newgame', onclick: toSetup }, 'New game'),
      ...utilButtons()),
    boards.length ? h('div', { class: 'wordlists' }, boards) : null);
}
function confetti(color) {
  if (matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = [color, '#fbbf24', '#ffffff', '#38bdf8'];
  for (let i = 0; i < 90; i++) {
    const el = h('div', { class: 'confetti', style: 'left:' + Math.random() * 100 + 'vw;width:' + (6 + Math.random() * 6) + 'px;height:' + (8 + Math.random() * 8) + 'px;background:' + colors[i % colors.length] + ';animation-duration:' + (2.2 + Math.random() * 2) + 's;animation-delay:' + Math.random() * 0.6 + 's' });
    document.body.append(el);
    setTimeout(() => el.remove(), 5000);
  }
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
function onKey(e) {
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Control' || e.key === 'Meta') { if (!ui.mod) { ui.mod = true; const l = document.querySelector('.lecterns'); if (l) l.classList.add('show-adj'); } return; }
  if (!S) return;
  if (mod && !e.altKey && !e.shiftKey) {
    const k = e.key.toLowerCase();
    const map = { z: undo, p: togglePause, s: () => pass(false), k: openChallenge, e: armEnd };
    if (k === 'i') { e.preventDefault(); if (!ui.peek && S.phase === 'play') { ui.peek = true; render(); } return; }
    if (map[k]) { e.preventDefault(); map[k](); return; }
    return;
  }
  if (ui.challenge) { if (e.key === 'Escape') { e.preventDefault(); closeChallenge(); } return; }
  const tag = (e.target && e.target.tagName) || '';
  const inField = (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') && e.target.id !== 'word';
  if (inField) return;
  if (e.key === 'Enter') {
    if (S.phase === 'intro' && !e.target.closest('button')) { e.preventDefault(); startBoard(); }
    else if (S.phase === 'boardEnd' && !e.target.closest('button')) { e.preventDefault(); nextBoard(); }
  } else if (S.phase === 'play' && !S.paused && e.target.id !== 'word' && e.key.length === 1 && !e.altKey) {
    // a stray focus elsewhere: send typing to the word bar
    const wb = $('word'); if (wb) wb.focus();
  }
}
function onKeyUp(e) {
  if (e.key === 'Control' || e.key === 'Meta') { ui.mod = false; const l = document.querySelector('.lecterns'); if (l && !ui.adjust) l.classList.remove('show-adj'); }
  if ((e.key === 'i' || e.key === 'I' || e.key === 'Control' || e.key === 'Meta') && ui.peek) { ui.peek = false; render(); }
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { ui.mod = false; if (ui.peek) { ui.peek = false; render(); } });
  window.addEventListener('resize', sizeBoard);
  if (window.ResizeObserver) new ResizeObserver(() => sizeBoard()).observe(document.body);
  document.addEventListener('pointerdown', () => actx(), { once: true });
  setInterval(clockLoop, 100);
  setInterval(() => { if (S && S.phase === 'play' && S.clock.running) { syncClock(); store.set(SAVE_KEY, { S, UNDO }); } }, 2000);
  render();
}
boot();
</script>
