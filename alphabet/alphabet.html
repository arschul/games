<style>
  /* =====================================================================
     ALPHABET GRAB — letterpress print shop.
     Walnut type case (hero), maple wood-type blocks, brass plates, kraft proof sheets.
     Designed on a 1920×1080 stage that scales to fit.
     ===================================================================== */
  :root {
    color-scheme: dark;
    --walnut: #4a2e1b; --walnut-d: #24150b; --walnut-l: #6b4428;
    --maple: #ecd1a2; --maple-d: #cf9f62; --maple-edge: #8a5a2a;
    --brass: #d6ad4a; --brass-l: #f6dc85; --brass-d: #86661c;
    --kraft: #dcc396; --kraft-l: #f1e3c3; --kraft-d: #ad8e58;
    --ink: #24180f; --ink-soft: #5c4532;
    --go: #2f9a5c; --go-l: #45bd78; --go-d: #1a5f37;
    --danger: #d3352c; --danger-l: #ec5a46; --danger-d: #8a1a14;
    /* scene: the only thing the theme changes */
    --sc-wall-1: #22150d; --sc-wall-2: #100905; --sc-drawer: #29190f; --sc-drawer-hi: #352214; --sc-pull: #5a4520;
    --sc-lamp: rgba(255, 186, 104, .28); --sc-bench: #3b2416; --sc-bench-hi: #5c3b22; --sc-vig: rgba(0, 0, 0, .55);
    --letterbox: #0d0805;
    --page-ink: #f5e7cc; --page-soft: #d2b994; --headline: #f2c95f;
    --TC: #e23b3b;
    --tilepx: 150px;
    --font-display: 'Alfa Slab One', 'Rockwell', Georgia, serif;
    --font-ui: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --sc-wall-1: #f1e5cc; --sc-wall-2: #dcc8a4; --sc-drawer: #e2cfac; --sc-drawer-hi: #efe2c6; --sc-pull: #b7995a;
    --sc-lamp: rgba(255, 250, 230, .6); --sc-bench: #a8784a; --sc-bench-hi: #c4925e; --sc-vig: rgba(90, 60, 30, .22);
    --letterbox: #cfb98f;
    --page-ink: #2a1a0e; --page-soft: #5e432a; --headline: #8a3c10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 22px; }
  html, body { height: 100%; }
  body { font-family: var(--font-ui); background: var(--letterbox); color: var(--page-ink); overflow: hidden; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select { font: inherit; color: inherit; }
  .hidden { display: none !important; }
  kbd { font: 800 16px var(--font-ui); background: rgba(60, 35, 15, .14); border: 1px solid rgba(60, 35, 15, .3); border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
  .stage kbd, .keystrip kbd, .keys-help kbd { background: rgba(255, 235, 200, .1); border-color: rgba(255, 235, 200, .28); }
  :root[data-theme="light"] .stage kbd, :root[data-theme="light"] .keystrip kbd, :root[data-theme="light"] .keys-help kbd { background: rgba(60, 35, 15, .1); border-color: rgba(60, 35, 15, .3); }

  .back-link {
    position: fixed; top: 10px; left: 10px; z-index: 100;
    padding: 6px 14px 7px; border-radius: 8px; text-decoration: none;
    font: 800 14px/1.2 var(--font-ui); color: var(--ink);
    background: linear-gradient(180deg, var(--maple), var(--maple-d));
    box-shadow: 0 3px 0 var(--maple-edge), 0 6px 12px rgba(0,0,0,.35); opacity: .9;
  }
  .back-link:hover { opacity: 1; }
  body.playing .back-link { display: none; }
  body.playing a[title="Classroom Hub"] { display: none !important; }

  /* ---------- stage ---------- */
  #stage { position: fixed; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--s, 1)); transform-origin: 50% 50%; overflow: hidden; }
  #scene { position: absolute; inset: 0; z-index: 0; }
  #scene svg { width: 100%; height: 100%; display: block; }
  #shaker { position: absolute; inset: 0; z-index: 1; }
  #app { position: absolute; inset: 0; padding: 22px 30px; }
  #flash { position: absolute; inset: 0; z-index: 65; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, rgba(211,53,44,0) 30%, rgba(211,53,44,.8) 100%); }
  #fx { position: absolute; inset: 0; z-index: 60; pointer-events: none; overflow: hidden; }
  #parts { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 70; pointer-events: none; }

  /* ---------- materials ---------- */
  .wood {
    background:
      radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
      repeating-linear-gradient(91deg, rgba(120,66,24,.10) 0 2px, rgba(0,0,0,0) 2px 7px),
      repeating-linear-gradient(89.3deg, rgba(95,52,18,.08) 0 1px, rgba(0,0,0,0) 1px 11px),
      linear-gradient(180deg, var(--maple), var(--maple-d));
  }
  .peg {
    --mc: #e23b3b; --pz: 46px;
    width: var(--pz); height: var(--pz); border-radius: 50%; flex-shrink: 0;
    display: inline-grid; place-items: center; font-size: calc(var(--pz) * .54); line-height: 1;
    background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.6), rgba(255,255,255,0) 30%),
                radial-gradient(circle at 50% 62%, var(--mc), color-mix(in srgb, var(--mc) 50%, #000) 105%);
    box-shadow: 0 3px 0 color-mix(in srgb, var(--mc) 45%, #000), 0 7px 9px rgba(0,0,0,.45), inset 0 -3px 5px rgba(0,0,0,.25);
  }

  /* ---------- shared bits ---------- */
  .panel {
    position: relative; color: var(--ink); padding: 18px 26px 20px; border-radius: 5px 9px 7px 11px;
    background:
      radial-gradient(ellipse at 18% 8%, rgba(255,255,255,.3), rgba(255,255,255,0) 50%),
      repeating-linear-gradient(0deg, rgba(110,80,35,.035) 0 2px, rgba(0,0,0,0) 2px 5px),
      linear-gradient(175deg, var(--kraft-l), var(--kraft));
    box-shadow: 0 2px 0 var(--kraft-d), 0 18px 30px rgba(0,0,0,.42);
  }
  .panel::after { content: ''; position: absolute; inset: 8px; border: 3px double rgba(80,50,20,.32); border-radius: 3px; pointer-events: none; }
  .panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.1; margin-bottom: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; margin: 8px 0; flex-wrap: wrap; }
  .row > label { font-weight: 800; font-size: 22px; }
  .seg { display: inline-flex; background: rgba(60,35,15,.16); border-radius: 12px; padding: 4px; gap: 3px; flex-wrap: wrap; box-shadow: inset 0 2px 4px rgba(60,35,15,.25); }
  .seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 9px; font-weight: 800; font-size: 20px; color: var(--ink-soft); }
  .seg button.on { color: var(--ink); background: linear-gradient(180deg, var(--maple), var(--maple-d)); box-shadow: 0 3px 0 var(--maple-edge), inset 0 1px 0 rgba(255,255,255,.5); }

  .note.warn { color: #a23310; font-weight: 800; }

  .big-btn {
    height: 84px; padding: 0 48px; border-radius: 20px; border: 0; color: #2b1a06;
    font-family: var(--font-display); font-size: 36px; line-height: 1;
    background: linear-gradient(180deg, var(--brass-l), var(--brass) 55%, #b98d2c);
    box-shadow: 0 8px 0 var(--brass-d), 0 18px 28px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.55);

  .big-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 2px 0 var(--brass-d), 0 8px 14px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.55); }
  .big-btn.alt { color: var(--ink); background: linear-gradient(180deg, var(--maple), var(--maple-d)); box-shadow: 0 8px 0 var(--maple-edge), 0 18px 28px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.5); }

  @keyframes breathe { 50% { box-shadow: 0 8px 0 var(--brass-d), 0 18px 28px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.55), 0 0 34px rgba(246,220,133,.65); } }

  .tool {
    height: 54px; padding: 0 18px; border: 0; border-radius: 12px; font-weight: 800; font-size: 20px; color: var(--ink); white-space: nowrap;
    background:
      repeating-linear-gradient(91deg, rgba(120,66,24,.09) 0 2px, rgba(0,0,0,0) 2px 7px),
      linear-gradient(180deg, var(--maple), var(--maple-d));
    box-shadow: 0 5px 0 var(--maple-edge), 0 10px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .1s, box-shadow .1s;
  }
  .tool:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--maple-edge), 0 4px 8px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  .tool:disabled { opacity: .42; cursor: not-allowed; }
  .tool.on { background: linear-gradient(180deg, var(--brass-l), var(--brass)); box-shadow: 0 5px 0 var(--brass-d), 0 10px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.55); }
  .tool.danger.armed { color: #fff; background: linear-gradient(180deg, var(--danger-l), var(--danger)); box-shadow: 0 5px 0 var(--danger-d), 0 10px 16px rgba(0,0,0,.35); }
  .chip { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); border-radius: 10px; padding: 8px 16px 10px; font-weight: 800; font-size: 22px; white-space: nowrap;
    background: linear-gradient(180deg, var(--maple), var(--maple-d)); box-shadow: 0 4px 0 var(--maple-edge), 0 8px 14px rgba(0,0,0,.3), inset 0 -6px 0 var(--c, transparent); }
  .spacer { flex: 1; }

  /* ---------- SETUP ---------- */
  #setup { height: 1036px; max-width: 1760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .logo { display: flex; justify-content: center; align-items: flex-end; gap: 7px; padding-top: 4px; }
  .logo .lt { width: 74px; height: 84px; display: grid; place-items: center; font: 64px/1 var(--font-display); color: #3a2312; border-radius: 7px;
    text-shadow: 0 1px 0 rgba(255,255,255,.4), 0 -1px 0 rgba(0,0,0,.3);
    box-shadow: 0 6px 0 var(--maple-edge), 0 12px 16px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.55); }
  .logo .lt.hot { color: #fff6e6; text-shadow: 0 2px 0 rgba(0,0,0,.3);
    background: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,.3), rgba(255,255,255,0) 55%), repeating-linear-gradient(91deg, rgba(0,0,0,.08) 0 2px, rgba(0,0,0,0) 2px 7px), linear-gradient(180deg, #ef7a3a, #c84a14);
    box-shadow: 0 6px 0 #7a2a08, 0 12px 16px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.4); }
  .logo .gap { width: 28px; }
  .logo.anim .lt { animation: drop .55s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes drop { 0% { transform: translateY(-140px) rotate(-8deg); opacity: 0; } 70% { transform: translateY(4px) scale(1.05,.92); opacity: 1; } 100% { transform: none; } }
  .tagline { text-align: center; color: var(--page-soft); font-weight: 700; font-size: 24px; }
  .setup-grid { flex: 1; min-height: 0; align-items: start; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.22fr); gap: 26px; }
  .setup-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; }
  .team-inputs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 14px; margin-top: 6px; }
  .ti { display: flex; align-items: center; gap: 10px; }
  .ti .peg { --pz: 42px; }
  .ti input, .field { flex: 1; min-width: 0; height: 52px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--kraft-d); background: #f8eed8; color: var(--ink); font-weight: 700; font-size: 21px; box-shadow: inset 0 2px 4px rgba(80,50,20,.18); }
  .ti input:focus, .field:focus { outline: none; border-color: var(--brass-d); box-shadow: inset 0 2px 4px rgba(80,50,20,.18), 0 0 0 4px rgba(214,173,74,.45); }
  .cat-groups { display: grid; gap: 10px; margin-top: 6px; }
  .cat-group h3 { font: 400 20px var(--font-display); color: var(--ink-soft); margin-bottom: 6px; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .cchip { border: 2px solid var(--kraft-d); background: rgba(255,250,235,.35); border-radius: 6px; padding: 5px 13px 6px; font-weight: 800; font-size: 19px; color: var(--ink); transition: transform .1s; }
  .cchip:hover { transform: translateY(-2px); }
  .cchip.on { background: #3a2416; border-color: #3a2416; color: #f8e9cb; box-shadow: 0 3px 0 #1b0f07; }
  .cchip .n { opacity: .7; font-weight: 700; margin-left: 5px; font-size: 16px; }
  .picked { display: flex; flex-wrap: wrap; gap: 8px; min-height: 56px; padding: 8px; border-radius: 10px; background: rgba(60,35,15,.13); box-shadow: inset 0 3px 6px rgba(60,35,15,.25); margin: 6px 0 2px; align-items: center; }
  .picked .pk { display: inline-flex; align-items: center; gap: 7px; color: var(--ink); border-radius: 8px; padding: 5px 6px 6px 12px; font-weight: 800; font-size: 19px;
    background: linear-gradient(180deg, var(--maple), var(--maple-d)); box-shadow: 0 3px 0 var(--maple-edge), inset 0 1px 0 rgba(255,255,255,.5); }
  .picked .pk b { font: 400 20px var(--font-display); color: var(--brass-d); }
  .picked .pk button { border: 0; border-radius: 50%; width: 28px; height: 28px; font-size: 16px; line-height: 1; font-weight: 900; background: rgba(60,35,15,.18); }
  .free-row { display: flex; gap: 10px; margin-top: 10px; }
  .setup-actions { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; align-items: center; }
  .keys-help { text-align: center; color: var(--page-soft); font-size: 17px; font-weight: 600; line-height: 1.8; }

  /* ---------- GAME ---------- */
  #game { display: flex; flex-direction: column; gap: 12px; height: 1036px; }
  .topbar { display: flex; align-items: center; gap: 14px; min-height: 78px; padding-left: 4px; }
  .cat-banner { position: relative; display: flex; align-items: baseline; gap: 18px; min-width: 0; max-width: 1150px; padding: 10px 40px 12px; border-radius: 8px; color: #2b1a06;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, rgba(0,0,0,0) 1px 3px), linear-gradient(180deg, var(--brass-l), var(--brass) 55%, #b48a2a);
    box-shadow: 0 4px 0 var(--brass-d), 0 12px 20px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.65); }
  .cat-banner::before, .cat-banner::after { content: ''; position: absolute; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff1c2, #9a7826 70%); box-shadow: inset 0 0 0 1px rgba(60,40,10,.5); }
  .cat-banner::before { left: 13px; } .cat-banner::after { right: 13px; }
  .cat-banner .lbl { font-family: var(--font-display); font-size: 50px; line-height: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-banner .sub { font-weight: 800; font-size: 20px; white-space: nowrap; opacity: .78; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .clockbar { position: relative; height: 26px; border-radius: 6px; overflow: hidden; background: var(--walnut-d); box-shadow: inset 0 3px 6px rgba(0,0,0,.8), 0 1px 0 rgba(255,220,180,.18); }
  .clockbar i { position: absolute; inset: 3px auto 3px 3px; width: 100%; max-width: calc(100% - 6px); border-radius: 4px; transition: width .1s linear;
    background: linear-gradient(180deg, color-mix(in srgb, var(--TC) 65%, #fff), var(--TC) 45%, color-mix(in srgb, var(--TC) 70%, #000)); }
  .clockbar::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 5%); }
  .clockbar.low i { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  .board-wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  .board {
    position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
    gap: calc(var(--tilepx) * .09); padding: 26px 30px;
    max-width: calc(var(--tilepx) * 9 + var(--tilepx) * .09 * 8 + 61px);
    border-radius: 14px;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(255,215,170,.14), rgba(0,0,0,0) 60%),
      repeating-linear-gradient(91deg, rgba(0,0,0,.14) 0 2px, rgba(0,0,0,0) 2px 9px),
      repeating-linear-gradient(89.3deg, rgba(255,220,180,.05) 0 1px, rgba(0,0,0,0) 1px 13px),
      linear-gradient(180deg, var(--walnut-l), var(--walnut) 40%, var(--walnut-d));
    box-shadow: inset 0 0 0 5px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,220,180,.25), 0 10px 0 #180c05, 0 30px 50px rgba(0,0,0,.55);
  }
  .board::before { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 14px;
    background:
      radial-gradient(circle at 15px 15px, #f6dc85 0 3px, #8b6a1f 5px, rgba(0,0,0,0) 6.5px),
      radial-gradient(circle at calc(100% - 15px) 15px, #f6dc85 0 3px, #8b6a1f 5px, rgba(0,0,0,0) 6.5px),
      radial-gradient(circle at 15px calc(100% - 15px), #f6dc85 0 3px, #8b6a1f 5px, rgba(0,0,0,0) 6.5px),
      radial-gradient(circle at calc(100% - 15px) calc(100% - 15px), #f6dc85 0 3px, #8b6a1f 5px, rgba(0,0,0,0) 6.5px); }
  .tile {
    --tc: #e23b3b; --tink: #fff;
    position: relative; width: var(--tilepx); height: var(--tilepx); border-radius: calc(var(--tilepx) * .08);
    border: 0; padding: 0; color: #3a2312;
    background:
      radial-gradient(ellipse at 30% 12%, rgba(255,255,255,.32), rgba(255,255,255,0) 55%),
      repeating-linear-gradient(91deg, rgba(120,66,24,.10) 0 2px, rgba(0,0,0,0) 2px 7px),
      repeating-linear-gradient(89.3deg, rgba(95,52,18,.08) 0 1px, rgba(0,0,0,0) 1px 11px),
      linear-gradient(180deg, var(--maple), var(--maple-d));
    box-shadow: 0 calc(var(--tilepx) * .045) 0 var(--maple-edge), 0 calc(var(--tilepx) * .09) calc(var(--tilepx) * .1) rgba(0,0,0,.5),
                inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 8px rgba(80,40,10,.22);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: calc(var(--tilepx) * .14);
    transition: transform .14s ease, box-shadow .14s ease;
  }
  .tile:hover:not(:disabled) { transform: translateY(-4px); }
  .tile:focus-visible { outline: 4px solid var(--brass-l); outline-offset: 4px; }
  .tile .L { font-family: var(--font-display); font-size: calc(var(--tilepx) * .5); line-height: 1; text-shadow: 0 1px 0 rgba(255,255,255,.42), 0 -1px 0 rgba(0,0,0,.32); }

  S: 1, C: 1, P: 1, B: 1, M: 1, A: 1, T: 1, D: 1, R: 1, F: 1,
  H: 2, G: 2, L: 2, W: 2, E: 2, I: 2, N: 2, O: 2,
  K: 3, J: 3, U: 3, V: 3, Y: 3,

    const p = PARTS[i];
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.rot += p.vr;
    if (p.k === 'puff') { p.vx *= 0.93; p.vy *= 0.93; p.r += 0.8; }
    if (p.k === 'confetti') { p.vx *= 0.985; if (p.vy > 4.5) p.vy = 4.5; p.vx += Math.sin(p.rot) * 0.06; }
    if (p.life <= 0 || p.y > 1160) { PARTS.splice(i, 1); continue; }
    cx.globalAlpha = Math.max(0, Math.min(1, p.k === 'puff' ? p.life * 0.55 : p.life));
    cx.fillStyle = p.c;
    if (p.k === 'confetti') { cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1); cx.restore(); }
    else { cx.beginPath(); cx.arc(p.x, p.y, Math.max(0.1, p.r), 0, 6.2832); cx.fill(); }
  }
  cx.globalAlpha = 1;
  if (PARTS.length) requestAnimationFrame(partsLoop);
  else { partsRunning = false; cx.clearRect(0, 0, 1920, 1080); }
}

/* ---------- moments ---------- */
function bumpScore(i) {
  const el = lecternEl(i); const sc = el && el.querySelector('.sc');
  if (!sc || reduced) return;
  sc.classList.remove('bump'); void sc.offsetWidth; sc.classList.add('bump');
}
function nudgeWord() {
  const wb = $('word'); const box = wb && wb.parentElement;
  if (!box || reduced) return;
  box.classList.remove('nudge'); void box.offsetWidth; box.classList.add('nudge');
}
/** A claim: an ink peg hops from the team's plaque to the block, which takes the ink. */
function fxClaim(t, L) {
  const tile = tileEl(L), lec = lecternEl(t), color = S && S.teams[t] ? S.teams[t].color : '#ffffff';
  if (!S || S.phase !== 'play') return;
  if (!tile || !lec || reduced || isRace()) {
    if (tile) tile.classList.remove('await');
    sfx('land');
    if (lec) { const c = mid(rel(lec)); emit(16, c.x, c.y - 10, { colors: [color, '#f6dc85', '#ffffff'], speed: 7, size: 4, decay: 0.03 }); }
    bumpScore(t); shake(6, 300);
    return;
  }
  const a = mid(rel(lec.querySelector('.peg') || lec)), b = mid(rel(tile));
  const dist = Math.hypot(b.x - a.x, b.y - a.y), lift = Math.min(160, 40 + dist * 0.35);
  const c = { x: (a.x + b.x) / 2, y: Math.min(a.y, b.y) - lift * 2 };      // control point: the curve peaks at about `lift` above the higher end
  const dur = Math.round(Math.max(420, Math.min(760, 300 + dist * 0.45)));
  const tok = peg(t, color, 'token');
  $('fx').append(tok);
  const frames = [];
  for (let k = 0; k <= 16; k++) {
    const s = k / 16, u = 1 - s;
    const x = u * u * a.x + 2 * u * s * c.x + s * s * b.x, y = u * u * a.y + 2 * u * s * c.y + s * s * b.y;
    frames.push({ transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) scale(' + (1 + 0.18 * Math.sin(Math.PI * s)).toFixed(3) + ')' });
  }
  sfx('hop');
  let done = false;
  const land = () => {
    if (done) return; done = true;
    tok.remove();
    const el = tileEl(L); if (!el) return;
    el.classList.remove('await'); void el.offsetWidth; el.classList.add('press');
    const r = rel(el);
    emit(7, r.x + r.w / 2, r.y + r.h, { kind: 'puff', colors: ['rgba(236,209,162,.95)', 'rgba(255,255,255,.85)'], speed: 2.6, g: -0.02, size: 10, decay: 0.028, angle: -Math.PI / 2, spread: Math.PI * 1.3, w: r.w * 0.8 });
    emit(18, r.x + r.w / 2, r.y + r.h / 2, { colors: [color, color, '#ffffff', '#f6dc85'], speed: 8, size: 4.5, decay: 0.026, g: 0.3 });
    shake(10, 450); sfx('land'); bumpScore(t);
  };
  try { tok.animate(frames, { duration: dur, easing: 'cubic-bezier(.35,.1,.3,1)', fill: 'forwards' }).onfinish = land; } catch (e) { land(); }
  setTimeout(land, dur + 400);      // safety net if the animation never reports back
}
/** Sweep the next team's name across the board. Skipped if the turn has already moved on. */
function turnBanner(i, delay) {
  if (reduced || !S || S.phase !== 'play') return;
  const key = S.b + ':' + B().turns + ':' + i;
  setTimeout(() => {
    if (!S || S.phase !== 'play' || S.paused || ui.challenge || S.turn !== i || S.b + ':' + B().turns + ':' + i !== key) return;
    const wrap = $('boardwrap');
    const y = wrap ? mid(rel(wrap)).y - 64 : 420;
    const col = team(i).color;
    const el = h('div', { class: 'turn-banner', style: 'top:' + Math.round(y) + 'px;color:' + inkOn(col) + ';background:repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 22px, rgba(0,0,0,0) 22px 44px), ' + inkedBg(col) },
      h('div', null, peg(i, '#f7ead0'), team(i).name + ', your turn'));
    $('fx').append(el);
    sfx('whoosh');
    setTimeout(() => el.remove(), 1400);
  }, delay || 0);
}
/** A rubber stamp, slammed into the space above the board. */
function stamp(text, sub, kind) {
  const inPlay = !!$('boardwrap');
  const el = h('div', { class: 'stamp' + (kind === 'ok' ? ' ok' : ''), style: 'left:' + (inPlay ? 1290 : 960) + 'px;top:' + (inPlay ? 112 : 230) + 'px' },
    h('span', { class: 's1', style: inPlay ? 'font-size:84px' : null }, text), sub ? h('span', { class: 's2' }, sub) : null);
  $('fx').append(el);
  setTimeout(() => el.remove(), reduced ? 1600 : 1950);
}
function failMoment(text, sub) {
  stamp(text, sub);
  redFlash();
  shake(26, 750);
  const board = $('board');
  if (board) {
    const r = rel(board);
    emit(46, r.x + r.w / 2, r.y + r.h - 10, { kind: 'puff', w: r.w * 0.95, colors: ['rgba(60,38,24,.9)', 'rgba(110,80,55,.85)', 'rgba(211,53,44,.6)'], speed: 1.8, g: -0.035, size: 16, decay: 0.012, angle: -Math.PI / 2, spread: 1.6 });
  }
}
/** A rejected word: the ink comes off the block in a burst. */
function inkOff(L, color) {
  const el = tileEl(L); if (!el) return;
  const r = rel(el);
  emit(12, r.x + r.w / 2, r.y + r.h / 2, { kind: 'puff', colors: [color, 'rgba(40,25,15,.8)'], speed: 4, g: 0.02, size: 12, decay: 0.022 });
  emit(22, r.x + r.w / 2, r.y + r.h / 2, { colors: [color], speed: 10, size: 5, decay: 0.025, g: 0.4 });
  if (!reduced) el.animate([{ transform: 'scale(1.25) rotate(-6deg)' }, { transform: 'scale(.9) rotate(3deg)' }, { transform: 'none' }], { duration: 520, easing: 'ease-out' });
}
function sparkTile(L, color) {
  const el = tileEl(L) || document.querySelector('.strip .tile[data-l="' + L + '"]'); if (!el) return;
  const r = rel(el);
  emit(20, r.x + r.w / 2, r.y + r.h / 2, { colors: [color, '#f6dc85', '#ffffff', '#45bd78'], speed: 8, size: 4, decay: 0.026 });
}
/** Board finished: a shower of paper scraps in the team colours. */
function boardDone() {
  if (!S) return;
  const cols = S.teams.map(t => t.color).concat(['#f1e3c3', '#d6ad4a']);
  for (let i = 0; i < 6; i++) emit(22, 160 + i * 320, -12, { kind: 'confetti', colors: cols, angle: Math.PI / 2, spread: 1.3, speed: 6, g: 0.12, size: 7, decay: 0.005, w: 200 });
}
/** Winners: firework bursts for about four seconds while the results are on screen. */
function fireworks(colors) {
  if (reduced) return;
  const cols = colors.concat(['#f6dc85', '#ffffff']);
  for (let i = 0; i < 6; i++) emit(18, 160 + i * 320, -12, { kind: 'confetti', colors: cols, angle: Math.PI / 2, spread: 1.3, speed: 6, g: 0.12, size: 8, decay: 0.005, w: 200 });
  let n = 0;
  const id = setInterval(() => {
    if (!S || S.phase !== 'end' || n++ >= 10) { clearInterval(id); return; }
    const x = 260 + Math.random() * 1400, y = 140 + Math.random() * 300;
    emit(70, x, y, { colors: cols, speed: 9, size: 4, decay: 0.016, g: 0.12 });
    tone(600 + Math.random() * 500, 0.12, { type: 'triangle', vol: 0.05 });
    noise(0.25, { f: 1800, f2: 400, vol: 0.06, at: 0.02 });
  }, 380);
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  fitStage();
  window.addEventListener('resize', fitStage);
  buildScene();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => sizeBoard());
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { ui.mod = false; if (ui.peek) { ui.peek = false; render(); } });
  window.addEventListener('resize', sizeBoard);
  if (window.ResizeObserver) new ResizeObserver(() => sizeBoard()).observe(document.body);
  document.addEventListener('pointerdown', () => actx(), { once: true });
  setInterval(clockLoop, 100);
  setInterval(() => { if (S && S.phase === 'play' && S.clock.running) { syncClock(); store.set(SAVE_KEY, { S, UNDO }); } }, 2000);
  render();
}
boot();
</script>
