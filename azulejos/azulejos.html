<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azulejos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Lisbon tile workshop: glazed azulejos, terracotta plates, limestone boards, a hillside of rooftops. */
:root{
  --s:1;
  --display:"Unbounded","Arial Black",sans-serif;
  --ui:"Figtree",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  /* day scene (light theme) */
  --sky-a:#4e9fdc; --sky-b:#a7d3f0; --sky-c:#f6e2c3; --sky-ink:#14234d; --sky-ink-soft:#2c3f6e;
  --hill:#c9b79a; --roof-far:#d99a78; --roof:#c46a45; --wall-far:#efe2cc; --wall:#f6ecdc; --win:#4a5c7a; --winlit:0; --orb:#fff4cf; --stars:0; --river:#7fb9db;
  /* materials (same in both themes) */
  --lime-hi:#f8f3e8; --lime:#ebe2cf; --lime-lo:#cfc0a3; --lime-edge:#9d8c6c; --lime-ink:#1b2853; --lime-ink-soft:#5a5f78;
  --terra-hi:#e08a5c; --terra:#b9582f; --terra-lo:#6f2e14;
  --cobalt-hi:#3d66d0; --cobalt:#1d3f9e; --cobalt-lo:#0f2363;
  --gilt-hi:#f6dc96; --gilt:#cfa449; --gilt-lo:#7a5a19;
  --glaze:#fbf9f3; --glaze-lo:#e4ded0;
  --danger:#d7372f; --danger-lo:#7e1510; --ok:#2f9a62; --ok-lo:#145232;
}
html[data-theme="dark"]{
  --sky-a:#060b22; --sky-b:#18244f; --sky-c:#5b3e66; --sky-ink:#f4ead6; --sky-ink-soft:#c8c2dc;
  --hill:#121a35; --roof-far:#1d2244; --roof:#262848; --wall-far:#1a2142; --wall:#222a4d; --win:#ffcf74; --winlit:1; --orb:#f2ecd8; --stars:1; --river:#1a2c5a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#04060f;color:var(--lime-ink);font-family:var(--ui)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
.hidden{display:none!important}
kbd{display:inline-block;min-width:24px;padding:2px 7px 3px;border-radius:6px;font:800 14px/1.2 var(--ui);text-align:center;background:var(--glaze);color:var(--cobalt-lo);box-shadow:0 2px 0 var(--glaze-lo)}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:hidden;background:var(--sky-a)}
#scene{position:absolute;inset:0;width:100%;height:100%}
#scene .star{opacity:calc(var(--stars)*.85)}
#scene .tw{animation:tw 3.6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:calc(var(--stars)*.15)}}
#scene .lit{opacity:calc(.25 + var(--winlit)*.75)}
#shaker{position:absolute;inset:0;will-change:transform}
#flash{position:absolute;inset:0;pointer-events:none;z-index:40;opacity:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(215,55,47,.6) 100%)}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:60}
#fly{position:absolute;inset:0;pointer-events:none;z-index:30}
#fly .tl{position:absolute;left:0;top:0;margin:0}

/* ---------- tiles ---------- */
.tl{--ts:60px;position:relative;display:block;width:var(--ts);height:var(--ts);border:0;padding:0;border-radius:calc(var(--ts)*.13);
  background:radial-gradient(circle at 28% 20%,rgba(255,255,255,.62),rgba(255,255,255,0) 34%),var(--motif) center/76% 76% no-repeat,linear-gradient(150deg,var(--c1),var(--c2));
  box-shadow:inset 0 calc(var(--ts)*-.07) 0 rgba(0,0,0,.28),inset 0 2px 0 rgba(255,255,255,.45),inset 0 0 0 1px rgba(255,255,255,.18),0 calc(var(--ts)*.07) calc(var(--ts)*.1) rgba(0,0,0,.45)}
.tl.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d2,var(--gilt-hi) 25%,var(--gilt) 60%,var(--gilt-lo) 100%);
  box-shadow:0 calc(var(--ts)*.06) 0 #5a400f,0 calc(var(--ts)*.1) calc(var(--ts)*.12) rgba(0,0,0,.45),inset 0 0 0 calc(var(--ts)*.07) rgba(255,240,190,.45);
  display:grid;place-items:center;color:#4a3207;font:900 calc(var(--ts)*.5)/1 var(--display)}
.tl.coin::after{content:"1"}
button.tl{transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .18s,box-shadow .18s}
button.tl:focus-visible{outline:4px solid var(--gilt-hi);outline-offset:3px}
.tl.sel{transform:translateY(-12%) scale(1.08);box-shadow:0 0 0 4px var(--gilt-hi),0 0 26px 6px rgba(246,220,150,.75),0 calc(var(--ts)*.25) calc(var(--ts)*.25) rgba(0,0,0,.4)}
.tl.dim{filter:saturate(.5) brightness(.7)}
.tl.ghost{visibility:hidden}
.tl.crack::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--crackimg) center/100% 100% no-repeat}
.tl.shine::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.85) 48%,transparent 62%) -150% 0/250% 100% no-repeat;animation:shine .7s ease-out forwards}
@keyframes shine{to{background-position:150% 0}}
.squash{animation:squash .32s ease-out}
@keyframes squash{0%{transform:scale(1.16,.82)}55%{transform:scale(.95,1.06)}100%{transform:none}}

/* ---------- materials ---------- */
.glazebtn{border-radius:16px;border:0;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.35),transparent 40%),linear-gradient(180deg,var(--cobalt-hi),var(--cobalt));color:#f4f1ff;
  box-shadow:0 5px 0 var(--cobalt-lo),0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
.glazebtn:hover{filter:brightness(1.12)}
.glazebtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cobalt-lo),0 4px 8px rgba(0,0,0,.35)}
.slab{background:
  linear-gradient(118deg,rgba(255,255,255,0) 0 22%,rgba(160,140,110,.10) 23%,rgba(255,255,255,0) 26% 61%,rgba(160,140,110,.09) 62%,rgba(255,255,255,0) 66%),
  linear-gradient(64deg,rgba(255,255,255,0) 0 40%,rgba(150,130,100,.07) 41%,rgba(255,255,255,0) 45%),
  radial-gradient(ellipse 60% 40% at 25% 10%,rgba(255,255,255,.55),transparent 70%),
  linear-gradient(180deg,var(--lime-hi),var(--lime) 55%,var(--lime-lo));
  box-shadow:0 7px 0 var(--lime-edge),0 22px 38px rgba(0,0,0,.45),inset 0 1px 0 #fff,inset 0 0 0 1px rgba(120,100,70,.25)}
.slot{position:absolute;border-radius:10px;background:radial-gradient(circle at 50% 35%,rgba(140,118,84,.32),rgba(110,90,60,.42));box-shadow:inset 0 3px 6px rgba(60,45,25,.55),0 1px 0 rgba(255,255,255,.75)}
.cell::before{content:"";position:absolute;inset:3px;border-radius:7px;background:var(--motif) center/76% 76% no-repeat,linear-gradient(150deg,var(--c1),var(--c2));opacity:.3;filter:saturate(.7)}
.cell.gray::before{display:none}

/* ---------- top bar ---------- */
#top{position:absolute;left:0;right:0;top:0;height:92px;display:flex;align-items:center;gap:14px;padding:0 26px;z-index:20}
.back-link{display:inline-flex;align-items:center;height:50px;padding:0 22px;border-radius:999px;text-decoration:none;font:800 19px var(--ui);white-space:nowrap;color:var(--lime-ink)}
#mark{display:flex;align-items:center;gap:14px;margin-left:8px;color:var(--sky-ink)}
#mark .tl{--ts:46px}
#mark span{font:900 46px/1 var(--display);letter-spacing:-.5px;text-shadow:0 3px 18px rgba(0,0,0,.25)}
#roundChip{margin-left:10px;padding:8px 18px;border-radius:999px;font:800 20px var(--ui);color:var(--sky-ink);border:2px solid color-mix(in srgb,var(--sky-ink) 35%,transparent)}
.spacer{flex:1}
.tbtn{height:54px;padding:0 20px;display:inline-flex;align-items:center;gap:10px;font:800 19px var(--ui)}
.tbtn svg{width:24px;height:24px;flex:0 0 auto}
.tbtn.icon{width:54px;padding:0;justify-content:center}
.tbtn.off{opacity:.55}
.tbtn:disabled{opacity:.4;filter:grayscale(.6)}

/* ---------- courtyard ---------- */
#court{position:absolute;left:20px;top:92px;width:890px;height:978px}
#court > svg.med{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.plate{position:absolute;border-radius:50%;background:
  radial-gradient(circle at 50% 50%,transparent 58%,rgba(0,0,0,.18) 60%,transparent 64%),
  radial-gradient(circle at 34% 28%,rgba(255,220,190,.45),transparent 45%),
  radial-gradient(circle,var(--terra-hi),var(--terra) 62%,var(--terra-lo));
  box-shadow:0 8px 0 #4f1f0c,0 20px 30px rgba(0,0,0,.45),inset 0 -6px 12px rgba(0,0,0,.3),inset 0 3px 2px rgba(255,220,190,.35)}
.plate::before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffdf6,var(--glaze) 55%,var(--glaze-lo));box-shadow:inset 0 4px 8px rgba(80,40,20,.35)}
.plate::after{content:"";position:absolute;inset:16%;border-radius:50%;border:3px dashed rgba(29,63,158,.35)}
.plate .grid{position:absolute;inset:0;display:grid;place-content:center;grid-template-columns:repeat(2,var(--pts));gap:calc(var(--pts)*.12);z-index:1}
.plate .grid .tl{--ts:var(--pts)}
.plate.empty::before{opacity:.65}
.plate .pnum{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,50%);font:800 16px var(--ui);color:#fff;background:var(--terra-lo);border-radius:999px;padding:2px 9px;z-index:2;opacity:.85}
#bowl{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 45%,#fffdf8,var(--glaze) 60%,var(--glaze-lo));
  box-shadow:0 0 0 10px var(--cobalt),0 0 0 13px var(--gilt),0 18px 34px rgba(0,0,0,.45),inset 0 10px 24px rgba(40,50,90,.25)}
#bowl .pat{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:.5}
#bowl .rowc{position:absolute;display:flex;align-items:center}
#bowl .rowc .tl{position:absolute;top:0}
#bowl .cnt{position:absolute;font:900 30px/1 var(--display);color:var(--cobalt)}
#bowl .lbl{position:absolute;left:0;right:0;text-align:center;font:800 22px var(--ui);color:rgba(29,63,158,.45)}
.counter{position:absolute;display:flex;align-items:center;gap:12px;color:var(--sky-ink)}
.counter svg{width:84px;height:84px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.counter b{font:900 38px/1 var(--display)}
.counter span{display:block;font:700 17px var(--ui);opacity:.85}
#hint{position:absolute;left:12px;bottom:12px;width:270px;padding:16px 18px;border-radius:16px;font:600 20px/1.3 var(--ui);color:var(--lime-ink)}
#hint b{font-weight:800}
#mainAct{position:absolute;right:6px;bottom:14px}
.act{min-height:92px;padding:0 34px;border:0;border-radius:22px;font:900 27px/1.1 var(--display);letter-spacing:-.3px;display:inline-flex;align-items:center;gap:14px;
  background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--ink,#fff);box-shadow:0 9px 0 var(--edge),0 20px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s}
.act:active{transform:translateY(7px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4)}
.act.gilt{--a1:var(--gilt-hi);--a2:var(--gilt);--edge:var(--gilt-lo);--ink:#3d2a05}
.act.cobalt{--a1:var(--cobalt-hi);--a2:var(--cobalt);--edge:var(--cobalt-lo)}
.act.green{--a1:#4cc485;--a2:var(--ok);--edge:var(--ok-lo)}
.act.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 9px 0 var(--edge),0 20px 30px rgba(0,0,0,.45),0 0 34px 8px rgba(246,220,150,.65),inset 0 2px 0 rgba(255,255,255,.4)}}
.act.pop{animation:popIn .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popIn{from{transform:translateY(30px) scale(.92);opacity:0}}

/* ---------- boards ---------- */
#board{position:absolute;left:940px;top:100px;width:960px;height:630px;border-radius:24px}
#board.enter{animation:boardIn .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes boardIn{from{transform:translateX(60px) rotate(1deg);opacity:0}}
.bhead{position:absolute;left:0;right:0;top:0;height:118px;border-radius:24px 24px 0 0}
.bhead::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--tc),transparent)}
.emb{position:relative;flex:0 0 auto;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--emoji);background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,var(--tc),color-mix(in srgb,var(--tc) 50%,#000) 110%);
  box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,#000),0 8px 12px rgba(0,0,0,.35),inset 0 -3px 5px rgba(0,0,0,.25)}
.bname{position:absolute;font:900 42px/1 var(--display);letter-spacing:-.5px;white-space:nowrap}
.bprompt{position:absolute;font:700 23px/1.25 var(--ui);color:var(--lime-ink-soft)}
.bprompt b{color:var(--lime-ink)}
.plaque{position:absolute;border-radius:16px;text-align:center;color:#fff;background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.3),transparent 45%),linear-gradient(180deg,var(--cobalt-hi),var(--cobalt) 60%,var(--cobalt-lo));
  box-shadow:0 5px 0 #0a1845,0 10px 16px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.25)}
.plaque b{display:block;font:900 58px/1 var(--display);margin-top:12px}
.plaque span{font:800 16px var(--ui);opacity:.85}
.holder{position:absolute}
.holder small{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font:800 13px var(--ui);white-space:nowrap;color:var(--gilt-lo)}
.lineHit{position:absolute;border-radius:12px;border:0;background:transparent;padding:0}
.lineHit.ok{background:rgba(47,154,98,.14);box-shadow:0 0 0 3px rgba(47,154,98,.75),0 0 22px rgba(47,154,98,.45);animation:okPulse 1.4s ease-in-out infinite}
.lineHit.no{background:rgba(120,100,80,.08)}
@keyframes okPulse{50%{box-shadow:0 0 0 3px rgba(47,154,98,.95),0 0 32px rgba(47,154,98,.7)}}
.badge{position:absolute;min-width:48px;height:40px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font:900 20px/1 var(--display);color:#fff;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.badge.good{background:var(--ok)} .badge.bad{background:var(--danger)} .badge.full{background:linear-gradient(var(--gilt-hi),var(--gilt));color:#3d2a05}
.badge svg{width:24px;height:24px}
.arrow{position:absolute;width:44px;height:20px;opacity:.35}
.flab{position:absolute;font:600 16px var(--ui);color:rgba(90,70,40,.75);text-align:center;pointer-events:none}
.floorInfo{position:absolute;font:800 22px/1.2 var(--ui);color:var(--lime-ink-soft)}
.floorInfo b{display:block;font:900 34px/1 var(--display);color:var(--danger)}
.floorInfo b.zero{color:var(--lime-ink-soft);opacity:.5}
.cell.pick{cursor:pointer;box-shadow:inset 0 3px 6px rgba(60,45,25,.55),0 0 0 3px var(--gilt),0 0 20px rgba(246,220,150,.8);animation:okPulse 1.2s infinite}
.cell.run{box-shadow:inset 0 3px 6px rgba(60,45,25,.55),0 0 0 3px var(--gilt-hi),0 0 18px 4px rgba(246,220,150,.85)}
.wallHit{position:absolute;border:0;padding:0;background:transparent;border-radius:10px;cursor:pointer}
#others{position:absolute;left:940px;top:744px;width:960px;height:326px;display:flex;gap:30px;justify-content:center;align-items:flex-start}
.mini{position:relative;width:300px;height:236px;border-radius:18px;flex:0 0 auto}
.mini.tilingNext{box-shadow:0 7px 0 var(--lime-edge),0 22px 38px rgba(0,0,0,.45),0 0 0 4px var(--gilt-hi)}
.mini .mname{position:absolute;left:60px;top:14px;font:900 22px/1 var(--display);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.mini .mscore{position:absolute;right:14px;top:8px;font:900 32px/1 var(--display);color:var(--cobalt)}
.mini .mscore small{font:700 13px var(--ui);color:var(--lime-ink-soft);margin-left:3px}
.mini .mup{position:absolute;left:60px;top:38px;font:700 14px var(--ui);color:var(--lime-ink-soft)}
.floatPts{position:absolute;font:900 54px/1 var(--display);color:var(--gilt-hi);-webkit-text-stroke:2px #3d2a05;paint-order:stroke fill;pointer-events:none;z-index:35;text-shadow:0 4px 10px rgba(0,0,0,.4)}
.floatPts.bad{color:#ff7a70;-webkit-text-stroke-color:#5a0d08}

/* ---------- banners, stamp, flag, toast ---------- */
.turnBan{position:absolute;left:-80px;right:-80px;top:440px;height:150px;z-index:45;pointer-events:none;display:flex;align-items:center;justify-content:center;gap:28px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc) 40%,color-mix(in srgb,var(--tc) 70%,#000));color:var(--ink);
  box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 4px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.2);transform:skewX(-12deg);animation:ban 1.5s cubic-bezier(.6,0,.4,1) forwards}
.turnBan::before,.turnBan::after{content:"";position:absolute;left:0;right:0;height:14px;background:var(--bandimg) 0 0/56px 14px repeat-x;opacity:.55}
.turnBan::before{top:8px}.turnBan::after{bottom:8px}
.turnBan > *{transform:skewX(12deg)}
.turnBan .emb{position:relative;width:100px;height:100px;font-size:58px}
.turnBan span{font:900 64px/1 var(--display);letter-spacing:-1px;text-shadow:0 3px 0 rgba(0,0,0,.18)}
@keyframes ban{0%{transform:translateX(-110%) skewX(-12deg)}22%,78%{transform:translateX(0) skewX(-12deg)}100%{transform:translateX(110%) skewX(-12deg)}}
.stamp{position:absolute;z-index:44;pointer-events:none;padding:10px 30px 14px;border:7px double var(--danger);border-radius:14px;color:var(--danger);text-align:center;background:rgba(255,248,240,.82);transform:rotate(-8deg);animation:stamp .42s cubic-bezier(.2,1.4,.4,1) both}
.stamp b{display:block;font:900 66px/1 var(--display);letter-spacing:1px}
.stamp span{font:800 22px var(--ui)}
@keyframes stamp{from{transform:rotate(-8deg) scale(3.2);opacity:0}}
.stamp.out{animation:fadeOut .5s ease-in forwards}
@keyframes fadeOut{to{opacity:0;transform:rotate(-8deg) scale(.9)}}
.flag{position:absolute;z-index:44;pointer-events:none;width:340px;height:110px;color:var(--ink);background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 80%,#fff),var(--tc) 45%,color-mix(in srgb,var(--tc) 70%,#000));
  clip-path:polygon(0 0,100% 0,88% 50%,100% 100%,0 100%);display:flex;align-items:center;gap:14px;padding-left:22px;font:900 30px/1.05 var(--display);animation:unfurl .6s cubic-bezier(.3,1.2,.5,1) both;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.flag .emb{position:relative;width:62px;height:62px;font-size:34px;flex:0 0 auto}
@keyframes unfurl{from{clip-path:inset(0 100% 0 0)}}
.flag.out{animation:fadeOut .5s ease-in forwards}
#toast{position:absolute;left:465px;top:556px;max-width:640px;text-align:center;transform:translateX(-50%);z-index:50;padding:12px 26px;border-radius:999px;background:var(--cobalt-lo);color:#fff;font:800 22px var(--ui);box-shadow:0 10px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* ---------- overlays: glazed tile panels with a painted frieze ---------- */
.ov{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:rgba(5,9,26,.62);animation:ovIn .3s ease-out}
@keyframes ovIn{from{background:rgba(5,9,26,0)}}
.sheet{position:relative;width:1520px;max-height:1000px;overflow:auto;padding:58px 70px 50px;border-radius:26px;color:var(--lime-ink);
  background:radial-gradient(ellipse 70% 40% at 20% 0%,rgba(255,255,255,.8),transparent 70%),linear-gradient(180deg,var(--glaze),#f1ebdd);
  box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.8);animation:sheetIn .5s cubic-bezier(.2,1.25,.4,1)}
.sheet::before{content:"";position:absolute;inset:16px;border-radius:16px;pointer-events:none;border:18px solid transparent;border-image:var(--frieze) 18 round}
@keyframes sheetIn{from{transform:translateY(40px) scale(.96);opacity:0}}
.sheet h1{margin:0;font:900 74px/1 var(--display);letter-spacing:-1.5px;color:var(--cobalt)}
.sheet h2{margin:0 0 14px;font:900 30px/1.1 var(--display);color:var(--cobalt)}
.sheet .lede{font:600 25px/1.4 var(--ui);margin:16px 0 0;max-width:1100px;color:var(--lime-ink-soft)}
.xbtn{position:absolute;right:42px;top:40px;width:58px;height:58px;border-radius:50%;z-index:2}
.xbtn svg{width:26px;height:26px}
.setupGrid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:30px}
.trow{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:8px 18px;padding:14px 18px;border-radius:18px;margin-bottom:12px;background:rgba(29,63,158,.06);box-shadow:inset 0 0 0 2px rgba(29,63,158,.1)}
.trow .emb{position:relative;width:76px;height:76px;font-size:44px;grid-row:span 2}
.trow .tname{font:900 32px/1 var(--display)}
.swatches{display:flex;gap:10px}
.sw{width:44px;height:44px;border-radius:12px;border:0;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 4px rgba(0,0,0,.2)}
.sw.sel{outline:4px solid var(--lime-ink);outline-offset:3px}
.sw.taken{opacity:.35}
.animals{grid-column:2 / 4;display:flex;gap:6px;flex-wrap:wrap}
.an{width:50px;height:50px;border-radius:12px;border:0;font:30px/1 var(--emoji);background:rgba(255,255,255,.75);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.an.sel{background:var(--gilt-hi);box-shadow:0 0 0 3px var(--gilt-lo)}
.an.taken{opacity:.3}
.rm{width:46px;height:46px;border-radius:50%;border:0;background:rgba(215,55,47,.12);color:var(--danger)}
.rm svg{width:20px;height:20px}
.opt{display:flex;gap:12px;margin:8px 0 22px;flex-wrap:wrap}
.opt button{padding:16px 24px;border-radius:16px;border:0;font:800 22px var(--ui);background:rgba(29,63,158,.08);color:var(--lime-ink);box-shadow:inset 0 0 0 2px rgba(29,63,158,.15);text-align:left}
.opt button small{display:block;font:600 17px var(--ui);color:var(--lime-ink-soft);margin-top:4px}
.opt button.on{background:var(--cobalt);color:#fff;box-shadow:0 4px 0 var(--cobalt-lo)}
.opt button.on small{color:#dfe5ff}
.musicRow{display:flex;align-items:center;gap:26px;flex-wrap:wrap;font:800 22px var(--ui)}
.musicRow label{display:flex;align-items:center;gap:10px;cursor:pointer}
.musicRow input[type=checkbox]{width:26px;height:26px;accent-color:var(--cobalt)}
.setupBtns{display:flex;align-items:center;gap:18px;margin-top:22px}
.add{padding:14px 22px;border-radius:16px;border:2px dashed rgba(29,63,158,.4);background:transparent;font:800 22px var(--ui);color:var(--cobalt)}
.resume{display:flex;align-items:center;gap:20px;padding:18px 22px;margin-top:22px;border-radius:18px;background:rgba(207,164,73,.18);box-shadow:inset 0 0 0 2px rgba(207,164,73,.45);font:600 20px/1.35 var(--ui)}
.resume b{display:block;font:900 24px var(--display);color:var(--cobalt)}
.rgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;margin-top:22px;font:600 23px/1.45 var(--ui)}
.rgrid ol,.rgrid ul{margin:0;padding-left:30px}
.rgrid li{margin-bottom:10px}
.rgrid strong{color:var(--cobalt)}
.demo{display:flex;align-items:center;gap:12px;margin:10px 0 18px}
.demo .tl{--ts:44px}
.minigrid{display:grid;grid-template-columns:repeat(5,40px);gap:4px;padding:8px;border-radius:12px;background:rgba(120,100,70,.18)}
.minigrid i{width:40px;height:40px;border-radius:7px;background:rgba(120,100,70,.25);position:relative}
.minigrid i.tl{--ts:40px}
.minigrid i.new{box-shadow:0 0 0 3px var(--gilt),0 0 12px var(--gilt-hi)}
.score-ex{display:flex;gap:26px;align-items:center}
table.final{width:100%;border-collapse:separate;border-spacing:0 10px;margin-top:20px;font:700 26px var(--ui)}
table.final th{font:800 18px var(--ui);color:var(--lime-ink-soft);text-align:center;padding:0 10px}
table.final td{text-align:center;padding:12px 10px;background:rgba(29,63,158,.06)}
table.final td:first-child{text-align:left;border-radius:16px 0 0 16px}
table.final td:last-child{border-radius:0 16px 16px 0;font:900 42px var(--display);color:var(--cobalt)}
table.final tr.top td{background:rgba(207,164,73,.25)}
table.final .who{display:flex;align-items:center;gap:16px;font:900 30px var(--display)}
table.final .who .emb{position:relative;width:60px;height:60px;font-size:34px}
table.final .plus{color:var(--ok)}
.winHead{display:flex;align-items:center;gap:30px}
.winHead .emb{position:relative;width:130px;height:130px;font-size:76px}
#debug{position:absolute;right:20px;top:100px;width:560px;max-height:900px;overflow:auto;z-index:80;padding:20px 22px;border-radius:18px;background:rgba(10,16,40,.95);color:#e8ecff;font:600 17px var(--ui);box-shadow:0 20px 50px rgba(0,0,0,.6)}
#debug h3{margin:0 0 10px;font:900 22px var(--display)}
#debug fieldset{border:1px solid rgba(255,255,255,.2);border-radius:12px;margin:0 0 10px;padding:8px 12px}
#debug button,#debug input,#debug select{font:700 16px var(--ui);margin:3px;padding:5px 9px;border-radius:8px;border:0}
#debug input{width:64px}
#dbgMsg{color:#ff9b93;min-height:20px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.001ms!important}
}
</style>

<body>
<div id="stage">
  <svg id="scene" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true"></svg>
  <div id="shaker">
    <header id="top">
      <a class="back-link slab" href="../">← Game Hub</a>
      <div id="mark"><i class="tl" data-c="B"></i><span>Azulejos</span></div>
      <div id="roundChip"></div>
      <div class="spacer"></div>
      <button class="tbtn glazebtn" id="rulesBtn" onclick="openRules()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5c3-1.5 5.5-1.5 8 0v15c-2.5-1.5-5-1.5-8 0zM12 5c2.5-1.5 5-1.5 8 0v15c-3-1.5-5.5-1.5-8 0"/></svg>Rules</button>
      <button class="tbtn glazebtn" id="undoBtn" onclick="AZui.undo()" title="Undo (Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
      <button class="tbtn glazebtn" id="newBtn" onclick="showSetup()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4"/></svg>New game</button>
      <button class="tbtn glazebtn icon" id="mute-btn" onclick="toggleMute()" title="Mute (M)"></button>
      <button class="tbtn glazebtn icon" id="music-btn" onclick="toggleMusic()" title="Music (Shift+N)"></button>
      <button class="tbtn glazebtn icon" id="theme-btn" onclick="toggleTheme()" title="Theme (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </header>
    <section id="court"></section>
    <section id="board" class="slab"></section>
    <section id="others"></section>
    <div id="fly"></div>
    <div id="toast"></div>
  </div>
  <div id="flash"></div>
  <div class="ov" id="setup"><div class="sheet" id="setupSheet"></div></div>
  <div class="ov hidden" id="rules" onclick="if(event.target===this)closeRules()"><div class="sheet" id="rulesSheet"></div></div>
  <div class="ov hidden" id="win"><div class="sheet" id="winSheet"></div></div>
  <div id="debug" class="hidden"></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>

<script id="engine">
/* Azulejos rules engine: pure functions over plain JSON state (testable in Node).
   Tiles have ids: color letter + number, e.g. "B07". The first-player marker is "F1".
   Phases: draft -> tiling (one player at a time, row by row, then the floor) -> refill | over */
(function (root) {
  'use strict';
  var COLORS = ['B', 'Y', 'R', 'K', 'T'];
  var NAMES = { B: 'blue', Y: 'yellow', R: 'red', K: 'black', T: 'teal' };
  var FLOOR = [-1, -1, -2, -2, -2, -3, -3];
  var MARKER = 'F1';
  var FACTORIES = { 2: 5, 3: 7, 4: 9 };

  function clone(s) { return JSON.parse(JSON.stringify(s)); }
  function col(id) { return id[0]; }
  function wallColor(r, c) { return COLORS[(c - r + 5) % 5]; }
  function wallCol(r, color) { return (COLORS.indexOf(color) + r) % 5; }
  function rnd(s) { // mulberry32 kept in state so saves stay deterministic
    s.rng = (s.rng + 0x6D2B79F5) | 0;
    var t = s.rng; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function assert(c, m) { if (!c) throw new Error('Azulejos: ' + m); }

  function emptyPlayer(p) {
    return { name: p.name, color: p.color, animal: p.animal, score: 0,
      lines: [[], [], [], [], []], lineColor: [null, null, null, null, null],
      wall: [[null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null], [null, null, null, null, null]],
      floor: [], bonus: null };
  }

  function createGame(opts) {
    assert(opts && opts.players && opts.players.length >= 2 && opts.players.length <= 4, '2-4 players');
    var bag = [];
    COLORS.forEach(function (c) { for (var i = 1; i <= 20; i++) bag.push(c + (i < 10 ? '0' : '') + i); });
    var s = {
      v: 1, variant: opts.variant === 'gray' ? 'gray' : 'color', rng: (opts.seed >>> 0) || ((Math.random() * 4294967295) >>> 0),
      players: opts.players.map(emptyPlayer), factories: [], center: [], markerInCenter: true, markerHolder: null,
      bag: bag, lid: [], current: 0, startPlayer: 0, round: 0, phase: 'refill', tiling: null, winners: null, takes: 0
    };
    var n = FACTORIES[s.players.length];
    for (var f = 0; f < n; f++) s.factories.push([]);
    return startRound(s).state;
  }

  /* ---------- round start ---------- */
  function startRound(s0) {
    var s = clone(s0);
    assert(s.phase === 'refill', 'startRound needs phase refill, got ' + s.phase);
    var events = { draws: [], refilledFromLid: 0 };
    s.factories.forEach(function (f, fi) {
      assert(f.length === 0, 'factory not empty');
      for (var k = 0; k < 4; k++) {
        if (!s.bag.length) {
          if (!s.lid.length) break;               // partial refill: legal, rare
          events.refilledFromLid += s.lid.length;
          s.bag = s.bag.concat(s.lid); s.lid = [];
        }
        var i = Math.floor(rnd(s) * s.bag.length), t = s.bag.splice(i, 1)[0];
        f.push(t); events.draws.push({ factory: fi, id: t });
      }
      f.sort(function (a, b) { return COLORS.indexOf(col(a)) - COLORS.indexOf(col(b)) || (a < b ? -1 : 1); });
    });
    s.center = []; s.markerInCenter = true;
    if (s.markerHolder !== null) s.startPlayer = s.markerHolder;
    s.markerHolder = null;
    s.current = s.startPlayer; s.round++; s.phase = 'draft'; s.tiling = null; s.takes = 0;
    s.players.forEach(function (p) { p.floor = []; });
    return { state: s, events: events };
  }

  /* ---------- drafting ---------- */
  function sourceTiles(s, src) { return src === 'C' ? s.center : s.factories[src]; }
  function sourceColors(s, src) {
    var seen = {};
    (sourceTiles(s, src) || []).forEach(function (t) { seen[col(t)] = 1; });
    return COLORS.filter(function (c) { return seen[c]; });
  }
  function canTake(s, src, color) {
    if (s.phase !== 'draft') return false;
    var a = sourceTiles(s, src);
    return !!a && a.some(function (t) { return col(t) === color; });
  }
  // gray wall: columns in row r where color may go (row space empty, column has no such color)
  function grayCols(p, r, color) {
    var out = [];
    for (var c = 0; c < 5; c++) {
      if (p.wall[r][c]) continue;
      var clash = false;
      for (var rr = 0; rr < 5; rr++) if (p.wall[rr][c] && col(p.wall[rr][c]) === color) clash = true;
      if (!clash) out.push(c);
    }
    return out;
  }
  function rowHas(p, r, color) { return p.wall[r].some(function (t) { return t && col(t) === color; }); }
  function lineAccepts(s, pi, r, color) {
    var p = s.players[pi];
    if (p.lines[r].length >= r + 1) return false;
    if (p.lineColor[r] && p.lineColor[r] !== color) return false;
    if (rowHas(p, r, color)) return false;
    if (s.variant === 'color') return !p.wall[r][wallCol(r, color)];
    return grayCols(p, r, color).length > 0;
  }
  function legalLines(s, pi, color) { var out = []; for (var r = 0; r < 5; r++) if (lineAccepts(s, pi, r, color)) out.push(r); return out; }

  // what would happen: how many fit in the line, how many fall to the floor, floor penalty added
  function preview(s, src, color, line) {
    var p = s.players[s.current], n = sourceTiles(s, src).filter(function (t) { return col(t) === color; }).length;
    var marker = src === 'C' && s.markerInCenter ? 1 : 0;
    var fit = line === 'F' ? 0 : Math.min(n, line + 1 - p.lines[line].length);
    var fall = n - fit, before = p.floor.length, after = Math.min(7, before + marker + fall), pen = 0;
    for (var i = before; i < after; i++) pen += FLOOR[i];
    return { count: n, fit: fit, fall: fall, marker: marker, penalty: pen, completes: line !== 'F' && p.lines[line].length + fit === line + 1 };
  }

  function take(s0, src, color, line) {
    var s = clone(s0), pi = s.current, p = s.players[pi];
    assert(canTake(s, src, color), 'cannot take ' + color + ' from ' + src);
    assert(line === 'F' || (line >= 0 && line <= 4 && lineAccepts(s, pi, line, color)), 'line ' + line + ' does not accept ' + color);
    var from = sourceTiles(s, src), taken = from.filter(function (t) { return col(t) === color; }), rest = from.filter(function (t) { return col(t) !== color; });
    var ev = { player: pi, src: src, color: color, line: line, taken: taken.slice(), toLine: [], toFloor: [], toLid: [], toCenter: [], marker: false };
    if (src === 'C') {
      s.center = rest;
      if (s.markerInCenter) {
        s.markerInCenter = false; s.markerHolder = pi; ev.marker = true;
        if (p.floor.length < 7) p.floor.push(MARKER);
      }
    } else {
      s.factories[src] = [];
      s.center = s.center.concat(rest); ev.toCenter = rest.slice();
    }
    taken.forEach(function (t) {
      if (line !== 'F' && p.lines[line].length < line + 1) { p.lines[line].push(t); p.lineColor[line] = color; ev.toLine.push(t); }
      else if (p.floor.length < 7) { p.floor.push(t); ev.toFloor.push(t); }
      else { s.lid.push(t); ev.toLid.push(t); }
    });
    s.takes++;
    if (draftOver(s)) beginTiling(s);
    else s.current = (pi + 1) % s.players.length;
    return { state: s, event: ev };
  }
  function draftOver(s) { return !s.center.length && s.factories.every(function (f) { return !f.length; }); }
  function beginTiling(s) {
    var order = [];
    for (var i = 0; i < s.players.length; i++) order.push((s.startPlayer + i) % s.players.length);
    s.phase = 'tiling'; s.tiling = { order: order, idx: 0 };
    s.current = order[0];
  }

  /* ---------- wall tiling ---------- */
  function tilingPlayer(s) { return s.phase === 'tiling' ? s.tiling.order[s.tiling.idx] : null; }
  function pendingRows(s, pi) {
    var p = s.players[pi], out = [];
    for (var r = 0; r < 5; r++) if (p.lines[r].length === r + 1) out.push(r);
    return out;
  }
  // legal wall columns for the next completed row (colored wall: exactly one)
  function rowTargets(s, pi, r) {
    var p = s.players[pi], c = p.lineColor[r];
    if (s.variant === 'color') { var k = wallCol(r, c); return p.wall[r][k] ? [] : [k]; }
    return rowHas(p, r, c) ? [] : grayCols(p, r, c);
  }
  function scoreAt(wall, r, c) {
    var h = 1, v = 1, i;
    for (i = c - 1; i >= 0 && wall[r][i]; i--) h++;
    for (i = c + 1; i < 5 && wall[r][i]; i++) h++;
    for (i = r - 1; i >= 0 && wall[i][c]; i--) v++;
    for (i = r + 1; i < 5 && wall[i][c]; i++) v++;
    if (h === 1 && v === 1) return { points: 1, h: 1, v: 1 };
    return { points: (h > 1 ? h : 0) + (v > 1 ? v : 0), h: h, v: v };
  }
  function tileRow(s0, pi, r, c) {
    var s = clone(s0);
    assert(s.phase === 'tiling' && tilingPlayer(s) === pi, 'not tiling player ' + pi);
    var pend = pendingRows(s, pi);
    assert(pend.length && pend[0] === r, 'next row to tile is ' + pend[0] + ', not ' + r);
    var p = s.players[pi], color = p.lineColor[r], targets = rowTargets(s, pi, r), line = p.lines[r];
    var ev = { player: pi, row: r, color: color };
    if (!targets.length) {
      assert(s.variant === 'gray', 'completed line ' + r + ' has no wall space (colored wall)');
      ev.toFloor = []; ev.toLid = [];   // gray wall: no legal space -> the whole line falls to the floor
      line.forEach(function (t) { if (p.floor.length < 7) { p.floor.push(t); ev.toFloor.push(t); } else { s.lid.push(t); ev.toLid.push(t); } });
    } else {
      if (c === undefined || c === null) { assert(targets.length === 1, 'choose a column'); c = targets[0]; }
      assert(targets.indexOf(c) >= 0, 'column ' + c + ' is not legal');
      var tid = line[0];
      p.wall[r][c] = tid;
      var sc = scoreAt(p.wall, r, c);
      p.score += sc.points;
      ev.col = c; ev.id = tid; ev.points = sc.points; ev.h = sc.h; ev.v = sc.v;
      ev.toLid = line.slice(1); s.lid = s.lid.concat(ev.toLid);
      ev.rowDone = p.wall[r].every(Boolean);
    }
    p.lines[r] = []; p.lineColor[r] = null;
    return { state: s, event: ev };
  }
  function floorPenalty(p) { var pen = 0; for (var i = 0; i < Math.min(7, p.floor.length); i++) pen += FLOOR[i]; return pen; }
  function applyFloor(s0, pi) {
    var s = clone(s0);
    assert(s.phase === 'tiling' && tilingPlayer(s) === pi, 'not tiling player ' + pi);
    assert(!pendingRows(s, pi).length, 'rows still to tile');
    var p = s.players[pi], pen = floorPenalty(p), before = p.score;
    p.score = Math.max(0, p.score + pen);
    var ev = { player: pi, penalty: pen, lost: before - p.score, ids: p.floor.slice(), toLid: p.floor.filter(function (t) { return t !== MARKER; }), marker: p.floor.indexOf(MARKER) >= 0 };
    s.lid = s.lid.concat(ev.toLid); p.floor = [];
    s.tiling.idx++;
    if (s.tiling.idx < s.tiling.order.length) s.current = s.tiling.order[s.tiling.idx];
    else finishRound(s, ev);
    return { state: s, event: ev };
  }
  function rowsDone(p) { return p.wall.filter(function (row) { return row.every(Boolean); }).length; }
  function finishRound(s, ev) {
    var ends = s.players.some(function (p) { return rowsDone(p) > 0; });
    s.tiling = null;
    if (!ends) { s.phase = 'refill'; s.current = s.markerHolder !== null ? s.markerHolder : s.startPlayer; ev.roundOver = true; return; }
    s.players.forEach(function (p) {
      var rows = rowsDone(p), cols = 0, colors = 0;
      for (var c = 0; c < 5; c++) if (p.wall.every(function (row) { return row[c]; })) cols++;
      COLORS.forEach(function (k) { var n = 0; p.wall.forEach(function (row) { row.forEach(function (t) { if (t && col(t) === k) n++; }); }); if (n === 5) colors++; });
      p.bonus = { before: p.score, rows: rows, cols: cols, colors: colors, points: rows * 2 + cols * 7 + colors * 10 };
      p.score += p.bonus.points;
    });
    var best = Math.max.apply(null, s.players.map(function (p) { return p.score; }));
    var top = s.players.map(function (p, i) { return i; }).filter(function (i) { return s.players[i].score === best; });
    var bestRows = Math.max.apply(null, top.map(function (i) { return s.players[i].bonus.rows; }));
    s.winners = top.filter(function (i) { return s.players[i].bonus.rows === bestRows; });
    s.phase = 'over'; ev.gameOver = true;
  }

  /* ---------- helpers for UI / tests ---------- */
  function counts(s) {
    var all = [].concat(s.bag, s.lid, s.center);
    s.factories.forEach(function (f) { all = all.concat(f); });
    s.players.forEach(function (p) {
      p.lines.forEach(function (l) { all = all.concat(l); });
      p.wall.forEach(function (row) { row.forEach(function (t) { if (t) all.push(t); }); });
      all = all.concat(p.floor.filter(function (t) { return t !== MARKER; }));
    });
    return all;
  }

  if (saved && saved.state.phase !== 'over') {
    var s = saved.state;
    h += '<div class="resume"><div style="flex:1"><b>Game in progress</b>Round ' + s.round + ', ' + esc(s.players[s.current].name) + ' to play. ' + s.players.map(function (p) { return esc(p.name) + ' ' + p.score; }).join(', ') + '.</div>' +
      '<button class="act green" style="min-height:76px;font-size:24px" onclick="AZui.resume()">Resume</button></div>';
  }
  h += '<div class="setupGrid"><div><h2>Teams</h2>';
  prefs.teams.forEach(function (t, i) {
    var a = animal(t.animal), c = hex(t.color);
    h += '<div class="trow">' + badgeEmb(t.color, t.animal, 76) + '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap"><div class="tname" style="color:' + c + '">' + esc(a.name) + '</div>' +
      '<div class="swatches">' + COLORS.map(function (cc) {
        var taken = prefs.teams.some(function (o, j) { return j !== i && o.color === cc.id; });
        return '<button class="sw' + (t.color === cc.id ? ' sel' : '') + (taken ? ' taken' : '') + '" style="--c:' + cc.hex + '" title="' + cc.name + '" aria-label="' + cc.name + '" onclick="AZui.setColor(' + i + ',\'' + cc.id + '\')"></button>';
      }).join('') + '</div></div>' +
      (prefs.teams.length > 2 ? '<button class="rm" title="Remove team" aria-label="Remove team" onclick="AZui.removeTeam(' + i + ')">' + X_ICON + '</button>' : '<span></span>') +
      '<div class="animals">' + ANIMALS.map(function (an) {
        var taken = prefs.teams.some(function (o, j) { return j !== i && o.animal === an.id; });
        return '<button class="an' + (t.animal === an.id ? ' sel' : '') + (taken ? ' taken' : '') + '" title="' + an.name + '" aria-label="' + an.name + '" onclick="AZui.setAnimal(' + i + ',\'' + an.id + '\')">' + an.e + '</button>';
      }).join('') + '</div></div>';
  });
  if (prefs.teams.length < 4) h += '<button class="add" onclick="AZui.addTeam()">Add a team</button>';
  h += '</div><div><h2>The wall</h2><div class="opt">' +
    '<button class="' + (prefs.variant === 'color' ? 'on' : '') + '" onclick="AZui.setVariant(\'color\')">Colored wall<small>Each color has its own space. Best for the first game.</small></button>' +
    '<button class="' + (prefs.variant === 'gray' ? 'on' : '') + '" onclick="AZui.setVariant(\'gray\')">Gray wall<small>Choose the space yourself. No color twice in a column.</small></button></div>' +
    '<h2>Sound</h2><div class="musicRow" id="musicRow"><label><input type="checkbox" id="optMusic"' + (musicOn ? ' checked' : '') + ' onchange="setMusic(this.checked)"> Music</label></div>' +
    '<div class="setupBtns" style="margin-top:34px"><button class="act cobalt" style="min-height:80px;font-size:24px" onclick="openRules()">How to play</button><div class="spacer"></div>' +
    '<button class="act gilt" onclick="AZui.start()">Start game</button></div>' +
    '<p style="font:600 18px/1.4 var(--ui);color:var(--lime-ink-soft);margin-top:22px">Keys: <kbd>1</kbd>–<kbd>5</kbd> choose a row, <kbd>F</kbd> floor, <kbd>Space</kbd> next step, <kbd>Z</kbd> undo, <kbd>M</kbd> sound, <kbd>T</kbd> theme, <kbd>Shift</kbd>+<kbd>N</kbd> music.</p></div></div>';
  $('setupSheet').innerHTML = h;
  $('musicRow').appendChild(makeVol('mvol-inline')); syncVol();
}
function swapPick(i, key, val) {
  var other = prefs.teams.findIndex(function (o, j) { return j !== i && o[key] === val; });
  if (other >= 0) prefs.teams[other][key] = prefs.teams[i][key];
  prefs.teams[i][key] = val; sfx.pick(); savePrefs(); renderSetup();
}
function freeOf(key, list) { return list.find(function (v) { return !prefs.teams.some(function (t) { return t[key] === v; }); }); }
window.showSetup = function () { renderSetup(); $('setup').classList.remove('hidden'); };

/* ---------- rules ---------- */
window.openRules = function () {
  var mg = function (cells) { var s = '<div class="minigrid">'; for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++) { var k = cells[r + '-' + c]; s += k ? '<i class="tl' + (k === 'n' ? ' new' : '') + '" data-c="' + AZ.wallColor(r, c) + '"></i>' : '<i></i>'; } return s + '</div>'; };
  var ex = mg({ '2-0': 1, '2-1': 1, '2-2': 'n', '1-2': 1, '3-2': 1, '4-2': 1 });
  $('rulesSheet').innerHTML = '<button class="xbtn glazebtn" onclick="closeRules()" aria-label="Close">' + X_ICON + '</button><h1>How to play</h1>' +
    '<p class="lede">Decorate your wall with tiles and get the most points.</p><div class="rgrid"><div>' +
    '<h2>1. Take tiles</h2><ol>' +
    '<li>Take <strong>all the tiles of one color</strong> from one plate. The other tiles on that plate go to the <strong>center</strong>.</li>' +
    '<li>Or take all the tiles of one color from the center. The first team to do that this round also takes the <strong>1 coin</strong>. It goes on their floor, but they start the next round.</li></ol>' +
    '<h2 style="margin-top:22px">2. Fill a row</h2><ul>' +
    '<li>Put all your tiles in <strong>one row</strong> on the left of your board. Rows hold 1, 2, 3, 4 and 5 tiles.</li>' +
    '<li>A row has <strong>one color only</strong>. You cannot use a color that is already on the wall in that row.</li>' +
    '<li>Tiles that do not fit <strong>fall to the floor</strong> and break. Floor tiles lose points: −1, −1, −2, −2, −2, −3, −3.</li></ul>' +
    '<h2 style="margin-top:22px">3. Wall time</h2><ul>' +
    '<li>When the plates and the center are empty, every <strong>full row</strong> moves one tile to the wall. The other tiles go in the box lid.</li>' +
    '<li>The game ends after the round when a team <strong>completes a row on its wall</strong>.</li></ul></div>' +
    '<div><h2>Scoring a new tile</h2><div class="score-ex">' + ex + '<div>The new tile touches a line of <strong>3 across</strong> and <strong>4 down</strong>.<br>It scores <strong>3 + 4 = 7</strong> points.<br><br>A tile that touches nothing scores <strong>1</strong>.</div></div>' +
    '<h2 style="margin-top:26px">End bonus</h2><ul><li><strong>+2</strong> for each full row (across)</li><li><strong>+7</strong> for each full column (down)</li><li><strong>+10</strong> for each color with all 5 tiles on the wall</li></ul>' +
    '<h2 style="margin-top:26px">Tips</h2><ul><li>Look at the green rows and the badges before you choose: a red number shows the points you lose.</li><li>Watch the other teams. Sometimes the best move is to take the tiles they need!</li></ul></div></div>';
  $('rules').classList.remove('hidden');
};
window.closeRules = function () { $('rules').classList.add('hidden'); };

/* ---------- win ---------- */
function showWin() {
  if (!G || G.phase !== 'over') return;
  var order = G.players.map(function (p, i) { return i; }).sort(function (a, b) { return G.players[b].score - G.players[a].score || G.players[b].bonus.rows - G.players[a].bonus.rows; });
  var w = G.winners, tc = pcol(w[0]);
  var title = w.length > 1 ? w.map(pname).map(esc).join(' and ') + ' share the win!' : esc(pname(w[0])) + ' win!';
  var h = '<button class="xbtn glazebtn" onclick="AZui.closeWin()" aria-label="Close">' + X_ICON + '</button>' +
    '<div class="winHead">' + embHTML(w[0], 130) + '<div><h1 style="color:' + tc + '">' + title + '</h1><p class="lede" style="margin-top:8px">The game ends after round ' + G.round + '. Here are the bonus points.</p></div></div>' +
    '<table class="final"><tr><th></th><th>Before bonus</th><th>Full rows ×2</th><th>Full columns ×7</th><th>Full colors ×10</th><th>Total</th></tr>';
  order.forEach(function (p) {
    var b = G.players[p].bonus;
    h += '<tr class="' + (w.indexOf(p) >= 0 ? 'top' : '') + '"><td><div class="who">' + embHTML(p, 60) + '<span style="color:' + pcol(p) + '">' + esc(pname(p)) + '</span></div></td><td>' + b.before + '</td>' +
      '<td class="plus">' + b.rows + ' → +' + b.rows * 2 + '</td><td class="plus">' + b.cols + ' → +' + b.cols * 7 + '</td><td class="plus">' + b.colors + ' → +' + b.colors * 10 + '</td><td data-final="' + G.players[p].score + '" data-from="' + b.before + '">' + b.before + '</td></tr>';
  });
  h += '</table>';
  if (w.length === 1) { var tie = order.filter(function (p) { return G.players[p].score === G.players[w[0]].score; }); if (tie.length > 1) h += '<p class="lede">Same score! The tie-break is the number of full rows.</p>'; }
  h += '<div class="setupBtns"><div class="spacer"></div><button class="act cobalt" style="min-height:80px;font-size:24px" onclick="showSetup()">New teams</button><button class="act gilt" onclick="AZui.again()">Play again</button></div>';
  $('winSheet').innerHTML = h;
  $('win').classList.remove('hidden');
  Music.cue('win'); Music.duck(4); sfx.fanfare();
  setTimeout(function () {
    $('winSheet').querySelectorAll('[data-final]').forEach(function (td) { countUp(td, +td.dataset.from, +td.dataset.final, 1200); });
  }, 500);
  confetti(960, 300, tc, 140);
  stopWinFx(); var n = 0;
  ui.winFx = setInterval(function () { firework(); if (++n > 11) stopWinFx(); }, 380);
}
function stopWinFx() { if (ui.winFx) { clearInterval(ui.winFx); ui.winFx = 0; } }

/* ---------- debug (Shift+D) ---------- */
function teamOpts() { return G.players.map(function (p, i) { return '<option value="' + i + '">' + esc(p.name) + '</option>'; }).join(''); }
function renderDebug() {
  $('debug').innerHTML = '<h3>Debug panel <span style="font:500 15px var(--ui);opacity:.7">Shift+D closes it</span></h3>' +
    '<fieldset><legend>Round</legend><button onclick="AZui.dbg(\'endDraft\')">End drafting now</button><button onclick="AZui.dbg(\'nearEnd\')">Current team: 4 tiles in wall row 1</button></fieldset>' +
    '<fieldset><legend>Fill a plate (from the bag)</legend>plate <input type="number" id="dfI" value="1" min="1" max="9"> colors <input id="dfC" value="BBRY" style="width:90px"> <button onclick="AZui.dbg(\'plate\')">Set</button></fieldset>' +
    '<fieldset><legend>Wall tile</legend><select id="dwT">' + teamOpts() + '</select> row <input type="number" id="dwR" value="1" min="1" max="5"> col <input type="number" id="dwC" value="1" min="1" max="5"> <button onclick="AZui.dbg(\'wall\')">Place</button></fieldset>' +
    '<fieldset><legend>Score</legend><select id="dsT">' + teamOpts() + '</select> <input type="number" id="dsV" value="20"> <button onclick="AZui.dbg(\'score\')">Set</button></fieldset>' +
    '<div id="dbgMsg"></div><pre id="dbgInfo" style="font:500 14px/1.4 ui-monospace,monospace;white-space:pre-wrap;opacity:.8"></pre>';
  renderDebugInfo();
}
function renderDebugInfo() {
  var el = $('dbgInfo'); if (!el || !G) return;
  el.textContent = 'phase: ' + G.phase + '  round: ' + G.round + '\ncurrent: ' + pname(G.current) + '  focus: ' + pname(ui.focus) + '\nbag: ' + G.bag.length + '  lid: ' + G.lid.length + '  center: ' + G.center.length +
    '\nmarker: ' + (G.markerInCenter ? 'center' : G.markerHolder === null ? 'none' : pname(G.markerHolder)) + '\nmusic: ' + JSON.stringify(Music.state);
}
function toggleDebug() { if (!G) return; ui.debug = !ui.debug; $('debug').classList.toggle('hidden', !ui.debug); if (ui.debug) renderDebug(); }
function dbg(cmd) {
  var v = function (id) { return +$(id).value; };
  $('dbgMsg').textContent = '';
  if (ui.busy) { $('dbgMsg').textContent = 'Wait for the animation.'; return; }
  try {
    snapshot();
    if (cmd === 'endDraft') { G = AZ.debug.endDraft(G); ui.focus = AZ.tilingPlayer(G); }
    if (cmd === 'nearEnd') { for (var c = 0; c < 4; c++) G = AZ.debug.wallTile(G, G.current, 0, c); }
    if (cmd === 'wall') { G = AZ.debug.wallTile(G, v('dwT'), v('dwR') - 1, v('dwC') - 1); }
    if (cmd === 'score') { G = AZ.debug.setScore(G, v('dsT'), v('dsV')); }
    if (cmd === 'plate') {
      if (G.phase !== 'draft') throw new Error('Only while drafting');
      var i = v('dfI') - 1, s = AZ.clone(G), letters = $('dfC').value.toUpperCase().replace(/[^BYRKT]/g, '').slice(0, 4).split('');
      if (!s.factories[i]) throw new Error('No plate ' + (i + 1));
      s.bag = s.bag.concat(s.factories[i]); s.factories[i] = [];
      letters.forEach(function (L) { var k = s.bag.findIndex(function (t) { return t[0] === L; }); if (k < 0) throw new Error('No ' + cname(L) + ' left in the bag'); s.factories[i].push(s.bag.splice(k, 1)[0]); });
      G = s;
    }
    AZ.check(G); ui.sel = null; render(); save(); renderDebug();
  } catch (e) { ui.undo.pop(); $('dbgMsg').textContent = e.message; }
}

/* ---------- keyboard ---------- */
addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.shiftKey && e.code === 'KeyD') { e.preventDefault(); toggleDebug(); return; }
  if (e.shiftKey && e.code === 'KeyN') { e.preventDefault(); toggleMusic(); return; }
  if (e.shiftKey && (e.code === 'BracketLeft' || e.code === 'BracketRight')) { Music.setLevel(Music.level + (e.code === 'BracketRight' ? 10 : -10)); syncVol(); toast('Music volume ' + Math.round(Music.level) + '%', 1200); e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'escape') { if (!$('rules').classList.contains('hidden')) closeRules(); else if (ui.sel) { ui.sel = null; render(); } return; }
  if (k === 'm') return toggleMute();
  if (k === 't') return toggleTheme();
  if (!G || !overlaysClosed()) return;
  if (k === 'z') return undo();
  if ((k === ' ' || k === 'enter') && !(e.target && e.target.tagName === 'BUTTON' && e.target.id !== 'mainActBtn')) { e.preventDefault(); mainAct(); return; }
  if (ui.sel && /^[1-5]$/.test(k)) place(+k - 1);
  else if (ui.sel && (k === 'f' || k === '0')) place('F');
});

/* ---------- start ---------- */
function startWith(state, focus) {
  G = state; ui.focus = focus != null ? focus : G.current; ui.sel = null; ui.pick = null; ui.busy = false; ui.undo = [];
  stopWinFx();
  render({ enter: true }); save();
}
window.AZui = {
  pick: pick, place: place, main: mainAct, undo: undo, chooseCell: chooseCell,
  setColor: function (i, c) { swapPick(i, 'color', c); },
  setAnimal: function (i, a) { swapPick(i, 'animal', a); },
  setVariant: function (v) { prefs.variant = v; savePrefs(); sfx.pick(); renderSetup(); },
  addTeam: function () {
    if (prefs.teams.length >= 4) return;
    prefs.teams.push({ color: freeOf('color', COLORS.map(function (x) { return x.id; })), animal: freeOf('animal', ANIMALS.map(function (x) { return x.id; })) });
    savePrefs(); renderSetup();
  },
  removeTeam: function (i) { if (prefs.teams.length > 2) { prefs.teams.splice(i, 1); savePrefs(); renderSetup(); } },
  start: function () {
    var players = prefs.teams.map(function (t) { return { name: animal(t.animal).name, color: t.color, animal: t.animal }; });
    $('setup').classList.add('hidden'); $('win').classList.add('hidden');
    startWith(AZ.createGame({ players: players, variant: prefs.variant }));
    setTimeout(turnBanner, 350);
  },
  resume: function () { var d = loadSave(); if (!d) return; $('setup').classList.add('hidden'); startWith(d.state, d.focus); },
  again: function () {
    $('win').classList.add('hidden');
    var players = G.players.map(function (p) { return { name: p.name, color: p.color, animal: p.animal }; });
    startWith(AZ.createGame({ players: players, variant: G.variant })); setTimeout(turnBanner, 350);
  },
  closeSetup: function () { $('setup').classList.add('hidden'); },
  closeWin: function () { $('win').classList.add('hidden'); stopWinFx(); },
  dbg: dbg,
  state: function () { return G; },
  load: function (s, focus) { AZ.check(s); startWith(AZ.clone(s), focus); },
  ui: function () { return ui; }
};

// on load: show the last game behind the setup sheet (no blank state), or a fresh preview game
(function boot() {
  var d = loadSave();
  if (d) { try { AZ.check(d.state); G = d.state; ui.focus = d.focus != null ? d.focus : G.current; } catch (e) { d = null; } }
  if (!d) {
    G = AZ.createGame({ players: prefs.teams.map(function (t) { return { name: animal(t.animal).name, color: t.color, animal: t.animal }; }), variant: prefs.variant, seed: 2026 });
    ui.focus = 0;
  }
  render();
  renderSetup();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
})();
})();

</script>
</body>
</html>
