<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Can't Stop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --s:1;
  --bg-outer:#c9d9ea; --sky1:#9ccbf7; --sky2:#e9f3fd; --ridge1:#8fb0d6; --ridge2:#adc6e4; --ridge3:#cbdcef;
  --panel:#ffffff; --panel2:#f1f5fb; --line:#c6d4e6; --ink:#0d1b2e; --muted:#4d6380;
  --accent:#c2620a; --accent-ink:#ffffff; --glow:rgba(194,98,10,.45);
  --cell:rgba(255,255,255,.66); --cell-line:rgba(40,70,110,.38); --cell-top:#c9dcf3; --num:#13243d;
  --danger:#dc2626; --ok:#059669; --pairA:#d97706; --pairB:#0284c7;
  --peg-stroke:#0b1220; --shadow:0 10px 30px rgba(20,40,70,.18);
}
html[data-theme="dark"]{
  --bg-outer:#03060d; --sky1:#07101f; --sky2:#1a2b50; --ridge1:#14223f; --ridge2:#1b2d52; --ridge3:#233966;
  --panel:#0e182b; --panel2:#15223a; --line:#283a5c; --ink:#eef3fb; --muted:#97a8c6;
  --accent:#fbbf24; --accent-ink:#1a1200; --glow:rgba(251,191,36,.55);
  --cell:rgba(30,48,82,.82); --cell-line:rgba(150,180,230,.18); --cell-top:#3a5584; --num:#f2f6fd;
  --danger:#f87171; --ok:#34d399; --pairA:#f59e0b; --pairB:#38bdf8;
  --peg-stroke:#050a14; --shadow:0 12px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-outer);color:var(--ink);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.hidden{display:none!important}
kbd{font:700 15px Inter,system-ui,sans-serif;padding:2px 8px;border-radius:6px;border:1.5px solid currentColor;opacity:.75}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));transform-origin:center;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
#shaker{position:absolute;inset:0;display:grid;grid-template-columns:350px 1fr 470px;grid-template-rows:88px 1fr 76px}
#shaker.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-4px)}20%,80%{transform:translateX(8px)}30%,50%,70%{transform:translateX(-14px)}40%,60%{transform:translateX(14px)}}

/* top bar */
#top{grid-column:1/-1;display:flex;align-items:center;gap:18px;padding:0 26px;position:relative;z-index:5}
.back-link{display:inline-flex;align-items:center;padding:12px 20px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:700 19px Inter,system-ui,sans-serif;white-space:nowrap}
.back-link:hover{border-color:var(--accent)}
#title{font:800 40px Sora,Inter,system-ui,sans-serif;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
#title small{font:600 18px Inter,system-ui,sans-serif;color:var(--muted);letter-spacing:0}
.spacer{flex:1}
.tbtn{height:56px;min-width:56px;padding:0 20px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font:700 19px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.tbtn:hover{border-color:var(--accent)}
.tbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#theme-btn,#mute-btn{font-size:24px;padding:0;width:56px;justify-content:center}

/* teams */
#teams{padding:6px 18px 18px 26px;display:flex;flex-direction:column;gap:16px;z-index:2}
.team{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);transition:transform .25s,border-color .25s}
.team.active{border-color:var(--tc);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 35%,transparent),var(--shadow);transform:translateX(6px)}
.team .row{display:flex;align-items:center;gap:14px}
.team .nm{font:800 30px Sora,Inter,system-ui,sans-serif;line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team .turnflag{font:800 15px Inter,system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--tc);margin-top:6px;height:18px}
.slots{display:flex;gap:10px;margin-top:12px}
.slot{width:62px;height:62px;border-radius:14px;border:2.5px dashed var(--line);display:grid;place-items:center;font:800 28px Sora,Inter,system-ui,sans-serif;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--tc);background:var(--tc);color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.team .stat{margin-top:10px;font:600 17px Inter,system-ui,sans-serif;color:var(--muted)}

/* board */
#boardWrap{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:0 0 10px}
#ridge{position:absolute;left:-350px;right:-470px;bottom:-76px;height:760px;pointer-events:none}
#board{position:relative;display:flex;align-items:flex-end;gap:12px;z-index:1}
.col{width:82px;display:flex;flex-direction:column;align-items:stretch;gap:5px;position:relative}
.col .num{height:58px;display:grid;place-items:center;font:800 46px Sora,Inter,system-ui,sans-serif;color:var(--num);text-shadow:0 2px 6px rgba(0,0,0,.25)}
.col .num.bot{height:56px}
.cell{height:54px;border-radius:12px;background:var(--cell);border:1.5px solid var(--cell-line);position:relative;display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:nowrap;transition:background .2s}
.cell.top{background:linear-gradient(180deg,#fff 0%,var(--cell-top) 100%);border:2px solid #7f9fc6}
html[data-theme="dark"] .cell.top{background:linear-gradient(180deg,#e9f1ff 0%,#9fb6dc 100%)}
.cell.path{background:color-mix(in srgb,var(--accent) 22%,var(--cell));border-color:var(--accent)}
.col.claimed .cell{opacity:.28}
.col.claimed .cell.owner{opacity:1;background:var(--oc);border-color:var(--oc)}
.col.closedHint .num{opacity:.45}
.banner{height:58px;border-radius:12px 12px 4px 4px;background:var(--oc);display:flex;align-items:center;justify-content:center;gap:4px;color:#fff;font:800 34px Sora,Inter,system-ui,sans-serif;text-shadow:0 2px 4px rgba(0,0,0,.5);box-shadow:0 6px 16px rgba(0,0,0,.3);position:relative}
.banner::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);border:12px solid transparent;border-top-color:var(--oc);border-bottom:0}
.peg{flex:0 0 auto;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mk{display:inline-grid;place-items:center;border-radius:50%;background:var(--mc);border:2.5px solid var(--peg-stroke);line-height:1;overflow:hidden;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mk.climber{background:#fff;border:3.5px solid #0b1220}
.mk.ghost{background:rgba(255,255,255,.4);border-style:dashed}
.peg.climber{filter:drop-shadow(0 0 7px rgba(255,255,255,.95)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.peg.ghost{opacity:.85;filter:none;animation:ghost 1s ease-in-out infinite alternate}
@keyframes ghost{from{opacity:.45}to{opacity:.95}}
.peg.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.3) translateY(14px)}70%{transform:scale(1.2)}100%{transform:none}}
.peg.fall{animation:fall .9s ease-in forwards}
@keyframes fall{0%{transform:none;opacity:1}100%{transform:translateY(240px) rotate(40deg);opacity:0}}

.boardMsg{position:absolute;left:0;right:0;top:0;bottom:0;z-index:4;pointer-events:none}
.boardMsg .box{position:absolute;z-index:2;left:calc(50% - 524px);top:26px;width:320px;padding:18px 22px;border-radius:24px;background:var(--panel);border:3px solid var(--accent);box-shadow:var(--shadow);text-align:center}
.boardMsg h2{margin:0;font:800 46px/1.1 Sora,Inter,system-ui,sans-serif;letter-spacing:-.5px;overflow-wrap:anywhere}
.boardMsg p{margin:8px 0 0;font:600 20px/1.35 Inter,system-ui,sans-serif;color:var(--muted)}
.boardMsg.bust .box{border-color:var(--danger)}
.boardMsg.bust h2{color:var(--danger);font-size:88px;line-height:1;animation:bustIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes bustIn{from{transform:scale(2.2);opacity:0}to{transform:none;opacity:1}}
.boardMsg.claim .box{border-color:var(--oc)}
.boardMsg.claim h2{color:var(--oc)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:22px;border-radius:3px;animation:conf 2.4s linear forwards}
@keyframes conf{to{transform:translateY(1100px) rotate(720deg)}}

/* right panel */
#panel{padding:6px 26px 18px 18px;display:flex;flex-direction:column;gap:14px;z-index:2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow)}
.whose{display:flex;align-items:center;gap:14px;font:800 30px Sora,Inter,system-ui,sans-serif}
.whose .lbl{font:700 15px Inter,system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);display:block}
.dice{display:flex;gap:14px;justify-content:center;margin-top:14px}
.die{width:92px;height:92px;border-radius:20px;display:block;transition:transform .2s}
.die.tumble{animation:tumble .14s linear infinite}
@keyframes tumble{0%{transform:rotate(-12deg) translateY(-4px)}50%{transform:rotate(10deg) translateY(3px)}100%{transform:rotate(-12deg) translateY(-4px)}}
.die.faded{opacity:.3}
.tray{display:flex;align-items:center;gap:12px;margin-top:14px;font:700 19px Inter,system-ui,sans-serif;color:var(--muted)}
.tray .pegs{display:flex;gap:6px}
.tray .peg.used{opacity:.22;filter:none}
.risk{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--panel2);font:700 20px Inter,system-ui,sans-serif;display:flex;justify-content:space-between}
.risk b{font:800 24px Sora,Inter,system-ui,sans-serif}
#opts{display:flex;flex-direction:column;gap:12px}
.optHead{font:700 16px Inter,system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 -2px 4px}
.opt{min-height:78px;border-radius:18px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 18px;box-shadow:var(--shadow);text-align:left;transition:transform .12s,border-color .12s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);transform:translateX(-4px);outline:none;box-shadow:0 0 0 4px var(--glow),var(--shadow)}
.opt .k{width:38px;height:38px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font:800 20px Inter,system-ui,sans-serif;color:var(--muted)}
.opt .pairs{display:flex;gap:8px}
.pair{display:flex;align-items:center;gap:3px;padding:4px 6px;border-radius:10px;border:2px solid}
.pair.A{border-color:var(--pairA);background:color-mix(in srgb,var(--pairA) 18%,transparent)}
.pair.B{border-color:var(--pairB);background:color-mix(in srgb,var(--pairB) 18%,transparent)}
.pair.off{opacity:.3;border-style:dashed}
.pair svg{width:26px;height:26px}
.opt .ol{flex:1;text-align:right;font:800 38px Sora,Inter,system-ui,sans-serif;letter-spacing:-.5px}
.bigbtn{height:96px;border-radius:22px;border:none;font:800 36px Sora,Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:14px;box-shadow:var(--shadow);flex-direction:column;line-height:1.05;transition:transform .1s,filter .15s}
.bigbtn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px)}
.bigbtn:disabled{opacity:.4}
.bigbtn small{font:700 18px Inter,system-ui,sans-serif;opacity:.9}
.bigbtn kbd{font-size:14px}
.b-roll{background:var(--accent);color:var(--accent-ink)}
.b-stop{background:#e11d48;color:#fff}
.b-next{background:var(--ok);color:#06231a}
.row2{display:flex;gap:12px}
.row2>*{flex:1}
.lnk{background:none;border:1px dashed var(--line);border-radius:14px;height:56px;font:700 18px Inter,system-ui,sans-serif;color:var(--muted)}
.lnk:hover{color:var(--ink);border-color:var(--accent)}
.summary{font:600 21px Inter,system-ui,sans-serif;line-height:1.45}
.summary b{font-family:Sora}

/* strip */
#strip{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 26px;background:color-mix(in srgb,var(--panel) 88%,transparent);border-top:1px solid var(--line);z-index:3}
#strip .main{font:700 26px Inter,system-ui,sans-serif;flex:1;display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden}
#strip .chip{padding:6px 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font:800 24px Sora,Inter,system-ui,sans-serif}
#strip .chip.top{border-color:var(--accent);color:var(--accent)}
#strip .keys{font:600 17px Inter,system-ui,sans-serif;color:var(--muted);display:flex;gap:16px;white-space:nowrap}

/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(3,8,18,.62);backdrop-filter:blur(3px)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:40px 48px;max-height:1000px;overflow:auto}
.sheet h1{margin:0 0 6px;font:800 64px Sora,Inter,system-ui,sans-serif;letter-spacing:-1px}
.sheet h2{margin:0 0 14px;font:800 34px Sora,Inter,system-ui,sans-serif}
.sheet .sub{font:600 22px Inter,system-ui,sans-serif;color:var(--muted);margin:0 0 24px}
.xbtn{position:absolute;right:26px;top:22px;width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font:700 26px Inter,system-ui,sans-serif}

/* setup */
#setup{background:linear-gradient(180deg,var(--sky1),var(--sky2))}
#setup .sheet{width:1240px;position:relative}
.resume{display:flex;align-items:center;gap:22px;padding:20px 24px;border-radius:20px;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));margin-bottom:26px}
.resume .t{flex:1;font:700 22px Inter,system-ui,sans-serif}
.resume .t b{font:800 28px Sora,Inter,system-ui,sans-serif;display:block}
.trow{display:grid;grid-template-columns:76px 1fr auto 56px;align-items:center;column-gap:18px;row-gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tname{font:800 36px Sora,Inter,system-ui,sans-serif}
.animals{grid-column:2/-1;display:flex;gap:8px}
.an{width:62px;height:62px;border-radius:14px;border:3px solid transparent;background:var(--panel2);font-size:36px;line-height:1;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.an:hover{border-color:var(--line)}
.an.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel2))}
.an.taken{opacity:.3}
.trow input{height:64px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);color:var(--ink);font:800 28px Sora,Inter,system-ui,sans-serif;padding:0 18px;width:100%}
.trow input:focus{outline:none;border-color:var(--accent)}
.picks{display:flex;gap:8px}
.sw{width:50px;height:50px;border-radius:12px;border:3px solid transparent;padding:0;display:grid;place-items:center;background:var(--panel2)}
.sw.sel{border-color:var(--ink)}
.sw.taken{opacity:.25}
.rm{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font:700 24px Inter,system-ui,sans-serif;color:var(--muted)}
.setupBtns{display:flex;gap:16px;margin-top:28px;align-items:center}
.setupBtns .bigbtn{padding:0 44px;height:84px}
.add{height:64px;padding:0 26px;border-radius:16px;border:2px dashed var(--line);background:none;font:700 21px Inter,system-ui,sans-serif;color:var(--muted)}

/* rules */
#rules .sheet{width:1380px;position:relative}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.rules ol,.rules ul{margin:0;padding-left:30px;font:500 24px/1.5 Inter,system-ui,sans-serif}
.rules li{margin-bottom:8px}
.rules b{font-weight:800}
.ex{background:var(--panel2);border-radius:20px;padding:22px 24px;font:500 21px/1.45 Inter,system-ui,sans-serif}
.ex .dice{justify-content:flex-start;margin:10px 0 14px}
.ex .die{width:58px;height:58px;border-radius:12px}
.exrow{display:flex;align-items:center;gap:12px;margin:8px 0}
.exrow .pair svg{width:30px;height:30px}
.exrow .arrow{font:800 24px Sora,Inter,system-ui,sans-serif;color:var(--muted)}
.exrow .res{font:700 21px Inter,system-ui,sans-serif}
.chips{display:flex;gap:10px;margin-top:12px}
.chips span{padding:8px 16px;border-radius:12px;border:2px solid var(--accent);font:800 24px Sora,Inter,system-ui,sans-serif}

/* win */
#win .sheet{width:980px;text-align:center;position:relative;overflow:hidden}
.stand{display:flex;flex-direction:column;gap:12px;margin:26px 0 30px;text-align:left}
.stand .r{display:flex;align-items:center;gap:18px;padding:14px 20px;border-radius:16px;background:var(--panel2);font:800 30px Sora,Inter,system-ui,sans-serif}
.stand .r .pl{width:44px;color:var(--muted)}
.stand .r .n{flex:1}
.stand .r .c{font:700 22px Inter,system-ui,sans-serif;color:var(--muted)}
.stand .r.first{outline:3px solid var(--oc)}

/* debug */
#debug{position:absolute;right:0;top:0;bottom:0;width:520px;z-index:30;background:var(--panel);border-left:2px solid var(--accent);box-shadow:-20px 0 60px rgba(0,0,0,.4);padding:26px;overflow:auto;font:600 19px Inter,system-ui,sans-serif}
#debug h3{margin:0 0 16px;font:800 28px Sora,Inter,system-ui,sans-serif}
#debug fieldset{border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#debug legend{font:800 16px Inter,system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 6px}
#debug input,#debug select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 19px Inter,system-ui,sans-serif;padding:0 8px}
#debug input[type=number]{width:64px}
#debug button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:700 17px Inter,system-ui,sans-serif;padding:0 14px}
#debug button:hover{border-color:var(--accent)}
#dbgMsg{min-height:26px;color:var(--danger);font:700 17px Inter,system-ui,sans-serif}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .peg.fall{opacity:0}
}
</style>
</head>
<body>
<div id="stage">
  <div id="shaker">
    <header id="top">
      <a class="back-link" href="../">← Game Hub</a>
      <div id="title">⛰️ Can't Stop <small>push-your-luck dice race</small></div>
      <div class="spacer"></div>
      <button class="tbtn" id="rulesBtn" onclick="openRules()">📖 Rules</button>
      <button class="tbtn" id="riskBtn" onclick="toggleRisk()" title="Teacher option: show the exact chance of busting">🎲 Bust risk: off</button>
      <button class="tbtn" id="newBtn" onclick="showSetup()">↺ New game</button>
      <button class="tbtn" id="mute-btn" onclick="toggleMute()" title="Mute (M)">🔊</button>
      <button class="tbtn theme-btn" id="theme-btn" onclick="toggleTheme()" title="Theme (T)">🌙</button>
    </header>
    <aside id="teams"></aside>
    <main id="boardWrap">
      <svg id="ridge" viewBox="0 0 1920 760" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 520 L220 380 L380 450 L560 290 L720 360 L960 120 L1200 340 L1380 260 L1560 420 L1740 330 L1920 430 L1920 760 L0 760Z" fill="var(--ridge3)"/>
        <path d="M0 600 L260 470 L470 540 L700 400 L960 250 L1220 420 L1450 360 L1680 500 L1920 470 L1920 760 L0 760Z" fill="var(--ridge2)"/>
        <path d="M0 700 L300 610 L620 650 L960 540 L1300 640 L1600 600 L1920 680 L1920 760 L0 760Z" fill="var(--ridge1)"/>
      </svg>

function renderBoard() {
  var pv = previewTargets(), html = '';
  CS.COLS.forEach(function (c) {
    var H = CS.HEIGHTS[c], owner = G.claimed[c];
    var oc = owner !== null ? pcol(owner) : '';
    html += '<div class="col' + (owner !== null ? ' claimed' : '') + '" data-col="' + c + '"' + (owner !== null ? ' style="--oc:' + oc + '"' : '') + '>';
    if (owner !== null) html += '<div class="banner">' + peg(G.players[owner].animal, '#fff', 26) + c + '</div>';
    else html += '<div class="num">' + c + '</div>';
    for (var pos = H; pos >= 1; pos--) {
      var cls = 'cell' + (pos === H ? ' top' : '');
      var marks = [];
      if (owner !== null) {
        if (pos === H) { cls += ' owner'; marks.push(peg(G.players[owner].animal, oc, 44)); }
      } else {
        G.bases.forEach(function (b, p) { if (b[c] === pos) marks.push({ base: p }); });
        if (G.climbers[c] === pos) marks.push({ climber: true });
        if (G.phase === 'bust' && G.lost && G.lost[c] === pos) marks.push({ lost: true });
        if (pv && pv[c] && pv[c].to === pos) marks.push({ ghost: true });
        if (pv && pv[c] && pos > pv[c].from && pos <= pv[c].to) cls += ' path';
        var n = marks.length, size = n <= 1 ? 44 : n === 2 ? 37 : n === 3 ? 25 : n === 4 ? 19 : 15;
        var csize = Math.min(48, size + 6);
        marks = marks.map(function (m) {
          if (m.base !== undefined) return peg(G.players[m.base].animal, pcol(m.base), size);
          if (m.climber) { var moved = ui.prevClimbers[c] !== pos; return climberSVG(csize, G.current, moved ? 'pop' : ''); }
          if (m.lost) return climberSVG(csize, G.current, 'fall');
          return climberSVG(csize, G.current, 'ghost');
        });
      }
      html += '<div class="' + cls + '" data-pos="' + pos + '">' + marks.join('') + '</div>';
    }
    html += '<div class="num bot">' + c + '</div></div>';
  });
  $('board').innerHTML = html;
  ui.prevClimbers = Object.assign({}, G.climbers);

  var msg = '';
  var p = G.current, pl = G.players[p];
  if (G.phase === 'bust') {
    msg = '<div class="boardMsg bust"><div class="box"><h2>BUST!</h2><p>No column can move. ' + esc(pl.name) + ' loses this turn’s climbing.</p></div></div>';
  } else if (G.phase === 'stopped' && G.banked) {
    var cl = G.banked.filter(function (b) { return b.claim; }).map(function (b) { return b.col; });
    if (cl.length) {
      msg = '<div class="boardMsg claim" style="--oc:' + pcol(p) + '"><div class="box"><h2>⛳ ' + esc(pl.name) + ' claims ' + cl.join(' & ') + '!</h2><p>Column' + (cl.length > 1 ? 's are' : ' is') + ' closed for everyone now.</p></div>' + confetti() + '</div>';
    }
  }
  $('boardMsg').innerHTML = msg;
}
function confetti() {
  if (reduced) return '';
  var s = '<div class="confetti">', cols = ['#f59e0b', '#38bdf8', '#f472b6', '#34d399', '#a78bfa', '#fde047'];
  for (var i = 0; i < 46; i++) s += '<i style="left:' + Math.random() * 100 + '%;background:' + cols[i % cols.length] + ';animation-delay:' + (Math.random() * 0.9).toFixed(2) + 's"></i>';
  return s + '</div>';
}

function pairHTML(pair, tint, used) {
  return '<span class="pair ' + tint + (used ? '' : ' off') + '">' + dieSVG(pair[0]) + dieSVG(pair[1]) + '</span>';
}

function diceHTML() {
  var diceVals = ui.tumble || G.dice || [0, 0, 0, 0];
  var tints = ['', '', '', ''], fade = [false, false, false, false];
  if (!ui.tumble && ui.preview != null && G.options[ui.preview]) {
    var o = G.options[ui.preview];
    o.pairIdx[0].forEach(function (i) { tints[i] = 'A'; fade[i] = !o.used[0]; });
    o.pairIdx[1].forEach(function (i) { tints[i] = 'B'; fade[i] = !o.used[1]; });
  }
  var showDice = G.phase === 'chooseOption' || G.phase === 'bust' || ui.tumble;
  return diceVals.map(function (v, i) {
    return dieSVG(showDice ? v : 0, (ui.tumble ? 'tumble' : '') + (fade[i] ? ' faded' : ''), tints[i] || null);
  }).join('');
}

function renderPanel() {
  var p = G.current, pl = G.players[p], h = '';
  var dice = diceHTML();
  var used = Object.keys(G.climbers).length, tray = '';
  for (var i = 0; i < CS.MAX_CLIMBERS; i++) tray += climberSVG(40, p, i < used ? 'used' : '');

  h += '<div class="card"><div class="whose">' + peg(pl.animal, pcol(p), 46) + '<div><span class="lbl">Turn ' + G.turn + '</span>' + esc(pl.name) + '</div></div>' +
    '<div class="dice" id="diceRow">' + dice + '</div>' +
    '<div class="tray"><div class="pegs">' + tray + '</div><span>' + (CS.MAX_CLIMBERS - used) + ' of 3 climbers free</span></div>';
  if (ui.showRisk && (G.phase === 'awaitDecision' || G.phase === 'awaitRoll')) {
    var r = CS.bustProbability(G);
    h += '<div class="risk"><span>Bust risk on next roll</span><b>' + (r * 100).toFixed(1) + '%</b></div>';
  }
  h += '</div>';

  if (G.phase === 'awaitRoll') {
    h += '<button class="bigbtn b-roll" onclick="CSui.roll()">🎲 Roll the dice<small><kbd>Space</kbd></small></button>';
  } else if (G.phase === 'chooseOption' && !ui.tumble) {
    h += '<div class="optHead">Choose your move</div><div id="opts">' + G.options.map(function (o, i) {
      return '<button class="opt" data-i="' + i + '" onclick="CSui.pick(' + i + ')" onmouseenter="CSui.hover(' + i + ')" onmouseleave="CSui.hover(null)" onfocus="CSui.hover(' + i + ')" onblur="CSui.hover(null)">' +
        '<span class="k">' + (i + 1) + '</span><span class="pairs">' + pairHTML(o.pairing[0], 'A', o.used[0]) + pairHTML(o.pairing[1], 'B', o.used[1]) + '</span>' +
        '<span class="ol">' + o.label + '</span></button>';
    }).join('') + '</div>';
  } else if (G.phase === 'awaitDecision') {
    var pv = CS.stopPreview(G), claims = pv.filter(function (b) { return b.claim; }).map(function (b) { return b.col; });
    var sub = 'Bank ' + pv.length + ' column' + (pv.length === 1 ? '' : 's') + (claims.length ? ' · claim ' + claims.join(' & ') : '') + (claims.length && CS.claimsOf(G, p) + claims.length >= CS.CLAIMS_TO_WIN ? ' → WIN' : '');
    h += '<button class="bigbtn b-roll" onclick="CSui.roll()">🎲 Roll again<small><kbd>Space</kbd></small></button>' +
      '<button class="bigbtn b-stop" onclick="CSui.stop()">✋ Stop<small>' + sub + ' · <kbd>S</kbd></small></button>' +
      (G.undo ? '<button class="lnk" onclick="CSui.undo()">↶ Undo last move <kbd>Z</kbd></button>' : '');
  } else if (G.phase === 'bust') {
    h += '<div class="card summary">💥 <b>Bust.</b> No pair of dice makes a column you can climb. All climbers fall off. Banked markers stay safe.</div>' +
      '<button class="bigbtn b-next" onclick="CSui.next()">Next team ▶<small><kbd>N</kbd></small></button>';
  } else if (G.phase === 'stopped') {
    var lines = (G.banked || []).map(function (b) {
      return '<div>Column <b>' + b.col + '</b>: ' + b.from + ' → ' + b.to + (b.claim ? ' ⛳ <b>claimed!</b>' : '') + '</div>';
    }).join('');
    h += '<div class="card summary">✅ <b>' + esc(pl.name) + ' banked:</b>' + lines + '</div>' +
      '<button class="bigbtn b-next" onclick="CSui.next()">Next team ▶<small><kbd>N</kbd></small></button>';
  }
  $('panel').innerHTML = h;
}

function renderStrip() {
  var m = '', p = G.current, pl = G.players[p];
  var chip = function (x) { return '<span class="chip' + (x.top ? ' top' : '') + '">+' + x.gain + ' on ' + x.col + (x.top ? ' ⛳' : '') + '</span>'; };
  if (G.phase === 'bust' && G.lost) {
    var lost = Object.keys(G.lost).map(Number).sort(function (a, b) { return a - b; }).map(function (c) { return { col: c, gain: G.lost[c] - G.bases[p][c] }; });
    m = '<span>Lost this turn:</span>' + (lost.length ? lost.map(chip).join('') : '<span>nothing</span>');
  } else if (G.phase === 'stopped') {
    m = '<span>Banked:</span>' + (G.banked || []).map(function (b) { return chip({ col: b.col, gain: b.to - b.from, top: b.claim }); }).join('');
  } else if (G.phase === 'won') {
    m = '<span>🏆 ' + esc(G.players[G.winner].name) + ' wins!</span>';
  } else {
    var tp = CS.turnProgress(G);
    m = '<span style="color:' + pcol(p) + '">' + esc(pl.name) + '</span><span>· This turn:</span>' + (tp.length ? tp.map(chip).join('') : '<span style="opacity:.6">nothing yet</span>');
  }
  $('stripMain').innerHTML = m;
  $('stripKeys').innerHTML = '<span><kbd>Space</kbd> roll</span><span><kbd>1–6</kbd> move</span><span><kbd>S</kbd> stop</span><span><kbd>N</kbd> next</span><span><kbd>Z</kbd> undo</span>';
}

/* ---------- win ---------- */
function renderWin() {
  var ov = $('win');
  if (G.phase !== 'won') { ov.classList.add('hidden'); return; }
  if (!ov.classList.contains('hidden')) return;
  var rows = G.players.map(function (pl, p) {
    return { p: p, claims: CS.claimsOf(G, p), banked: CS.COLS.reduce(function (a, c) { return a + G.bases[p][c] / CS.HEIGHTS[c]; }, 0) };
  }).sort(function (a, b) { return (b.p === G.winner) - (a.p === G.winner) || b.claims - a.claims || b.banked - a.banked; });
  var w = G.players[G.winner];
  $('winSheet').style.setProperty('--oc', pcol(G.winner));
  $('winSheet').innerHTML = confetti() + '<div style="font-size:90px">🏔️</div><h1 style="color:' + pcol(G.winner) + '">' + esc(w.name) + ' wins!</h1>' +
    '<p class="sub">First to claim three columns.</p><div class="stand">' + rows.map(function (r, i) {
      var pl = G.players[r.p];
      return '<div class="r' + (i === 0 ? ' first' : '') + '"><span class="pl">' + (i + 1) + '</span>' + peg(pl.animal, pcol(r.p), 40) +
        '<span class="n">' + esc(pl.name) + '</span><span class="c">' + r.claims + ' column' + (r.claims === 1 ? '' : 's') + ' claimed</span></div>';
    }).join('') + '</div><div class="row2"><button class="bigbtn b-roll" onclick="CSui.again()">↺ Play again</button><button class="bigbtn b-next" onclick="showSetup()">New game</button></div>';
  ov.classList.remove('hidden');
}

/* ---------- setup ---------- */
function renderSetup() {
  var saved = loadSave(), h = '';
  h += '<h1>⛰️ Can’t Stop</h1><p class="sub">Roll four dice, climb the mountain, and know when to stop. First team to claim three columns wins.</p>';
  if (saved && saved.state.phase !== 'won') {
    var s = saved.state;
    h += '<div class="resume"><div class="t"><b>Saved game found</b>Turn ' + s.turn + ' · ' + s.players.map(function (p) { return esc(p.name); }).join(' vs ') + ' · ' + esc(s.players[s.current].name) + ' to play</div>' +
      '<button class="bigbtn b-roll" style="height:76px;padding:0 34px;font-size:28px" onclick="CSui.resume()">▶ Resume</button></div>';
  }
  h += '<h2>Teams</h2>';
  setupTeams.forEach(function (t, i) {
    var a = animal(t.animal);
    h += '<div class="trow"><div class="tprev">' + peg(t.animal, hex(t.color), 64) + '</div>' +
      '<div class="tname" style="color:' + hex(t.color) + '">' + esc(a.name) + '</div>' +
      '<div class="picks">' + COLORS.map(function (c) {
        var taken = setupTeams.some(function (o, j) { return j !== i && o.color === c.id; });
        return '<button class="sw' + (t.color === c.id ? ' sel' : '') + (taken ? ' taken' : '') + '" style="background:' + c.hex + '" title="' + c.name + '" onclick="CSui.setColor(' + i + ',\'' + c.id + '\')"></button>';
      }).join('') + '</div>' +
      (setupTeams.length > 2 ? '<button class="rm" title="Remove team" onclick="CSui.removeTeam(' + i + ')">✕</button>' : '<span></span>') +
      '<div class="animals">' + ANIMALS.map(function (an) {
        var taken = setupTeams.some(function (o, j) { return j !== i && o.animal === an.id; });
        return '<button class="an' + (t.animal === an.id ? ' sel' : '') + (taken ? ' taken' : '') + '" title="' + an.name + '" data-animal="' + an.id + '" onclick="CSui.setAnimal(' + i + ',\'' + an.id + '\')">' + an.e + '</button>';
      }).join('') + '</div></div>';
  });
  h += '<div class="setupBtns">' + (setupTeams.length < 4 ? '<button class="add" onclick="CSui.addTeam()">＋ Add team</button>' : '') +
    '<div class="spacer"></div><button class="tbtn" onclick="openRules()">📖 How to play</button>' +
    '<button class="bigbtn b-roll" onclick="CSui.start()">Start game ▶</button></div>';
  $('setupSheet').innerHTML = h;
}
window.showSetup = function () {
  $('win').classList.add('hidden');
  if (G) setupTeams = G.players.map(function (p) { return { color: p.color, animal: p.animal }; });
  renderSetup(); $('setup').classList.remove('hidden');
};
function swapPick(i, key, val) {
  var other = setupTeams.findIndex(function (o, j) { return j !== i && o[key] === val; });
  if (other >= 0) setupTeams[other][key] = setupTeams[i][key];
  setupTeams[i][key] = val;
  renderSetup();
}
function freeOf(key, list) { return list.find(function (v) { return !setupTeams.some(function (t) { return t[key] === v; }); }); }

/* ---------- rules ---------- */
window.openRules = function () {
  var ex = function (a, b, ua, ub, res) {
    return '<div class="exrow">' + pairHTML(a, 'A', ua) + pairHTML(b, 'B', ub) + '<span class="arrow">→</span><span class="res">' + res + '</span></div>';
  };
  $('rulesSheet').innerHTML = '<button class="xbtn" onclick="closeRules()">✕</button><h1>How to play</h1>' +
    '<p class="sub">Goal: be the first team to reach the top of <b>three</b> columns.</p><div class="rgrid"><div>' +
    '<h2>On your turn</h2><ol>' +
    '<li><b>Roll</b> the four dice.</li>' +
    '<li>Put the dice in <b>two pairs</b> and add each pair. Each total is a column number (2–12).</li>' +
    '<li>Move a white <b>climber</b> up one space in each of those columns. You only have <b>3 climbers</b> per turn.</li>' +
    '<li>Now decide: <b>roll again</b> to climb more, or <b>stop</b> to save your progress.</li></ol>' +
    '<h2 style="margin-top:22px">Stop or bust?</h2><ul>' +
    '<li><b>Stop:</b> your colored markers move up to your climbers. That progress is safe.</li>' +
    '<li><b>Bust:</b> no pair gives a column you can use. Your climbers fall off and you lose everything from this turn.</li>' +
    '<li>Reach the <b>top</b> of a column and stop: you <b>claim</b> it. Nobody can use that column again.</li></ul></div>' +
    '<div class="ex"><h2>Example turn</h2>Blue already has climbers on columns <b>3</b> and <b>6</b>. One climber is free. Blue rolls:' +
    '<div class="dice">' + [2, 4, 5, 5].map(function (v) { return dieSVG(v); }).join('') + '</div>' +
    'There are three ways to make pairs:' +
    ex([2, 4], [5, 5], true, true, '6 and 10: move up on 6, put the last climber on 10') +
    ex([2, 5], [4, 5], true, false, '7 and 9: only one free climber, so choose <b>7</b>…') +
    ex([2, 5], [4, 5], false, true, '…or <b>9</b> (not both)') +
    'So Blue’s options are:<div class="chips"><span>6 + 10</span><span>7 only</span><span>9 only</span></div>' +
    '<p style="margin:16px 0 0">Middle columns are short to roll but tall to climb. Edge columns (2, 12) are short but hard to roll. <b>Talk with your team before you decide!</b></p></div></div>';
  $('rules').classList.remove('hidden');
};
window.closeRules = function () { $('rules').classList.add('hidden'); };
function overlaysClosed() { return $('setup').classList.contains('hidden') && $('rules').classList.contains('hidden'); }

/* ---------- debug (Shift+D) ---------- */
function colOpts() { return CS.COLS.map(function (c) { return '<option>' + c + '</option>'; }).join(''); }
function teamOpts() { return G.players.map(function (p, i) { return '<option value="' + i + '">' + esc(p.name) + '</option>'; }).join(''); }
function renderDebug() {
  $('debug').innerHTML = '<h3>🛠 Debug <span style="font:600 16px Inter;color:var(--muted)">Shift+D to close</span></h3>' +
    '<fieldset><legend>Force dice</legend>' + [0, 1, 2, 3].map(function (i) { return '<input type="number" min="1" max="6" value="' + (i + 1) + '" id="dd' + i + '">'; }).join('') +
    '<button onclick="CSui.dbg(\'dice\')">Roll these</button></fieldset>' +
    '<fieldset><legend>Climber (current team)</legend>col <select id="dcC">' + colOpts() + '</select> pos <input type="number" id="dcP" value="1" min="0" max="13">' +
    '<button onclick="CSui.dbg(\'climb\')">Set</button><button onclick="CSui.dbg(\'unclimb\')">Remove</button><button onclick="CSui.dbg(\'clear\')">Clear all</button></fieldset>' +
    '<fieldset><legend>Base marker</legend><select id="dbT">' + teamOpts() + '</select> col <select id="dbC">' + colOpts() + '</select> pos <input type="number" id="dbP" value="3" min="0" max="12">' +
    '<button onclick="CSui.dbg(\'base\')">Set</button></fieldset>' +
    '<fieldset><legend>Claim column</legend><select id="dlT">' + teamOpts() + '</select> col <select id="dlC">' + colOpts() + '</select>' +
    '<button onclick="CSui.dbg(\'claim\')">Claim</button></fieldset>' +
    '<fieldset><legend>Game</legend><button onclick="CSui.dbg(\'win\')">Jump to win (current team)</button><button onclick="CSui.dbg(\'pass\')">Skip to next team</button></fieldset>' +
    '<div id="dbgMsg"></div><pre id="dbgInfo" style="font:500 15px/1.4 ui-monospace,monospace;white-space:pre-wrap;color:var(--muted)"></pre>';
  renderDebugInfo();
}
function renderDebugInfo() {
  var el = $('dbgInfo'); if (!el) return;
  el.textContent = 'phase: ' + G.phase + '\ncurrent: ' + G.players[G.current].name + '\ndice: ' + JSON.stringify(G.dice) +
    '\nclimbers: ' + JSON.stringify(G.climbers) + '\nbust risk: ' + (CS.bustProbability(G) * 100).toFixed(2) + '%';
}
function toggleDebug() {
  if (!G) return;
  ui.debug = !ui.debug;
  $('debug').classList.toggle('hidden', !ui.debug);
  if (ui.debug) renderDebug();
}
function dbg(cmd) {
  var v = function (id) { return +$(id).value; };
  $('dbgMsg').textContent = '';
  try {
    if (cmd === 'dice') {
      var d = [0, 1, 2, 3].map(function (i) { return Math.max(1, Math.min(6, v('dd' + i) || 1)); });
      if (!CS.canRoll(G)) { if (G.phase === 'chooseOption') { G = Object.assign({}, G, { phase: 'awaitDecision' }); if (!Object.keys(G.climbers).length) G.phase = 'awaitRoll'; } else throw new Error('Cannot roll now (' + G.phase + ')'); }
      return doRoll(d);
    }
    if (cmd === 'climb') commit(CS.debug.setClimber(G, v('dcC'), v('dcP')));
    if (cmd === 'unclimb') commit(CS.debug.setClimber(G, v('dcC'), 0));
    if (cmd === 'clear') { var s = G; Object.keys(G.climbers).forEach(function (c) { s = CS.debug.setClimber(s, +c, 0); }); commit(s); }
    if (cmd === 'base') commit(CS.debug.setBase(G, v('dbT'), v('dbC'), v('dbP')));
    if (cmd === 'claim') commit(CS.debug.claim(G, v('dlT'), v('dlC')));
    if (cmd === 'win') { commit(CS.debug.winNow(G)); sfx.fanfare(); }
    if (cmd === 'pass') { var t = Object.assign({}, G, { phase: 'stopped', banked: [] }); commit(CS.nextTeam(t)); }
  } catch (e) { $('dbgMsg').textContent = e.message; }
}

/* ---------- keyboard ---------- */
addEventListener('keydown', function (e) {
  var tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); toggleDebug(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'escape') { closeRules(); return; }
  if (k === 'm') return toggleMute();
  if (k === 't') return toggleTheme();
  if (!G || !overlaysClosed()) return;
  if (k === ' ' || k === 'r') { e.preventDefault(); doRoll(); }
  else if (/^[1-6]$/.test(k)) pick(+k - 1);
  else if (k === 's') doStop();
  else if (k === 'n') doNext();
  else if (k === 'z') doUndo();
});
addEventListener('pointerdown', function () { ac(); }, { once: true });

/* ---------- public hooks ---------- */
window.CSui = {
  roll: function () { doRoll(); }, pick: pick, stop: doStop, next: doNext, undo: doUndo,
  hover: function (i) {
    if (ui.preview === i || !G || G.phase !== 'chooseOption') return;
    ui.preview = i; renderBoard();
    var row = $('diceRow'); if (row) row.innerHTML = diceHTML();
  },
  setColor: function (i, c) { swapPick(i, 'color', c); },
  setAnimal: function (i, a) { swapPick(i, 'animal', a); },
  addTeam: function () {
    if (setupTeams.length >= 4) return;
    var c = freeOf('color', COLORS.map(function (x) { return x.id; })), an = freeOf('animal', ANIMALS.map(function (x) { return x.id; }));
    setupTeams.push({ color: c, animal: an });
    renderSetup();
  },
  removeTeam: function (i) { if (setupTeams.length > 2) { setupTeams.splice(i, 1); renderSetup(); } },
  start: function () {
    setupTeams.forEach(function (t) { t.name = animal(t.animal).name; });
    ui.preview = null; ui.prevClimbers = {};
    commit(CS.createGame(setupTeams));
    $('setup').classList.add('hidden');
  },
  resume: function () {
    var d = loadSave(); if (!d) return;
    ui.showRisk = !!d.showRisk; ui.prevClimbers = Object.assign({}, d.state.climbers);
    G = d.state; render(); $('setup').classList.add('hidden');
  },
  again: function () {
    $('win').classList.add('hidden');
    ui.prevClimbers = {};
    commit(CS.createGame(G.players));
  },
  dbg: dbg,
  closeSetup: function () { $('setup').classList.add('hidden'); render(); },
  state: function () { return G; }
};

renderSetup();
})();
</script>
</body>
