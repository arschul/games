<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auction Stunt Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Old-time variety-show auction house: velvet curtains, a mahogany rostrum, a brass gavel,
   marquee bulbs and an ivory lot card on a brass easel under one spotlight. */
:root{
  --s:1;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --ui:"Figtree",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  /* materials (same in both themes) */
  --velvet:#3a0d14; --velvet-hi:#7d1d2b; --velvet-mid:#5c1420; --velvet-lo:#22060b;
  --mahogany:#5a2a1a; --mahogany-hi:#8a4a2c; --mahogany-lo:#2e130a;
  --gilt:#d9a441; --gilt-hi:#f3cf7a; --gilt-lo:#8a6420; --gilt-ink:#4a3008;
  --ivory:#f3e6c8; --ivory-hi:#fbf4e2; --ivory-lo:#d9c59c; --ink:#2b1a10; --ink-soft:#5a4330;
  --danger:#e0342b; --success:#2fa86a; --bulb:#ffd98a; --bulb-glow:rgba(255,200,110,.75);
  /* scene (theme) */
  --wall-a:#0d0406; --wall-b:#2a0c12; --wall-c:#40121b; --wall-stripe:rgba(255,210,150,.035);
  --floor-a:#3a2214; --floor-b:#1c0f08; --spot:rgba(255,236,190,.34); --spot-pool:rgba(255,226,160,.30); --house:.0;
}
:root[data-theme="light"]{
  --wall-a:#b9876b; --wall-b:#d7b08c; --wall-c:#ead0ac; --wall-stripe:rgba(120,50,30,.06);
  --floor-a:#9a6a44; --floor-b:#6b4528; --spot:rgba(255,248,225,.30); --spot-pool:rgba(255,246,220,.35); --house:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0304}
:root[data-theme="light"] body{background:#7a4a35}
body{font-family:var(--ui);color:var(--ivory);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:hidden;background:var(--wall-a)}
#shaker{position:absolute;inset:0}

/* ---------- scene ---------- */
#wall{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,var(--wall-stripe) 0 2px,transparent 2px 46px),
  radial-gradient(70% 70% at 34% 52%,var(--wall-c),transparent 70%),
  linear-gradient(180deg,var(--wall-a),var(--wall-b))}
#floor{position:absolute;left:0;right:0;top:770px;height:310px;background:
  repeating-linear-gradient(180deg,rgba(0,0,0,.35) 0 2px,transparent 2px 38px),
  repeating-linear-gradient(91deg,rgba(255,255,255,.035) 0 1px,transparent 1px 23px),
  linear-gradient(180deg,var(--floor-a),var(--floor-b))}
#floor::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%)}
#spot{position:absolute;inset:0;pointer-events:none;transition:filter .6s}
#spot .cone{fill:url(#coneG);mix-blend-mode:screen}
#spot .pool{fill:url(#poolG);mix-blend-mode:screen}
#spot stop.sc{stop-color:var(--spot)}
#spot stop.sp{stop-color:var(--spot-pool)}
#spot.red stop.sc{stop-color:rgba(255,70,50,.55)}
#spot.red stop.sp{stop-color:rgba(255,40,30,.6)}
#spot.red{filter:saturate(1.4)}
#spot.sputter{animation:sputter .7s steps(1) 1}
@keyframes sputter{0%{opacity:1}12%{opacity:.15}24%{opacity:.9}36%{opacity:.05}52%{opacity:.7}70%{opacity:.1}100%{opacity:1}}
#spot.hot{filter:brightness(1.5)}

.curtain{position:absolute;top:0;bottom:0;width:240px;z-index:4;background:
  linear-gradient(180deg,rgba(0,0,0,.25),transparent 25%,transparent 70%,rgba(0,0,0,.45)),
  repeating-linear-gradient(90deg,var(--velvet-lo) 0,var(--velvet-mid) 20px,var(--velvet-hi) 31px,var(--velvet-mid) 42px,var(--velvet-lo) 58px);
  transition:clip-path 1.4s cubic-bezier(.5,0,.2,1)}
.curtain.l{left:0;clip-path:polygon(0 0,100% 0,72% 46%,58% 56%,46% 100%,0 100%);filter:drop-shadow(10px 0 18px rgba(0,0,0,.6))}
.curtain.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,54% 100%,42% 56%,28% 46%)}
.tie{position:absolute;top:548px;z-index:5;width:120px;height:26px;border-radius:13px;background:repeating-linear-gradient(115deg,var(--gilt-hi) 0 6px,var(--gilt) 6px 12px,var(--gilt-lo) 12px 15px);box-shadow:0 4px 8px rgba(0,0,0,.5)}
.tie.l{left:84px;transform:rotate(-14deg)} .tie.r{right:84px;transform:rotate(14deg)}
.tie i{position:absolute;bottom:-46px;width:22px;height:50px;border-radius:4px 4px 11px 11px;background:repeating-linear-gradient(90deg,var(--gilt-hi) 0 2px,var(--gilt-lo) 2px 4px)}
.tie.l i{left:20px} .tie.r i{right:20px}
#stage.closed .curtain.l{clip-path:polygon(0 0,100% 0,100% 0,100% 100%,100% 100%,0 100%);width:980px}
#stage.closed .curtain.r{clip-path:polygon(0 0,100% 0,100% 100%,0 100%,0 100%,0 0);width:980px}
#stage.closed .tie{opacity:0;transition:opacity .4s}

#valance{position:absolute;left:0;right:0;top:0;height:132px;z-index:7;background:
  linear-gradient(180deg,rgba(0,0,0,.35),transparent 40%,rgba(0,0,0,.3)),
  repeating-linear-gradient(90deg,var(--velvet-lo) 0,var(--velvet-mid) 30px,var(--velvet-hi) 46px,var(--velvet-mid) 62px,var(--velvet-lo) 80px);
  box-shadow:0 6px 0 var(--gilt-lo)}
#valance::after{content:"";position:absolute;left:0;right:0;top:132px;height:44px;background:
  radial-gradient(circle at 50% 0,var(--velvet-mid) 0 36px,transparent 37px) 0 0/80px 44px repeat-x,
  radial-gradient(circle at 50% 0,var(--gilt) 0 41px,var(--gilt-lo) 42px 43px,transparent 44px) 0 0/80px 44px repeat-x;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
#bulbs{position:absolute;left:0;right:0;top:104px;height:22px;z-index:8;display:flex;justify-content:space-around;padding:0 20px}
.bulb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff 0 18%,var(--bulb) 40%,#c98a2c 100%);box-shadow:0 0 10px var(--bulb-glow),0 0 2px #fff;flex:none}
.chase .bulb{animation:chase .5s steps(1) infinite}
.chase .bulb:nth-child(3n+1){animation-delay:-.33s}.chase .bulb:nth-child(3n+2){animation-delay:-.16s}
@keyframes chase{0%{filter:brightness(.35);box-shadow:none}50%{filter:none}}

/* ---------- top bar ---------- */
#top{position:absolute;left:28px;right:28px;top:22px;height:64px;z-index:9;display:flex;align-items:center;gap:14px}
.tbtn,.back-link{height:56px;display:inline-flex;align-items:center;gap:10px;padding:0 22px;border-radius:999px;font:700 21px var(--ui);color:var(--ivory);text-decoration:none;white-space:nowrap;border:0}
.tbtn svg{width:24px;height:24px}
.icon-btn{width:56px;padding:0;justify-content:center}
.back-link:hover,.tbtn:hover{filter:brightness(1.15)}
#mark{display:flex;align-items:center;gap:14px;margin-left:16px;font:400 34px/1 var(--display);color:var(--gilt-hi);text-shadow:0 3px 0 var(--velvet-lo),0 0 18px rgba(243,207,122,.35)}
#mark svg{width:46px;height:46px}
#roundInfo{display:flex;gap:10px;margin-left:10px}
.chip{height:46px;display:inline-flex;align-items:center;padding:0 18px;border-radius:12px;font:800 22px var(--ui);color:var(--gilt-ink)}
.spacer{flex:1}

/* ---------- materials ---------- */
.wood{background:
  repeating-linear-gradient(91deg,rgba(0,0,0,.09) 0 2px,transparent 2px 9px),
  repeating-linear-gradient(89.3deg,rgba(255,225,190,.05) 0 1px,transparent 1px 17px),
  radial-gradient(120% 90% at 28% 0%,rgba(255,215,170,.16),transparent 60%),
  linear-gradient(180deg,#7a3a22,var(--mahogany) 58%,#3f1c10);
  box-shadow:inset 0 1px 0 rgba(255,220,180,.28),0 4px 0 var(--mahogany-lo),0 10px 18px rgba(0,0,0,.45)}
.brass{background:radial-gradient(120% 140% at 30% 0%,rgba(255,255,255,.55),transparent 42%),linear-gradient(180deg,var(--gilt-hi),var(--gilt) 48%,#a87a2a);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 3px 0 var(--gilt-lo),0 8px 14px rgba(0,0,0,.4)}
.paper{background:
  radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.55),transparent 60%),
  repeating-linear-gradient(0deg,rgba(120,90,40,.035) 0 1px,transparent 1px 4px),
  repeating-linear-gradient(90deg,rgba(120,90,40,.03) 0 1px,transparent 1px 5px),
  linear-gradient(180deg,var(--ivory-hi),var(--ivory) 60%,#ead9b2)}

/* tactile buttons */
.act{position:relative;height:100px;padding:0 40px;border-radius:22px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:16px;
  font:400 40px/1 var(--display);letter-spacing:1px;color:var(--ink);background:linear-gradient(180deg,var(--a1),var(--a2));
  box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s,filter .2s}
.act:active{transform:translateY(6px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.3)}
.act:disabled{filter:grayscale(.85) brightness(.6);cursor:default}
.act:disabled:active{transform:none}
.act kbd{font:800 18px var(--ui);padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.18);color:inherit;opacity:.8}
.act svg{width:44px;height:44px}
.a-gold{--a1:#f6d88c;--a2:#c8902f;--edge:#7a5418;color:var(--gilt-ink)}
.a-ember{--a1:#ffa264;--a2:#e0562b;--edge:#86280d;color:#fff}
.a-green{--a1:#5fd897;--a2:#2fa86a;--edge:#145f37;color:#fff}
.a-red{--a1:#ff7a6c;--a2:#e0342b;--edge:#7a130e;color:#fff}
.a-wood{--edge:var(--mahogany-lo);color:var(--ivory);background:
  repeating-linear-gradient(91deg,rgba(0,0,0,.09) 0 2px,transparent 2px 9px),linear-gradient(180deg,#86442a,var(--mahogany))}
.act.small{height:72px;font-size:28px;padding:0 28px;border-radius:18px}
.breathe{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{filter:brightness(1.12) drop-shadow(0 0 22px rgba(243,207,122,.75))}}
.pop{animation:popIn .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{from{opacity:0;transform:translateY(30px) scale(.92)}}

/* ---------- easel + lot card ---------- */
#easel{position:absolute;left:250px;top:186px;width:800px;height:800px;z-index:3}
#easelLegs{position:absolute;left:0;top:0;width:800px;height:800px;overflow:visible}
#lot{position:absolute;left:20px;top:0;width:760px;height:500px;border-radius:10px;color:var(--ink);padding:42px 54px 34px;
  box-shadow:0 2px 0 #c9b385,0 24px 40px rgba(0,0,0,.55),0 4px 10px rgba(0,0,0,.35)}
#lot::before{content:"";position:absolute;inset:14px;border:3px solid var(--gilt);border-radius:6px;box-shadow:inset 0 0 0 5px var(--ivory),inset 0 0 0 6.5px var(--gilt-lo);pointer-events:none}
#lot .clip{position:absolute;top:-16px;width:70px;height:34px;border-radius:8px 8px 12px 12px}
#lot .clip.a{left:110px}#lot .clip.b{right:110px}
#lot .head{display:flex;align-items:center;justify-content:space-between;position:relative}
#lot .lotno{font:400 34px/1 var(--display);color:var(--gilt-lo)}
.ribbon{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px 0 18px;border-radius:6px;font:800 24px var(--ui);color:#fff;background:var(--rc);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.ribbon svg{width:28px;height:28px}
#lot h2{margin:30px 0 14px;font:400 72px/1.02 var(--display);color:var(--ink);letter-spacing:.5px}
#lot .desc{margin:0;font:600 36px/1.28 var(--ui);color:var(--ink-soft);max-width:640px}
#lot .foot{position:absolute;left:54px;right:54px;bottom:40px;display:flex;align-items:center;gap:14px;font:800 27px var(--ui);color:var(--ink)}
#lot .foot svg{width:40px;height:40px;flex:none}
#lot .foot .ghost{color:var(--ink-soft);font-weight:600}
#lot .foot.goal span{max-width:300px;line-height:1.15}
#lot.enter{animation:lotIn .7s cubic-bezier(.25,1.2,.4,1)}
@keyframes lotIn{0%{transform:translate(-160px,-420px) rotate(-14deg);opacity:0}70%{transform:translate(0,8px) rotate(1deg);opacity:1}100%{transform:none}}

/* stamps and flags sit on the card's lower right, away from the buttons */
#msg{position:absolute;left:250px;top:186px;width:800px;height:520px;z-index:6;pointer-events:none}
.stamp{position:absolute;right:-44px;bottom:-22px;transform:rotate(-9deg);text-align:center;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
.stamp .ink{display:inline-block;padding:10px 26px 4px;border:7px double var(--sc);border-radius:14px;font:400 92px/1 var(--display);color:var(--sc);
  background:rgba(243,230,200,.55);mix-blend-mode:multiply;-webkit-mask:repeating-radial-gradient(circle at 30% 40%,#000 0 3px,rgba(0,0,0,.82) 3px 5px)}
.stamp p{margin:8px 0 0;font:800 26px/1.2 var(--ui);color:var(--sc)}
@keyframes slam{0%{transform:rotate(-9deg) scale(3.2);opacity:0}60%{opacity:1}100%{transform:rotate(-9deg) scale(1)}}
.flag{position:absolute;right:-56px;bottom:-30px;display:flex;align-items:center}
.flag .pole{width:14px;height:190px;border-radius:7px;background:linear-gradient(90deg,var(--gilt-lo),var(--gilt-hi),var(--gilt));box-shadow:0 6px 10px rgba(0,0,0,.4);align-self:flex-end}
.flag .cloth{position:relative;margin-left:-2px;align-self:flex-start;height:124px;padding:0 60px 0 20px;display:flex;align-items:center;gap:14px;background:
  repeating-linear-gradient(100deg,rgba(255,255,255,.12) 0 18px,rgba(0,0,0,.08) 18px 40px),var(--tc);color:var(--tink);
  clip-path:polygon(0 0,100% 0,86% 50%,100% 100%,0 100%);box-shadow:0 8px 16px rgba(0,0,0,.4);animation:unfurl .8s cubic-bezier(.3,1.2,.4,1) both}
.flag .cloth b{font:400 46px/1 var(--display)}
.flag .cloth span span{font:800 22px/1.2 var(--ui);display:block;margin-top:6px}
@keyframes unfurl{from{clip-path:polygon(0 0,0 0,0 50%,0 100%,0 100%)}}

/* ---------- right column ---------- */
#right{position:absolute;left:1110px;top:186px;width:570px;height:470px;z-index:3}
#board{position:absolute;left:0;top:0;width:570px;height:260px;border-radius:22px}
#board .bulbs{position:absolute;inset:8px;pointer-events:none}
#board .bulbs .bulb{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px}
#board .panel{position:absolute;inset:28px;border-radius:12px;background:radial-gradient(90% 90% at 50% 40%,#2a0f0a,#0d0504);box-shadow:inset 0 6px 14px rgba(0,0,0,.9),0 0 0 3px var(--gilt-lo);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#bidNum{font:400 128px/1 var(--display);color:#ffe2a0;text-shadow:0 0 6px #ffb84d,0 0 26px rgba(255,170,60,.7),0 0 60px rgba(255,140,40,.35);font-variant-numeric:tabular-nums}
#bidUnit{margin-top:6px;font:800 26px var(--ui);color:var(--ivory);opacity:.9;display:flex;align-items:center;gap:10px}
#bidUnit svg{width:28px;height:28px}
#plaque{position:absolute;left:0;top:274px;width:570px;height:76px;border-radius:16px;display:flex;align-items:center;gap:16px;padding:0 22px;color:var(--gilt-ink);font:800 29px/1.1 var(--ui)}
#plaque .pc{flex:none}
#plaque .txt{flex:1;min-width:0}
#plaque small{display:block;font:600 21px var(--ui);color:#6b4a14;margin-top:3px}
#plaque small.warn{color:#a3170f;font-weight:800}
#actions{position:absolute;left:0;top:364px;width:570px;display:flex;gap:18px;align-items:flex-start}
#actions .act{flex:1}

/* stopwatch */
#watch{position:absolute;left:110px;top:-6px;width:350px;height:368px}
#watch svg{width:350px;height:368px;overflow:visible}
#watch .digits{position:absolute;left:0;right:0;top:248px;text-align:center;font:400 46px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
#watch.hurry .digits{color:var(--danger)}
#watch.hurry .face{animation:hurry .5s ease-in-out infinite alternate}
@keyframes hurry{to{fill:#f6cfc0}}
#watch.ring{animation:ring .5s ease-in-out 2}
@keyframes ring{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}

/* gavel */
#gavelBox{position:absolute;left:1640px;top:856px;width:220px;height:140px;z-index:7;pointer-events:none}
#gavel{position:absolute;left:28px;top:-40px;width:200px;height:120px;transform-origin:182px 92px;transform:rotate(-24deg)}
#block{position:absolute;left:10px;top:92px;width:120px;height:44px;border-radius:50%/40%}

/* ---------- rostrum and paddles ---------- */
#rostrum{position:absolute;left:0;right:0;top:990px;height:90px;z-index:5;border-top:6px solid var(--gilt)}
#rostrum::before{content:"";position:absolute;left:0;right:0;top:-18px;height:14px;background:linear-gradient(180deg,#8a4a2c,#4a2414);box-shadow:0 -2px 0 rgba(255,220,180,.25)}
#paddles{position:absolute;left:0;right:0;top:0;bottom:0;z-index:6;pointer-events:none}
.paddle{position:absolute;top:768px;width:160px;height:224px;margin-left:-80px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;transition:filter .3s}
.paddle .lift{position:absolute;inset:0;transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.paddle.up .lift{transform:translateY(-62px) rotate(-3deg)}
.paddle .face{position:absolute;left:50%;top:0;width:var(--fs,132px);height:var(--fs,132px);margin-left:calc(var(--fs,132px) / -2);border-radius:50%;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 62%,var(--tc),color-mix(in srgb,var(--tc) 50%,#000) 105%);
  box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 45%,#000),0 9px 12px rgba(0,0,0,.5),inset 0 -4px 6px rgba(0,0,0,.25),inset 0 0 0 5px rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;transition:box-shadow .3s}
.paddle .emo{font:calc(var(--fs,132px) * .55)/1 var(--emoji);filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.paddle .handle{position:absolute;left:50%;bottom:0;width:26px;height:110px;margin-left:-13px;border-radius:6px 6px 10px 10px;background:
  repeating-linear-gradient(1deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px),linear-gradient(90deg,#4a2414,#9a5a34 45%,#5a2a1a);box-shadow:0 6px 8px rgba(0,0,0,.4)}
.paddle .coin{position:absolute;right:4px;top:-8px;min-width:58px;height:58px;padding:0 8px;border-radius:29px;display:flex;align-items:center;justify-content:center;
  font:400 30px/1 var(--display);color:var(--gilt-ink);background:radial-gradient(circle at 35% 30%,#fff3c4,var(--gilt) 55%,#9a6c1e);
  box-shadow:0 3px 0 #6b4a12,0 6px 10px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,255,255,.25)}
.paddle.holder .face{box-shadow:0 0 0 7px var(--gilt-hi),0 0 40px 10px rgba(243,207,122,.55),0 9px 12px rgba(0,0,0,.5),inset 0 -4px 6px rgba(0,0,0,.25)}
.paddle.opener .face{animation:breatheFace 2s ease-in-out infinite}
@keyframes breatheFace{50%{box-shadow:0 0 0 7px var(--gilt-hi),0 0 46px 14px rgba(243,207,122,.6),0 9px 12px rgba(0,0,0,.5)}}
.paddle.dim{filter:brightness(.55) saturate(.6)}
.paddle:focus-visible{outline:none}

/* ---------- save / load ---------- */
function save() { try { if (G && !ui.preview) localStorage.setItem(SAVE_KEY, JSON.stringify({ state: G })); } catch (e) {} }
function loadSave() { try { var d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return d && AUC.valid(d.state) ? d : null; } catch (e) { return null; } }

/* ---------- rendering ---------- */
function overlayOpen() { return !$('setup').classList.contains('hidden') || !$('rules').classList.contains('hidden') || !$('score').classList.contains('hidden'); }

function render() {
  if (!G) return;
  if (!ui.holdScores) ui.shown = G.teams.map(function (t) { return t.score; });
  var n = G.teams.length;
  $('roundInfo').innerHTML = '<span class="chip brass">Round ' + G.round + ' of ' + G.rounds + '</span><span class="chip brass">Lot ' + (G.lotInRound + 1) + ' of ' + n + '</span>';
  renderLot();
  renderRight();
  renderPaddles();
  renderMsg(false);
  $('spot').classList.toggle('red', !!(G.result && !G.result.passed && G.phase !== 'auction'));
  if (ui.debug) renderDebug();
}

function renderLot() {
  var t = G.task, c = CAT_COLOR[t.type], foot;
  if (G.phase === 'auction') {
    foot = (G.mode === 'up' ? I.up + '<span>Highest bid wins</span>' : I.down + '<span>Lowest bid wins</span>') +
      '<span class="ghost">' + (G.mode === 'down' ? 'Bids start at ' + AUC.DOWN_START + ' seconds' : 'Each bid adds 1') + '</span>';
  } else {
    var b = G.bidder, goal;
    if (t.type === 'name') goal = 'Goal: ' + G.bid + ' ' + pl(G.bid, AUC.unitOf(t)) + ' in ' + AUC.NAME_TIME + ' seconds';
    else if (t.type === 'endurance') goal = 'Goal: hold for ' + G.bid + ' ' + pl(G.bid, 'seconds');
    else goal = 'Goal: finish in ' + G.bid + ' ' + pl(G.bid, 'seconds');
    foot = tpc(b, 50) + '<span>' + goal + '</span>';
  }
  $('lot').innerHTML = '<span class="clip a brass"></span><span class="clip b brass"></span>' +
    '<div class="head"><span class="lotno">Lot ' + G.lotNo + '</span><span class="ribbon" style="--rc:' + c + '">' + I[t.type] + AUC.CAT_LABEL[t.type] + '</span></div>' +
    '<h2>' + esc(t.title) + '</h2><p class="desc">' + esc(t.desc) + '</p><div class="foot' + (G.phase === 'auction' ? '' : ' goal') + '">' + foot + '</div>';
  fitTitle();
}
function fitTitle() {
  var h = $('lot').querySelector('h2'); if (!h) return;
  var fs = 72; h.style.fontSize = fs + 'px';
  while (h.scrollWidth > h.clientWidth + 1 && fs > 44) { fs -= 4; h.style.fontSize = fs + 'px'; }
  while (h.offsetHeight > fs * 1.1 * 2 && fs > 44) { fs -= 4; h.style.fontSize = fs + 'px'; }
}

function pl(n, word) { if (n === 1) return word === 'catches' ? 'catch' : word.replace(/s$/, ''); return word; }
function unitHTML() {
  var t = G.task;
  if (t.type === 'name') return I.up + pl(G.bid, AUC.unitOf(t)) + ' in ' + AUC.NAME_TIME + ' seconds';
  return (G.mode === 'up' ? I.up : I.down) + pl(G.bid, 'seconds');
}

function plaqueHTML() {
  if (G.bidder === null) {
    var o = G.opener;
    return tpc(o, 56) + '<div class="txt">' + tname(o) + ' open the bidding<small>Click their paddle or press ' + (o + 1) + '</small></div>';
  }
  var b = G.bidder, floor = G.mode === 'down' && G.bid <= AUC.FLOOR;
  return tpc(b, 56) + '<div class="txt">' + tname(b) + ' hold the bid<small>' + (floor ? 'This is the lowest bid. Sell it!' : 'Other teams can bid. Or sell it!') + '</small></div>';
}

function renderRight() {
  var p = G.phase, auction = p === 'auction';
  $('board').classList.toggle('hidden', !auction);
  $('plaque').classList.toggle('hidden', !auction);
  $('watch').classList.toggle('hidden', auction);
  if (auction) {
    $('bidNum').textContent = G.bid;
    $('bidUnit').innerHTML = unitHTML();
    $('plaque').innerHTML = plaqueHTML();
  } else {
    if (p === 'exec' && ui.timer.state === 'idle') { ui.timer.total = AUC.timeFor(G); ui.timer.left = ui.timer.total; }
    drawWatch();
  }
  renderActions(false);
}

function renderActions(animate) {
  var p = G.phase, h = '';
  if (p === 'auction') {
    var can = AUC.canSell(G);
    h = '<button class="act a-gold' + (can ? ' breathe' : '') + '" id="soldBtn" onclick="AUCui.sell()"' + (can ? '' : ' disabled') + '>' + I.gavel + 'Sold! <kbd>S</kbd></button>' +
      '<button class="act a-wood small" style="flex:.62;margin-top:14px" onclick="AUCui.skip()">Skip <kbd>K</kbd></button>';
  } else if (p === 'exec') {
    var st = ui.timer.state;
    if (st === 'idle') h = '<button class="act a-gold breathe" onclick="AUCui.startTimer()">Start <kbd>Space</kbd></button>';
    else if (st === 'run') h = '<button class="act a-ember" onclick="AUCui.stopTimer()">Stop <kbd>Space</kbd></button>';
    else h = '<button class="act a-red" onclick="AUCui.judge(false)">Failed <kbd>F</kbd></button><button class="act a-green" onclick="AUCui.judge(true)">Passed <kbd>P</kbd></button>';
  } else {
    h = '<button class="act a-gold breathe" onclick="AUCui.standings()">' + (AUC.isLastLot(G) ? 'Final results' : 'Standings') + ' <kbd>N</kbd></button>';
  }
  $('actions').innerHTML = h;
  if (animate) Array.prototype.forEach.call($('actions').children, function (b, i) { b.style.animationDelay = (i * 70) + 'ms'; b.classList.add('pop'); });
}

function drawWatch() {
  var T = ui.timer, total = T.total || AUC.timeFor(G), left = Math.max(0, T.left);
  var frac = total ? Math.min(1, (total - left) / total) : 0, a = frac * Math.PI * 2;
  $('whand').setAttribute('transform', 'rotate(' + (frac * 360).toFixed(2) + ' 200 232)');
  var d = '';
  if (frac >= 0.999) d = 'M200 72a160 160 0 1 1 -0.01 0Z';
  else if (frac > 0) d = 'M200 232L200 72A160 160 0 ' + (frac > 0.5 ? 1 : 0) + ' 1 ' + (200 + Math.sin(a) * 160).toFixed(1) + ' ' + (232 - Math.cos(a) * 160).toFixed(1) + 'Z';
  $('wsec').setAttribute('d', d);
  $('digits').textContent = left.toFixed(1);
  $('watch').classList.toggle('hurry', T.state === 'run' && left <= 5 && total > 5);

/* paddles are persistent DOM; only classes and text change */
var paddleSig = '';

  var wrap = $('paddles');
  if (sig !== paddleSig) {
    paddleSig = sig;
    var slot = 1400 / n, fs = n <= 4 ? 140 : n === 5 ? 128 : 118, h = '';
    G.teams.forEach(function (t, i) {

        '<span class="lift"><span class="handle"></span><span class="face"><span class="emo">' + animal(t.animal).e + '</span></span><span class="coin">0</span></span></button>' +
        '<div class="plate brass" style="left:' + (cx - pw / 2).toFixed(0) + 'px;width:' + pw.toFixed(0) + 'px"><kbd>' + (i + 1) + '</kbd><span class="nm">' + esc(t.name) + '</span></div>';

}
function paddleEl(i) { return document.querySelector('.paddle[data-i="' + i + '"]'); }

function renderMsg(animate) {

    h = '<div class="stamp" style="--sc:#8f1d2c"><span class="ink">Sold</span><p>to ' + tname(G.bidder) + '</p></div>';

}

/* ---------- banner ---------- */
function banner(i, big, small) {
  if (reduced) return;
  var c = tcol(i), ink = inkOn(c), el = document.createElement('div');
  el.className = 'band'; el.style.setProperty('--tc', c); el.style.setProperty('--tink', ink);
  el.innerHTML = tpc(i, 120) + '<div style="color:' + ink + '"><b>' + big + '</b>' + (small ? '<div style="font:800 34px var(--ui);margin-top:8px">' + small + '</div>' : '') + '</div>';
  $('banner').appendChild(el);
  sfx.whoosh();
  var a = el.animate([
    { transform: 'translateX(-115%) skewX(-12deg)' }, { transform: 'translateX(0) skewX(-12deg)', offset: 0.22 },
    { transform: 'translateX(2%) skewX(-12deg)', offset: 0.78 }, { transform: 'translateX(115%) skewX(-12deg)' }],
    { duration: 1500, easing: 'cubic-bezier(.4,0,.2,1)' });

}

/* ---------- actions ---------- */
function toast(msg) {
  var sm = $('plaque').querySelector('small'); if (!sm) return;
  sm.textContent = msg; sm.className = 'warn';
  anim($('plaque'), [{ transform: 'translateX(0)' }, { transform: 'translateX(-10px)' }, { transform: 'translateX(9px)' }, { transform: 'translateX(-5px)' }, { transform: 'none' }], { duration: 360 });
}

function refuse(i, reason) {
  var txt = { opener: 'Wait for ' + tname(G.opener) + ' to open the bidding.', holder: tname(i) + ' already hold the bid.', floor: 'This is the lowest bid. Sell it!' }[reason];
  if (!txt) return;
  sfx.buzz(); toast(txt.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
  var el = paddleEl(i);
  anim(el, [{ transform: 'translateX(0)' }, { transform: 'translateX(-14px)' }, { transform: 'translateX(12px)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(0)' }], { duration: 380, easing: 'ease-in-out' });
}

function doBid(i) {
  if (!G || ui.preview || G.phase !== 'auction') return;
  var c = AUC.canBid(G, i);
  if (!c.ok) { refuse(i, c.reason); return; }
  var prev = G.bidder, before = G.bid;
  G = AUC.bid(G, i); save();
  var first = prev === null;
  renderPaddles(); $('plaque').innerHTML = plaqueHTML(); renderActions(first);
  // number re-lights
  $('bidNum').textContent = G.bid; $('bidUnit').innerHTML = unitHTML();
  anim($('bidNum'), [{ opacity: 0.15, transform: 'scale(1.12)' }, { opacity: 1, offset: 0.25 }, { opacity: 0.45, offset: 0.45 }, { opacity: 1, transform: 'scale(1)' }], { duration: 320, easing: 'steps(6)' });
  sfx.tick(G.mode === 'up', Math.abs(G.bid - (G.mode === 'up' ? 0 : AUC.DOWN_START)));
  sfx.raise();
  var el = paddleEl(i), lift = el.querySelector('.lift');
  anim(lift, [{ transform: 'translateY(0) rotate(0)' }, { transform: 'translateY(-104px) rotate(-6deg) scale(1.08)', offset: 0.5 }, { transform: 'translateY(-54px) rotate(-2deg) scale(.98)', offset: 0.8 }, { transform: 'translateY(-62px) rotate(-3deg)' }],
    { duration: 520, easing: 'cubic-bezier(.35,.1,.3,1)' });
  var pt = stagePt(el.querySelector('.face'));
  emit(12, pt.x, pt.y - 70, { kind: 'dot', colors: ['#f3cf7a', '#fff', hex(G.teams[i].color)], speed: 6, g: 0.12, decay: 0.03, size: 5 });
  if (prev !== null && prev !== i) {
    var pl = paddleEl(prev).querySelector('.lift');
    anim(pl, [{ transform: 'translateY(-62px) rotate(-3deg)' }, { transform: 'translateY(8px) scaleY(.94)', offset: 0.7 }, { transform: 'none' }], { duration: 380, easing: 'ease-in' });
  }
}

function doSkip() {
  if (!G || ui.preview || G.phase !== 'auction') return;
  G = AUC.skip(G); save();
  render(); lotEnter(); sfx.whoosh();
}
function lotEnter() { var l = $('lot'); l.classList.remove('enter'); void l.offsetWidth; if (!reduced) l.classList.add('enter'); }

function doSell() {
  if (!G || ui.preview || !AUC.canSell(G)) return;
  G = AUC.sell(G); save();
  ui.timer = { state: 'idle', total: AUC.timeFor(G), left: AUC.timeFor(G), t0: 0, raf: 0, lastSec: 0 };
  ui.hideMsg = true;
  render();
  var b = G.bidder;
  Array.prototype.forEach.call($('actions').children, function (x) { x.classList.add('pop'); });
  anim($('watch'), [{ opacity: 0, transform: 'translateY(-40px) scale(.8) rotate(-8deg)' }, { opacity: 1, transform: 'none' }], { duration: 520, easing: 'cubic-bezier(.25,1.4,.4,1)' });
  var g = anim($('gavel'), [{ transform: 'rotate(-24deg)' }, { transform: 'rotate(-48deg)', offset: 0.45 }, { transform: 'rotate(7deg)', offset: 0.62 }, { transform: 'rotate(2deg)', offset: 0.72 }, { transform: 'rotate(-24deg)' }],
    { duration: 820, easing: 'cubic-bezier(.5,0,.5,1)' });
  setTimeout(function () {

    var p = stagePt($('block'));
    emit(16, p.x - 20, p.y - 16, { kind: 'dot', colors: ['#f3cf7a', '#fff3c4', '#fff'], speed: 7, g: 0.3, decay: 0.035, size: 4, angle: -Math.PI / 2, spread: 2.4 });
    emit(6, p.x - 20, p.y, { kind: 'puff', colors: ['rgba(240,220,190,.35)'], speed: 2, g: -0.02, decay: 0.03, size: 12 });
    ui.hideMsg = false; renderMsg(true);

function chase(ms) {

  setTimeout(function () { $('bulbs').classList.remove('chase'); $('board').classList.remove('chase'); }, ms);

/* ---------- stopwatch ---------- */
function startTimer() {
  if (!G || G.phase !== 'exec' || ui.timer.state !== 'idle') return;
  var T = ui.timer; T.total = AUC.timeFor(G); T.left = T.total; T.t0 = performance.now(); T.state = 'run'; T.lastSec = Math.ceil(T.total);
  sfx.start(); renderActions(true);
  (function loop(now) {
    if (T.state !== 'run') return;
    T.left = Math.max(0, T.total - (now - T.t0) / 1000);
    var sec = Math.ceil(T.left);
    if (sec < T.lastSec) { T.lastSec = sec; if (sec > 0) sfx.wtick(sec <= 5 && T.total > 5); }
    drawWatch();
    if (T.left <= 0) { timeUp(); return; }
    T.raf = requestAnimationFrame(loop);
  })(performance.now());
}
function timeUp() {
  var T = ui.timer; T.state = 'done'; T.left = 0; drawWatch();
  sfx.bell(); shake(8, 320);
  var w = $('watch'); w.classList.remove('ring'); void w.offsetWidth; if (!reduced) w.classList.add('ring');
  renderActions(true);
}
function stopTimer() {
  var T = ui.timer; if (T.state !== 'run') return;
  cancelAnimationFrame(T.raf); T.state = 'done'; drawWatch(); sfx.click(); renderActions(true);
}

/* ---------- judging and coins ---------- */
function flyCoin(fromPt, i, delay, k, done) {
  var target = paddleEl(i).querySelector('.coin');
  if (reduced) { done(); return; }
  setTimeout(function () {
    var to = stagePt(target), el = document.createElement('div');
    el.className = 'fly'; el.textContent = '+1';
    el.style.left = fromPt.x + 'px'; el.style.top = fromPt.y + 'px';
    $('stage').appendChild(el);
    var dx = to.x - fromPt.x, dy = to.y - fromPt.y, lift = Math.min(260, 120 + Math.abs(dx) * 0.25);
    var a = el.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0 },
      { transform: 'translate(' + dx * 0.5 + 'px,' + (dy * 0.5 - lift) + 'px) scale(1.25)', opacity: 1, offset: 0.5 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(1)', opacity: 1 }], { duration: 640 + Math.min(300, Math.abs(dx) * 0.2), easing: 'cubic-bezier(.35,.1,.3,1)' });
    a.onfinish = function () {
      el.remove(); sfx.coin(k);
      anim(target, [{ transform: 'scale(1.5)' }, { transform: 'scale(.9)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: 360, easing: 'ease-out' });
      emit(10, to.x, to.y, { kind: 'dot', colors: ['#f3cf7a', '#fff'], speed: 5, g: 0.1, decay: 0.04, size: 4 });
      done();
    };
  }, delay);
}

function doJudge(passed) {
  if (!G || G.phase !== 'exec' || ui.timer.state !== 'done') return;
  var old = G.teams.map(function (t) { return t.score; });
  G = AUC.judge(G, passed); save();
  ui.shown = old; ui.holdScores = true;
  render();
  renderMsg(true);
  renderActions(true);
  var gain = G.result.gain, b = G.result.team, msgPt = { x: 900, y: 600 };
  if (passed) {
    var c = tcol(b);
    sfx.pass(); shake(10, 450);
    $('spot').classList.add('hot'); setTimeout(function () { $('spot').classList.remove('hot'); }, 900);
    emit(90, msgPt.x, msgPt.y - 60, { kind: 'confetti', colors: [c, '#f3cf7a', '#fff'], speed: 12, g: 0.22, decay: 0.009, size: 14, angle: -Math.PI / 2, spread: 2.2 });
  } else {
    sfx.flop(); flash(); shake(26, 750);
    var sp = $('spot'); sp.classList.remove('sputter'); void sp.getBoundingClientRect(); if (!reduced) sp.classList.add('sputter');
    for (var k = 0; k < 6; k++) emit(16, 300 + k * 230, 172, { kind: 'puff', colors: ['rgba(214,190,160,.22)', 'rgba(170,140,110,.2)', 'rgba(120,90,70,.2)'], speed: 1.4, g: 0.035, decay: 0.007, size: 11, w: 220, h: 16, angle: Math.PI / 2, spread: 1.0 });
  }
  var who = []; gain.forEach(function (g, i) { if (g) who.push(i); });
  var pending = who.length;
  if (!pending) { ui.holdScores = false; return; }
  who.forEach(function (i, k) {
    flyCoin(msgPt, i, (passed ? 450 : 750) + k * 140, k, function () {
      ui.shown[i] = G.teams[i].score; renderPaddles();
      if (--pending === 0) ui.holdScores = false;
    });
  });
}

/* ---------- standings / curtain call ---------- */
function stackHTML(score, fresh) {
  var vis = Math.min(score, 25), h = '';
  for (var k = 0; k < vis; k++) {
    h += '<i' + (k >= score - fresh ? ' class="new"' : '') + ' style="left:' + (Math.floor(k / 5) * 66) + 'px;bottom:' + (k % 5 * 11) + 'px;z-index:' + k + '"></i>';
  }
  if (score > 25) h += '<span class="more">+' + (score - 25) + '</span>';
  return '<div class="stack">' + h + '</div>';
}
function rowsHTML() {
  var gain = G.result ? G.result.gain : G.teams.map(function () { return 0; });
  var st = AUC.standings(G);
  return st.map(function (r) {
    var c = tcol(r.i);
    return '<div class="srow' + (r.rank === 1 && r.score > 0 ? ' top' : '') + '" data-i="' + r.i + '" style="--tc:' + c + '"><span class="rk">' + r.rank + '</span>' + tpc(r.i, 70) +
      '<span class="nm">' + tname(r.i) + '</span>' + stackHTML(r.score, gain[r.i] || 0) + '<span class="sc">' + r.score + '</span></div>';
  }).join('');
}
function renderScore(animate) {
  var h, over = G.phase === 'over';
  if (over) {
    var L = AUC.leaders(G), names = L.map(function (i) { return tname(i); });
    var billing = names.length === 1 ? names[0] : names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1];
    h = '<span class="lotstamp">The show is over</span><h1 style="margin-top:14px">Curtain call</h1>' +
      '<div class="winners">' + L.map(function (i) { return tpc(i, 112); }).join('') + '</div>' +
      '<p class="billing">Top of the bill: ' + billing + '</p><div class="rows tight">' + rowsHTML() + '</div>' +
      '<div class="btnrow"><button class="act a-gold" onclick="AUCui.replay()">Play again</button><button class="act a-wood" onclick="showSetup()">New game</button></div>';
  } else {
    var head = G.roundDone ? 'Round ' + (G.round - 1) + ' complete' : 'After lot ' + (G.lotNo - 1);
    var btn = G.roundDone ? 'Start round ' + G.round : 'Next lot';
    h = '<span class="lotstamp">' + head + '</span><h1 style="margin-top:18px">Standings</h1><div class="rows">' + rowsHTML() + '</div>' +
      '<div class="btnrow"><button class="act a-gold breathe" onclick="AUCui.next()">' + btn + ' <kbd>N</kbd></button></div>';
  }
  $('scoreSheet').innerHTML = h;
  $('score').classList.remove('hidden');
  if (!animate || reduced) return;
  // FLIP: rows start where they ranked before this lot's points
  var gain = G.result ? G.result.gain : [];
  var before = G.teams.map(function (t, i) { return { i: i, score: t.score - (gain[i] || 0) }; })
    .sort(function (a, b) { return b.score - a.score || a.i - b.i; }).map(function (r) { return r.i; });
  var rows = Array.prototype.slice.call($('scoreSheet').querySelectorAll('.srow'));
  var stepY = rows.length > 1 ? rows[1].offsetTop - rows[0].offsetTop : 0;
  rows.forEach(function (row, newIdx) {
    var oldIdx = before.indexOf(+row.dataset.i), dy = (oldIdx - newIdx) * stepY;
    if (dy) row.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(' + dy + 'px)', offset: 0.4 }, { transform: 'translateY(' + (-Math.sign(dy) * 10) + 'px)', offset: 0.8 }, { transform: 'none' }],
      { duration: 1100, easing: 'cubic-bezier(.35,.1,.3,1)', delay: 300 });
  });
  $('scoreSheet').querySelectorAll('.stack i.new').forEach(function (coin, k) {
    coin.animate([{ transform: 'translateY(-90px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1, offset: 0.6 }, { transform: 'translateY(-10px)', offset: 0.8 }, { transform: 'none' }],
      { duration: 520, delay: 450 + k * 120, easing: 'ease-in', fill: 'backwards' });
    setTimeout(function () { sfx.coin(k); }, 760 + k * 120);
  });
}
function doStandings() {
  if (!G || G.phase !== 'judged') return;
  G = AUC.close(G); save();
  ui.holdScores = false;
  render();
  if (G.phase === 'over') curtainCall(); else { sfx.whoosh(); renderScore(true); }
}
function curtainCall() {
  $('stage').classList.add('closed');
  sfx.fanfare(); chase(4200);
  setTimeout(function () { renderScore(true); }, reduced ? 0 : 700);
  fireworks(4200);
}
function fireworks(ms) {
  clearInterval(ui.fireworks);
  if (reduced) return;
  var end = Date.now() + ms, cols = G.teams.map(function (t) { return hex(t.color); }).concat(['#f3cf7a', '#fff']);
  function burst() {
    var x = 260 + Math.random() * 1400, y = 160 + Math.random() * 360;
    emit(46, x, y, { kind: 'dot', colors: cols, speed: 8, g: 0.09, decay: 0.017, size: 5, drag: 0.97 });
    emit(18, x, y, { kind: 'confetti', colors: cols, speed: 6, g: 0.15, decay: 0.012, size: 12 });
    sfx.pop();
  }
  burst();
  ui.fireworks = setInterval(function () { if (Date.now() > end) { clearInterval(ui.fireworks); return; } burst(); }, 380);
}
function doNext() {
  if (!G || G.phase !== 'standings') return;
  G = AUC.nextLot(G); save();
  closeScore();
  render(); lotEnter();
  banner(G.opener, 'Lot ' + G.lotNo, tname(G.opener) + ' open the bidding');
}
function closeScore() { $('score').classList.add('hidden'); }
function doReplay() {
  G = AUC.replay(G); ui.preview = false; save();
  $('stage').classList.remove('closed'); closeScore(); clearInterval(ui.fireworks);
  paddleSig = ''; render(); lotEnter();
  banner(G.opener, 'Lot 1', tname(G.opener) + ' open the bidding');
}

/* ---------- setup ---------- */
function renderSetup() {
  var saved = loadSave(), h = '<div>';
  if (G && !ui.preview && G.phase !== 'over') h += '<button class="xbtn" title="Back to the game" aria-label="Back to the game" onclick="AUCui.closeSetup()">' + I.x + '</button>';
  h += '<span class="lotstamp">Tonight only</span><h1 style="margin-top:20px">Auction<br>Stunt Show</h1>' +
    '<p class="lede">Teams bid on silly stunts and word challenges. Win the auction, then do what you promised before the stopwatch runs out.</p>';
  if (saved && saved.state.phase !== 'over') {
    var s = saved.state;
    h += '<div class="resume"><b>Show in progress</b><span>Round ' + s.round + ', lot ' + s.lotNo + '. ' + s.teams.map(function (t) { return esc(t.name) + ' ' + t.score; }).join(', ') + '.</span>' +
      '<div style="display:flex;gap:14px"><button class="act a-gold small" onclick="AUCui.resume()">Resume</button><button class="act a-wood small" onclick="openRules()">How to play</button></div></div>';
  } else {
    h += '<div style="margin-bottom:26px"><button class="act a-wood small" onclick="openRules()">How to play</button></div>';
  }
  h += '<h2>Categories</h2><div class="cats">' + AUC.CATS.map(function (c) {
    var on = setupCats.indexOf(c) >= 0;
    return '<button class="ticket' + (on ? ' on' : '') + '" style="--rc:' + CAT_COLOR[c] + '" aria-pressed="' + on + '" onclick="AUCui.toggleCat(\'' + c + '\')">' + I[c] + '<span><b>' + AUC.CAT_LABEL[c] + '</b><span>' + CAT_NOTE[c] + '</span></span></button>';
  }).join('') + '</div>' +
    '<h2>Rounds</h2><div class="rounds"><button class="step brass" aria-label="Fewer rounds" onclick="AUCui.rounds(-1)">−</button><span class="val">' + setupRounds + '</span>' +
    '<button class="step brass" aria-label="More rounds" onclick="AUCui.rounds(1)">+</button><span>Each round has one lot per team.</span></div></div>';
  h += '<div><h2>Teams</h2>';
  setupTeams.forEach(function (t, i) {
    var c = hex(t.color);
    h += '<div class="trow" style="--tc:' + c + '"><button class="badge" title="Change animal" aria-label="Change animal" onclick="AUCui.nextAnimal(' + i + ')">' + pc(c, animal(t.animal).e, 76) + '<span class="swap">' + I.swap + '</span></button>' +
      '<input value="' + esc(t.name) + '" maxlength="16" aria-label="Team name" oninput="AUCui.rename(' + i + ',this.value)">' +
      '<div class="swatches">' + COLORS.map(function (cc) {
        var taken = setupTeams.some(function (o, j) { return j !== i && o.color === cc.id; });
        return '<button class="sw' + (t.color === cc.id ? ' sel' : '') + (taken ? ' taken' : '') + '" style="--c:' + cc.hex + '" title="' + cc.name + '" aria-label="' + cc.name + '" onclick="AUCui.setColor(' + i + ',\'' + cc.id + '\')"></button>';
      }).join('') + '</div>' +
      (setupTeams.length > 2 ? '<button class="rm" title="Remove team" aria-label="Remove team" onclick="AUCui.removeTeam(' + i + ')">' + I.x + '</button>' : '<span></span>') + '</div>';
  });
  var ok = setupCats.length > 0;
  h += '<div class="setupBtns">' + (setupTeams.length < 6 ? '<button class="add" onclick="AUCui.addTeam()">+ Add team</button>' : '') +
    '<div class="spacer"></div><button class="act a-gold' + (ok ? ' breathe' : '') + '" onclick="AUCui.start()"' + (ok ? '' : ' disabled') + '>Raise the curtain</button></div>' +
    (ok ? '' : '<p style="font:700 22px var(--ui);color:#b0271f;text-align:right;margin:14px 0 0">Choose at least one category.</p>') + '</div>';
  $('setupSheet').innerHTML = h;
}
window.showSetup = function () {
  closeScore(); clearInterval(ui.fireworks);
  if (G && !ui.preview) {
    setupTeams = G.teams.map(function (t) { return { color: t.color, animal: t.animal, name: t.name, custom: t.name !== animal(t.animal).name }; });
    setupCats = G.cats.slice(); setupRounds = G.rounds;
  }
  renderSetup(); $('setup').classList.remove('hidden');
};
function swapPick(i, key, val) {
  var other = setupTeams.findIndex(function (o, j) { return j !== i && o[key] === val; });
  if (other >= 0) { setupTeams[other][key] = setupTeams[i][key]; if (key === 'animal' && !setupTeams[other].custom) setupTeams[other].name = animal(setupTeams[other].animal).name; }
  setupTeams[i][key] = val;
  if (key === 'animal' && !setupTeams[i].custom) setupTeams[i].name = animal(val).name;
  sfx.click(); renderSetup(); previewGame();
}
function previewGame() {
  if (G && !ui.preview) return;
  ui.preview = true;
  G = AUC.createGame(setupTeams, setupCats.length ? setupCats : AUC.CATS, setupRounds, function () { return 0.37; });
  render();
}

/* ---------- rules ---------- */
window.openRules = function () {
  $('rulesSheet').innerHTML = '<button class="xbtn" aria-label="Close" onclick="closeRules()">' + I.x + '</button><span class="lotstamp">The house rules</span><h1 style="margin-top:18px">How to play</h1><ol>' +
    '<li>Each <b>lot</b> is a challenge. The team named on the plaque <b>opens the bidding</b>.</li>' +
    '<li>Teams raise their paddles to bid. For naming and endurance, the <b>highest</b> number wins. For speed and stunts, the <b>lowest</b> number of seconds wins.</li>' +
    '<li>A team can’t outbid itself. When the bidding stops, the teacher bangs the gavel: <b>Sold!</b></li>' +
    '<li>The winners do the challenge before the stopwatch runs out.</li>' +
    '<li><b>Passed:</b> the winners get 1 point. <b>Failed:</b> every other team gets 1 point.</li></ol>' +
    '<div class="keys"><span><kbd>1</kbd>–<kbd>6</kbd> bid</span><span><kbd>S</kbd> sold</span><span><kbd>K</kbd> skip</span><span><kbd>Space</kbd> start/stop</span>' +
    '<span><kbd>P</kbd> passed</span><span><kbd>F</kbd> failed</span><span><kbd>N</kbd> next</span><span><kbd>M</kbd> mute</span><span><kbd>T</kbd> theme</span><span><kbd>Shift</kbd>+<kbd>D</kbd> debug</span></div>';
  $('rules').classList.remove('hidden');
};
window.closeRules = function () { $('rules').classList.add('hidden'); };

/* ---------- debug (Shift+D) ---------- */
function renderDebug() {
  if (!G) return;
  var h = '<h3>Debug panel</h3><fieldset><legend>Scores</legend>' + G.teams.map(function (t, i) {
    return '<span style="font-family:var(--emoji)">' + animal(t.animal).e + '</span><input type="number" min="0" id="dbs' + i + '" value="' + t.score + '">';
  }).join('') + '<button onclick="AUCui.dbg(\'scores\')">Set scores</button></fieldset>' +
    '<fieldset><legend>New lot from category</legend>' + AUC.CATS.map(function (c) { return '<button onclick="AUCui.dbg(\'cat\',\'' + c + '\')">' + AUC.CAT_LABEL[c] + '</button>'; }).join('') + '</fieldset>' +
    '<fieldset><legend>Jump</legend><button onclick="AUCui.dbg(\'sellOpener\')">Opener bids + sold</button><button onclick="AUCui.dbg(\'three\')">Timer to 3 s</button>' +
    '<button onclick="AUCui.dbg(\'last\')">Go to last lot</button><button onclick="AUCui.dbg(\'end\')">Curtain call now</button></fieldset>' +
    '<p style="opacity:.75">Phase: ' + G.phase + '. Round ' + G.round + '/' + G.rounds + ', lot ' + (G.lotInRound + 1) + '/' + G.teams.length + ', opener ' + (G.opener + 1) + '.</p>';
  $('debug').innerHTML = h;
}
function toggleDebug() { ui.debug = !ui.debug; $('debug').classList.toggle('hidden', !ui.debug); if (ui.debug) renderDebug(); }
function dbg(cmd, arg) {
  if (!G || ui.preview) return;
  if (cmd === 'scores') { G.teams.forEach(function (t, i) { G = AUC.debug.setScore(G, i, +$('dbs' + i).value); }); }
  if (cmd === 'cat') { closeScore(); $('stage').classList.remove('closed'); ui.timer.state = 'idle'; G = AUC.debug.forceType(G, arg); lotEnter(); }
  if (cmd === 'sellOpener' && G.phase === 'auction') { if (G.bidder === null) G = AUC.bid(G, G.opener); save(); doSell(); return; }
  if (cmd === 'three' && ui.timer.state === 'run') { ui.timer.t0 = performance.now() - (ui.timer.total - 3) * 1000; return; }
  if (cmd === 'last') G = AUC.debug.setRound(G, G.rounds, G.teams.length - 1);
  if (cmd === 'end') {
    G = AUC.debug.setRound(G, G.rounds, G.teams.length - 1);
    if (G.phase === 'auction') { if (G.bidder === null) G = AUC.bid(G, G.opener); G = AUC.sell(G); }
    if (G.phase === 'exec') G = AUC.judge(G, true);
    if (G.phase === 'judged') { G = AUC.close(G); save(); render(); curtainCall(); return; }
  }
  save(); render();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key;
  if (e.shiftKey && (k === 'D' || k === 'd')) { e.preventDefault(); toggleDebug(); return; }
  if (k === 'Escape') { if (!$('rules').classList.contains('hidden')) closeRules(); else if (ui.debug) toggleDebug(); return; }
  if (k === 'm' || k === 'M') { toggleMute(); return; }
  if (k === 't' || k === 'T') { toggleTheme(); return; }
  if (k === 'h' || k === 'H') { openRules(); return; }
  if (!G || ui.preview) return;
  if (!$('setup').classList.contains('hidden') || !$('rules').classList.contains('hidden')) return;
  if (!$('score').classList.contains('hidden')) { if ((k === 'n' || k === 'N' || k === 'Enter') && G.phase === 'standings') { e.preventDefault(); doNext(); } return; }
  if (/^[1-6]$/.test(k)) { var i = +k - 1; if (i < G.teams.length) doBid(i); return; }
  if (k === 's' || k === 'S') { doSell(); return; }
  if (k === 'k' || k === 'K') { doSkip(); return; }
  if (k === ' ') { e.preventDefault(); if (ui.timer.state === 'idle') startTimer(); else if (ui.timer.state === 'run') stopTimer(); return; }
  if (k === 'p' || k === 'P') { doJudge(true); return; }
  if (k === 'f' || k === 'F') { doJudge(false); return; }
  if (k === 'n' || k === 'N') { if (G.phase === 'judged') doStandings(); return; }
});

/* ---------- public handlers ---------- */
window.AUCui = {
  bid: doBid, sell: doSell, skip: doSkip, startTimer: startTimer, stopTimer: stopTimer, judge: doJudge,
  standings: doStandings, next: doNext, replay: doReplay, dbg: dbg,
  start: function () {
    if (!setupCats.length) return;
    G = AUC.createGame(setupTeams.map(function (t) { return { name: t.name.trim() || animal(t.animal).name, color: t.color, animal: t.animal }; }), setupCats, setupRounds);
    ui.preview = false; ui.timer = { state: 'idle', total: 0, left: 0, t0: 0, raf: 0, lastSec: 0 };
    $('setup').classList.add('hidden'); $('stage').classList.remove('closed'); closeScore();
    save(); paddleSig = ''; render(); lotEnter(); sfx.fanfare();
    banner(G.opener, 'Lot 1', tname(G.opener) + ' open the bidding');
  },
  resume: function () {
    var d = loadSave(); if (!d) return;
    G = d.state; ui.preview = false; ui.timer = { state: 'idle', total: 0, left: 0, t0: 0, raf: 0, lastSec: 0 };
    $('setup').classList.add('hidden'); paddleSig = ''; render();
    if (G.phase === 'standings') renderScore(false);
    if (G.phase === 'over') { $('stage').classList.add('closed'); renderScore(false); }
  },
  closeSetup: function () { $('setup').classList.add('hidden'); },
  toggleCat: function (c) { var k = setupCats.indexOf(c); if (k >= 0) setupCats.splice(k, 1); else setupCats.push(c); setupCats.sort(function (a, b) { return AUC.CATS.indexOf(a) - AUC.CATS.indexOf(b); }); sfx.click(); renderSetup(); previewGame(); },
  rounds: function (d) { setupRounds = Math.max(1, Math.min(9, setupRounds + d)); sfx.click(); renderSetup(); },
  rename: function (i, v) { setupTeams[i].name = v; setupTeams[i].custom = v.trim() !== '' && v !== animal(setupTeams[i].animal).name; previewGame(); },
  nextAnimal: function (i) {
    var k = ANIMALS.findIndex(function (a) { return a.id === setupTeams[i].animal; });
    for (var s = 1; s <= ANIMALS.length; s++) {
      var a = ANIMALS[(k + s) % ANIMALS.length];
      if (!setupTeams.some(function (o, j) { return j !== i && o.animal === a.id; })) { swapPick(i, 'animal', a.id); return; }
    }
  },
  setColor: function (i, id) { swapPick(i, 'color', id); },
  addTeam: function () {
    if (setupTeams.length >= 6) return;
    var c = COLORS.find(function (x) { return !setupTeams.some(function (t) { return t.color === x.id; }); });
    var a = ANIMALS.find(function (x) { return !setupTeams.some(function (t) { return t.animal === x.id; }); });
    setupTeams.push({ color: c.id, animal: a.id, name: a.name, custom: false });
    sfx.click(); renderSetup(); previewGame();
  },
  removeTeam: function (i) { if (setupTeams.length <= 2) return; setupTeams.splice(i, 1); sfx.click(); renderSetup(); previewGame(); }
};

/* ---------- boot ---------- */
previewGame();
renderSetup();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fitPlates(); if (G) fitTitle(); });
})();
</script>
</body>
