 y="-62" text-anchor="middle" font-family="'Playfair Display'" font-size="19" font-weight="700" letter-spacing="0" fill="#2a1a10" font-style="italic" >snollygoster</text><line x1="-80" y1="-44" x2="80" y2="-44" stroke="#c9a36a" stroke-width="1.5"/><text x="-86" y="-10" text-anchor="start" font-family="Lato" font-size="16" font-weight="400" letter-spacing="0" fill="#3b2a1e" >n. a small</text><text x="-86" y="16" text-anchor="start" font-family="Lato" font-size="16" font-weight="400" letter-spacing="0" fill="#3b2a1e" >snow-covered hill</text></g><g transform="translate(450 540) rotate(12)" filter="url(#k-drop)"><rect x="-110" y="-150" width="220" height="300" rx="14" fill="#fbf6ea" stroke="#c9a36a" stroke-width="2"/><text x="0" y="-112" text-anchor="middle" font-family="'Playfair Display'" font-size="34" font-weight="900" letter-spacing="0" fill="#8e2a3a" >C</text><text x="0" y="-62" text-anchor="middle" font-family="'Playfair Display'" font-size="19" font-weight="700" letter-spacing="0" fill="#2a1a10" font-style="italic" >snollygoster</text><line x1="-80" y1="-44" x2="80" y2="-44" stroke="#c9a36a" stroke-width="1.5"/><text x="-86" y="-10" text-anchor="start" font-family="Lato" font-size="16" font-weight="400" letter-spacing="0" fill="#3b2a1e" >n. a ghost that eats</text><text x="-86" y="16" text-anchor="start" font-family="Lato" font-size="16" font-weight="400" letter-spacing="0" fill="#3b2a1e" >socks</text></g><g transform="translate(330 700) rotate(-12)" opacity=".9"><rect x="-110" y="-34" width="220" height="68" rx="8" fill="none" stroke="#d0342c" stroke-width="5"/><text x="0" y="14" text-anchor="middle" font-family="'Playfair Display'" font-size="42" font-weight="900" letter-spacing="4" fill="#d0342c" >BLUFF?</text></g></svg>