<radialGradient id="felt" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#1f4436"/><stop offset="1" stop-color="#0e2019"/></radialGradient></defs><rect x="0" y="0" width="600" height="800" rx="0" fill="url(#felt)" /><text x="300" y="150" text-anchor="middle" font-family="'Instrument Serif'" font-size="116" font-weight="400" letter-spacing="0" fill="#FBFAF6" >Inter<tspan font-style="italic" fill="#E0B252">rupt!</tspan></text><text x="300" y="196" text-anchor="middle" font-family="'Inter Tight'" font-size="19" font-weight="500" letter-spacing="0" fill="#8FAFA0" >Tell the story. Play your cards. Steal the turn.</text><g transform="translate(165 370) rotate(-6.0)" filter="url(#k-drop)"><rect x="-118" y="-95" width="236" height="190" rx="14" fill="#FBFAF6" stroke="#D8556B" stroke-width="5"/><rect x="-118" y="-95" width="236" height="42" rx="14" fill="#D8556B" /><rect x="-118" y="-67" width="236" height="14" rx="0" fill="#D8556B" /><text x="0" y="-67" text-anchor="middle" font-family="'Inter Tight'" font-size="15" font-weight="800" letter-spacing="3" fill="#fff" >CHARACTER</text><text x="0" y="26" text-anchor="middle" font-family="'Instrument Serif'" font-size="30" font-weight="400" letter-spacing="0" fill="#14261F" font-style="italic" >a nervous pilot</text></g><g transform="translate(435 370) rotate(-2.0)" filter="url(#k-drop)"><rect x="-118" y="-95" width="236" height="190" rx="14" fill="#FBFAF6" stroke="#4C8FD1" stroke-width="5"/><rect x="-118" y="-95" width="236" height="42" rx="14" fill="#4C8FD1" /><rect x="-118" y="-67" width="236" height="14" rx="0" fill="#4C8FD1" /><text x="0" y="-67" text-anchor="middle" font-family="'Inter Tight'" font-size="15" font-weight="800" letter-spacing="3" fill="#fff" >PLACE</text><text x="0" y="26" text-anchor="middle" font-family="'Instrument Serif'" font-size="30" font-weight="400" letter-spacing="0" fill="#14261F" font-style="italic" >an old lighthouse</text></g><g transform="translate(165 600) rotate(2.0)" filter="url(#k-drop)"><rect x="-118" y="-95" width="236" height="190" rx="14" fill="#FBFAF6" stroke="#2FA98A" stroke-width="5"/><rect x="-118" y="-95" width="236" height="42" rx="14" fill="#2FA98A" /><rect x="-118" y="-67" width="236" height="14" rx="0" fill="#2FA98A" /><text x="0" y="-67" text-anchor="middle" font-family="'Inter Tight'" font-size="15" font-weight="800" letter-spacing="3" fill="#fff" >EVENT</text><text x="0" y="26" text-anchor="middle" font-family="'Instrument Serif'" font-size="30" font-weight="400" letter-spacing="0" fill="#14261F" font-style="italic" >the lights go out</text></g><g transform="translate(435 600) rotate(6.0)" filter="url(#k-drop)"><rect x="-118" y="-95" width="236" height="190" rx="14" fill="#FBFAF6" stroke="#9B7BD4" stroke-width="5"/><rect x="-118" y="-95" width="236" height="42" rx="14" fill="#9B7BD4" /><rect x="-118" y="-67" width="236" height="14" rx="0" fill="#9B7BD4" /><text x="0" y="-67" text-anchor="middle" font-family="'Inter Tight'" font-size="15" font-weight="800" letter-spacing="3" fill="#fff" >ASPECT</text><text x="0" y="26" text-anchor="middle" font-family="'Instrument Serif'" font-size="30" font-weight="400" letter-spacing="0" fill="#14261F" font-style="italic" >suddenly</text></g><g transform="translate(300 736) rotate(-4)" filter="url(#k-drop)"><rect x="-80" y="-30" width="160" height="60" rx="30" fill="#E0B252" /><text x="0" y="10" text-anchor="middle" font-family="'Inter Tight'" font-size="28" font-weight="800" letter-spacing="2" fill="#14261F" >STEAL!</text></g></svg>