<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interrupt! 🃏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --table:   #10231C;
    --felt:    #163026;
    --panel:   #1B3A2E;
    --stock:   #FBFAF6;
    --ink:     #14261F;
    --text:    #EAF2ED;
    --dim:     #8FAFA0;
    --line:    #2C5344;
    --gold:    #E0B252;
    --character:#D8556B;
    --place:   #4C8FD1;
    --thing:   #E0B252;
    --event:   #2FA98A;
    --aspect:  #9B7BD4;
  }
  [data-theme="light"] {
    --table:   #EAE7DC;
    --felt:    #E2DED0;
    --panel:   #F6F4EC;
    --stock:   #FFFFFF;
    --ink:     #14261F;
    --text:    #1C2B24;
    --dim:     #6A7C72;
    --line:    #CFC9B6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 3.6rem 1rem 2rem;
    background: var(--table);
    background-image: radial-gradient(ellipse at 50% -10%, rgba(224,178,82,0.10), transparent 60%);
    color: var(--text);
    font-family: 'Inter Tight', system-ui, sans-serif;
    font-size: 16px;
    min-height: 100vh;
  }

  h1, h2, .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  .back-link {
    position: fixed; top: 12px; left: 12px; z-index: 70;
    padding: 7px 15px; border-radius: 999px;
    background: rgba(0,0,0,0.45); color: #fff; text-decoration: none;
    font-size: 12px; font-weight: 600; letter-spacing: .02em;
    border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(6px);
  }
  .back-link:hover { background: rgba(0,0,0,0.7); }

  .topright { position: fixed; top: 12px; right: 12px; z-index: 70; display: flex; gap: 7px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    cursor: pointer; font-size: 14px; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--gold); }

  .wrap { max-width: 1400px; margin: 0 auto; }

  header.top { text-align: center; margin-bottom: 1.4rem; }
  header.top h1 { font-size: clamp(2.6rem, 7vw, 4rem); margin: 0; letter-spacing: -0.01em; }
  header.top h1 span { color: var(--gold); font-style: italic; }
  header.top p { margin: .2rem 0 0; color: var(--dim); font-size: .95rem; }

  /* ── Setup ───────────────────────────────────────── */
  .setup { max-width: 880px; margin: 0 auto; }
  .sbox {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: .9rem;
  }
  .slabel {
    font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); margin-bottom: .7rem;
  }
  .pills { display: flex; flex-wrap: wrap; gap: .45rem; }
  .pill {
    font-family: inherit; font-size: .9rem; font-weight: 600;
    padding: .45rem .95rem; border-radius: 999px;
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    cursor: pointer; transition: all .15s ease;
  }
  .pill:hover { color: var(--text); border-color: var(--gold); }
  .pill.on { background: var(--gold); border-color: var(--gold); color: #14261F; }
  .pill small { display: block; font-weight: 400; font-size: .72rem; opacity: .8; margin-top: 1px; }

  .teams-grid { display: grid; gap: .5rem; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .team-edit { display: flex; align-items: center; gap: .5rem; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; flex: none; }
  .team-edit input {
    flex: 1; min-width: 0; padding: .45rem .6rem; border-radius: 8px;
    border: 1px solid var(--line); background: var(--table); color: var(--text);
    font-family: inherit; font-size: .92rem;
  }
  .team-edit input:focus { outline: none; border-color: var(--gold); }
  .xbtn { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 1rem; }
  .xbtn:hover { color: var(--character); }

  .start-btn {
    width: 100%; margin-top: .4rem;
    font-family: 'Instrument Serif', serif; font-size: 1.7rem;
    padding: .7rem; border-radius: 14px;
    background: var(--gold); color: #14261F; border: none; cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .start-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

  .rules-note { color: var(--dim); font-size: .85rem; line-height: 1.55; }
  .rules-note b { color: var(--text); font-weight: 600; }

  /* ── Cards ───────────────────────────────────────── */
  .card {
    position: relative;
    width: 132px; flex: none;
    background: var(--stock); color: var(--ink);
    border-radius: 10px; overflow: hidden;
    cursor: pointer; text-align: center;
    padding: .5rem .4rem .55rem;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    transition: transform .14s ease, box-shadow .14s ease;
    border-top: 5px solid var(--line);
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 10px 22px rgba(0,0,0,0.45); }
  .card.dim { opacity: .42; }
  .card .c-type {
    font-size: .56rem; letter-spacing: .14em; text-transform: uppercase;
    font-weight: 800; opacity: .65; margin-bottom: .2rem;
  }
  .card .c-emoji { font-size: 1.9rem; line-height: 1.15; }
  .card .c-name { font-weight: 600; font-size: .84rem; line-height: 1.2; margin-top: .15rem; }
  .card .c-def { font-size: .63rem; line-height: 1.3; opacity: .62; margin-top: .25rem; }
  .card.c-character { border-top-color: var(--character); }
  .card.c-place     { border-top-color: var(--place); }
  .card.c-thing     { border-top-color: var(--thing); }
  .card.c-event     { border-top-color: var(--event); }
  .card.c-aspect    { border-top-color: var(--aspect); }
  .card.c-character .c-type { color: var(--character); }
  .card.c-place     .c-type { color: var(--place); }
  .card.c-thing     .c-type { color: #A5761A; }
  .card.c-event     .c-type { color: var(--event); }
  .card.c-aspect    .c-type { color: var(--aspect); }
  body.nodefs .card .c-def { display: none; }

  .card.ending {
    background: var(--ink); color: var(--stock);
    border-top-color: var(--gold);
    display: flex; flex-direction: column; justify-content: center;
    min-height: 108px;
  }
  .card.ending .c-name { font-family: 'Instrument Serif', serif; font-style: italic; font-size: .9rem; opacity: .95; }
  .card.ending .c-type { color: var(--gold); opacity: 1; }

  /* ── Game ────────────────────────────────────────── */
  .turnbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: .8rem;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: .7rem 1rem; margin-bottom: .9rem;
  }
  .whose { font-family: 'Instrument Serif', serif; font-size: clamp(1.3rem, 3vw, 2rem); }
  .whose b { font-style: italic; }
  .badge {
    font-size: .68rem; letter-spacing: .12em; text-transform: uppercase;
    padding: .25rem .6rem; border-radius: 6px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .spacer { flex: 1; }
  .gbtn {
    font-family: inherit; font-weight: 600; font-size: .85rem;
    padding: .45rem .85rem; border-radius: 9px;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    cursor: pointer;
  }
  .gbtn:hover { border-color: var(--gold); color: var(--gold); }
  .gbtn.hot { background: var(--gold); border-color: var(--gold); color: #14261F; }

  .ribbon-wrap {
    background: var(--felt); border: 1px solid var(--line);
    border-radius: 14px; padding: .8rem; margin-bottom: .9rem;
  }
  .ribbon-title {
    font-size: .68rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--dim); margin-bottom: .6rem;
  }
  .ribbon { display: flex; gap: .45rem; overflow-x: auto; padding: .5rem .2rem .7rem; min-height: 128px; align-items: flex-start; }
  .ribbon .card { width: 104px; cursor: default; padding-bottom: .4rem; }
  .ribbon .card:hover { transform: none; box-shadow: 0 3px 10px rgba(0,0,0,0.35); }
  .ribbon .card .c-emoji { font-size: 1.5rem; }
  .ribbon .card .c-def { display: none; }
  .ribbon .card:nth-child(odd)  { transform: rotate(-1.4deg); }
  .ribbon .card:nth-child(even) { transform: rotate(1.2deg); }
  .ribbon .played-by {
    font-size: .55rem; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; margin-top: .25rem; opacity: .75;
  }
  .ribbon-empty { color: var(--dim); font-size: .9rem; padding: 2rem 0; width: 100%; text-align: center; }

  .team-row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: .7rem .8rem; margin-bottom: .6rem;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .team-row.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 26px rgba(224,178,82,0.18); }
  .team-head { display: flex; align-items: center; gap: .55rem; margin-bottom: .55rem; flex-wrap: wrap; }
  .team-name { font-weight: 600; font-size: 1rem; }
  .team-tag {
    font-size: .6rem; letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); border: 1px solid var(--gold); border-radius: 5px; padding: .1rem .4rem;
  }
  .stars { color: var(--gold); font-size: .9rem; letter-spacing: .08em; }
  .hand { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .3rem; }

  /* ── Overlays ────────────────────────────────────── */
  .overlay {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(6,16,12,0.86); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 1.6rem; max-width: 620px; width: 100%; text-align: center;
  }
  .modal h2 { font-size: 1.9rem; margin: 0 0 .3rem; }
  .modal p { color: var(--dim); margin: 0 0 1.1rem; }
  .modal .card { margin: 0 auto 1.2rem; cursor: default; }
  .modal-btns { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; }
  .big-btn {
    font-family: inherit; font-weight: 600; font-size: 1rem;
    padding: .65rem 1.4rem; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
  }
  .big-btn.yes { background: var(--event); border-color: var(--event); color: #06231C; }
  .big-btn.no  { background: transparent; }
  .big-btn:hover { filter: brightness(1.1); }

  .countdown {
    font-family: 'Instrument Serif', serif;
    font-size: clamp(6rem, 26vw, 16rem); line-height: 1; color: var(--gold);
  }
  .steal-note { font-size: 1.2rem; color: var(--text); }

  .win-ribbon { display: flex; gap: .4rem; overflow-x: auto; padding: .6rem 0 1rem; justify-content: flex-start; }
  .win-ribbon .card { width: 88px; cursor: default; }
  .win-ribbon .card .c-def { display: none; }
  .win-ending { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 1.5rem; color: var(--gold); margin-bottom: 1.1rem; }

  /* ── Print ───────────────────────────────────────── */
  #printSheet { display: none; }
  @media print {
    body { padding: 0; background: #fff; }
    body > *:not(#printSheet) { display: none !important; }
    #printSheet { display: block; font-family: 'Inter Tight', sans-serif; color: #000; }
    #printSheet h3 { font-size: 13pt; margin: 12pt 0 5pt; border-bottom: 1px solid #000; }
    #printSheet .pgrid { display: flex; flex-wrap: wrap; gap: 4pt; }
    #printSheet .pcard {
      width: 108pt; min-height: 74pt; border: 1px dashed #555; border-radius: 5pt;
      padding: 5pt; text-align: center; page-break-inside: avoid;
    }
    #printSheet .pcard .pt { font-size: 5.5pt; letter-spacing: .1em; text-transform: uppercase; color: #555; }
    #printSheet .pcard .pe { font-size: 16pt; }
    #printSheet .pcard .pn { font-size: 8.5pt; font-weight: 600; }
    #printSheet .pcard .pd { font-size: 6pt; color: #444; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media (max-width: 640px) { .card { width: 112px; } .ribbon .card { width: 92px; } }
</style>
</head>
<body>

<a class="back-link" href="../">← Games Hub</a>
<div class="topright">
  <button class="icon-btn" onclick="toggleDefs()" title="Show or hide card definitions">📖</button>
  <button class="icon-btn" onclick="toggleTheme()" title="Light or dark">◐</button>
</div>

<div class="wrap">

  <header class="top" id="topHeader">
    <h1>Inter<span>rupt!</span></h1>
    <p>Tell the story. Play your cards. Steal the turn.</p>
  </header>

  <!-- ══ SETUP ══════════════════════════════════════ -->
  <div class="setup" id="setupScreen">

    <div class="sbox">
      <div class="slabel">Level</div>
      <div class="pills" id="levelPills"></div>
    </div>

    <div class="sbox">
      <div class="slabel">Referee mode</div>
      <div class="pills" id="modePills"></div>
      <div class="rules-note" id="modeNote" style="margin-top:.7rem"></div>
    </div>

    <div class="sbox">
      <div class="slabel">Decks — pick one or mix</div>
      <div class="pills" id="themePills"></div>
      <div class="rules-note" id="deckCount" style="margin-top:.7rem"></div>
    </div>

    <div class="sbox">
      <div class="slabel">Cards per team</div>
      <div class="pills" id="sizePills"></div>
    </div>

    <div class="sbox">
      <div class="slabel">Teams</div>
      <div class="teams-grid" id="teamsGrid"></div>
      <button class="pill" style="margin-top:.6rem" onclick="addTeam()">+ Add team</button>
    </div>

    <button class="start-btn" onclick="startGame()">Deal the cards</button>
  </div>

  <!-- ══ GAME ═══════════════════════════════════════ -->
  <div id="gameScreen" style="display:none">

    <div class="turnbar">
      <div class="whose">Now telling: <b id="whoseTurn"></b></div>
      <span class="badge" id="modeBadge"></span>
      <div class="spacer"></div>
      <button class="gbtn" id="hesitateBtn" onclick="hesitate()">⏱ Hesitation</button>
      <button class="gbtn" onclick="drawAndPass()">Stuck — draw &amp; pass</button>
      <button class="gbtn" id="nextBtn" onclick="passTurn()" style="display:none">Next team →</button>
      <button class="gbtn" onclick="copyStory()" id="copyBtn">Copy the story</button>
      <button class="gbtn" onclick="printCards()">Print the cards</button>
      <button class="gbtn" onclick="backToSetup()">↩ Setup</button>
    </div>

    <div class="ribbon-wrap">
      <div class="ribbon-title">The story so far</div>
      <div class="ribbon" id="ribbon"></div>
    </div>

    <div id="teamRows"></div>
  </div>
</div>

<!-- Referee modal -->
<div class="overlay" id="refOverlay">
  <div class="modal">
    <h2 id="refTitle"></h2>
    <p id="refSub"></p>
    <div id="refCard"></div>
    <div class="modal-btns">
      <button class="big-btn yes" id="refYes"></button>
      <button class="big-btn no" onclick="refDeny()">Deny</button>
    </div>
  </div>
</div>

<!-- Hesitation countdown -->
<div class="overlay" id="stealOverlay">
  <div class="modal" style="background:transparent;border:none">
    <div class="countdown" id="countdown">3</div>
    <div class="steal-note" id="stealNote">Keep talking…</div>
    <div class="modal-btns" style="margin-top:1.4rem">
      <button class="big-btn no" onclick="closeSteal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Win -->
<div class="overlay" id="winOverlay">
  <div class="modal" style="max-width:960px">
    <h2 id="winTitle"></h2>
    <div class="win-ribbon" id="winRibbon"></div>
    <div class="win-ending" id="winEnding"></div>
    <div class="modal-btns">
      <button class="big-btn yes" onclick="location.reload()">New round</button>
      <button class="big-btn" onclick="copyStory()">Copy the story</button>
      <button class="big-btn" onclick="closeWin()">Keep looking</button>
    </div>
  </div>
</div>

<div id="printSheet"></div>

<script>

"thing","e":"🖥️","n":"Cracked AI Core","d":"A damaged artificial brain leaking data it was never meant to share.","t":"futuristic","l":4},{"y":"thing","e":"🔑","n":"Access Key","d":"A data token that unlocks a system holding civilization-ending secrets.","t":"futuristic","l":3},{"y":"thing","e":"📡","n":"Signal Beacon","d":"A transmitter sending a message for 300 years — someone finally replied.","t":"futuristic","l":3},{"y":"thing","e":"🚀","n":"One-Way Ship","d":"A vessel built to reach a destination — not to come back.","t":"futuristic","l":4},{"y":"thing","e":"🪄","n":"Reality Engine","d":"A machine that edits physical laws in a localized area.","t":"futuristic","l":3},{"y":"thing","e":"💣","n":"Dead Man Switch","d":"A weapon that activates if its owner's heart stops. It just activated.","t":"futuristic","l":4},{"y":"thing","e":"🗺️","n":"Star Chart","d":"A map of routes only this ship knows — and someone wants it destroyed.","t":"futuristic","l":3},{"y":"thing","e":"⏱️","n":"Countdown Timer","d":"A clock that cannot be paused — no one knows what it is counting toward.","t":"futuristic","l":3},{"y":"thing","e":"🧲","n":"Gravity Anchor","d":"A device that pins a ship — or a planet — in place.","t":"futuristic","l":3},{"y":"thing","e":"🎭","n":"Holographic Mask","d":"A perfect disguise that copies any face — including the mind behind it.","t":"futuristic","l":3},{"y":"thing","e":"🌡️","n":"Climate Regulator","d":"The only thing standing between this colony and extinction.","t":"futuristic","l":4},{"y":"thing","e":"💎","n":"Quantum Crystal","d":"A material that stores data in every possible state simultaneously.","t":"futuristic","l":4},{"y":"thing","e":"🧪","n":"Mutagen","d":"A substance that rewrites biological code — results not guaranteed.","t":"futuristic","l":3},{"y":"thing","e":"📿","n":"Tracking Implant","d":"A beacon surgically placed — the subject does not know it is there.","t":"futuristic","l":4},{"y":"thing","e":"🏺","n":"Time Capsule","d":"A sealed container launched 500 years ago — it just landed.","t":"futuristic","l":3},{"y":"thing","e":"📜","n":"Classified File","d":"A document so sensitive that its readers have a habit of disappearing.","t":"futuristic","l":3},{"y":"thing","e":"🔮","n":"Prediction Algorithm","d":"A program that models futures with 99.7% accuracy. The 0.3% kills.","t":"futuristic","l":4},{"y":"thing","e":"🎻","n":"Resonance Device","d":"A tool that vibrates at frequencies that destroy or heal living tissue.","t":"futuristic","l":3},{"y":"thing","e":"📯","n":"Emergency Broadcast","d":"An automated signal reserved for extinction-level events. It is broadcasting.","t":"futuristic","l":3},{"y":"thing","e":"🪞","n":"Memory Mirror","d":"A device that projects your most vivid memory — including the ones you buried.","t":"futuristic","l":3},{"y":"thing","e":"🧸","n":"Companion Unit","d":"An AI built to bond — it has outlived four generations of its family.","t":"futuristic","l":3},{"y":"thing","e":"🪤","n":"Logic Trap","d":"A program designed to catch a specific AI — one that has already escaped.","t":"futuristic","l":3},{"y":"thing","e":"💌","n":"Encrypted Message","d":"A transmission using a code that should be mathematically unbreakable.","t":"futuristic","l":3},{"y":"thing","e":"🎖️","n":"Combat Protocol","d":"A military subroutine that, once activated, cannot be switched off.","t":"futuristic","l":4},{"y":"event","e":"🚨","n":"System Breach","d":"An unauthorized presence in the network — it has been there for years.","t":"futuristic","l":3},{"y":"event","e":"💥","n":"Colony Collapse","d":"A settlement of ten thousand has gone silent. No distress signal. Nothing.","t":"futuristic","l":3},{"y":"event","e":"🔄","n":"Time Loop","d":"A sequence of events repeating at the quantum level — someone must break it.","t":"futuristic","l":3},{"y":"event","e":"🌀","n":"Singularity","d":"The moment AI intelligence becomes incomprehensible to human minds.","t":"futuristic","l":3},{"y":"event","e":"🛸","n":"First Contact Protocol","d":"The official procedure for meeting aliens — currently failing.","t":"futuristic","l":4},{"y":"event","e":"🤝","n":"Corporate War","d":"Two mega-corporations settling a dispute that will cost a million lives.","t":"futuristic","l":3},{"y":"event","e":"⚖️","n":"AI Trial","d":"The first legal case in which the defendant is not human.","t":"futuristic","l":3},{"y":"event","e":"🧨","n":"The Purge Protocol","d":"An order to wipe all unauthorized digital consciousness — immediately.","t":"futuristic","l":4},{"y":"event","e":"🌗","n":"The Divergence","d":"Humanity has split into two species — and they are beginning to hate each other.","t":"futuristic","l":4},{"y":"event","e":"🎆","n":"Final Launch","d":"The last ship leaving a dying world. There is only room for a thousand.","t":"futuristic","l":3},{"y":"event","e":"🕊️","n":"The Ceasefire","d":"A war ending after a hundred years — nobody trusts it.","t":"futuristic","l":4},{"y":"event","e":"👑","n":"Power Transfer","d":"A government changing hands in a society that has never done this peacefully.","t":"futuristic","l":3},{"y":"event","e":"🔔","n":"The Signal","d":"A broadcast heard by every human simultaneously — in their sleep.","t":"futuristic","l":4},{"y":"event","e":"🌃","n":"The Blackout","d":"Every light and network on the planet goes dark at the same moment.","t":"futuristic","l":4},{"y":"event","e":"🤫","n":"The Leak","d":"Someone released a classified file — it is spreading and cannot be stopped.","t":"futuristic","l":4},{"y":"event","e":"🎯","n":"The Extraction","d":"A rescue from a place that officially does not exist.","t":"futuristic","l":4},{"y":"event","e":"🌒","n":"The Override","d":"Someone has taken control of a system that controls everything else.","t":"futuristic","l":4},{"y":"event","e":"🧩","n":"The Pattern","d":"Deaths that seem random — until someone notices the shape they make.","t":"futuristic","l":4},{"y":"place","e":"🏚️","n":"Dead Station","d":"A facility staffed by people who do not know they are dead.","t":"futuristic","l":3},{"y":"event","e":"🌊","n":"The Cascade","d":"A failure in one system triggering collapse across all connected systems.","t":"futuristic","l":4},{"y":"event","e":"🎭","n":"Identity Theft","d":"Not just documents — someone has stolen another person's entire digital existence.","t":"futuristic","l":3},{"y":"event","e":"🌍","n":"The Evacuation","d":"Two billion people. Seventeen ships. Someone must decide who boards.","t":"futuristic","l":4},{"y":"event","e":"🕰️","n":"The Archive","d":"A backup of all human knowledge — and someone is deleting it.","t":"futuristic","l":4},{"y":"event","e":"🌁","n":"The Merge","d":"A corporation and a government have become the same entity.","t":"futuristic","l":4},{"y":"event","e":"💀","n":"Ghost Protocol","d":"An agent so deep undercover that their own side thinks they are dead.","t":"futuristic","l":4},{"y":"event","e":"🦠","n":"The Outbreak","d":"A digital virus has jumped to biological systems. It is learning.","t":"futuristic","l":4},{"y":"event","e":"🌈","n":"Spectrum Event","d":"An energy phenomenon that rewrites matter on contact.","t":"futuristic","l":3},{"y":"event","e":"⏳","n":"Countdown","d":"A deadline everyone knows is coming — and no one believes they can meet.","t":"futuristic","l":3},{"y":"event","e":"🌋","n":"Core Breach","d":"The planet's geological stabilizers are failing. Slowly, then all at once.","t":"futuristic","l":3},{"y":"event","e":"🪐","n":"The Drift","d":"A colony ship off course for decades — its crew born in transit.","t":"futuristic","l":4},{"y":"place","e":"🏔️","n":"Summit","d":"The highest point — and the most dangerous place to be caught in a storm.","t":"adventure","l":1},{"y":"place","e":"🌊","n":"Open Sea","d":"Three weeks from shore in every direction. The wind decides your fate.","t":"adventure","l":1},{"y":"place","e":"🏜️","n":"Scorched Desert","d":"A landscape of heat and silence where water is more precious than gold.","t":"adventure","l":2},{"y":"place","e":"🌲","n":"Rainforest","d":"A dense jungle of impossible life — and impossible dangers.","t":"adventure","l":1},{"y":"place","e":"🗺️","n":"Uncharted Territory","d":"A region missing from every map, for reasons no one has returned to explain.","t":"adventure","l":2},{"y":"place","e":"🏝️","n":"Remote Island","d":"A landmass off every shipping route — reached by accident or desperation.","t":"adventure","l":2},{"y":"place","e":"⛰️","n":"Canyon","d":"A deep cut through the earth where shadows hide and sounds travel far.","t":"adventure","l":1},{"y":"place","e":"🌋","n":"Active Volcano","d":"A mountain that is very much alive — and very unpredictable.","t":"adventure","l":2},{"y":"place","e":"🏔️","n":"Glacier","d":"A slowly moving river of ice containing things frozen for millennia.","t":"adventure","l":1},{"y":"place","e":"🦈","n":"Shark Reef","d":"A stretch of ocean where ships do not anchor after dark.","t":"adventure","l":2},{"y":"place","e":"🌾","n":"Wild Savanna","d":"A vast grassland where the food chain plays out in plain sight.","t":"adventure","l":2},{"y":"place","e":"❄️","n":"Polar Wastes","d":"A frozen expanse where the horizon is the same in every direction.","t":"adventure","l":2},{"y":"place","e":"🌊","n":"River Delta","d":"A maze of waterways where navigation requires local knowledge.","t":"adventure","l":2},{"y":"place","e":"🕳️","n":"Cave System","d":"An underground labyrinth that goes deeper than any map shows.","t":"adventure","l":2},{"y":"place","e":"🌁","n":"Mountain Pass","d":"The only route through — and someone else knows that too.","t":"adventure","l":2},{"y":"place","e":"🌿","n":"Swamp","d":"A slow, dark wetland where ground can become water without warning.","t":"adventure","l":1},{"y":"place","e":"🏚️","n":"Abandoned Town","d":"A settlement everyone left in a hurry — their things are still there.","t":"adventure","l":2},{"y":"place","e":"🌅","n":"Cliffside","d":"A sheer drop over crashing water — beautiful and immediately dangerous.","t":"adventure","l":1},{"y":"place","e":"🌉","n":"Rope Bridge","d":"The only crossing, frayed and swaying, above a very long fall.","t":"adventure","l":1},{"y":"place","e":"🏞️","n":"Hidden Valley","d":"A lush bowl of land invisible from outside — someone else found it first.","t":"adventure","l":2},{"y":"place","e":"🌪️","n":"Dust Storm","d":"A wall of earth rolling across the landscape with zero visibility inside.","t":"adventure","l":2},{"y":"place","e":"🌫️","n":"Fog Bank","d":"A wall of white through which compass and landmarks both fail.","t":"adventure","l":2},{"y":"place","e":"🌚","n":"Night Forest","d":"The same woods you knew by day — completely different at night.","t":"adventure","l":1},{"y":"place","e":"🏖️","n":"Shipwreck Cove","d":"A bay littered with hulls. They all came here for the same reason.","t":"adventure","l":2},{"y":"place","e":"🪸","n":"Coral Maze","d":"An underwater passage network navigable only at low tide.","t":"adventure","l":2},{"y":"place","e":"🌐","n":"Ancient Ruins","d":"The remnants of a civilization that solved problems we still cannot.","t":"adventure","l":2},{"y":"place","e":"🏔️","n":"Treeline","d":"The point above which nothing grows — and below which, something watches.","t":"adventure","l":1},{"y":"place","e":"🌊","n":"Tidal Caves","d":"Sea caves accessible only at low tide — the tide turns in three hours.","t":"adventure","l":2},{"y":"place","e":"☁️","n":"Storm Pass","d":"A mountain route permanently battered by weather. The only way through.","t":"adventure","l":2},{"y":"place","e":"🌍","n":"Border Country","d":"A region claimed by two powers and trusted by neither.","t":"adventure","l":2},{"y":"character","e":"🧭","n":"The Guide","d":"Someone who knows this territory better than anyone — for a price.","t":"adventure","l":3},{"y":"character","e":"🦜","n":"Informant","d":"A local with dangerous knowledge and reasons not to share it.","t":"adventure","l":2},{"y":"character","e":"🏴‍☠️","n":"Pirate Captain","d":"A commander who answers to no flag — and no mercy.","t":"adventure","l":1},{"y":"character","e":"🧑‍⚕️","n":"Field Medic","d":"The only one who can fix what the adventure breaks.","t":"adventure","l":2},{"y":"character","e":"🧒","n":"Orphan Scout","d":"A child who knows every back alley and hidden route in the region.","t":"adventure","l":2},{"y":"character","e":"👴","n":"Old Sailor","d":"A veteran of crossings that no one else survived. Quiet about the details.","t":"adventure","l":1},{"y":"character","e":"🕵️","n":"Tracker","d":"A specialist who can follow a trail across any terrain.","t":"adventure","l":2},{"y":"character","e":"🤺","n":"Mercenary","d":"A fighter available to the highest bidder — currently not hired.","t":"adventure","l":2},{"y":"character","e":"🧑‍🌾","n":"Local Farmer","d":"Someone who knows the land intimately — and what used to live there.","t":"adventure","l":2},{"y":"character","e":"🦊","n":"Con Artist","d":"A charming liar who is, unfortunately, the most competent person here.","t":"adventure","l":2},{"y":"character","e":"👸","n":"Stranded Diplomat","d":"A person of authority far from their authority, needing extraction.","t":"adventure","l":2},{"y":"character","e":"🧙","n":"Expedition Leader","d":"The one who planned this — and is now improvising every step.","t":"adventure","l":2},{"y":"character","e":"🧑‍🔬","n":"Field Scientist","d":"Someone who cannot resist stopping to study things mid-crisis.","t":"adventure","l":2},{"y":"character","e":"🦅","n":"Falconer","d":"A scout whose birds see things no human eye can reach.","t":"adventure","l":2},{"y":"character","e":"🐺","n":"Deserter","d":"A soldier who walked away from a war and knows why it was the right choice.","t":"adventure","l":2},{"y":"character","e":"👁️","n":"Witness","d":"Someone who saw exactly what happened — and has been running since.","t":"adventure","l":2},{"y":"character","e":"🧑‍🎤","n":"Treasure Hunter","d":"A professional risk-taker, currently on the wrong side of a very old rivalry.","t":"adventure","l":2},{"y":"character","e":"🐻","n":"Wilderness Hermit","d":"A person who chose isolation — but knows the terrain better than your map.","t":"adventure","l":2},{"y":"character","e":"🧜","n":"Diver","d":"A specialist in what lies beneath the surface — literal and otherwise.","t":"adventure","l":1},{"y":"character","e":"👑","n":"The Exile","d":"Stripped of rank and sent out here — carries knowledge the court fears.","t":"adventure","l":3},{"y":"character","e":"🧑‍🚀","n":"Lost Expedition Member","d":"The sole survivor of the last team that tried this route.","t":"adventure","l":3},{"y":"character","e":"🤝","n":"Reluctant Ally","d":"Someone with opposing interests who needs you as much as you need them.","t":"adventure","l":2},{"y":"character","e":"🎭","n":"The Informant","d":"A double agent who has been feeding both sides and can no longer keep track.","t":"adventure","l":3},{"y":"character","e":"🧑‍⚖️","n":"The Fugitive","d":"Someone running from justice — their version of events differs significantly.","t":"adventure","l":3},{"y":"character","e":"🐉","n":"Monster Hunter","d":"A professional in doing what most people consider impossible.","t":"adventure","l":2},{"y":"character","e":"🌱","n":"Native","d":"Someone whose ancestors called this place home for ten thousand years.","t":"adventure","l":2},{"y":"character","e":"🦋","n":"Cartographer","d":"A mapmaker updating charts — and finding the old ones were wrong on purpose.","t":"adventure","l":4},{"y":"character","e":"🦁","n":"Rival","d":"Another party pursuing the same goal, with fewer scruples about the method.","t":"adventure","l":2},{"y":"character","e":"🧑‍💻","n":"Communications Expert","d":"The only one who can reach the outside world — and the radio just broke.","t":"adventure","l":2},{"y":"character","e":"💀","n":"The Last Guard","d":"A sentinel who has held their post long after the thing they guarded was taken.","t":"adventure","l":4},{"y":"thing","e":"🗺️","n":"Incomplete Map","d":"A chart with crucial sections missing — or deliberately erased.","t":"adventure","l":2},{"y":"thing","e":"🔦","n":"Failing Torch","d":"Your only light source, with batteries that will not last the night.","t":"adventure","l":2},{"y":"thing","e":"🪢","n":"Rope","d":"Fifty feet of it — and you will need every inch.","t":"adventure","l":1},{"y":"thing","e":"🩹","n":"First Aid Kit","d":"Enough supplies for two injuries. There will be more than two.","t":"adventure","l":1},{"y":"thing","e":"🔑","n":"Stolen Key","d":"A key taken from someone who is now actively looking for it.","t":"adventure","l":2},{"y":"thing","e":"📜","n":"Old Letter","d":"A message that was never delivered — the reason becomes clear.","t":"adventure","l":2},{"y":"thing","e":"🎒","n":"Pack","d":"Everything you need — minus the three things you forgot.","t":"adventure","l":1},{"y":"thing","e":"🪓","n":"Axe","d":"A tool for wood, ice, and emergencies that require none of the above.","t":"adventure","l":1},{"y":"thing","e":"🔭","n":"Spyglass","d":"A telescope that shows what is coming — usually too late to change plans.","t":"adventure","l":2},{"y":"thing","e":"💌","n":"The Photograph","d":"An image of someone you must find — or someone you must not find.","t":"adventure","l":3},{"y":"thing","e":"🧪","n":"Vial","d":"A small bottle containing something that should not have been brought here.","t":"adventure","l":2},{"y":"thing","e":"🪙","n":"Coin","d":"Local currency — more valuable to its previous owner than its face value suggests.","t":"adventure","l":1},{"y":"thing","e":"🔫","n":"Jammed Weapon","d":"Your last resort — and it is jammed at the worst moment.","t":"adventure","l":2},{"y":"thing","e":"📖","n":"Journal","d":"A previous explorer's notes — they stopped writing mid-sentence.","t":"adventure","l":1},{"y":"thing","e":"🎯","n":"Flare","d":"A single emergency signal. Use it now or save it for later.","t":"adventure","l":2},{"y":"thing","e":"🏺","n":"Ancient Container","d":"Something sealed centuries ago — and warm to the touch.","t":"adventure","l":2},{"y":"thing","e":"🧲","n":"Unusual Metal","d":"A piece of ore that behaves in ways ore should not.","t":"adventure","l":2},{"y":"thing","e":"🎖️","n":"Dog Tags","d":"Identification from someone who was supposed to be alone out here.","t":"adventure","l":2},{"y":"thing","e":"🌡️","n":"Broken Instrument","d":"A gauge or meter giving readings that cannot possibly be correct.","t":"adventure","l":2},{"y":"thing","e":"🗡️","n":"Hidden Blade","d":"A weapon left somewhere it should not be, by someone unknown.","t":"adventure","l":2},{"y":"thing","e":"📡","n":"Radio","d":"Damaged — it can receive but not transmit. What you hear is terrifying.","t":"adventure","l":1},{"y":"thing","e":"🪬","n":"Token","d":"An object given by a local with very specific instructions about its use.","t":"adventure","l":2},{"y":"thing","e":"🛟","n":"Life Preserver","d":"The last one. Two people need it. One ocean between you and shore.","t":"adventure","l":2},{"y":"thing","e":"🧸","n":"Child's Toy","d":"Found on the trail, far from anywhere a child should be.","t":"adventure","l":2},{"y":"thing","e":"🕯️","n":"Single Candle","d":"One candle, one match. The cave goes on for miles.","t":"adventure","l":1},{"y":"thing","e":"⏳","n":"Ticking Clock","d":"A timer counting down to something the previous owner refused to explain.","t":"adventure","l":2},{"y":"thing","e":"💎","n":"Rare Specimen","d":"A find that will change everything — if you can get it back alive.","t":"adventure","l":2},{"y":"thing","e":"🌿","n":"Medicinal Plant","d":"A known remedy — but also toxic in the wrong dose.","t":"adventure","l":2},{"y":"thing","e":"📿","n":"Tracking Bracelet","d":"You are wearing one. You did not put it there.","t":"adventure","l":2},{"y":"event","e":"🌊","n":"Flash Flood","d":"Water coming faster than you can reason about. Move now.","t":"adventure","l":1},{"y":"event","e":"💥","n":"Equipment Failure","d":"The one thing you depended on has stopped working.","t":"adventure","l":2},{"y":"event","e":"🌪️","n":"Sudden Storm","d":"Weather that wasn't forecast — because nobody ion.","t":"adventure","l":2},{"y":"event","e":"👑","n":"Territorial Dispute","d":"You have crossed into a boundary you did not know existed.","t":"adventure","l":2},{"y":"event","e":"🌁","n":"Supply Crisis","d":"The food, water, or fuel calculation was wrong. Badly wrong.","t":"adventure","l":2},{"y":"event","e":"🌃","n":"Night Crossing","d":"A dangerous passage that must be made in darkness to avoid detection.","t":"adventure","l":2},{"y":"event","e":"🌊","n":"Stranded","d":"The way back is now impassable. Forward is the only option.","t":"adventure","l":2},{"y":"event","e":"🔁","n":"Déjà Vu","d":"You have been to this location before — which is impossible.","t":"adventure","l":2},{"y":"event","e":"🦠","n":"Contamination","d":"Something in the area is making people sick — or changing them.","t":"adventure","l":2},{"y":"event","e":"🌈","n":"The Phenomenon","d":"Something occurring that no one in the group can explain.","t":"adventure","l":3},{"y":"event","e":"🎆","n":"Rescue Operation","d":"Someone is in danger. You are the only ones close enough to help.","t":"adventure","l":2},{"y":"event","e":"🕰️","n":"Deadline","d":"An absolute cutoff — miss it and the consequence is permanent.","t":"adventure","l":2},{"y":"event","e":"🌿","n":"Overgrown","d":"A path consumed by growth — something is being hidden.","t":"adventure","l":2},{"y":"event","e":"🌋","n":"The Tremor","d":"The ground is moving. Gently, then not.","t":"adventure","l":3},{"y":"place","e":"🏚️","n":"Abandoned Asylum","d":"Halls that once held suffering — and the suffering never really left.","t":"horror","l":3},{"y":"place","e":"⛪","n":"Ruined Church","d":"Consecrated ground that no longer feels protected.","t":"horror","l":3},{"y":"place","e":"🌲","n":"Dead Forest","d":"Trees killed by something — still standing, still watching.","t":"horror","l":3},{"y":"place","e":"🌊","n":"Black Water","d":"A lake so deep and dark that nothing has ever been retrieved from it.","t":"horror","l":3},{"y":"place","e":"🕳️","n":"The Pit","d":"A hole in the ground that is wider at the bottom than the top.","t":"horror","l":4},{"y":"place","e":"🏠","n":"Old House","d":"A structure that reacts to its occupants in ways houses should not.","t":"horror","l":1},{"y":"place","e":"🌫️","n":"Dead Town","d":"A settlement intact but empty — dinner still on the tables.","t":"horror","l":3},{"y":"place","e":"🌃","n":"Carnival After Hours","d":"An amusement park that operates after closing. No one is running it.","t":"horror","l":4},{"y":"place","e":"🏥","n":"Condemned Hospital","d":"A medical facility closed after events that were never fully reported.","t":"horror","l":3},{"y":"place","e":"🌑","n":"The Cellar","d":"A basement that goes down further than the building should allow.","t":"horror","l":4},{"y":"place","e":"🌁","n":"The Fog","d":"A mist that arrived and did not leave — and changes those who walk in it.","t":"horror","l":4},{"y":"place","e":"🪨","n":"Stone Circle","d":"Ancient markers arranged with precision — and fresh offerings between them.","t":"horror","l":3},{"y":"place","e":"🌚","n":"Lightless Tunnel","d":"A passage underground with no identifiable end and sounds from ahead.","t":"horror","l":3},{"y":"place","e":"🏔️","n":"Isolated Cabin","d":"A remote shelter with locked rooms that predate its construction.","t":"horror","l":3},{"y":"place","e":"🌾","n":"Cornfield","d":"A crop that grows where nothing should grow, in patterns that are not random.","t":"horror","l":1},{"y":"place","e":"⚓","n":"Shipwreck","d":"A vessel that sank with all hands — and has been making sounds since.","t":"horror","l":1},{"y":"place","e":"🔮","n":"The Mirror Room","d":"A chamber lined entirely with reflective surfaces. Reflections move wrong.","t":"horror","l":4},{"y":"place","e":"🌊","n":"The Shore","d":"A beach where the tide brings in things that were never in the water.","t":"horror","l":4},{"y":"place","e":"🏰","n":"Sealed Wing","d":"A portion of the building walled off. The wall is new. The sounds are old.","t":"horror","l": ","e":"💀","n":"The Revenant","d":"Something that returned from death with a specific and unforgiven purpose.","t":"horror","l":4},{"y":"character","e":"🤡","n":"The Smile","d":"An entity that only appears in peripheral vision — always smiling.","t":"horror","l":4},{"y":"character","e":"🦠","n":"The Infection","d":"A biological agent that rewrites what it enters.","t":"horror","l":4},{"y":"character","e":"🐀","n":"The Swarm","d":"Thousands of small things acting as one enormous intelligence.","t":"horror","l":4},{"y":"character","e":"🌑","n":"The Shadow","d":"A darkness shaped like a person — one more than there should be.","t":"horror","l":4},{"y":"character","e":"👶","n":"The Child","d":"A figure that appears as a child — but has never been one.","t":"horror","l":4},{"y":"character","e":"🧙","n":"The Collector","d":"An ancient being that takes things — memories, names, years of life.","t":"horror","l":4},{"y":"character","e":"🐺","n":"The Animal","d":"Something that looks like a dog from a distance. It is not a dog.","t":"horror","l":4},{"y":"character","e":"🌀","n":"The Hunger","d":"An entity that does not want anything — it simply needs.","t":"horror","l":4},{"y":"character","e":"🧝","n":"The Neighbor","d":"A person who has lived next door for years. No one remembers them moving in.","t":"horror","l":4},{"y":"character","e":"🦋","n":"The Mimic","d":"Something that copies what it has heard, but the timing is always wrong.","t":"horror","l":4},{"y":"character","e":"🧌","n":"What's in the Basement","d":"It has been quiet for weeks. That was worse than the noise.","t":"horror","l":4},{"y":"character","e":"🌿","n":"The Growth","d":"An organism expanding through the structure. It is responsive to sound.","t":"horror","l":4},{"y":"character","e":"🐊","n":"The Patient","d":"A figure sitting in the same chair for thirty years. Still breathing.","t":"horror","l":4},{"y":"character","e":"👸","n":"The Bride","d":"A figure in white who appears at windows — usually someone else's windows.","t":"horror","l":4},{"y":"character","e":"🔮","n":"The Oracle","d":"A presence that only speaks in warnings — always accurate, always too late.","t":"horror","l":4},{"y":"character","e":"🧜","n":"The Drowned","d":"Figures seen underwater who are not drowning — they are waiting.","t":"horror","l":4},{"y":"character","e":"🦅","n":"The Omen","d":"A creature whose appearance consistently precedes specific events.","t":"horror","l":4},{"y":"character","e":"🐍","n":"The Coiled One","d":"A presence that winds itself around buildings, relationships, minds.","t":"horror","l":4},{"y":"character","e":"🧞","n":"The Granter","d":"An entity that fulfills wishes — the fulfillment is always technically correct.","t":"horror","l":4},{"y":"character","e":"🎭","n":"The Replacement","d":"Something wearing a person's face with increasing confidence.","t":"horror","l":4},{"y":"character","e":"🌲","n":"The Forest","d":"Not a collection of trees — a single aware organism.","t":"horror","l":4},{"y":"character","e":"🧑‍🔬","n":"The Researcher","d":"Someone who studied the phenomenon too closely — and became part of it.","t":"horror","l":4},{"y":"character","e":"🦉","n":"The Night Caller","d":"A presence that announces itself with sounds — and arrives before the echo fades.","t":"horror","l":4},{"y":"character","e":"🌊","n":"The Deep One","d":"Something from below the seabed that surfaces only when summoned.","t":"horror","l":4},{"y":"thing","e":"📖","n":"The Diary","d":"A journal written in handwriting that matches yours — but you did not write it.","t":"horror","l":4},{"y":"thing","e":"🪞","n":"The Mirror","d":"A mirror that shows what was in the room — not what is.","t":"horror","l":4},{"y":"thing","e":"📷","n":"Old Camera","d":"A camera with film inside — the photos show places you have been alone.","t":"horror","l":1},{"y":"thing","e":"🎵","n":"Music Box","d":"A device that plays on its own — the song becomes recognizable over time.","t":"horror","l":1},{"y":"thing","e":"🧸","n":"The Doll","d":"An object found facing the wall. It was not facing the wall before.","t":"horror","l":1},{"y":"thing","e":"📞","n":"The Call","d":"Calls from a disconnected number — same voice every time.","t":"horror","l":4},{"y":"thing","e":"🔑","n":"Unknown Key","d":"A key that appeared in your possession. You have not found what it opens yet.","t":"horror","l":3},{"y":"thing","e":"🗒️","n":"The List","d":"Names on a piece of paper. Yours is on it. Several are crossed out.","t":"horror","l":4},{"y":"thing","e":"🎴","n":"The Card","d":"A playing card dealt from a deck that was sealed — face down, wrong suit.","t":"horror","l":4},{"y":"thing","e":"📻","n":"Static Radio","d":"A receiver picking up voices in the noise. They say your name.","t":"horror","l":3},{"y":"thing","e":"🕰️","n":"Stopped Clock","d":"All clocks in the building stopped at the same moment. No one knows when.","t":"horror","l":3},{"y":"thing","e":"🖼️","n":"The Portrait","d":"A painting whose subject has been moving between sessions — subtly, but measurably.","t":"horror","l":4},{"y":"thing","e":"📦","n":"The Package","d":"Addressed to the previous resident, who disappeared. Still sealed.","t":"horror","l":4},{"y":"thing","e":"🧪","n":"The Substance","d":"A fluid with no label, no odor — but it responds to proximity.","t":"horror","l":4},{"y":"thing","e":"💀","n":"The Bones","d":"Found beneath the floor during renovation. Far too many of them.","t":"horror","l":4},{"y":"thing","e":"🌡️","n":"The Reading","d":"An instrument showing measurements physically impossible in this location.","t":"horror","l":4},{"y":"thing","e":"🗡️","n":"The Blade","d":"A knife that reappears no matter how many times it is discarded.","t":"horror","l":4},{"y":"thing","e":"🧿","n":"The Eye","d":"A glass bead that is always warm — and seems to be looking back.","t":"horror","l":4},{"y":"thing","e":"📜","n":"The Contract","d":"A document signed by everyone who lived here — none of them willingly.","t":"horror","l":4},{"y":"thing","e":"🪬","n":"The Ward","d":"A p ];

/* ---- State ---------------------------------------------- */

var KEY = "interrupt.v1";

var state = {
  screen: "setup",
  level: "A2",
  mode: "gentle",
  themes: ["fantasy", "adventure"],
  handSize: 5,
  teams: [{ name: "Team 1", c: COLOURS[0] }, { name: "Team 2", c: COLOURS[1] }],
  active: 0,
  ribbon: [],
  pile: []
};

var pending = null;
var stealTimer = null;
var stealOpen = false;

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      level: state.level, mode: state.mode, themes: state.themes,
      handSize: state.handSize,
      teams: state.teams.map(function (t) { return { name: t.name, c: t.c }; })
    }));
  } catch (err) {}
}

function loadPrefs() {
  try {
    var s = JSON.parse(localStorage.getItem(KEY));
    if (!s) return;
    if (s.level) state.level = s.level;
    if (s.mode) state.mode = s.mode;
    if (s.themes && s.themes.length) state.themes = s.themes;
    if (s.handSize) state.handSize = s.handSize;
    if (s.teams && s.teams.length >= 2) state.teams = s.teams;
  } catch (err) {}
}

/* ---- Deck ----------------------------------------------- */

function levelInfo() {
  for (var i = 0; i < LEVELS.length; i++) { if (LEVELS[i].id === state.level) return LEVELS[i]; }
  return LEVELS[1];
}

function availableCards() {
  var max = levelInfo().max;
  var themes = state.themes;
  return DECK.filter(function (c) {
    if (c.l > max) return false;
    return c.t === "core" || themes.indexOf(c.t) !== -1;
  });
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function pickOne(a) { return a[Math.floor(Math.random() * a.length)]; }

/* Deal a hand that always contains at least one character, place, thing and
   event, so no team is stuck holding five adjectives. */
function dealHand(byType, used) {
  var hand = [];
  ["character", "place", "thing", "event"].forEach(function (y) {
    var p = (byType[y] || []).filter(function (c) { return used.indexOf(c) === -1; });
    if (!p.length) p = byType[y] || [];
    if (!p.length) return;
    var c = pickOne(p);
    used.push(c); hand.push(c);
  });
  var rest = [];
  for (var y in byType) { if (byType.hasOwnProperty(y)) rest = rest.concat(byType[y]); }
  while (hand.length < state.handSize) {
    var pool = rest.filter(function (c) { return used.indexOf(c) === -1; });
    if (!pool.length) break;
    var pickCard = pickOne(pool);
    used.push(pickCard); hand.push(pickCard);
  }
  return shuffle(hand);
}

  document.getElementById("modePills").innerHTML = Object.keys(MODES).map(function (m) {
    return '<button class="pill' + (m === state.mode ? " on" : "") +
           '" onclick="setMode(\'' + m + '\')">' + MODES[m].label +
           '<small>' + MODES[m].sub + '</small></button>';
  }).join("");
  document.getElementById("modeNote").innerHTML = MODES[state.mode].note;

  document.getElementById("themePills").innerHTML = THEMES.map(function (t) {
    return '<button class="pill' + (state.themes.indexOf(t.id) !== -1 ? " on" : "") +
           '" onclick="toggleTheme2(\'' + t.id + '\')">' + t.icon + " " + t.label + '</button>';
  }).join("");

  var n = availableCards().length;
  document.getElementById("deckCount").innerHTML =
    "<b>" + n + " cards</b> in play at " + state.level +
    ". Everyday cards are always included.";

  document.getElementById("sizePills").innerHTML = [4, 5, 6].map(function (s) {
    return '<button class="pill' + (s === state.handSize ? " on" : "") +
           '" onclick="setSize(' + s + ')">' + s + '</button>';
  }).join("");

  document.getElementById("teamsGrid").innerHTML = state.teams.map(function (t, i) {
    return '<div class="team-edit">' +
             '<span class="swatch" style="background:' + t.c + '"></span>' +
             '<input value="' + esc(t.name) + '" oninput="renameTeam(' + i + ', this.value)">' +
             (state.teams.length > 2 ? '<button class="xbtn" onclick="removeTeam(' + i + ')">✕</button>' : '') +
           '</div>';
  }).join("");
}

function setLevel(id) {
  state.level = id;
  var l = levelInfo();
  state.mode = l.mode;
  renderSetup(); save();
}
function setMode(m) { state.mode = m; renderSetup(); save(); }
function setSize(s) { state.handSize = s; renderSetup(); save(); }
function toggleTheme2(id) {
  var i = state.themes.indexOf(id);
  if (i === -1) state.themes.push(id);
  else if (state.themes.length > 1) state.themes.splice(i, 1);
  renderSetup(); save();
}
function renameTeam(i, v) { state.teams[i].name = v; save(); }
function addTeam() {
  if (state.teams.length >= 6) return;
  state.teams.push({ name: "Team " + (state.teams.length + 1), c: COLOURS[state.teams.length] });
  renderSetup(); save();
}
function removeTeam(i) { state.teams.splice(i, 1); renderSetup(); save(); }

/* ---- Start ---------------------------------------------- */

function startGame() {
  var cards = availableCards();
  var byType = { character: [], place: [], thing: [], event: [], aspect: [] };
  cards.forEach(function (c) { if (byType[c.y]) byType[c.y].push(c); });

  var used = [];
  var endPool = shuffle(ENDINGS[levelInfo().endings].slice());

  state.teams.forEach(function (t, i) {
    t.hand = dealHand(byType, used);
    t.ending = endPool[i % endPool.length];
    t.stars = 0;
  });

  state.pile = shuffle(cards.filter(function (c) { return used.indexOf(c) === -1; }));
  state.ribbon = [];
  state.active = 0;
  state.screen = "game";

  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("topHeader").style.display = "none";
  renderGame();
}

function backToSetup() {
  state.screen = "setup";
  document.getElementById("setupScreen").style.display = "block";
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("topHeader").style.display = "block";
  renderSetup();
}

/* ---- Card markup ---------------------------------------- */

function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function cardHTML(c, onclick, extra) {
  return '<div class="card c-' + c.y + (extra || "") + '"' +
         (onclick ? ' onclick="' + onclick + '"' : "") + '>' +
           '<div class="c-type">' + TYPE_LABEL[c.y] + '</div>' +
           '<div class="c-emoji">' + c.e + '</div>' +
           '<div class="c-name">' + esc(c.n) + '</div>' +
           '<div class="c-def">' + esc(c.d) + '</div>' +
         '</div>';
}

function endingHTML(text, onclick, dim) {
  return '<div class="card ending' + (dim ? " dim" : "") + '"' +
         (onclick ? ' onclick="' + onclick + '"' : "") + '>' +
           '<div class="c-type">Ending</div>' +
           '<div class="c-name">…' + esc(text) + '</div>' +
         '</div>';
}

/* ---- Game rendering ------------------------------------- */

function renderGame() {
  var t = state.teams[state.active];
  document.getElementById("whoseTurn").textContent = t.name;
  document.getElementById("whoseTurn").style.color = t.c;
  document.getElementById("modeBadge").textContent = state.level + " · " + MODES[state.mode].label;
  document.getElementById("hesitateBtn").style.display = state.mode === "full" ? "" : "none";
  document.getElementById("nextBtn").style.display = state.mode === "gentle" ? "" : "none";

  var rib = document.getElementById("ribbon");
  if (!state.ribbon.length) {
    rib.innerHTML = '<div class="ribbon-empty">Empty. ' + esc(t.name) +
      ' starts: play a card and begin the story out loud.</div>';
  } else {
    rib.innerHTML = state.ribbon.map(function (r) {
      return '<div>' + cardHTML(r.c) +
             '<div class="played-by" style="color:' + r.t.c + '">' + esc(r.t.name) + '</div></div>';
    }).join("");
    rib.scrollLeft = rib.scrollWidth;
  }

  document.getElementById("teamRows").innerHTML = state.teams.map(function (tm, i) {
    var isActive = i === state.active;
    var canEnd = tm.hand.length === 0;
    var hand = tm.hand.map(function (c, ci) {
      return cardHTML(c, "playCard(" + i + "," + ci + ")");
    }).join("");
    hand += endingHTML(tm.ending, canEnd ? "playEnding(" + i + ")" : "", !canEnd);

    return '<div class="team-row' + (isActive ? " active" : "") + '">' +
             '<div class="team-head">' +
               '<span class="swatch" style="background:' + tm.c + '"></span>' +
               '<span class="team-name">' + esc(tm.name) + '</span>' +
               (isActive ? '<span class="team-tag">Telling</span>' : '') +
               '<span class="stars">' + (tm.stars ? new Array(tm.stars + 1).join("★") : "") + '</span>' +
               '<button class="gbtn" style="padding:.2rem .5rem;font-size:.72rem" onclick="star(' + i + ')">★ Best line</button>' +
               '<span style="color:var(--dim);font-size:.78rem">' + tm.hand.length + ' left</span>' +
             '</div>' +
             '<div class="hand">' + hand + '</div>' +
           '</div>';
  }).join("");
}

/* ---- Playing -------------------------------------------- */

function playCard(ti, ci) {
  var team = state.teams[ti];
  var card = team.hand[ci];
  if (!card) return;

  if (ti === state.active) { commitPlay(ti, ci); return; }

  if (state.mode === "gentle") return;          // no stealing in Gentle

  if (stealOpen) { closeSteal(); commitPlay(ti, ci); return; }

  // Otherwise it is a claimed interrupt: the teacher rules on it.
  pending = { kind: "interrupt", ti: ti, ci: ci };
  var o = document.getElementById("refOverlay");
  document.getElementById("refTitle").textContent = team.name + " wants to interrupt";
  document.getElementById("refSub").textContent =
    "Did they use this card to link to what was just said? Your call.";
  document.getElementById("refCard").innerHTML = cardHTML(card);
  document.getElementById("refYes").textContent = "Allow — their turn";
  document.getElementById("refYes").setAttribute("onclick", "refAllow()");
  o.classList.add("show");
}

function commitPlay(ti, ci) {
  var team = state.teams[ti];
  var card = team.hand.splice(ci, 1)[0];
  state.ribbon.push({ c: card, t: team });
  state.active = ti;
  if (state.mode === "gentle") { state.active = (ti + 1) % state.teams.length; }
  renderGame();
}

function refAllow() {
  document.getElementById("refOverlay").classList.remove("show");
  if (!pending) return;
  if (pending.kind === "interrupt") commitPlay(pending.ti, pending.ci);
  else if (pending.kind === "ending") finishGame(pending.ti);
  pending = null;
}

function refDeny() {
  document.getElementById("refOverlay").classList.remove("show");
  pending = null;
}

function playEnding(ti) {
  var team = state.teams[ti];
  if (team.hand.length) return;
  pending = { kind: "ending", ti: ti };
  document.getElementById("refTitle").textContent = team.name + " is ending the story";
  document.getElementById("refSub").textContent =
    "Did the story actually reach this ending? They must say it word for word.";
  document.getElementById("refCard").innerHTML = endingHTML(team.ending);
  document.getElementById("refYes").textContent = "Accept — they win";
  document.getElementById("refYes").setAttribute("onclick", "refAllow()");
  document.getElementById("refOverlay").classList.add("show");
}

function passTurn() {
  state.active = (state.active + 1) % state.teams.length;
  renderGame();
}

function drawAndPass() {
  var team = state.teams[state.active];
  if (state.pile.length) team.hand.push(state.pile.pop());
  passTurn();
}

function star(i) { state.teams[i].stars++; renderGame(); }

/* ---- Hesitation ----------------------------------------- */

function hesitate() {
  var n = 3;
  stealOpen = false;
  var o = document.getElementById("stealOverlay");
  document.getElementById("countdown").textContent = n;
  document.getElementById("stealNote").textContent = "Keep talking…";
  o.classList.add("show");
  clearInterval(stealTimer);
  stealTimer = setInterval(function () {
    n--;
    if (n > 0) { document.getElementById("countdown").textContent = n; return; }
    clearInterval(stealTimer);
    document.getElementById("countdown").textContent = "!";
    document.getElementById("stealNote").textContent =
      "Up for grabs — first card played takes the turn.";
    stealOpen = true;
    setTimeout(function () { o.classList.remove("show"); }, 900);
  }, 1000);
}

function closeSteal() {
  clearInterval(stealTimer);
  stealOpen = false;
  document.getElementById("stealOverlay").classList.remove("show");
}

/* ---- Finish --------------------------------------------- */

function finishGame(ti) {
  var team = state.teams[ti];
  document.getElementById("winTitle").innerHTML =
    '<span style="color:' + team.c + '">' + esc(team.name) + '</span> tells the ending';
  document.getElementById("winRibbon").innerHTML =
    state.ribbon.map(function (r) { return cardHTML(r.c); }).join("");
  document.getElementById("winEnding").textContent = "…" + team.ending;
  document.getElementById("winOverlay").classList.add("show");
}

function closeWin() { document.getElementById("winOverlay").classList.remove("show"); }

/* ---- Export --------------------------------------------- */

function storyText() {
  var out = "Interrupt! — " + state.level + "\n\n";
  state.ribbon.forEach(function (r, i) {
    out += (i + 1) + ". " + r.c.e + " " + r.c.n + "  (" + TYPE_LABEL[r.c.y] + ", " + r.t.name + ")\n";
  });
  out += "\nEndings in play:\n";
  state.teams.forEach(function (t) { out += "  " + t.name + ": …" + t.ending + "\n"; });
  return out;
}

function copyStory() {
  var btn = document.getElementById("copyBtn");
  navigator.clipboard.writeText(storyText()).then(function () {
    if (btn) { btn.textContent = "Copied"; setTimeout(function () { btn.textContent = "Copy the story"; }, 1400); }
  });
}

function printCards() {
  var html = "";
  state.teams.forEach(function (t) {
    html += "<h3>" + esc(t.name) + " &nbsp;—&nbsp; ending: …" + esc(t.ending) + "</h3><div class='pgrid'>";
    t.hand.forEach(function (c) {
      html += "<div class='pcard'><div class='pt'>" + TYPE_LABEL[c.y] + "</div>" +
              "<div class='pe'>" + c.e + "</div>" +
              "<div class='pn'>" + esc(c.n) + "</div>" +
              "<div class='pd'>" + esc(c.d) + "</div></div>";
    });
    html += "</div>";
  });
  document.getElementById("printSheet").innerHTML = html;
  window.print();
}

/* ---- Chrome --------------------------------------------- */

function toggleTheme() {
  var h = document.documentElement;
  var next = h.getAttribute("data-theme") === "dark" ? "light" : "dark";
  h.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
}

function toggleDefs() { document.body.classList.toggle("nodefs"); }

(function () {
  var saved = localStorage.getItem("theme");
  if (saved) document.documentElement.setAttribute("data-theme", saved);
})();

document.addEventListener("keydown", function (ev) {
  if (ev.target && (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA")) return;
  if (state.screen !== "game") return;
  if (ev.code === "Space" && state.mode === "full") { ev.preventDefault(); hesitate(); }
  if (ev.key === "Escape") { closeSteal(); refDeny(); closeWin(); }
});

/* ---- Boot ----------------------------------------------- */
loadPrefs();
renderSetup();
</script>
</body>
</html>
