<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEOPARDY!</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #0a1fd4;
    --dark-blue: #060e8a;
    --gold: #ffcc00;
    --gold-dark: #c9a000;
    --white: #ffffff;
    --light-blue: #1a3fff;
    --correct: #00c851;
    --wrong: #ff4444;
    --bg: #04083a;
    --chrome-bg: #060a24;
    --chrome-bg2: #0b1030;
    --chrome-panel: rgba(255,255,255,0.05);
    --chrome-panel-border: rgba(255,255,255,0.1);
    --chrome-text: #ffffff;
    --chrome-text-dim: #aabfff;
    --chrome-text-dimmer: #7488c4;
    --board-navy: #04083a;
  }
  :root[data-theme="light"] {
    --chrome-bg: #eef1fb;
    --chrome-bg2: #ffffff;
    --chrome-panel: #ffffff;
    --chrome-panel-border: #d7ddf5;
    --chrome-text: #131a3a;
    --chrome-text-dim: #45508c;
    --chrome-text-dimmer: #6b76ab;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--chrome-bg);
    color: var(--chrome-text);
    font-family: 'Barlow Condensed', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }
  button { font: inherit; }
  kbd {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7em;
    letter-spacing: 1px;
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid currentColor;
    opacity: 0.6;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* ─── SCREENS ─── */
  .screen { display: none; width: 100%; min-height: 100vh; min-height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }

  /* ─── START SCREEN ───
     Sized to fit a 1366×768 viewport with no page scroll: the logo and
     paddings are kept small, and .cat-grid is the one part that scrolls. */
  #startScreen {
    background: radial-gradient(ellipse at top, #0f1f9e 0%, var(--chrome-bg) 62%);
    padding: 14px 20px 16px;
    min-height: 100vh;
    min-height: 100dvh;
    justify-content: center;
  }
  :root[data-theme="light"] #startScreen {
    background: radial-gradient(ellipse at top, #dbe3ff 0%, var(--chrome-bg) 70%);
  }
  .logo {
    font-family: 'Anton', sans-serif;
    font-size: clamp(30px, 4.2vw, 44px);
    color: var(--gold);
    text-shadow: 3px 3px 0 var(--gold-dark), 0 0 40px #ffcc0088;
    letter-spacing: 4px;
    text-align: center;
    animation: logoPulse 3s ease-in-out infinite;
  }
  #endScreen .logo { font-size: clamp(32px,7vw,64px); }
  @keyframes logoPulse {
    0%,100%{text-shadow:3px 3px 0 var(--gold-dark),0 0 30px #ffcc0088;}
    50%{text-shadow:3px 3px 0 var(--gold-dark),0 0 60px #ffcc00cc;}
  }
  .subtitle {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(10px, 1.6vw, 13px);
    color: var(--chrome-text-dim);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-align: center;
  }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; z-index: 60;
    background: rgba(0,0,0,0.35); border: 1px solid var(--chrome-panel-border);
    color: var(--chrome-text); border-radius: 999px; padding: 7px 12px; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1px;
    backdrop-filter: blur(4px);
  }
  :root[data-theme="light"] .theme-toggle { background: rgba(255,255,255,0.7); }

  .setup-grid {
    width: 100%;
    max-width: 1180px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .setup-grid { grid-template-columns: 1fr; }
  }
  .setup-col {
    background: var(--chrome-panel);
    border: 1px solid var(--chrome-panel-border);
    border-radius: 14px;
    padding: 12px 16px 14px;
    backdrop-filter: blur(10px);
  }
  .section-title {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-bottom: 4px;
    border-bottom: 2px solid var(--gold-dark);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .section-title .hint {
    font-size: 11px;
    color: var(--chrome-text-dimmer);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    text-transform: none;
  }

  /* Team setup */
  .player-count-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .pcount-btn {
    flex: 1;
    background: rgba(120,140,255,0.08);
    border: 2px solid transparent;
    border-radius: 8px;
    color: var(--chrome-text);
    font-family: 'Oswald', sans-serif;
    font-size: 16px;
    padding: 7px 0;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pcount-btn.active { border-color: var(--gold); background: rgba(255,204,0,0.15); color: var(--gold-dark); }
  :root[data-theme="dark"] .pcount-btn.active { color: var(--gold); }

  .players-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .player-card {
    background: rgba(120,140,255,0.06);
    border: 2px solid transparent;
    border-left: 4px solid var(--team, #4466ff);
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: default;
  }
  .player-card label {
    font-size: 11px; color: var(--chrome-text-dim); letter-spacing: 1px;
    display: flex; align-items: center; white-space: nowrap;
  }
  .team-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .player-card input {
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--team, #4466ff);
    color: var(--chrome-text);
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    flex: 1;
    min-width: 0;
    padding: 3px 0;
    outline: none;
  }

  .rules-row { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .rule-label { font-family: 'Oswald', sans-serif; font-size: 14px; color: var(--chrome-text-dim); letter-spacing: 1px; }
  .seg { display: inline-flex; background: rgba(120,140,255,0.08); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button {
    border: none; background: transparent; color: var(--chrome-text-dim); cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 13px; padding: 6px 13px; border-radius: 8px; letter-spacing: 1px;
  }
  .seg button.active { background: var(--gold); color: #000; font-weight: 700; }

  /* Board builder: selected slots strip */
  .slots-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    margin-bottom: 8px;
  }
  .slot {
    min-height: 42px;
    border: 2px dashed var(--chrome-panel-border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4px 3px;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    color: var(--chrome-text-dimmer);
    letter-spacing: 0.5px;
    gap: 2px;
    position: relative;
  }
  .slot.filled {
    border-style: solid;
    border-color: var(--gold-dark);
    background: rgba(255,204,0,0.08);
    color: var(--chrome-text);
    cursor: pointer;
  }
  .slot .slot-num {
    position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--chrome-text-dimmer);
  }
  .slot .slot-diff {
    font-size: 9px;
    letter-spacing: 1px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-top: 2px;
  }
  .slot .slot-diff.easy { background: #00c851; color: #000; }
  .slot .slot-diff.medium { background: #ffbb00; color: #000; }
  .slot .slot-diff.hard { background: #ff4444; color: #fff; }
  .slot .slot-remove {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--wrong); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer;
    display: none; align-items: center; justify-content: center;
  }
  .slot.filled:hover .slot-remove { display: flex; }

  .builder-toolbar { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; align-items: center; }
  .tool-btn {
    background: rgba(120,140,255,0.1); border: 1px solid var(--chrome-panel-border); color: var(--chrome-text);
    border-radius: 8px; padding: 6px 13px; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.5px;
  }
  .tool-btn:hover { border-color: var(--gold); }
  .cat-search {
    flex: 1; min-width: 140px;
    background: rgba(120,140,255,0.06); border: 1px solid var(--chrome-panel-border); border-radius: 8px;
    color: var(--chrome-text); padding: 6px 12px; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; outline: none;
  }
  .cat-search:focus { border-color: var(--gold); }

  .group-tabs { display: flex; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
  .group-tab {
    background: transparent; border: 1px solid var(--chrome-panel-border); color: var(--chrome-text-dim);
    border-radius: 999px; padding: 4px 12px; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 1px;
  }
  .group-tab.active { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 700; }

  .cat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 6px;
    max-height: 230px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .cat-grid::-webkit-scrollbar { width: 6px; }
  .cat-grid::-webkit-scrollbar-track { background: rgba(120,140,255,0.05); border-radius: 3px; }
  .cat-grid::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 3px; }
  .cat-item {
    background: rgba(120,140,255,0.06);
    border: 2px solid var(--chrome-panel-border);
    border-radius: 9px;
    padding: 7px 9px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .cat-item:hover { border-color: var(--gold-dark); }
  .cat-item.selected { border-color: var(--gold); background: rgba(255,204,0,0.1); }
  .cat-item.hidden { display: none; }
  .cat-item .cat-name {
    font-family: 'Oswald', sans-serif;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
  }
  .diff-selector { display: flex; gap: 4px; }
  .diff-btn {
    flex: 1;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 3px 4px;
    border-radius: 4px;
    border: 1px solid var(--chrome-panel-border);
    background: transparent;
    color: var(--chrome-text-dimmer);
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    transition: all 0.15s;
  }
  .diff-btn.easy.active { background: #00c851; border-color: #00c851; color: #000; font-weight: 700; }
  .diff-btn.medium.active { background: #ffbb00; border-color: #ffbb00; color: #000; font-weight: 700; }
  .diff-btn.hard.active { background: #ff4444; border-color: #ff4444; color: #fff; font-weight: 700; }
  .cat-count {
    font-size: 11px;
    color: var(--chrome-text-dim);
    margin: 2px 0 6px;
  }
  .cat-count span { color: var(--gold-dark); font-weight: 700; }
  :root[data-theme="dark"] .cat-count span { color: var(--gold); }
  .cat-warn { color: #ff6a6a; margin-left: 10px; opacity: 0; transition: opacity .2s; }
  .cat-warn.show { opacity: 1; animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }

  .start-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    border: none;
    border-radius: 12px;
    color: #000;
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 11px 38px;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(255,204,0,0.4);
    flex-shrink: 0;
  }
  .start-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,204,0,0.6); }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .start-hint { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--chrome-text-dimmer); letter-spacing: 1px; margin-top: 5px; text-align: center; min-height: 1.2em; }

  .resume-banner {
    width: 100%;
    max-width: 1180px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: rgba(255,204,0,0.12);
    border: 2px solid var(--gold);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 14px;
  }
  .resume-banner[hidden] { display: none; }
  .resume-title { font-family: 'Oswald', sans-serif; font-size: 18px; color: var(--gold-dark); letter-spacing: 1px; text-transform: uppercase; }
  :root[data-theme="dark"] .resume-title { color: var(--gold); }
  .resume-meta { font-size: 15px; color: var(--chrome-text-dim); margin-top: 2px; }
  .resume-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .resume-btn, .discard-btn {
    border-radius: 10px; padding: 9px 18px; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 1px;
  }
  .resume-btn { background: var(--gold); color: #000; border: none; font-weight: 700; }
  .discard-btn { background: transparent; color: var(--chrome-text); border: 2px solid var(--chrome-panel-border); }

  /* ─── GAME BOARD (fills the viewport) ─── */
  #boardScreen { background: var(--board-navy); padding: 0; justify-content: flex-start; height: 100vh; height: 100dvh; overflow: hidden; }
  .scoreboard {
    display: flex;
    gap: 0;
    width: 100%;
    background: #000;
    border-bottom: 3px solid var(--gold);
    flex-shrink: 0;
  }
  .score-cell {
    flex: 1;
    text-align: center;
    padding: 8px 6px;
    border-right: 1px solid #14183a;
    border-top: 4px solid var(--team, transparent);
    transition: background 0.3s;
    cursor: pointer;
    position: relative;
  }
  .score-cell:last-child { border-right: none; }
  .score-cell.current-turn { background: rgba(255,204,0,0.15); box-shadow: inset 0 -3px 0 var(--gold); }
  .score-cell .p-name {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(11px, 1.7vw, 15px);
    font-weight: 700;
    color: var(--team, var(--gold));
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .score-cell .p-score {
    font-family: 'Anton', sans-serif;
    font-size: clamp(18px, 3vw, 30px);
    color: white;
    transition: transform 0.2s;
  }
  .score-cell .p-score.negative { color: #ff6666; }
  .score-cell .p-score.bump { animation: scorebump 0.35s ease; }
  @keyframes scorebump { 0%{transform:scale(1)} 40%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .pick-tag {
    display: inline-block; margin-left: 6px; font-size: 9px; letter-spacing: 1.5px;
    background: var(--gold); color: #000; border-radius: 4px; padding: 1px 5px; vertical-align: middle;
  }
  .adj { display: none; gap: 6px; justify-content: center; margin-top: 3px; }
  body.adjusting .adj { display: flex; }
  .adj button {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); color: #fff;
    border-radius: 6px; padding: 2px 9px; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 12px;
  }

  .board-wrap { width: 100%; flex: 1; padding: 6px; min-height: 0; }
  .board {
    display: grid;
    grid-template-rows: auto repeat(5, 1fr);
    gap: 5px;
    width: 100%;
    height: 100%;
  }
  .cat-header {
    background: linear-gradient(180deg, var(--blue) 0%, var(--dark-blue) 100%);
    border: 2px solid var(--light-blue);
    border-radius: 6px;
    padding: 6px 4px;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: clamp(11px, 1.6vw, 19px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
    text-wrap: balance;
  }
  .cell {
    background: linear-gradient(180deg, var(--blue) 0%, var(--dark-blue) 100%);
    border: 2px solid var(--light-blue);
    border-radius: 6px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    box-shadow: inset 0 2px 0 rgba(255,255,255,0.12), inset 0 -3px 6px rgba(0,0,0,0.35);
  }
  .cell:hover:not(.used) { background: linear-gradient(180deg, var(--light-blue) 0%, var(--blue) 100%); transform: scale(1.02); border-color: var(--gold); z-index: 1; }
  button.cell:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .cell.used { background: #030620; border-color: #12163a; cursor: default; box-shadow: inset 0 3px 10px rgba(0,0,0,0.5); pointer-events: none; }
  button.cell { color: inherit; width: 100%; height: 100%; }
  .cell .val {
    font-family: 'Anton', sans-serif;
    font-size: clamp(20px, 4.2vw, 64px);
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--gold-dark);
  }
  .cell.used .val { display: none; }

  .teacher-bar {
    position: fixed; right: 10px; bottom: 10px; z-index: 50;
    display: flex; align-items: center; gap: 6px;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 999px; padding: 5px 6px 5px 14px; backdrop-filter: blur(4px);
  }
  .tb-status { font-size: 13px; color: #aabfff; letter-spacing: 1px; margin-right: 4px; }
  .tb-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    border-radius: 999px; padding: 5px 13px; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1px;
  }
  .tb-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .tb-btn.on { background: var(--gold); color: #000; }
  .tb-btn.danger.armed { background: var(--wrong); border-color: var(--wrong); }

  /* ─── CLUE TAKEOVER ─── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, var(--blue) 0%, var(--dark-blue) 100%);
    z-index: 100;
    flex-direction: column;
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay.animating .modal { animation: clueIn 0.42s cubic-bezier(.2,.85,.3,1); }
  @keyframes clueIn {
    from { transform: scale(0.4); opacity: 0.3; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: clamp(16px, 3vw, 40px);
    transform-origin: center center;
  }
  .modal-topbar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: clamp(10px, 3vh, 28px); flex-wrap: wrap; gap: 8px; }
  .modal-cat {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(13px, 2vw, 20px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #aabfff;
  }
  .modal-value {
    font-family: 'Anton', sans-serif;
    font-size: clamp(28px, 4.5vw, 52px);
    color: var(--gold);
    text-shadow: 2px 2px 0 var(--gold-dark);
  }
  .modal-clue-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    padding: 0 clamp(4px, 3vw, 40px);
  }
  .modal-clue {
    font-family: 'Libre Baskerville', 'Oswald', serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: clamp(24px, 4.6vw, 60px);
    text-align: center;
    line-height: 1.3;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.35);
    text-wrap: balance;
  }

// ═══════════════════════════════════════════════════════
//  SOUND ENGINE (Web Audio API)
// ═══════════════════════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    return ctx;
  }

  function play(fn) {
    try { fn(getCtx()); } catch(e) {}
  }

  // Board tile click - classic Jeopardy-style blip
  function tileClick() {
    play(ctx => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(880, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.08);
      g.gain.setValueAtTime(0.3, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.15);
    });
  }

  // Correct answer - ascending fanfare
  function correct() {
    play(ctx => {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'triangle';
        const t = ctx.currentTime + i * 0.1;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.start(t);
        o.stop(t + 0.25);
      });
    });
  }

  // Wrong answer - descending buzz
  function wrong() {
    play(ctx => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(220, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
      g.gain.setValueAtTime(0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.35);
    });
  }

  // Question open - dramatic low thud + shimmer
  function questionOpen() {
    play(ctx => {
      // Low thud
      const o1 = ctx.createOscillator();
      const g1 = ctx.createGain();
      o1.connect(g1); g1.connect(ctx.destination);
      o1.type = 'sine';
      o1.frequency.setValueAtTime(120, ctx.currentTime);
      o1.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.25);
      g1.gain.setValueAtTime(0.4, ctx.currentTime);
      g1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o1.start(ctx.currentTime);
      o1.stop(ctx.currentTime + 0.3);
      // Shimmer
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine';
      o2.frequency.setValueAtTime(1200, ctx.currentTime + 0.05);
      o2.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.2);
      g2.gain.setValueAtTime(0.15, ctx.currentTime + 0.05);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o2.start(ctx.currentTime + 0.05);
      o2.stop(ctx.currentTime + 0.3);
    });
  }

  // Answer reveal - soft chime
  function reveal() {
    play(ctx => {
      [1046.50, 1318.51].forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        const t = ctx.currentTime + i * 0.12;
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        o.start(t);
        o.stop(t + 0.5);
      });
    });
  }

  // Game over / victory fanfare
  function victory() {
    play(ctx => {
      const melody = [
        {f:523.25, t:0},    {f:523.25, t:0.15},
        {f:523.25, t:0.3},  {f:415.30, t:0.45},
        {f:523.25, t:0.6},  {f:415.30, t:0.75},
        {f:659.25, t:0.9},
      ];
      melody.forEach(({f, t}) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'square';
        o.frequency.setValueAtTime(f, ctx.currentTime + t);
        g.gain.setValueAtTime(0.18, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.18);
        o.start(ctx.currentTime + t);
        o.stop(ctx.currentTime + t + 0.2);
      });
    });
  }

  // Game start - ascending sweep
  function gameStart() {
    play(ctx => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.setValueAtTime(220, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.4);
      g.gain.setValueAtTime(0.25, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.5);
    });
  }

  return { tileClick, correct, wrong, questionOpen, reveal, victory, gameStart };
})();

// ═══════════════════════════════════════════════════════
//  GAME STATE
//  Everything a game needs lives in S, which is plain JSON:
//  autosave, resume and undo are all just copies of S.
// ═══════════════════════════════════════════════════════
const VALUES = [200, 400, 600, 800, 1000];
const TEAM_COLORS = ['#ff5d5d', '#4dabff', '#3ddc84', '#ffb020', '#c77dff', '#2ee6d6'];
const MIN_TEAMS = 2, MAX_TEAMS = 6, NUM_CATS = 6;
const SAVE_KEY = 'jeopardy:save';
const SETUP_KEY = 'jeopardy:setup';
const HISTORY_DEPTH = 50;

let S = null;          // live game, or null on the setup screen
let history = [];      // stack of JSON snapshots of S, taken before each action
let pendingTeam = null; // team picked with a number key, waiting for Enter / Backspace
let adjustToggle = false, shiftHeld = false;
let endArmTimer = null;

function store(key, val) { try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
function load(key) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

function save() { if (S) store(SAVE_KEY, { S, history }); }
function snapshot() {
  history.push(JSON.stringify(S));
  if (history.length > HISTORY_DEPTH) history.shift();
}
function commit() { save(); render(); }

function fmt(n) { return (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString('en-US'); }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function usedCount() { return Object.keys(S.used).length; }
function totalCells() { return S.cats.length * VALUES.length; }
function cellKey(col, row) { return col + '_' + row; }

// ═══════════════════════════════════════════════════════
//  SETUP SCREEN
// ═══════════════════════════════════════════════════════
let setup = {
  count: 2,
  names: ['Team 1', 'Team 2', 'Team 3', 'Team 4', 'Team 5', 'Team 6'],
  penalty: false,
  cats: {}, // {catName: difficulty}, insertion order = column order
};
let activeGroup = 'All';
const GROUPS = ['All', ...Array.from(new Set(Object.values(CAT_GROUP))).sort()];

function loadSetup() {
  const saved = load(SETUP_KEY);
  if (!saved) return;
  if (saved.count >= MIN_TEAMS && saved.count <= MAX_TEAMS) setup.count = saved.count;
  if (Array.isArray(saved.names)) saved.names.slice(0, MAX_TEAMS).forEach((n, i) => { if (typeof n === 'string' && n.trim()) setup.names[i] = n; });
  setup.penalty = !!saved.penalty;
  if (saved.cats && typeof saved.cats === 'object') {
    Object.entries(saved.cats).forEach(([name, diff]) => {
      if (CATEGORIES[name] && CATEGORIES[name][diff] && Object.keys(setup.cats).length < NUM_CATS) setup.cats[name] = diff;
    });
  }
}
function saveSetup() { store(SETUP_KEY, setup); }

function renderTeamSetup() {
  const countRow = document.getElementById('teamCountRow');
  countRow.innerHTML = '';
  for (let n = MIN_TEAMS; n <= MAX_TEAMS; n++) {
    const b = el('button', 'pcount-btn' + (n === setup.count ? ' active' : ''), String(n));
    b.addEventListener('click', () => { setup.count = n; renderTeamSetup(); });
    countRow.appendChild(b);
  }
  const row = document.getElementById('teamsRow');
  row.innerHTML = '';
  for (let i = 0; i < setup.count; i++) {
    const card = el('div', 'player-card active');
    card.style.setProperty('--team', TEAM_COLORS[i]);
    const label = el('label');
    const sw = el('span', 'team-swatch'); sw.style.background = TEAM_COLORS[i];
    label.append(sw, 'TEAM ' + (i + 1));
    const input = el('input');
    input.type = 'text'; input.maxLength = 16; input.value = setup.names[i]; input.id = 'teamName' + i;
    input.addEventListener('input', () => { setup.names[i] = input.value; });
    card.append(label, input);
    row.appendChild(card);
  }
}

function renderRules() {
  document.querySelectorAll('#penaltySeg button').forEach(b => {
    b.classList.toggle('active', (b.dataset.v === 'on') === setup.penalty);
  });
}

function buildCatGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.keys(CATEGORIES).forEach(catName => {
    const item = el('div', 'cat-item');
    item.dataset.cat = catName;
    item.dataset.group = CAT_GROUP[catName] || 'All';
    item.appendChild(el('div', 'cat-name', catName));
    const sel = el('div', 'diff-selector');
    [['easy', 'Easy'], ['medium', 'Med'], ['hard', 'Hard']].forEach(([diff, label]) => {
      const b = el('button', 'diff-btn ' + diff, label);
      b.dataset.cat = catName; b.dataset.diff = diff;
      b.addEventListener('click', e => { e.stopPropagation(); toggleDiff(catName, diff); });
      sel.appendChild(b);
    });
    item.appendChild(sel);
    // clicking anywhere else on the tile picks/removes it at "easy" (or its current difficulty)
    item.addEventListener('click', () => toggleDiff(catName, setup.cats[catName] || 'easy'));
    grid.appendChild(item);
  });
  buildGroupTabs();
  renderCatSelection();
}

function buildGroupTabs() {
  const tabs = document.getElementById('groupTabs');
  tabs.innerHTML = '';
  GROUPS.forEach(g => {
    const b = el('button', 'group-tab' + (g === activeGroup ? ' active' : ''), g);
    b.addEventListener('click', () => { activeGroup = g; renderCatSelection(); });
    tabs.appendChild(b);
  });
}

function toggleDiff(catName, diff) {
  const warn = document.getElementById('catWarn');
  if (setup.cats[catName] === diff) {
    delete setup.cats[catName];
  } else if (setup.cats[catName]) {
    setup.cats[catName] = diff; // change difficulty, keep column position
  } else if (Object.keys(setup.cats).length >= NUM_CATS) {
    warn.classList.remove('show'); void warn.offsetWidth; warn.classList.add('show');
    clearTimeout(toggleDiff._t); toggleDiff._t = setTimeout(() => warn.classList.remove('show'), 2200);
    return;
  } else {
    setup.cats[catName] = diff;
  }
  warn.classList.remove('show');
  renderCatSelection();
}

function removeCat(catName) {
  delete setup.cats[catName];
  renderCatSelection();
}

function randomBoard() {
  const pool = Object.keys(CATEGORIES);
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const diffs = ['easy', 'medium', 'hard'];
  setup.cats = {};
  pool.slice(0, NUM_CATS).forEach(name => { setup.cats[name] = diffs[Math.floor(Math.random() * diffs.length)]; });
  activeGroup = 'All';
  buildGroupTabs();
  renderCatSelection();
}

function grammarBoard() {
  const grammar = Object.keys(CATEGORIES).filter(n => CAT_GROUP[n] === 'Grammar');
  setup.cats = {};
  grammar.slice(0, NUM_CATS).forEach(name => { setup.cats[name] = 'easy'; });
  activeGroup = 'Grammar';
  buildGroupTabs();
  renderCatSelection();
}

function renderCatSelection() {
  const q = (document.getElementById('catSearch').value || '').trim().toLowerCase();
  document.querySelectorAll('#catGrid .cat-item').forEach(item => {
    const chosen = setup.cats[item.dataset.cat];
    item.classList.toggle('selected', !!chosen);
    item.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b.dataset.diff === chosen));
    const matchesGroup = activeGroup === 'All' || item.dataset.group === activeGroup;
    const matchesSearch = !q || item.dataset.cat.toLowerCase().includes(q);
    item.classList.toggle('hidden', !(matchesGroup && matchesSearch));
  });
  document.querySelectorAll('#groupTabs .group-tab').forEach(b => b.classList.toggle('active', b.textContent === activeGroup));
  const c = Object.keys(setup.cats).length;
  document.getElementById('catCountDisplay').textContent = c;
  document.getElementById('startBtn').disabled = c !== NUM_CATS;
  document.getElementById('startHint').textContent = c === NUM_CATS ? '' : `Pick ${NUM_CATS - c} more categor${NUM_CATS - c === 1 ? 'y' : 'ies'}`;
  renderSlots();
}

function renderSlots() {
  const row = document.getElementById('slotsRow');
  row.innerHTML = '';
  const entries = Object.entries(setup.cats);
  for (let i = 0; i < NUM_CATS; i++) {
    const entry = entries[i];
    const slot = el('div', 'slot' + (entry ? ' filled' : ''));
    slot.appendChild(el('span', 'slot-num', String(i + 1)));
    if (entry) {
      const [name, diff] = entry;
      slot.title = name;
      slot.appendChild(el('div', 'cat-name', name.length > 20 ? name.slice(0, 19) + '…' : name));
      slot.appendChild(el('span', 'slot-diff ' + diff, diff));
      const rm = el('button', 'slot-remove', '✕');
      rm.setAttribute('aria-label', 'Remove ' + name);
      rm.addEventListener('click', e => { e.stopPropagation(); removeCat(name); });
      slot.appendChild(rm);
    }
    row.appendChild(slot);
  }
}

function renderResumeBanner() {
  const banner = document.getElementById('resumeBanner');
  const saved = load(SAVE_KEY);
  const g = saved && saved.S;
  if (!g || g.ended || !Array.isArray(g.teams)) { banner.hidden = true; return; }
  const played = Object.keys(g.used || {}).length;
  const total = (g.cats || []).length * VALUES.length;
  document.getElementById('resumeMeta').textContent =
    g.teams.map(t => `${t.name} ${fmt(t.score)}`).join(' · ') + `  —  ${played}/${total} played`;
  banner.hidden = false;
}

// ═══════════════════════════════════════════════════════
//  GAME LIFECYCLE
// ═══════════════════════════════════════════════════════
function newGameState(cfg) {
  const cats = cfg.cats.map(c => ({ name: c.name, diff: c.diff }));
  return {
    v: 1,
    teams: cfg.teams.map((name, i) => ({ name, color: TEAM_COLORS[i], score: 0 })),
    cats,
    // questions are resolved at start and stored, so a saved game never
    // depends on the bank staying the same
    board: cats.map(c => CATEGORIES[c.name][c.diff].slice(0, VALUES.length).map(q => ({ q: q.q, a: q.a }))),
    used: {},
    control: 0,
    penalty: !!cfg.penalty,
    clue: null,
    ended: false,
  };
}

function startGame() {
  if (Object.keys(setup.cats).length !== NUM_CATS) return;
  const teams = [];
  for (let i = 0; i < setup.count; i++) {
    const n = (setup.names[i] || '').trim() || 'Team ' + (i + 1);
    setup.names[i] = n;
    teams.push(n);
  }
  saveSetup();
  S = newGameState({
    teams,
    cats: Object.entries(setup.cats).map(([name, diff]) => ({ name, diff })),
    penalty: setup.penalty,
  });
  history = [];
  pendingTeam = null;
  SFX.gameStart();
  commit();
}

function resumeGame() {
  const saved = load(SAVE_KEY);
  if (!saved || !saved.S) return;
  S = saved.S;
  history = Array.isArray(saved.history) ? saved.history : [];
  pendingTeam = null;
  render();
}

function discardSave() {
  store(SAVE_KEY, null);
  renderResumeBanner();
}

function rematch() {
  if (!S) return;
  S = newGameState({ teams: S.teams.map(t => t.name), cats: S.cats, penalty: S.penalty });
  history = [];
  pendingTeam = null;
  SFX.gameStart();
  commit();
}

function goToSetup() {
  S = null;
  history = [];
  pendingTeam = null;
  store(SAVE_KEY, null);
  loadSetup();
  renderTeamSetup(); renderRules(); renderCatSelection();
  render();
}

function endGame() {
  if (!S || S.ended) return;
  snapshot();
  S.clue = null;
  S.ended = true;
  pendingTeam = null;
  SFX.victory();
  commit();
}

function armEnd() {
  const btn = document.getElementById('endBtn');
  if (btn.classList.contains('armed')) {
    disarmEnd();
    endGame();
    return;
  }
  btn.classList.add('armed');
  btn.textContent = 'Click again to end';
  clearTimeout(endArmTimer);
  endArmTimer = setTimeout(disarmEnd, 3000);
}
function disarmEnd() {
  clearTimeout(endArmTimer);
  const btn = document.getElementById('endBtn');
  btn.classList.remove('armed');
  btn.textContent = 'End game';
}

function undo() {
  if (!history.length) return;
  S = JSON.parse(history.pop());
  pendingTeam = null;
  disarmEnd();
  commit();
}

// ═══════════════════════════════════════════════════════
//  CLUE FLOW
// ═══════════════════════════════════════════════════════
function openClue(col, row, sourceEl) {
  if (!S || S.ended || S.clue || S.used[cellKey(col, row)]) return;
  snapshot();
  S.clue = { col, row, tried: [], winner: null, revealed: false, mark: history.length };
  pendingTeam = null;
  SFX.tileClick();
  SFX.questionOpen();
  if (sourceEl) setClueOrigin(sourceEl);
  commit();
}

// Sets the takeover's transform-origin to the clicked tile's screen position,
// so the clue appears to grow out of the board rather than just fading in.
function setClueOrigin(tile) {
  const r = tile.getBoundingClientRect();
  const ox = ((r.left + r.width / 2) / window.innerWidth) * 100;
  const oy = ((r.top + r.height / 2) / window.innerHeight) * 100;
  const modal = document.querySelector('.modal');
  if (modal) modal.style.transformOrigin = `${ox}% ${oy}%`;
}

function clueValue() { return VALUES[S.clue.row]; }
function canCancel() { const c = S.clue; return !!c && !c.revealed && c.winner === null && c.tried.length === 0; }

function markCorrect(t) {
  const c = S && S.clue;
  if (!c || c.winner !== null || c.tried.includes(t) || !S.teams[t]) return;
  snapshot();
  S.teams[t].score += clueValue();
  c.winner = t;
  c.revealed = true;
  S.control = t; // whoever answers correctly picks next
  pendingTeam = null;
  SFX.correct();
  flashFeedback('CORRECT!', true);
  commit();
}

function markWrong(t) {
  const c = S && S.clue;
  if (!c || c.winner !== null || c.tried.includes(t) || !S.teams[t]) return;
  snapshot();
  if (S.penalty) S.teams[t].score -= clueValue();
  c.tried.push(t);
  pendingTeam = null;
  SFX.wrong();
  flashFeedback(S.penalty ? '−' + fmt(clueValue()) : 'WRONG!', false);
  commit();
}

function revealAnswer() {
  if (!S || !S.clue || S.clue.revealed) return;
  S.clue.revealed = true;
  SFX.reveal();
  commit();
}

// Close without spending the tile: only while nothing has happened on it.
function cancelClue() {
  if (!canCancel()) return;
  const mark = S.clue.mark;
  S.clue = null;
  pendingTeam = null;
  // drop the snapshot taken on open, so undo doesn't replay a no-op
  if (history.length === mark) history.pop();
  commit();
}

// Close and spend the tile. Control stays put unless someone answered correctly.
function doneClue() {
  if (!S || !S.clue) return;
  snapshot();
  S.used[cellKey(S.clue.col, S.clue.row)] = true;
  S.clue = null;
  pendingTeam = null;
  if (usedCount() >= totalCells()) {
    S.ended = true;
    SFX.victory();
  }
  commit();
}

function setControl(t) {
  if (!S || S.clue || S.ended || S.control === t || !S.teams[t]) return;
  snapshot();
  S.control = t;
  commit();
}

function adjustScore(t, delta) {
  if (!S || !S.teams[t]) return;
  snapshot();
  S.teams[t].score += delta;
  commit();
}

function flashFeedback(msg, correct) {
  const f = document.getElementById('feedbackFlash');
  f.textContent = msg;
  f.className = 'feedback-flash ' + (correct ? 'correct-flash' : 'wrong-flash');
  setTimeout(() => f.classList.add('show'), 10);
  setTimeout(() => f.classList.remove('show'), 900);
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
}

function render() {
  document.body.classList.toggle('adjusting', adjustToggle || shiftHeld);
  if (!S) {
    showScreen('startScreen');
    document.getElementById('modalOverlay').classList.remove('open');
    renderResumeBanner();
    return;
  }
  if (S.ended) {
    showScreen('endScreen');
    document.getElementById('modalOverlay').classList.remove('open');
    renderEnd();
    return;
  }
  showScreen('boardScreen');
  renderBoard();
  renderScoreboard();
  renderTeacherBar();
  renderModal();
}

function renderBoard() {
  const board = document.getElementById('board');
  board.style.gridTemplateColumns = `repeat(${S.cats.length}, 1fr)`;
  board.innerHTML = '';
  S.cats.forEach(cat => board.appendChild(el('div', 'cat-header', cat.name.toUpperCase())));
  for (let row = 0; row < VALUES.length; row++) {
    S.cats.forEach((cat, col) => {
      const used = !!S.used[cellKey(col, row)];
      const cell = el('button', 'cell' + (used ? ' used' : ''));
      cell.dataset.col = col; cell.dataset.row = row;
      cell.setAttribute('aria-label', `${cat.name} for ${VALUES[row]}`);
      if (used) cell.tabIndex = -1;
      cell.appendChild(el('span', 'val', fmt(VALUES[row])));
      cell.addEventListener('click', e => openClue(col, row, e.currentTarget));
      board.appendChild(cell);
    });
  }
}

let lastScores = null;
function renderScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  S.teams.forEach((t, i) => {
    const cell = el('div', 'score-cell' + (i === S.control ? ' current-turn' : ''));
    cell.id = 'scell_' + i;
    cell.style.setProperty('--team', t.color);
    cell.title = 'Click to give this team control';
    const name = el('div', 'p-name', t.name);
    if (i === S.control) name.appendChild(el('span', 'pick-tag', 'PICKING'));
    const scoreChanged = lastScores && lastScores[i] !== undefined && lastScores[i] !== t.score;
    const score = el('div', 'p-score' + (t.score < 0 ? ' negative' : '') + (scoreChanged ? ' bump' : ''), fmt(t.score));
    const adj = el('div', 'adj');
    [[-100, '−100'], [100, '+100']].forEach(([d, label]) => {
      const b = el('button', null, label);
      b.addEventListener('click', e => { e.stopPropagation(); adjustScore(i, d); });
      adj.appendChild(b);
    });
    cell.append(name, score, adj);
    cell.addEventListener('click', () => setControl(i));
    sb.appendChild(cell);
  });
  lastScores = S.teams.map(t => t.score);
}

function renderTeacherBar() {
  document.getElementById('tbStatus').textContent = `${usedCount()} / ${totalCells()} played`;
  document.getElementById('undoBtn').disabled = history.length === 0;
  document.getElementById('adjustBtn').classList.toggle('on', adjustToggle);
}

function renderModal() {
  const overlay = document.getElementById('modalOverlay');
  const c = S.clue;
  if (!c) { overlay.classList.remove('open'); return; }
  const cat = S.cats[c.col];
  const q = S.board[c.col][c.row];
  document.getElementById('modalCat').textContent = cat.name.toUpperCase() + ' — ' + cat.diff.toUpperCase();
  document.getElementById('modalVal').textContent = fmt(VALUES[c.row]);
  document.getElementById('modalClue').textContent = q.q;

  const ans = document.getElementById('answerReveal');
  ans.textContent = c.revealed ? '✓ ' + q.a : '';
  ans.style.display = c.revealed ? 'block' : 'none';
  document.getElementById('revealBtn').style.display = c.revealed ? 'none' : '';
  document.getElementById('backBtn').hidden = !canCancel();

  const buzzRow = document.getElementById('buzzRow');
  buzzRow.innerHTML = '';
  buzzRow.style.gridTemplateColumns = S.teams.length > 3 ? '1fr 1fr' : '1fr';
  S.teams.forEach((t, i) => {
    const tried = c.tried.includes(i), won = c.winner === i;
    const locked = c.winner !== null || tried;
    const card = el('div', 'buzz-card' + (tried ? ' tried' : '') + (won ? ' winner' : '') + (pendingTeam === i ? ' pending' : ''));
    card.style.setProperty('--team', t.color);
    const nameWrap = el('div');
    nameWrap.append(el('span', 'buzz-key', String(i + 1)), el('span', 'buzz-name', t.name));
    const btns = el('div', 'buzz-btns');
    const ok = el('button', 'buzz-btn correct', '✓'); ok.disabled = locked;
    const no = el('button', 'buzz-btn wrong', '✗'); no.disabled = locked;
    ok.addEventListener('click', e => { e.stopPropagation(); markCorrect(i); });
    no.addEventListener('click', e => { e.stopPropagation(); markWrong(i); });
    btns.append(ok, no);
    card.append(nameWrap, btns);
    card.addEventListener('click', () => { if (!locked) { pendingTeam = i; renderModal(); } });
    buzzRow.appendChild(card);
  });

  if (!overlay.classList.contains('open')) {
    overlay.classList.add('open', 'animating');
    setTimeout(() => overlay.classList.remove('animating'), 450);
  }
}

function renderEnd() {
  const ranked = S.teams.map(t => ({ name: t.name, score: t.score, color: t.color }))
    .sort((a, b) => b.score - a.score);
  // competition ranking: ties share a place (1, 1, 3)
  ranked.forEach((t, i) => { t.place = i > 0 && t.score === ranked[i - 1].score ? ranked[i - 1].place : i + 1; });
  // winner in the middle, then alternate outwards
  const arranged = [];
  ranked.forEach((t, i) => (i % 2 === 0 ? arranged.push(t) : arranged.unshift(t)));

  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const bars = { 1: 'first', 2: 'second', 3: 'third' };
  const podium = document.getElementById('podium');
  podium.innerHTML = '';
  arranged.forEach(t => {
    const block = el('div', 'podium-block');
    block.dataset.place = t.place;
    block.append(
      el('div', 'medal', medals[t.place] || ordinal(t.place)),
      el('div', 'podium-name', t.name),
      el('div', 'podium-score', fmt(t.score)),
    );
    const bar = el('div', 'podium-bar ' + (bars[t.place] || 'fourth'));
    bar.style.borderTopColor = t.color;
    block.appendChild(bar);
    podium.appendChild(block);
  });
  const winners = ranked.filter(t => t.place === 1);
  launchConfetti(winners.map(t => t.color));
}
function ordinal(n) { return n + 'th'; } // only used for places 4–6

function launchConfetti(colors) {
  const layer = document.getElementById('confettiLayer');
  if (!layer) return;
  layer.innerHTML = '';
  const palette = colors && colors.length ? colors : TEAM_COLORS;
  const count = 70;
  for (let i = 0; i < count; i++) {
    const p = el('div', 'confetti-piece');
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = palette[i % palette.length];
    p.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.transform = `rotate(${Math.random() * 360}deg)`;
    layer.appendChild(p);
  }
  clearTimeout(launchConfetti._t);
  launchConfetti._t = setTimeout(() => { layer.innerHTML = ''; }, 4500);
}

// ═══════════════════════════════════════════════════════
//  KEYBOARD
//  In a clue: 1–6 pick a team, Enter = correct (or Done if no team picked),
//  Backspace = wrong, Space = reveal, Esc = back / done.
//  Teacher shortcuts behind Shift: Shift+U undo, Shift+E end (twice).
//  Holding Shift shows the ± score controls.
// ═══════════════════════════════════════════════════════
function onKeyDown(e) {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

  if (e.key === 'Shift') { if (!shiftHeld) { shiftHeld = true; document.body.classList.add('adjusting'); } return; }
  if (e.shiftKey && e.code === 'KeyU') { e.preventDefault(); undo(); return; }
  if (e.shiftKey && e.code === 'KeyE') { e.preventDefault(); if (S && !S.ended) armEnd(); return; }
  if (!S || S.ended || !S.clue) return;

  const c = S.clue;
  if (/^[1-6]$/.test(e.key) && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const t = +e.key - 1;
    if (S.teams[t] && c.winner === null && !c.tried.includes(t)) { pendingTeam = t; renderModal(); }
    e.preventDefault();
  } else if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault(); revealAnswer();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (pendingTeam !== null && c.winner === null) markCorrect(pendingTeam); else doneClue();
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    if (pendingTeam !== null) markWrong(pendingTeam);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    if (pendingTeam !== null) { pendingTeam = null; renderModal(); }
    else if (canCancel()) cancelClue();
    else doneClue();
  }
}
function onKeyUp(e) {
  if (e.key === 'Shift') { shiftHeld = false; document.body.classList.toggle('adjusting', adjustToggle); }
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
// ═══════════════════════════════════════════════════════
//  THEME (shared hub convention: localStorage 'arschul:theme')
// ═══════════════════════════════════════════════════════
const THEME_KEY = 'arschul:theme';
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {} // raw string, matching the hub's leaf script
}

function init() {
  loadSetup();
  renderTeamSetup();
  renderRules();
  buildCatGrid();

  document.querySelectorAll('#penaltySeg button').forEach(b =>
    b.addEventListener('click', () => { setup.penalty = b.dataset.v === 'on'; renderRules(); }));
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('resumeBtn').addEventListener('click', resumeGame);
  document.getElementById('discardBtn').addEventListener('click', discardSave);
  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('adjustBtn').addEventListener('click', () => { adjustToggle = !adjustToggle; render(); });
  document.getElementById('endBtn').addEventListener('click', armEnd);
  document.getElementById('revealBtn').addEventListener('click', revealAnswer);
  document.getElementById('backBtn').addEventListener('click', cancelClue);
  document.getElementById('doneBtn').addEventListener('click', doneClue);
  document.getElementById('rematchBtn').addEventListener('click', rematch);
  document.getElementById('newGameBtn').addEventListener('click', goToSetup);
  document.getElementById('catSearch').addEventListener('input', renderCatSelection);
  document.getElementById('randomBoardBtn').addEventListener('click', randomBoard);
  document.getElementById('grammarBoardBtn').addEventListener('click', grammarBoard);
  ['themeToggle', 'themeToggle2', 'themeToggle3'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.addEventListener('click', toggleTheme);
  });
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);
  window.addEventListener('blur', () => { shiftHeld = false; document.body.classList.toggle('adjusting', adjustToggle); });

  render();
}
init();
</script>
