<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter Swap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root, html[data-theme="dark"]{
  --bg:#1b2026; --surface:#242a32; --surface-2:#2d353f; --line:#3a4450;
  --text:#eef0f2; --muted:#8e9aa6;
  --wood:#dcb680; --wood-2:#c99d62; --wood-edge:#8f6634; --ink:#2b1d0f;
  --team-0:#f07d5e; --team-1:#45b5c4;
  --good:#6cc070; --bad:#e5484d;
  --shadow:0 6px 0 var(--wood-edge), 0 10px 22px rgba(0,0,0,.45);
}
html[data-theme="light"]{
  --bg:#dfe3e6; --surface:#f4f6f7; --surface-2:#e8ecef; --line:#c3cad0;
  --text:#1d242b; --muted:#5b6670;
  --wood:#e2bd86; --wood-2:#cfa367; --wood-edge:#9a6f3a; --ink:#2b1d0f;
  --team-0:#c9502f; --team-1:#1f8796;
  --good:#2f8a3a; --bad:#c7353a;
  --shadow:0 6px 0 var(--wood-edge), 0 10px 18px rgba(40,50,60,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;font-size:17px;line-height:1.5;
  display:flex;flex-direction:column;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--team-1);outline-offset:2px}
.hidden{display:none!important}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px}
.back-link{white-space:nowrap;color:var(--muted);text-decoration:none;font-weight:500;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:15px}
.back-link:hover{color:var(--text)}
.brand{font-family:"Alfa Slab One",serif;font-size:22px;letter-spacing:.02em;margin-left:6px}
.topbar .spacer{flex:1}
.round-info{color:var(--muted);font-size:15px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);font-size:18px;display:grid;place-items:center}
.icon-btn:hover{background:var(--surface)}

/* setup */
.setup{max-width:620px;width:100%;margin:24px auto;padding:0 20px}
.setup h1{font-family:"Alfa Slab One",serif;font-size:clamp(40px,7vw,64px);line-height:1.05;font-weight:400}
.setup .demo{display:flex;gap:8px;margin:22px 0 10px}
.setup .demo .tile{width:58px;height:66px;font-size:34px}
.setup .lede{color:var(--muted);max-width:52ch;margin-bottom:24px}
.field{margin-bottom:18px}
.field > label, .field > .flabel{display:block;font-weight:700;margin-bottom:8px}
.teams-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams-row input{width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font:inherit;color:var(--text)}
.teams-row input:nth-child(1){border-left:8px solid var(--team-0)}
.teams-row input:nth-child(2){border-left:8px solid var(--team-1)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.goal-row{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{padding:14px 26px;border-radius:12px;font-weight:700;font-size:18px;border:2px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--wood);border-color:var(--wood-edge);color:var(--ink);box-shadow:0 4px 0 var(--wood-edge)}
.btn.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-edge)}
.dict-note{color:var(--muted);font-size:14px;margin-top:14px}

/* game */
.game{flex:1;display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,3fr) minmax(150px,1fr);gap:18px;padding:6px 20px 16px;align-items:start}
.team{border-radius:16px;background:var(--surface);padding:18px 16px;text-align:center;border:3px solid transparent;transition:border-color .2s, opacity .2s;margin-top:40px}
.team .tname{font-weight:700;font-size:20px;overflow-wrap:anywhere}
.team .tscore{font-family:"Alfa Slab One",serif;font-size:clamp(48px,6vw,84px);line-height:1.1}
.team[data-i="0"] .tscore{color:var(--team-0)}
.team[data-i="1"] .tscore{color:var(--team-1)}
.team .tturn{font-size:14px;color:var(--muted);min-height:1.5em}
.team.active[data-i="0"]{border-color:var(--team-0)}
.team.active[data-i="1"]{border-color:var(--team-1)}
.team:not(.active){opacity:.6}
.team.bump .tscore{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.3)}}

.stage{display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.trail{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;min-height:30px;color:var(--muted);font-weight:500;max-width:100%}
.trail span{white-space:nowrap}
.trail .sep{opacity:.5}
.trail .t0{color:var(--team-0)} .trail .t1{color:var(--team-1)}

.timer{width:min(560px,100%);display:flex;align-items:center;gap:12px}
.timer .bar{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.timer .fill{height:100%;width:100%;background:var(--team-0);transform-origin:left;transition:transform .25s linear}
.timer .secs{font-family:"Alfa Slab One",serif;font-size:30px;min-width:2.2ch;text-align:right}
.timer.low .secs{color:var(--bad)}
.timer.off{visibility:hidden}

.word{display:flex;gap:clamp(10px,1.6vw,18px);margin:10px 0 6px;perspective:600px}
.tile{width:clamp(76px,11vw,130px);height:clamp(88px,12.8vw,150px);border-radius:12px;
  background:repeating-linear-gradient(94deg,rgba(0,0,0,0) 0 7px,rgba(120,70,20,.07) 7px 9px,rgba(0,0,0,0) 9px 16px),
             linear-gradient(180deg,var(--wood),var(--wood-2));
  color:var(--ink);font-family:"Alfa Slab One",serif;font-size:clamp(48px,7.4vw,92px);line-height:1;
  display:grid;place-items:center;box-shadow:var(--shadow);position:relative;user-select:none;
  transition:transform .15s ease, box-shadow .15s ease}
button.tile:hover{transform:translateY(-3px)}
.tile.sel{transform:translateY(-12px);box-shadow:0 6px 0 var(--wood-edge),0 0 0 5px var(--turn-color),0 18px 26px rgba(0,0,0,.4)}
.tile.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.word.bad .tile{background:linear-gradient(180deg,#bfb6ab,#a39a8f);color:#4a3f36}
.word.bad .tile.changed{color:var(--bad)}
.word.bad{animation:shake .45s ease}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.word.hint .tile{animation:nudge .5s ease}
@keyframes nudge{50%{transform:translateY(-8px)}}
.word.deal .tile{animation:deal .45s ease both}
.word.deal .tile:nth-child(2){animation-delay:.06s}.word.deal .tile:nth-child(3){animation-delay:.12s}.word.deal .tile:nth-child(4){animation-delay:.18s}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-6deg)}}

.msg{min-height:1.6em;font-size:clamp(17px,1.6vw,22px);font-weight:500;text-align:center}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}

.kbd{display:flex;flex-direction:column;gap:8px;width:min(760px,100%);margin-top:4px}
.krow{display:flex;justify-content:center;gap:6px}
.key{flex:1 1 0;max-width:62px;height:clamp(48px,6vw,62px);border-radius:10px;background:var(--surface);border:1px solid var(--line);
  font-weight:700;font-size:clamp(18px,2vw,24px);box-shadow:0 3px 0 var(--line)}
.key:hover{background:var(--surface-2)}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key:disabled{opacity:.3;cursor:default}
.kbd.locked .key{opacity:.35;pointer-events:none}

.teacher{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.tbtn{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:15px;font-weight:500;color:var(--muted)}
.tbtn:hover{color:var(--text);background:var(--surface)}
.tbtn:disabled{opacity:.35;cursor:default;background:none}
.tbtn.override{color:var(--text);border-color:var(--text)}

.overlay{position:fixed;inset:0;background:rgba(10,12,15,.72);display:grid;place-items:center;z-index:20}
.overlay .card{background:var(--surface);border-radius:18px;padding:32px 36px;text-align:center;max-width:520px;width:calc(100% - 40px)}
.overlay h2{font-family:"Alfa Slab One",serif;font-weight:400;font-size:40px;margin-bottom:8px}
.overlay p{color:var(--muted);margin-bottom:18px}
.final{display:flex;justify-content:center;gap:28px;margin:12px 0 20px}
.final div{font-weight:700}
.final b{display:block;font-family:"Alfa Slab One",serif;font-weight:400;font-size:56px;line-height:1.1}
.final .f0 b{color:var(--team-0)} .final .f1 b{color:var(--team-1)}
.overlay .actions{justify-content:center}

@media (max-width:820px){
  .game{grid-template-columns:1fr 1fr}
  .stage{grid-column:1 / -1;grid-row:2}
  .team{margin-top:0;padding:10px}
  .team .tscore{font-size:44px}
  .brand,.round-info{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <a class="back-link" href="../">&#8592; Game Hub</a>
  <span class="brand">Letter Swap</span>
  <span class="spacer"></span>
  <span class="round-info" id="roundInfo"></span>
  <button class="icon-btn hidden" id="pauseBtn" title="Pause (Space)" aria-label="Pause">&#10074;&#10074;</button>
  <button class="icon-btn" id="soundBtn" title="Sound" aria-label="Sound on">&#128266;</button>
  <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Theme" aria-label="Theme">&#127769;</button>
</header>

<!-- SETUP -->
<main class="setup" id="setup">
  <h1>Letter Swap</h1>
  <div class="demo" aria-hidden="true">
    <div class="tile">L</div><div class="tile">A</div><div class="tile">T</div><div class="tile">E</div>
  </div>
  <p class="lede">Change one letter to make a new word. Late, lame, came, same&hellip; Every real word scores a point. Run out of time or miss, and a new word comes in.</p>

  <div class="field">
    <span class="flabel">Teams</span>
    <div class="teams-row">
      <input id="name0" maxlength="18" value="Team 1" aria-label="First team name">
      <input id="name1" maxlength="18" value="Team 2" aria-label="Second team name">
    </div>
  </div>
  <div class="field">
    <span class="flabel">Time per turn</span>
    <div class="chips" id="timerChips"></div>
  </div>
  <div class="field">
    <span class="flabel">Game ends</span>
    <div class="goal-row">
      <div class="chips" id="modeChips"></div>
      <div class="chips" id="goalChips"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn primary" id="startBtn">Start game</button>
    <button class="btn hidden" id="resumeBtn">Resume game</button>
  </div>
  <p class="dict-note" id="dictNote"></p>
</main>

<!-- GAME -->
<main class="game hidden" id="game">
  <section class="team" data-i="0" id="team0"><div class="tname"></div><div class="tscore">0</div><div class="tturn"></div></section>
  <section class="stage">
    <div class="trail" id="trail" aria-label="Words so far"></div>
    <div class="timer" id="timer"><div class="bar"><div class="fill" id="timerFill"></div></div><div class="secs" id="timerSecs">15</div></div>
    <div class="word" id="word" role="group" aria-label="Current word"></div>
    <div class="msg" id="msg" aria-live="polite"></div>
    <div class="kbd" id="kbd"></div>
    <div class="teacher">
      <button class="tbtn" id="undoBtn" disabled>Undo</button>
      <button class="tbtn hidden override" id="overrideBtn"></button>
      <button class="tbtn" id="skipBtn">New word</button>
      <button class="tbtn" id="endBtn">End game</button>
    </div>
  </section>
  <section class="team" data-i="1" id="team1"><div class="tname"></div><div class="tscore">0</div><div class="tturn"></div></section>
</main>

<div class="overlay hidden" id="pauseOv"><div class="card"><h2>Paused</h2><p>Press Space or the button to continue.</p><div class="actions"><button class="btn primary" id="resumePlay">Continue</button></div></div></div>
<div class="overlay hidden" id="endOv"><div class="card"><h2 id="endTitle"></h2><div class="final" id="finalScores"></div><p id="endStats"></p>
  <div class="actions"><button class="btn primary" id="againBtn">Play again</button><button class="btn" id="setupBtn">Change setup</button></div></div></div>

<script>
"use strict";
/* ═════ DATA ═════ */
const START_WORDS = ["LATE", "BAKE", "CAKE", "COLD", "BOLD", "HOLD", "GOLD", "MAKE", "TAKE", "LAKE", "LANE", "CANE", "NAME", "GAME", "CAME", "SAME", "TIME", "LINE", "FINE", "MINE", "PINE", "WINE", "BIKE", "LIKE", "HIKE", "HATE", "GATE", "RATE", "MATE", "DATE", "HAND", "BAND", "LAND", "SAND", "WIND", "MIND", "KIND", "FIND", "BELL", "TELL", "WELL", "SELL", "FELL", "HILL", "FILL", "MILL", "PILL", "WALL", "BALL", "CALL", "FALL", "HALL", "TALL", "BOOK", "LOOK", "COOK", "HOOK", "TOOK", "FOOT", "BOOT", "COAT", "BOAT", "GOAT", "MEAT", "HEAT", "SEAT", "BEAT", "NEAT", "FEET", "MEET", "BEST", "NEST", "REST", "TEST", "WEST", "LOST", "COST", "MOST", "POST", "DUST", "MUST", "RUST", "JUST", "FAST", "LAST", "PAST", "CART", "PART", "DART", "HARD", "CARD", "YARD", "WORD", "WORK", "FORK", "SHIP", "SHOP", "SLIP", "TRIP", "GRIP", "CHIP", "WISH", "DISH", "RING", "KING", "WING", "SONG", "LONG", "BONE", "CONE", "TONE", "HOME", "HOPE", "ROPE", "NOTE", "VOTE", "NOSE", "ROSE", "CASE", "BASE", "RACE", "FACE", "PACE", "MICE", "NICE", "RICE", "LOVE", "MOVE", "WAVE", "CAVE", "SAVE", "GAVE", "FIRE", "HIRE", "WIRE", "TIRE", "CORE", "MORE", "SORE", "WORE", "CURE", "PURE", "SURE", "BATH", "PATH", "MATH", "HEAD", "READ", "LEAD", "LOAD", "ROAD", "FOOD", "MOOD", "GOOD", "WOOD", "RAIN", "PAIN", "GAIN", "MAIN", "TAIL", "MAIL", "SAIL", "NAIL", "FAIL", "BEAR", "DEAR", "FEAR", "HEAR", "NEAR", "WEAR", "YEAR", "PEAR", "BEAN", "LEAN", "MEAN", "BELT", "MELT", "FELT", "PICK", "SICK", "KICK", "LUCK", "DUCK", "BACK", "PACK", "LOCK", "SOCK", "ROCK", "PINK", "SINK", "LINK", "MILK", "FARM", "WARM", "FOLD", "SOLD", "TOLD", "CUTE", "JUMP", "BUMP", "PUMP", "CAMP", "LAMP", "TENT", "RENT", "SENT", "BENT", "WENT"];
// Valid in shared/wordlist.js but not wanted one tap away in class.
const BLOCKED = new Set(["ANUS", "ARSE", "BOOB", "COCK", "COON", "CRAP", "CUNT", "DAGO", "DICK", "DYKE", "FAGS", "FUCK", "GOOK", "HOES", "HOMO", "KIKE", "MUFF", "NUDE", "PISS", "POOF", "PORN", "RAPE", "SEXY", "SHAG", "SHIT", "SLAG", "SLUT", "SMUT", "SPIC", "TITS", "TURD", "TWAT", "WANK", "WOPS"]);
const ALPHA = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ROWS = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
const TIMERS = [10,15,20,30,0];
const GOALS = {points:[5,10,15,20], rounds:[5,10,15,20]};
const STATE_KEY = "letterswap:state", SET_KEY = "letterswap:settings";

/* ═════ STORAGE ═════ */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

/* ═════ THEME fallback (leaf.v1.js replaces this when it loads) ═════ */
window.toggleTheme = function(){
  const cur = document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", cur);
  try{ localStorage.setItem("arschul:theme", cur); }catch(e){}
};

/* ═════ WORD LIST ═════ */
let WORDS = null;
function wordSet(){
  if (WORDS) return WORDS;
  const raw = window.WORDLIST;
  if (typeof raw === "string" && raw.length > 1000){
    WORDS = new Set(raw.split("\n").map(w=>w.trim()).filter(w=>w.length===4));
  }
  return WORDS;
}
async function inDictionary(w){
  const s = wordSet();
  if (s) return s.has(w);
  try{ return (await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+w.toLowerCase())).ok; }
  catch(e){ return false; }
}

/* ═════ SOUND ═════ */
let AC = null, soundOn = true;
function tone(freq, dur, type="sine", vol=.15, when=0){
  if (!soundOn) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const SFX = {
  clack(){ tone(180,.06,"square",.08); tone(90,.08,"triangle",.1,.01); },
  good(){ tone(660,.12,"triangle"); tone(880,.18,"triangle",.15,.1); },
  bad(){ tone(200,.25,"sawtooth",.1); tone(150,.3,"sawtooth",.1,.12); },
  tick(){ tone(1000,.05,"square",.06); },
  deal(){ [0,.06,.12,.18].forEach(d=>tone(140,.05,"square",.06,d)); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.14,i*.12)); }
};

/* ═════ STATE ═════ */
let settings = Object.assign({names:["Team 1","Team 2"], timer:15, mode:"points", goal:10, sound:true}, store.get(SET_KEY)||{});
soundOn = settings.sound !== false;
let G = null;          // serializable game state
let undoStack = [];    // snapshots of G
let sel = -1, busy = false, paused = false, timeLeft = 0, tickHandle = null, pendingTimer = null;

function snapshot(){ return JSON.parse(JSON.stringify(G)); }
function save(){ if (G) store.set(STATE_KEY, {G, undoStack: undoStack.slice(-20)}); }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function newDeck(){
  const s = wordSet();
  return shuffle(START_WORDS.filter(w => !s || s.has(w)));
}
function drawWord(){
  if (G.deckPos >= G.deck.length){ G.deck = newDeck(); G.deckPos = 0; }
  return G.deck[G.deckPos++];
}
function isValidLocal(w){ return !BLOCKED.has(w) && !G.rejected.includes(w); }
function neighbors(w){
  const s = wordSet(); if (!s) return null;
  const out = [];
  for (let i=0;i<4;i++) for (const c of ALPHA){
    if (c===w[i]) continue;
    const n = w.slice(0,i)+c+w.slice(i+1);
    if ((s.has(n)||G.accepted.includes(n)) && isValidLocal(n) && !G.chain.includes(n)) out.push(n);
  }
  return out;
}

function newGame(){
  G = {
    names:[...settings.names], scores:[0,0], turn:0, turns:0,
    timer:settings.timer, mode:settings.mode, goal:settings.goal,
    deck:newDeck(), deckPos:0, word:null, chain:[], chainBy:[],
    accepted:[], rejected:[], longest:1, last:null, over:false
  };
  G.word = drawWord(); G.chain = [G.word]; G.chainBy = [-1];
  undoStack = [];
  showGame(); render(true); SFX.deal(); startTurn();
}

/* ═════ TURN FLOW ═════ */
function startTurn(keepMsg){
  sel = -1; busy = false;
  timeLeft = G.timer;
  render(false, keepMsg);
  save();
  stopTimer();
  if (G.timer > 0 && !paused) tickHandle = setInterval(onTick, 1000);
}
function stopTimer(){ clearInterval(tickHandle); tickHandle = null; }
function onTick(){
  if (paused || busy) return;
  timeLeft--;
  if (timeLeft <= 5 && timeLeft > 0) SFX.tick();
  renderTimer();
  if (timeLeft <= 0){ stopTimer(); fail(null, "Time's up. No point."); }
}

function selectTile(i){
  if (busy || paused || G.over) return;
  sel = (sel === i) ? -1 : i;
  SFX.clack(); renderWord(); renderKeys();
}

async function playLetter(L){
  if (busy || paused || G.over) return;
  if (sel < 0){
    const w = $("word"); w.classList.remove("hint"); void w.offsetWidth; w.classList.add("hint");
    setMsg("Tap a letter box first.", ""); return;
  }
  if (G.word[sel] === L) return;
  const cand = G.word.slice(0,sel) + L + G.word.slice(sel+1);
  SFX.clack();
  busy = true;
  const before = snapshot();
  let ok, reason;
  if (G.chain.includes(cand)){ ok = false; reason = `${cand} was already used.`; }
  else if (!isValidLocal(cand)){ ok = false; reason = `${cand} isn't allowed.`; }
  else if (G.accepted.includes(cand)){ ok = true; }
  else {
    if (!wordSet()) setMsg("Checking\u2026", "");
    ok = await inDictionary(cand);
    reason = `${cand} isn't in the word list.`;
  }
  undoStack.push(before);
  if (ok) succeed(cand, sel); else fail(cand, reason + " No point.", sel);
}

function succeed(w, idx){
  stopTimer();
  const t = G.turn;
  G.scores[t]++;
  G.chain.push(w); G.chainBy.push(t);
  G.longest = Math.max(G.longest, G.chain.length);
  G.word = w; G.turns++;
  G.last = {type:"valid", word:w, team:t};
  SFX.good();
  sel = -1;
  render();
  flipTile(idx);
  bump(t);
  setMsg(`${w}! Point to ${G.names[t]}.`, "good");
  if (checkEnd()) return;
  G.turn = 1 - t;
  const n = neighbors(w);
  if (n && n.length === 0){
    busy = true; save();
    pendingTimer = setTimeout(()=>dealNew(`No words left from ${w}. New word, no penalty.`), 1300);
    return;
  }
  startTurn(true);
}

function fail(w, text, idx){
  stopTimer();
  const t = G.turn;
  G.turns++;
  G.last = {type:"fail", word:w, team:t};
  SFX.bad();
  busy = true;
  sel = -1;
  if (w){ renderWord(w, idx); }
  const el = $("word"); el.classList.remove("bad"); void el.offsetWidth;
  el.classList.add("bad");
  setMsg(text, "bad");
  renderTeacher();
  if (checkEnd(true)) return;
  G.turn = 1 - t;
  save();
  pendingTimer = setTimeout(dealNew, 1600);
}

function dealNew(note){
  pendingTimer = null;
  G.word = drawWord(); G.chain = [G.word]; G.chainBy = [-1];
  $("word").classList.remove("bad");
  render(true); SFX.deal();
  startTurn(!!note);
  if (note) setMsg(note, "");
}

function checkEnd(afterFail){
  const done = G.mode === "points" ? Math.max(...G.scores) >= G.goal : G.turns >= G.goal*2;
  if (!done) return false;
  G.over = true; stopTimer(); busy = true; save();
  pendingTimer = setTimeout(showEnd, afterFail ? 1400 : 900);
  return true;
}

/* ═════ TEACHER CONTROLS ═════ */
function clearPending(){ if (pendingTimer){ clearTimeout(pendingTimer); pendingTimer = null; } }
function undo(){
  if (!undoStack.length) return;
  clearPending(); stopTimer();
  G = undoStack.pop();
  $("word").classList.remove("bad");
  hideEnd();
  setMsg("Undone.", "");
  startTurn();
}
function override(){
  if (!G.last || !undoStack.length) return;
  const last = G.last;
  clearPending(); stopTimer(); hideEnd();
  G = undoStack.pop();
  $("word").classList.remove("bad");
  const idx = diffIndex(G.word, last.word);
  undoStack.push(snapshot());
  if (last.type === "fail"){
    if (!G.accepted.includes(last.word)) G.accepted.push(last.word);
    G.rejected = G.rejected.filter(x=>x!==last.word);
    succeed(last.word, idx);
    if (!G.over) setMsg(`${last.word} accepted. Point to ${G.names[last.team]}.`, "good");
  } else {
    if (!G.rejected.includes(last.word)) G.rejected.push(last.word);
    G.accepted = G.accepted.filter(x=>x!==last.word);
    fail(last.word, `${last.word} rejected by the teacher. No point.`, idx);
  }
}
function diffIndex(a,b){ if(!a||!b) return -1; for(let i=0;i<4;i++) if(a[i]!==b[i]) return i; return -1; }
function skipWord(){
  if (G.over) return;
  clearPending(); stopTimer();
  undoStack.push(snapshot());
  G.last = null;
  setMsg("New word.", "");
  dealNew();
}
function setPaused(p){
  if (!G || G.over) return;
  paused = p;
  $("pauseOv").classList.toggle("hidden", !p);
  if (p){ stopTimer(); }
  else if (!busy && G.timer > 0){ stopTimer(); tickHandle = setInterval(onTick, 1000); }
}

/* ═════ RENDER ═════ */
const $ = id => document.getElementById(id);
function setMsg(t, cls){ const m=$("msg"); m.textContent=t; m.className="msg "+(cls||""); }
function teamColor(i){ return `var(--team-${i})`; }

function render(deal, keepMsg){
  document.documentElement.style.setProperty("--turn-color", teamColor(G.turn));
  [0,1].forEach(i=>{
    const el = $("team"+i);
    el.querySelector(".tname").textContent = G.names[i];
    el.querySelector(".tscore").textContent = G.scores[i];
    el.classList.toggle("active", G.turn===i && !G.over);
    el.querySelector(".tturn").textContent = (G.turn===i && !G.over) ? "Your turn" : "";
  });
  $("roundInfo").textContent = G.mode === "points"
    ? `First to ${G.goal}`
    : `Round ${Math.min(Math.floor(G.turns/2)+1, G.goal)} of ${G.goal}`;
  renderTrail(); renderWord(); renderTimer(); renderKeys(); renderTeacher();
  if (deal){ const w=$("word"); w.classList.remove("deal"); void w.offsetWidth; w.classList.add("deal"); if(!busy) setMsg(`${G.names[G.turn]}, change one letter.`, ""); }
  else if (!busy && !keepMsg) setMsg(`${G.names[G.turn]}, change one letter.`, "");
}
function renderTrail(){
  const t = $("trail"); t.innerHTML = "";
  G.chain.forEach((w,i)=>{
    if (i){ const s=document.createElement("span"); s.className="sep"; s.textContent="\u2192"; t.appendChild(s); }
    const s=document.createElement("span"); s.textContent=w.toLowerCase();
    if (G.chainBy[i]>=0) s.className="t"+G.chainBy[i];
    t.appendChild(s);
  });
}
function renderWord(shown, changedIdx){
  const w = $("word"); w.innerHTML = "";
  const word = shown || G.word;
  for (let i=0;i<4;i++){
    const b = document.createElement("button");
    b.className = "tile" + (i===sel ? " sel" : "") + (shown && i===changedIdx ? " changed" : "");
    b.textContent = word[i];
    b.setAttribute("aria-label", `Letter ${i+1}: ${word[i]}` + (i===sel?", selected":""));
    b.setAttribute("aria-pressed", i===sel);
    b.addEventListener("click", ()=>selectTile(i));
    w.appendChild(b);
  }
}
function flipTile(i){ const t=$("word").children[i]; if(t){ t.classList.remove("flip"); void t.offsetWidth; t.classList.add("flip"); } }
function bump(i){ const el=$("team"+i); el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function renderTimer(){
  const tm = $("timer");
  tm.classList.toggle("off", !G.timer);
  if (!G.timer) return;
  $("timerSecs").textContent = Math.max(0,timeLeft);
  $("timerFill").style.transform = `scaleX(${Math.max(0,timeLeft)/G.timer})`;
  $("timerFill").style.background = teamColor(G.turn);
  tm.classList.toggle("low", timeLeft <= 5);
}
function buildKeys(){
  const k = $("kbd"); k.innerHTML = "";
  ROWS.forEach(r=>{
    const row = document.createElement("div"); row.className="krow";
    for (const L of r){
      const b=document.createElement("button"); b.className="key"; b.textContent=L; b.dataset.l=L;
      b.addEventListener("click", ()=>playLetter(L));
      row.appendChild(b);
    }
    k.appendChild(row);
  });
}
function renderKeys(){
  $("kbd").classList.toggle("locked", busy || G.over);
  document.querySelectorAll(".key").forEach(b=>{ b.disabled = sel>=0 && G.word[sel]===b.dataset.l; });
}
function renderTeacher(){
  $("undoBtn").disabled = !undoStack.length;
  const ob = $("overrideBtn"), last = G.last;
  if (last && last.word && undoStack.length){
    ob.classList.remove("hidden");
    ob.textContent = last.type==="fail" ? `Accept ${last.word}` : `Reject ${last.word}`;
  } else ob.classList.add("hidden");
}

/* ═════ SCREENS ═════ */
function showGame(){
  $("setup").classList.add("hidden"); $("game").classList.remove("hidden");
  $("pauseBtn").classList.remove("hidden");
  buildKeys();
}
function showSetup(){
  clearPending(); stopTimer(); hideEnd(); paused=false; $("pauseOv").classList.add("hidden");
  $("game").classList.add("hidden"); $("setup").classList.remove("hidden");
  $("pauseBtn").classList.add("hidden"); $("roundInfo").textContent="";
  renderSetup();
}
function showEnd(){
  pendingTimer = null;
  render();
  const [a,b] = G.scores;
  $("endTitle").textContent = a===b ? "It's a tie" : `${G.names[a>b?0:1]} wins`;
  $("finalScores").innerHTML = "";
  [0,1].forEach(i=>{ const d=document.createElement("div"); d.className="f"+i; d.innerHTML=`<b>${G.scores[i]}</b>`; d.appendChild(document.createTextNode(G.names[i])); $("finalScores").appendChild(d); });
  $("endStats").textContent = `Longest chain: ${G.longest} words.`;
  $("endOv").classList.remove("hidden");
  store.del(STATE_KEY);
  renderTeacher();
  SFX.win();
}
function hideEnd(){ $("endOv").classList.add("hidden"); if (G) G.over = false; }

/* ═════ SETUP UI ═════ */
function chipGroup(host, items, current, label, onPick){
  host.innerHTML = "";
  items.forEach(v=>{
    const c=document.createElement("button"); c.className="chip"; c.textContent=label(v);
    c.setAttribute("aria-pressed", v===current);
    c.addEventListener("click", ()=>{ onPick(v); renderSetup(); });
    host.appendChild(c);
  });
}
function renderSetup(){
  $("name0").value = settings.names[0]; $("name1").value = settings.names[1];
  chipGroup($("timerChips"), TIMERS, settings.timer, v=> v ? v+" s" : "No timer", v=>settings.timer=v);
  chipGroup($("modeChips"), ["points","rounds"], settings.mode, v=> v==="points"?"First to":"After", v=>settings.mode=v);
  chipGroup($("goalChips"), GOALS[settings.mode], settings.goal, v=> v + (settings.mode==="points"?" points":" rounds"), v=>settings.goal=v);
  const saved = store.get(STATE_KEY);
  const rb = $("resumeBtn");
  if (saved && saved.G && !saved.G.over){
    rb.classList.remove("hidden");
    rb.textContent = `Resume ${saved.G.names[0]} ${saved.G.scores[0]}\u2013${saved.G.scores[1]} ${saved.G.names[1]}`;
  } else rb.classList.add("hidden");
  $("dictNote").textContent = wordSet() ? "" : "Word list not loaded. Words will be checked online.";
  saveSettings();
}
function saveSettings(){
  settings.names = [$("name0").value.trim()||"Team 1", $("name1").value.trim()||"Team 2"];
  if (!GOALS[settings.mode].includes(settings.goal)) settings.goal = 10;
  settings.sound = soundOn;
  store.set(SET_KEY, settings);
}
function renderSound(){ $("soundBtn").innerHTML = soundOn ? "&#128266;" : "&#128263;"; $("soundBtn").setAttribute("aria-label", soundOn?"Sound on":"Sound off"); }

/* ═════ EVENTS ═════ */
$("startBtn").addEventListener("click", ()=>{ saveSettings(); store.del(STATE_KEY); newGame(); });
$("resumeBtn").addEventListener("click", ()=>{
  const s = store.get(STATE_KEY); if (!s) return;
  G = s.G; undoStack = s.undoStack || [];
  showGame(); render(true); startTurn();
});
["name0","name1"].forEach(id=>$(id).addEventListener("input", saveSettings));
$("undoBtn").addEventListener("click", undo);
$("overrideBtn").addEventListener("click", override);
$("skipBtn").addEventListener("click", skipWord);
$("endBtn").addEventListener("click", ()=>{ if (!G || G.over) return; clearPending(); stopTimer(); G.over = true; busy = true; showEnd(); });
$("pauseBtn").addEventListener("click", ()=>setPaused(!paused));
$("resumePlay").addEventListener("click", ()=>setPaused(false));
$("againBtn").addEventListener("click", ()=>{ hideEnd(); settings.names = [...G.names]; newGame(); });
$("setupBtn").addEventListener("click", showSetup);
$("soundBtn").addEventListener("click", ()=>{ soundOn=!soundOn; settings.sound=soundOn; store.set(SET_KEY, settings); renderSound(); });

document.addEventListener("keydown", e=>{
  if ($("game").classList.contains("hidden") || !G) return;
  if (e.target.tagName === "INPUT") return;
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); return; }
  if (e.ctrlKey||e.metaKey||e.altKey) return;
  if (e.key === " "){ e.preventDefault(); setPaused(!paused); return; }
  if (/^[1-4]$/.test(e.key)){ selectTile(+e.key-1); return; }
  if (e.key === "ArrowLeft" || e.key === "ArrowRight"){
    e.preventDefault(); if (busy||paused||G.over) return;
    sel = sel<0 ? (e.key==="ArrowLeft"?3:0) : (sel + (e.key==="ArrowLeft"?3:1)) % 4;
    SFX.clack(); renderWord(); renderKeys(); return;
  }
  if (/^[a-zA-Z]$/.test(e.key)){ playLetter(e.key.toUpperCase()); }
});
document.addEventListener("visibilitychange", ()=>{ if (document.hidden && G && !G.over && !$("game").classList.contains("hidden") && !paused) setPaused(true); });

renderSound();
renderSetup();
window.addEventListener("load", ()=>{ if (!$("setup").classList.contains("hidden")) renderSetup(); });
</script>
</body>
</html>
