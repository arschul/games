<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maze Race — Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --bg0: #050a17;
    --bg1: #0c1834;
    --panel: rgba(13, 21, 40, .86);
    --panelHi: rgba(30, 44, 76, .9);
    --panel2: #17233f;
    --text: #eef4ff;
    --muted: #93a4c3;
    --border: #2a3b60;
    --screw: #5d6b86;
    --accent: #22d3ee;
    --accent2: #0e7490;
    --danger: #ef4444;
    /* terrain */
    --frame1: #313c52;
    --frame2: #131a28;
    --frameEdge: #5b6b88;
    --groove: #03060d;
    --conduit: #22d3ee;
    --plate1: #5a6880;
    --plate2: #36425a;
    --plateLine: rgba(0, 0, 0, .38);
    --plateHi: rgba(255, 255, 255, .14);
    --rivet: #9aa6bd;
    --tread: rgba(255, 255, 255, .07);
    --decal: rgba(150, 190, 240, .22);
    /* background */
    --gridLine: rgba(34, 211, 238, .22);
    --sky1: #162a57;
    --sky2: #0f1f45;
    --glowA: rgba(34, 211, 238, .16);
    --glowB: rgba(168, 85, 247, .14);
    --side: clamp(170px, 17vw, 300px);
}
[data-theme="light"] {
    --bg0: #cfdbea;
    --bg1: #eef3f9;
    --panel: rgba(255, 255, 255, .9);
    --panelHi: rgba(255, 255, 255, .98);
    --panel2: #eaf0f7;
    --text: #0f172a;
    --muted: #475a78;
    --border: #b8c6da;
    --screw: #9fadc2;
    --accent: #0891b2;
    --accent2: #0e7490;
    --frame1: #8f9bb1;
    --frame2: #66738b;
    --frameEdge: #d2dae6;
    --groove: #232c3d;
    --conduit: #67e8f9;
    --plate1: #eef2f7;
    --plate2: #c6d0de;
    --plateLine: rgba(30, 41, 59, .22);
    --plateHi: rgba(255, 255, 255, .8);
    --rivet: #8693a8;
    --tread: rgba(30, 41, 59, .06);
    --decal: rgba(30, 60, 110, .16);
    --gridLine: rgba(14, 116, 144, .2);
    --sky1: #b9c8db;
    --sky2: #a7b8ce;
    --glowA: rgba(34, 211, 238, .22);
    --glowB: rgba(129, 140, 248, .16);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
    font-family: 'Open Sans', system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 62%, var(--bg0) 100%);
    color: var(--text);
    display: grid;
    grid-template-rows: auto auto 1fr;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
}
button { font-family: inherit; }
h1, h2, h3, .banner-main, .btn, .tray-name, .title, .seg button, .sfield > label { font-family: 'Exo 2', 'Montserrat', sans-serif; }

/* ---------- Background: robot factory at night ---------- */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.bg-glow { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(10px); }
.bg-glow.a { left: -25vmax; top: -30vmax; background: radial-gradient(circle, var(--glowA), transparent 65%); animation: driftA 26s ease-in-out infinite alternate; }
.bg-glow.b { right: -28vmax; top: -10vmax; background: radial-gradient(circle, var(--glowB), transparent 65%); animation: driftB 32s ease-in-out infinite alternate; }
@keyframes driftA { to { transform: translate(14vmax, 10vmax); } }
@keyframes driftB { to { transform: translate(-12vmax, 14vmax); } }
.bg-stars {
    position: absolute; inset: 0 0 45% 0; opacity: .55;
    background-image:
        radial-gradient(1.4px 1.4px at 12% 18%, #fff 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 27% 8%, #cbe9ff 50%, transparent 51%),
        radial-gradient(1.6px 1.6px at 43% 26%, #fff 50%, transparent 51%),
        radial-gradient(1.1px 1.1px at 58% 12%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 71% 30%, #a5f3fc 50%, transparent 51%),
        radial-gradient(1.2px 1.2px at 84% 9%, #fff 50%, transparent 51%),
        radial-gradient(1.3px 1.3px at 93% 22%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 6% 40%, #fff 50%, transparent 51%),
        radial-gradient(1.3px 1.3px at 36% 44%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 66% 48%, #fff 50%, transparent 51%);
}
[data-theme="light"] .bg-stars { display: none; }
.bg-skyline { position: absolute; left: 0; right: 0; bottom: 26vh; width: 100%; height: 24vh; }
.bg-skyline .far { fill: var(--sky1); }
.bg-skyline .near { fill: var(--sky2); }
.bg-skyline .lamp { fill: #f87171; animation: lamp 2.4s ease-in-out infinite; }
.bg-skyline .lamp:nth-of-type(2n) { animation-delay: -1.2s; }
.bg-skyline .win { fill: #fde68a; opacity: .5; }
[data-theme="light"] .bg-skyline .win { fill: #64748b; opacity: .35; }
@keyframes lamp { 50% { opacity: .15; } }
.bg-gear { position: absolute; bottom: calc(26vh + 9vh); right: 14vw; width: 11vh; height: 11vh; fill: var(--sky1); animation: spin 40s linear infinite; }
.bg-gear.small { right: calc(14vw + 9vh); bottom: calc(26vh + 15vh); width: 6vh; height: 6vh; animation-direction: reverse; animation-duration: 22s; }
@keyframes spin { to { transform: rotate(360deg); } }
.bg-floor {
    position: absolute; left: -50%; right: -50%; bottom: 0; height: 26vh; overflow: hidden;
    transform: perspective(36vh) rotateX(58deg); transform-origin: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent 100%);
    mask-image: linear-gradient(to top, #000 30%, transparent 100%);
}
.bg-floor::before {
    content: ''; position: absolute; left: 0; right: 0; top: -80px; bottom: 0;
    background-image:
        linear-gradient(to right, var(--gridLine) 2px, transparent 2px),
        linear-gradient(to bottom, var(--gridLine) 2px, transparent 2px);
    background-size: 80px 80px;
    animation: floor 4s linear infinite;
}
@keyframes floor { to { transform: translateY(80px); } }
.bg-horizon { position: absolute; left: 0; right: 0; bottom: 26vh; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: .45; box-shadow: 0 0 18px var(--accent); }

/* ---------- Top bar ---------- */
.back-link {
    position: fixed; top: 12px; left: 12px; z-index: 50;
    background: var(--panel); color: var(--text); border: 2px solid var(--border);
    padding: 8px 16px; border-radius: 999px; text-decoration: none;
    font-family: 'Exo 2', 'Montserrat', sans-serif; font-weight: 800; font-size: 1rem;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); backdrop-filter: blur(6px);
}
.back-link:hover { border-color: var(--accent); }
.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px 0 170px; gap: 12px; min-height: 58px;
}
.title { font-weight: 900; font-size: clamp(1.3rem, 2.1vw, 1.9rem); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.title span { color: var(--accent); text-shadow: 0 0 14px var(--accent); }
.title svg { width: 38px; height: 38px; }
.utils { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.ubtn {
    background: var(--panel); color: var(--text); border: 2px solid var(--border);
    border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: .95rem; cursor: pointer;
    min-height: 44px; display: inline-flex; align-items: center; gap: 6px; backdrop-filter: blur(6px);
}
.ubtn:hover { border-color: var(--accent); }
.ubtn.on { background: var(--accent2); border-color: var(--accent); color: #fff; }

/* ---------- Turn bar ---------- */
.turnbar { display: flex; align-items: stretch; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
.banner {
    flex: 1 1 380px; border-radius: 16px; padding: 6px 18px 6px 10px; display: flex; align-items: center; gap: 12px;
    background:
        linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,0) 40%),
        repeating-linear-gradient(135deg, rgba(0,0,0,.06) 0 10px, rgba(0,0,0,0) 10px 20px),
        var(--pc, #334155);
    color: var(--pink, #fff);
    box-shadow: 0 0 0 2px rgba(255,255,255,.12) inset, 0 0 26px color-mix(in srgb, var(--pc, #334155) 55%, transparent), 0 6px 22px rgba(0,0,0,.3);
    transition: background-color .25s;
}
.banner-text { flex: 1; min-width: 0; }
.banner-main { font-weight: 900; font-size: clamp(1.1rem, 2.1vw, 2rem); line-height: 1.1; }
.banner-sub { font-weight: 600; font-size: clamp(.85rem, 1.1vw, 1.05rem); opacity: .92; margin-top: 2px; }
.banner-icon { flex: none; width: 58px; height: 58px; border-radius: 14px; background: rgba(0,0,0,.22); display: grid; place-items: center; }
.banner-icon svg { width: 52px; height: 52px; display: block; }
.timer {
    font-family: 'Exo 2', 'Montserrat', sans-serif; font-weight: 900; font-size: clamp(1.2rem, 2vw, 1.9rem);
    background: rgba(0,0,0,.25); border-radius: 12px; padding: 4px 12px; min-width: 84px; text-align: center; align-self: center;
}
.timer.low { background: rgba(0,0,0,.45); }
.banner.flash { animation: flash .5s steps(2) 6; }
@keyframes flash { 50% { filter: brightness(1.7) saturate(1.3); box-shadow: 0 0 0 6px #fff, 0 0 30px #fff; } }

.btn {
    border: 2px solid var(--border); background: linear-gradient(180deg, var(--panelHi), var(--panel)); color: var(--text);
    border-radius: 14px; padding: 8px 16px; font-weight: 800; font-size: clamp(1rem, 1.4vw, 1.3rem);
    cursor: pointer; min-height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform .08s, background .15s, border-color .15s; backdrop-filter: blur(6px);
    box-shadow: 0 3px 0 rgba(0,0,0,.25);
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.mode.on { background: var(--pc); border-color: #fff; color: var(--pink); box-shadow: 0 0 0 3px var(--pc), 0 0 22px var(--pc); }
.btn.primary { background: linear-gradient(180deg, #22d3ee, #0e7490); border-color: #67e8f9; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.btn.danger { background: #b91c1c; border-color: #ef4444; color: #fff; }
.btn.confirm { background: linear-gradient(180deg, #22c55e, #15803d); border-color: #86efac; color: #fff; font-size: clamp(1.1rem, 1.6vw, 1.5rem); padding: 8px 22px; }
.btn.confirm:not(:disabled) { animation: nudge 1s ease-in-out infinite; }
.btn.confirm:disabled { background: var(--panel); border-color: var(--border); color: var(--muted); opacity: .6; }
@keyframes nudge { 50% { transform: scale(1.04); } }
.btn small { font-weight: 700; font-size: .7em; opacity: .85; }
.seg { display: inline-flex; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; backdrop-filter: blur(6px); }
.seg button {
    border: 0; background: var(--panel); color: var(--text); font-weight: 800;
    font-size: clamp(.95rem, 1.3vw, 1.2rem); padding: 6px 14px; cursor: pointer; min-height: 50px; min-width: 56px;
}
.seg button + button { border-left: 2px solid var(--border); }
.seg button.on { background: var(--accent2); color: #fff; box-shadow: inset 0 0 14px rgba(34,211,238,.45); }
.orient { transition: opacity .15s; }
.orient.hidden { visibility: hidden; }
.hidden { display: none !important; }

/* ---------- Main ---------- */
main {
    display: grid; grid-template-columns: var(--side) minmax(0, 1fr) var(--side);
    gap: 14px; padding: 0 14px 14px; min-height: 0;
}
.side { display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0; }
.boardwrap { min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
#board { width: 100%; height: 100%; max-width: 100%; max-height: 100%; touch-action: none; display: block; }

/* ---------- Trays (robot docks) ---------- */
.tray {
    --sc: var(--screw);
    background:
        radial-gradient(circle at 11px 11px, var(--sc) 2.6px, transparent 3.4px),
        radial-gradient(circle at calc(100% - 11px) 11px, var(--sc) 2.6px, transparent 3.4px),
        radial-gradient(circle at 11px calc(100% - 11px), var(--sc) 2.6px, transparent 3.4px),
        radial-gradient(circle at calc(100% - 11px) calc(100% - 11px), var(--sc) 2.6px, transparent 3.4px),
        linear-gradient(180deg, var(--panelHi), var(--panel));
    border: 2px solid var(--border); border-radius: 18px; padding: 12px 16px 14px;
    backdrop-filter: blur(6px);
    transition: box-shadow .25s, border-color .25s, transform .25s;
    position: relative; overflow: hidden;
}
.tray::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--pc); opacity: .9; }
.tray.active { border-color: var(--pc); box-shadow: 0 0 0 3px var(--pc), 0 0 34px var(--pc); transform: scale(1.02); }
.tray.won { border-color: gold; box-shadow: 0 0 0 4px gold, 0 0 40px gold; }
.tray-head { display: flex; align-items: center; gap: 10px; }
.tray-bot { flex: none; width: clamp(52px, 4.6vw, 70px); height: clamp(52px, 4.6vw, 70px); border-radius: 14px; background: radial-gradient(circle at 50% 70%, color-mix(in srgb, var(--pc) 35%, transparent), transparent 70%); display: grid; place-items: center; }
.tray-bot svg { width: 100%; height: 100%; }
.tray.active .tray-bot svg { animation: trayBob 1.4s ease-in-out infinite; }
@keyframes trayBob { 50% { transform: translateY(-4px); } }
.tray-info { min-width: 0; }
.tray-name { font-weight: 900; font-size: clamp(1.05rem, 1.5vw, 1.45rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tray-edge { color: var(--muted); font-size: clamp(.78rem, .95vw, .95rem); font-weight: 600; margin-top: 2px; }
.tiles { display: grid; gap: clamp(4px, .4vw, 7px); max-width: 260px; margin-top: 10px; }
.tile {
    width: 100%; max-width: 20px; height: clamp(44px, 4.2vw, 70px); border-radius: 4px; position: relative;
    background:
        linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,0) 45%, rgba(0,0,0,.3)),
        repeating-linear-gradient(45deg, #facc15 0 6px, #1f2937 6px 12px);
    border: 2px solid #0f172a;
    box-shadow: 0 3px 0 rgba(0,0,0,.45);
    transition: opacity .3s, transform .3s;
}
.tile::after { content: ''; position: absolute; left: 50%; top: 50%; width: 6px; height: 14px; margin: -7px 0 0 -3px; border-radius: 3px; background: var(--pc); box-shadow: 0 0 8px var(--pc); }
.tile.used { opacity: .13; box-shadow: none; transform: scale(.92); }
.tray-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 6px; flex-wrap: wrap; }
.wcount { font-weight: 800; font-size: clamp(.95rem, 1.2vw, 1.15rem); }
.pathbadge { background: var(--panel2); border: 2px solid var(--pc); border-radius: 999px; padding: 2px 10px; font-weight: 800; font-size: .95rem; }

/* ---------- SVG board ---------- */
.bot .blink { animation: blink 5.2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.12); } }
.bot .ring { opacity: 0; transition: opacity .25s; }
.bot.active .ring { opacity: 1; animation: ringspin 1.1s linear infinite; }
@keyframes ringspin { to { stroke-dashoffset: -28; } }
.bot.active .idle { animation: bob 1.5s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.ant-tip { animation: antglow 2.2s ease-in-out infinite; }
@keyframes antglow { 50% { opacity: .4; } }
.arm { transform-box: fill-box; transform-origin: 50% 12%; }
.bot.moving .armL { animation: swingL .22s ease-in-out infinite alternate; }
.bot.moving .armR { animation: swingR .22s ease-in-out infinite alternate; }
@keyframes swingL { from { transform: rotate(-26deg); } to { transform: rotate(20deg); } }
@keyframes swingR { from { transform: rotate(26deg); } to { transform: rotate(-20deg); } }
.bot.winner .idle, .celebrate .idle { animation: cheer .55s ease-in-out infinite; }
.bot.winner .armL, .celebrate .armL { animation: waveL .3s ease-in-out infinite alternate; }
.bot.winner .armR, .celebrate .armR { animation: waveR .3s ease-in-out infinite alternate; }
@keyframes cheer { 50% { transform: translateY(-9px); } }
@keyframes waveL { from { transform: rotate(150deg); } to { transform: rotate(120deg); } }
@keyframes waveR { from { transform: rotate(-150deg); } to { transform: rotate(-120deg); } }
.flame { animation: flicker .09s steps(2) infinite; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes flicker { 50% { transform: scaleY(.72); } }
.pad .hl-ring { animation: padspin 1.6s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes padspin { to { transform: rotate(360deg); } }
.pad .core { animation: padpulse 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes padpulse { 50% { opacity: .55; transform: scale(.85); } }
.wall.drop { animation: drop 380ms cubic-bezier(.3,.1,.5,1); transform-box: fill-box; transform-origin: center; }
@keyframes drop { 0% { transform: translateY(-46px) scale(1.18); opacity: 0; } 55% { transform: translateY(2px) scale(1); opacity: 1; } 72% { transform: translateY(-4px); } 100% { transform: none; } }
.lastwall { animation: lastglow 1.6s ease-in-out infinite; }
@keyframes lastglow { 50% { opacity: .3; } }
.holo { animation: holo 1.2s steps(3) infinite; }
@keyframes holo { 50% { opacity: .82; } }
.chip text { font-family: 'Exo 2', 'Montserrat', sans-serif; font-weight: 800; }

/* ---------- Overlays ---------- */
.overlay {
    position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center;
    background: rgba(2, 6, 23, .68); backdrop-filter: blur(5px); padding: 20px;
}
.overlay.show { display: flex; }
.card {
    background:
        radial-gradient(circle at 14px 14px, var(--screw) 3px, transparent 4px),
        radial-gradient(circle at calc(100% - 14px) 14px, var(--screw) 3px, transparent 4px),
        radial-gradient(circle at 14px calc(100% - 14px), var(--screw) 3px, transparent 4px),
        radial-gradient(circle at calc(100% - 14px) calc(100% - 14px), var(--screw) 3px, transparent 4px),
        linear-gradient(180deg, var(--panelHi), var(--panel));
    border: 2px solid var(--border); border-radius: 24px; padding: 26px 30px;
    max-width: 760px; width: 100%; max-height: calc(100vh - 40px); overflow-y: auto;
    box-shadow: 0 0 0 1px rgba(34,211,238,.15), 0 20px 60px rgba(0,0,0,.5);
}
.card h1 { margin: 0; font-size: clamp(2.2rem, 4.5vw, 3.6rem); font-weight: 900; text-transform: uppercase; letter-spacing: .03em; }
.card h1 span { color: var(--accent); text-shadow: 0 0 18px var(--accent); }
.card h2 { margin: 0 0 10px; font-weight: 900; font-size: clamp(1.4rem, 2.4vw, 2rem); }
.sub { color: var(--muted); font-size: 1.15rem; margin: 4px 0 18px; font-weight: 600; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 4px; }
.nameRow { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 2px solid var(--border); border-left: 6px solid var(--pc); border-radius: 14px; padding: 8px 10px; }
.nameRow svg { width: 42px; height: 42px; flex: none; }
.nameRow input {
    flex: 1; min-width: 0; font: 800 1.15rem 'Exo 2', 'Montserrat', sans-serif; color: var(--text); background: transparent;
    border: 0; border-bottom: 2px solid var(--border); padding: 4px 2px; outline: none;
}
.nameRow input:focus { border-color: var(--accent); }
.nameRow .edge { color: var(--muted); font-size: .85rem; font-weight: 700; white-space: nowrap; }
.actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.setup-card { max-width: 1000px; padding: clamp(16px, 3vh, 28px) clamp(18px, 3vw, 34px); }
.setup-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: clamp(8px, 2vh, 18px); }
.setup-head h1 { font-size: clamp(2rem, 6vh, 3.2rem); line-height: 1; }
.setup-head .sub { margin: 0; flex: 1 1 260px; }
.setup-bots { display: flex; gap: 2px; }
.setup-bots svg { width: clamp(40px, 7vh, 58px); height: clamp(40px, 7vh, 58px); animation: trayBob 1.6s ease-in-out infinite; }
.setup-bots svg:nth-child(2) { animation-delay: -.4s; }
.setup-bots svg:nth-child(3) { animation-delay: -.8s; }
.setup-bots svg:nth-child(4) { animation-delay: -1.2s; }

<script>
'use strict';

/* =====================================================================
   RULE ENGINE (pure functions)
   Squares: r,c in 0..8 (r=0 is the top row).
   Walls: key "r,c,O" where (r,c) in 0..7 is the center intersection
   between squares (r,c),(r,c+1),(r+1,c),(r+1,c+1). O = 'H' | 'V'.
   H at (r,c) blocks (r,c)-(r+1,c) and (r,c+1)-(r+1,c+1).
   V at (r,c) blocks (r,c)-(r,c+1) and (r+1,c)-(r+1,c+1).
   ===================================================================== */
const N = 9;
const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];

function wkey(r, c, o) { return r + ',' + c + ',' + o; }
function parseKey(k) { const [r, c, o] = k.split(','); return { r: +r, c: +c, o }; }
function inBounds(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

function isBlocked(walls, a, b) {
    if (a.c === b.c) {
        const top = Math.min(a.r, b.r);
        return walls.has(wkey(top, a.c, 'H')) || walls.has(wkey(top, a.c - 1, 'H'));
    }
    const left = Math.min(a.c, b.c);
    return walls.has(wkey(a.r, left, 'V')) || walls.has(wkey(a.r - 1, left, 'V'));
}

function atGoal(goal, pos) {
    return (goal === 'top' && pos.r === 0) || (goal === 'bottom' && pos.r === N - 1) ||
           (goal === 'left' && pos.c === 0) || (goal === 'right' && pos.c === N - 1);
}

function legalMoves(players, walls, i) {
    const me = players[i].pos;
    const occ = (r, c) => players.some(p => p.pos.r === r && p.pos.c === c);
    const out = [];
    const add = (sq, kind) => { if (!out.some(m => m.r === sq.r && m.c === sq.c)) out.push({ r: sq.r, c: sq.c, kind }); };
    for (const [dr, dc] of DIRS) {
        const n = { r: me.r + dr, c: me.c + dc };
        if (!inBounds(n.r, n.c) || isBlocked(walls, me, n)) continue;
        if (!occ(n.r, n.c)) { add(n, 'step'); continue; }
        // A pawn is next to us: try a straight jump.
        const j = { r: n.r + dr, c: n.c + dc };
        if (inBounds(j.r, j.c) && !isBlocked(walls, n, j) && !occ(j.r, j.c)) { add(j, 'jump'); continue; }
        // Straight jump blocked (wall, edge or pawn behind): side jumps. Never a second jump.
        const sides = dr !== 0 ? [[0, -1], [0, 1]] : [[-1, 0], [1, 0]];
        for (const [sr, sc] of sides) {
            const s = { r: n.r + sr, c: n.c + sc };
            if (inBounds(s.r, s.c) && !isBlocked(walls, n, s) && !occ(s.r, s.c)) add(s, 'side');
        }
    }
    return out;
}

// BFS: shortest number of steps to the goal edge (walls only, pawns ignored). -1 = no path.
function shortestPath(walls, pos, goal) {
    if (atGoal(goal, pos)) return 0;
    const seen = new Uint8Array(N * N);
    let frontier = [pos];
    seen[pos.r * N + pos.c] = 1;
    let d = 0;
    while (frontier.length) {
        d++;
        const next = [];
        for (const p of frontier) {
            for (const [dr, dc] of DIRS) {
                const q = { r: p.r + dr, c: p.c + dc };
                if (!inBounds(q.r, q.c) || seen[q.r * N + q.c] || isBlocked(walls, p, q)) continue;
                if (atGoal(goal, q)) return d;
                seen[q.r * N + q.c] = 1;
                next.push(q);
            }
        }
        frontier = next;
    }
    return -1;
}
function hasPathToGoal(player, walls) { return shortestPath(walls, player.pos, player.goal) >= 0; }

function canPlaceWall(players, walls, r, c, o) {
    if (r < 0 || r > N - 2 || c < 0 || c > N - 2 || (o !== 'H' && o !== 'V')) return { ok: false, reason: 'Off the board' };
    if (walls.has(wkey(r, c, o))) return { ok: false, reason: 'Overlaps a wall' };
    if (o === 'H' && (walls.has(wkey(r, c - 1, 'H')) || walls.has(wkey(r, c + 1, 'H')))) return { ok: false, reason: 'Overlaps a wall' };
    if (o === 'V' && (walls.has(wkey(r - 1, c, 'V')) || walls.has(wkey(r + 1, c, 'V')))) return { ok: false, reason: 'Overlaps a wall' };
    if (walls.has(wkey(r, c, o === 'H' ? 'V' : 'H'))) return { ok: false, reason: 'Crosses a wall' };
    const test = new Set(walls.keys());
    test.add(wkey(r, c, o));
    for (let i = 0; i < players.length; i++) {
        if (!hasPathToGoal(players[i], test)) return { ok: false, reason: `Blocks ${players[i].name}'s path`, blocked: i };
    }
    return { ok: true };
}

/* ---------- Engine self-test (console only) ---------- */
function runSelfTests() {
    const P = (r, c, goal, name) => ({ pos: { r, c }, goal: goal || 'top', name: name || 'P' });
    const has = (moves, r, c) => moves.some(m => m.r === r && m.c === c);
    const results = [];
    const t = (name, cond) => results.push([name, !!cond]);
    {
        const pl = [P(4, 4), P(3, 4, 'bottom')]; const m = legalMoves(pl, new Set(), 0);
        t('straight jump', has(m, 2, 4) && !has(m, 3, 4) && has(m, 5, 4));
    }
    {
        const pl = [P(4, 4), P(3, 4, 'bottom')]; const w = new Set([wkey(2, 4, 'H')]); const m = legalMoves(pl, w, 0);
        t('side jump against wall', !has(m, 2, 4) && has(m, 3, 3) && has(m, 3, 5));
    }
    {
        const pl = [P(1, 4), P(0, 4, 'bottom')]; const m = legalMoves(pl, new Set(), 0);
        t('side jump against board edge', has(m, 0, 3) && has(m, 0, 5) && !has(m, 0, 4));
    }
    {
        const pl = [P(4, 4), P(3, 4, 'bottom'), P(2, 4, 'left')]; const m = legalMoves(pl, new Set(), 0);
        t('no double jump (4p)', !has(m, 1, 4) && has(m, 3, 3) && has(m, 3, 5));
    }
    {
        const pl = [P(4, 4), P(3, 4, 'bottom')]; const w = new Set([wkey(3, 3, 'V')]); const m = legalMoves(pl, w, 0);
        t('side jump blocked by wall beside jumped pawn', !has(m, 3, 3) && has(m, 2, 4));
    }
    {
        const pl = [P(8, 4)]; const w = new Set([wkey(3, 3, 'H')]);
        t('overlap rejection', canPlaceWall(pl, w, 3, 4, 'H').reason === 'Overlaps a wall' &&
            canPlaceWall(pl, w, 3, 2, 'H').reason === 'Overlaps a wall' &&
            canPlaceWall(pl, w, 3, 3, 'H').reason === 'Overlaps a wall' &&
            canPlaceWall(pl, w, 3, 5, 'H').ok);
    }
    {
        const pl = [P(8, 4)]; const w = new Set([wkey(3, 3, 'H')]);
        t('cross rejection', canPlaceWall(pl, w, 3, 3, 'V').reason === 'Crosses a wall' && canPlaceWall(pl, w, 2, 3, 'V').ok);
    }
    {
        t('off-board rejection', !canPlaceWall([P(8, 4)], new Set(), 8, 0, 'H').ok && !canPlaceWall([P(8, 4)], new Set(), 0, -1, 'V').ok);
    }
    {
        const pl = [P(8, 4, 'top', 'Red'), P(0, 4, 'bottom', 'Blue')];
        const w = new Set([wkey(6, 1, 'H'), wkey(6, 3, 'H'), wkey(6, 5, 'H'), wkey(6, 7, 'H'), wkey(7, 0, 'H')]);
        const res = canPlaceWall(pl, w, 6, 0, 'V');
        t('path-block rejection (protects every pawn)', !res.ok && res.reason === "Blocks Red's path" && res.blocked === 0);
    }
    {
        t('BFS distance', shortestPath(new Set(), { r: 8, c: 4 }, 'top') === 8);
    }
    const failed = results.filter(r => !r[1]);
    console.groupCollapsed(`Maze Race rule self-test: ${results.length - failed.length}/${results.length} passed`);
    results.forEach(([n, ok]) => console.log((ok ? '✅ ' : '❌ ') + n));
    console.groupEnd();
    if (failed.length) console.warn('Maze Race self-test failures:', failed.map(f => f[0]));
    return failed.length === 0;
}

/* =====================================================================
   CONFIG
   ===================================================================== */
// Each robot has its own color, head shape and chest letter, so players never rely on color alone.
const COLORS = [
    { name: 'Red',    hex: '#ef4444', light: '#fca5a5', dark: '#991b1b', ink: '#ffffff', shape: 'circle',   letter: 'R', head: 'round head' },
    { name: 'Blue',   hex: '#3b82f6', light: '#93c5fd', dark: '#1e3a8a', ink: '#ffffff', shape: 'square',   letter: 'B', head: 'square head' },
    { name: 'Green',  hex: '#10b981', light: '#6ee7b7', dark: '#065f46', ink: '#ffffff', shape: 'triangle', letter: 'G', head: 'triangle head' },
    { name: 'Yellow', hex: '#facc15', light: '#fef08a', dark: '#a16207', ink: '#1f2937', shape: 'diamond',  letter: 'Y', head: 'diamond head' }
];
// Turn order goes clockwise around the table: bottom → left → top → right.
const SEATS = {
    2: [
        { color: 0, start: { r: 8, c: 4 }, edge: 'bottom', goal: 'top' },
        { color: 1, start: { r: 0, c: 4 }, edge: 'top', goal: 'bottom' }
    ],
    4: [
        { color: 0, start: { r: 8, c: 4 }, edge: 'bottom', goal: 'top' },
        { color: 2, start: { r: 4, c: 0 }, edge: 'left', goal: 'right' },
        { color: 1, start: { r: 0, c: 4 }, edge: 'top', goal: 'bottom' },
        { color: 3, start: { r: 4, c: 8 }, edge: 'right', goal: 'left' }
    ]
};
const ARROW = { top: '↑', bottom: '↓', left: '←', right: '→' };

/* Board geometry (SVG user units) */
const C = 80, G = 16, P = C + G, M = 42;
const BW = N * C + (N - 1) * G, VB = BW + 2 * M;
const cellX = c => M + c * P, cellY = r => M + r * P;
const grooveX = i => M + i * P + C + G / 2;  // center of intersection column i (0..7)
const grooveY = i => M + i * P + C + G / 2;

const REDUCED = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

/* =====================================================================
   STATE
   ===================================================================== */
const settings = { n: 2, names: COLORS.map(c => c.name), randomFirst: false, timer: 0, paths: false };
let S = null;            // game state
let mode = 'move';       // 'move' | 'wall'
let orientMode = 'auto'; // 'auto' | 'H' | 'V'
let ghost = null;        // { r, c, o, since, pending, ptr }
let justPlaced = null;
let timerLeft = 0, timerId = null, timeUp = false;
let muted = false;
let anim = null;         // the robot move currently being animated
let busy = false;        // true while a robot is moving: input is ignored until it lands
try { muted = localStorage.getItem('mazerace:mute') === '1'; } catch (e) {}

function newState() {
    const seats = SEATS[settings.n];
    const per = settings.n === 2 ? 10 : 5;
    const players = seats.map(s => ({
        name: (settings.names[s.color] || COLORS[s.color].name).trim() || COLORS[s.color].name,
        colorIdx: s.color, pos: { ...s.start }, start: { ...s.start },
        edge: s.edge, goal: s.goal, wallsLeft: per, wallsTotal: per
    }));
    return {
        n: settings.n, players, walls: new Map(),
        current: settings.randomFirst ? Math.floor(Math.random() * settings.n) : 0,
        history: [], winner: null, last: null
    };
}

function snapshot() {
    return {
        pos: S.players.map(p => ({ ...p.pos })), left: S.players.map(p => p.wallsLeft),
        walls: [...S.walls.entries()], current: S.current, last: S.last, winner: S.winner
    };
}
function restore(snap) {

let actx = null, master = null, noiseBuffer = null;
function ac() {

}

    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

}
// Filtered noise: clanks, whooshes, hisses.

    f.Q.value = o.q || 1;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.3, t0 + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

// Servo motor whirr that lasts as long as the movement.
function servo(dur, f0, f1, vol) {
    const a = ac(); if (!a) return;
    const t0 = a.currentTime;

    const lfo = a.createOscillator(), lg = a.createGain();

    o.frequency.linearRampToValueAtTime(f0 * 1.15, t0 + dur);
    f.type = 'lowpass'; f.frequency.value = 1100; f.Q.value = 4;
    lfo.frequency.value = 32; lg.gain.value = vol * 0.45;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.04);
    g.gain.setValueAtTime(vol, t0 + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    lfo.connect(lg).connect(g.gain);
    o.connect(f).connect(g).connect(master);
    o.start(t0); lfo.start(t0); o.stop(t0 + dur + 0.05); lfo.stop(t0 + dur + 0.05);
}

    move(sec) { tone(1180, 0.05, 'square', 0.045); servo(sec * 0.85, 150, 310, 0.075); },

        burst({ dur: 0.38, vol: 0.1, filter: 'highpass', freq: 3600, delay: 0.08 }); // hydraulic hiss

    win() {

        const g = el('g', { class: 'bot' }, L.bots);
        const ground = el('g', null, g);
        el('ellipse', { class: 'ring', cx: 0, cy: 35, rx: 34, ry: 10, fill: 'none', stroke: k.hex, 'stroke-width': 3.5, 'stroke-dasharray': '9 5' }, ground);
        const shadow = el('ellipse', { cx: 0, cy: 36, rx: 23, ry: 6.5, fill: '#000', opacity: .42 }, ground);
        const lift = el('g', null, g);
        const pose = el('g', null, lift);
        const idle = el('g', { class: 'idle' }, pose);
        idle.innerHTML = robotParts(p.colorIdx);
        const blink = idle.querySelector('.blink');
        if (blink) blink.style.animationDelay = `${-i * 1.37}s`;
        return { g, shadow, lift, pose, look: idle.querySelector('.look'), flame: idle.querySelector('.flame') };
    });
}

function wallRect(r, c, o) {
    if (o === 'H') return { x: cellX(c) + 2, y: cellY(r) + C - 5, width: 2 * C + G - 4, height: G + 10 };
    return { x: cellX(c) + C - 5, y: cellY(r) + 2, width: G + 10, height: 2 * C + G - 4 };
}

// Steel barricade: shadow, steel body, hazard stripes, end caps with rivets, LED strip in the owner's color.
function drawWall(parent, r, c, o, ownerHex, cls) {
    const R = wallRect(r, c, o), H = o === 'H';
    const g = el('g', { class: 'wall' + (cls ? ' ' + cls : '') }, parent);
    el('rect', { x: R.x + 2, y: R.y + 6, width: R.width, height: R.height, rx: 7, fill: '#000', opacity: .4 }, g);
    el('rect', { ...R, rx: 6, fill: `url(#gBar${o})`, stroke: '#0b1120', 'stroke-width': 2 }, g);
    const inset = H ? { x: R.x + 17, y: R.y + 5, width: R.width - 34, height: R.height - 10 } : { x: R.x + 5, y: R.y + 17, width: R.width - 10, height: R.height - 34 };
    el('rect', { ...inset, rx: 3, fill: 'url(#pHazard)', stroke: '#0b1120', 'stroke-width': 1.2, opacity: .95 }, g);
    const caps = H ? [[R.x + 8.5, R.y + R.height / 2], [R.x + R.width - 8.5, R.y + R.height / 2]] : [[R.x + R.width / 2, R.y + 8.5], [R.x + R.width / 2, R.y + R.height - 8.5]];
    for (const [cx, cy] of caps) el('circle', { cx, cy, r: 3.4, fill: 'url(#gRivet)' }, g);
    const cx = R.x + R.width / 2, cy = R.y + R.height / 2;
    const led = H ? { x: cx - 20, y: cy - 3.5, width: 40, height: 7 } : { x: cx - 3.5, y: cy - 20, width: 7, height: 40 };
    el('rect', { x: led.x - 4, y: led.y - 4, width: led.width + 8, height: led.height + 8, rx: 7, fill: ownerHex, opacity: .5, filter: 'url(#fGlow)' }, g);
    el('rect', { ...led, rx: 3.5, fill: ownerHex, stroke: '#0b1120', 'stroke-width': 1.5 }, g);
    el('rect', H ? { x: led.x + 4, y: cy - 1, width: led.width - 8, height: 2, rx: 1 } : { x: cx - 1, y: led.y + 4, width: 2, height: led.height - 8, rx: 1 }, g)
        .setAttribute('fill', 'rgba(255,255,255,.75)');
    el('path', { d: H ? `M${R.x + 6} ${R.y + 2.5} H${R.x + R.width - 6}` : `M${R.x + 2.5} ${R.y + 6} V${R.y + R.height - 6}`, stroke: '#fff', 'stroke-opacity': .4, 'stroke-width': 1.6, 'stroke-linecap': 'round' }, g);
    return { g, R };
}

const botCenter = sq => ({ x: cellX(sq.c) + C / 2, y: cellY(sq.r) + C / 2 });

function setBot(i, x, y, h, lean, sx, sy) {
    const b = botEls[i]; if (!b) return;
    b.g.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
    b.lift.setAttribute('transform', `translate(0 ${(-(h || 0)).toFixed(2)})`);
    b.pose.setAttribute('transform', `translate(0 35) rotate(${(lean || 0).toFixed(2)}) scale(${(sx || 1).toFixed(3)} ${(sy || 1).toFixed(3)}) translate(0 -35)`);
    const s = Math.max(.45, 1 - (h || 0) / 110);
    b.shadow.setAttribute('transform', `translate(0 36) scale(${s.toFixed(3)}) translate(0 -36)`);
    b.shadow.setAttribute('opacity', (.42 * s).toFixed(3));
}
function lookAt(i, dx, dy) { const b = botEls[i]; if (b && b.look) b.look.setAttribute('transform', `translate(${dx * 2.3} ${dy * 1.7})`); }

function renderBoard() {
    const legal = (S.winner === null && mode === 'move' && !busy) ? legalMoves(S.players, S.walls, S.current) : [];
    const cur = S.players[S.current], ck = COLORS[cur.colorIdx];

    // Last move: outline of the square it came from + a dotted trail
    L.marker.innerHTML = '';
    if (S.last && S.last.type === 'move') {
        const mover = S.players[S.last.player], k = COLORS[mover.colorIdx];
        const a = botCenter(S.last.from), b = botCenter(mover.pos);
        el('rect', { x: cellX(S.last.from.c) + 6, y: cellY(S.last.from.r) + 6, width: C - 12, height: C - 14, rx: 8,
            fill: 'none', stroke: k.hex, 'stroke-width': 3.5, 'stroke-dasharray': '9 7', opacity: .8 }, L.marker);
        el('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: k.hex, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-dasharray': '0.1 14', opacity: .7 }, L.marker);
    }

    // Legal destinations: holographic target pads
    L.hl.innerHTML = '';
    for (const m of legal) {
        const { x: cx, y: cy } = botCenter(m);
        const g = el('g', { class: 'pad' }, L.hl);
        el('circle', { cx, cy, r: 27, fill: ck.hex, opacity: .3 }, g);
        el('circle', { class: 'hl-ring', cx, cy, r: 32, fill: 'none', stroke: ck.hex, 'stroke-width': 5, 'stroke-dasharray': '14 8' }, g);
        const ang = Math.atan2(m.r - cur.pos.r, m.c - cur.pos.c) * 180 / Math.PI;
        const arrow = m.kind === 'step' ? 'M-6 -9 L4 0 L-6 9' : 'M-11 -9 L-2 0 L-11 9 M-1 -9 L8 0 L-1 9';
        const ag = el('g', { transform: `translate(${cx} ${cy}) rotate(${ang})` }, g);
        el('path', { class: 'core', d: arrow, fill: 'none', stroke: '#fff', 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, ag);
    }

    // Walls
    L.walls.innerHTML = '';
    const lastKey = S.last && S.last.type === 'wall' ? S.last.key : null;
    for (const [k, owner] of S.walls) {
        const { r, c, o } = parseKey(k);
        const oc = COLORS[S.players[owner] ? S.players[owner].colorIdx : 0].hex;
        const { g, R } = drawWall(L.walls, r, c, o, oc, k === justPlaced && !REDUCED ? 'drop' : '');
        if (k === lastKey) el('rect', { x: R.x - 5, y: R.y - 5, width: R.width + 10, height: R.height + 10, rx: 10, fill: 'none',
            stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '8 6', class: 'lastwall' }, g);
    }
    justPlaced = null;

    // Robots
    S.players.forEach((p, i) => {
        const b = botEls[i];
        if (!anim || anim.i !== i) { const q = botCenter(p.pos); setBot(i, q.x, q.y, 0, 0, 1, 1); }
        b.g.classList.toggle('active', i === S.current && S.winner === null && !busy);
        b.g.classList.toggle('winner', i === S.winner && !busy);
    });
    orderBots();
    renderGhost();
}

// Robots lower on the board are drawn in front; a robot in mid-air is always on top.
function orderBots() {
    const order = S.players.map((p, i) => i).sort((a, b) => S.players[a].pos.r - S.players[b].pos.r || a - b);
    if (anim) { order.splice(order.indexOf(anim.i), 1); order.push(anim.i); }
    const kids = [...L.bots.children];
    if (order.every((i, j) => kids[j] === botEls[i].g)) return;
    order.forEach(i => L.bots.appendChild(botEls[i].g));
}

function renderGhost() {
    L.ghost.innerHTML = ''; L.chip.innerHTML = '';
    if (!ghost || mode !== 'wall' || S.winner !== null) { updatePlaceBtn(); return; }
    const res = canPlaceWall(S.players, S.walls, ghost.r, ghost.c, ghost.o);
    ghost.ok = res.ok; ghost.reason = res.reason;
    const R = wallRect(ghost.r, ghost.c, ghost.o);
    const colr = res.ok ? '#22c55e' : '#ef4444';
    const g = el('g', { class: 'holo' }, L.ghost);
    el('rect', { x: R.x - 4, y: R.y - 4, width: R.width + 8, height: R.height + 8, rx: 9, fill: colr, opacity: .45, filter: 'url(#fGlow)' }, g);
    el('rect', { ...R, rx: 6, fill: colr, 'fill-opacity': ghost.pending ? .62 : .42 }, g);
    el('rect', { ...R, rx: 6, fill: 'url(#pScan)' }, g);
    el('rect', { ...R, rx: 6, fill: 'none', stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': ghost.pending ? 'none' : '9 6' }, g);
    if (!res.ok) {
        const cx = R.x + R.width / 2, cy = R.y + R.height / 2;
        el('path', { d: `M${cx - 12} ${cy - 12} L${cx + 12} ${cy + 12} M${cx + 12} ${cy - 12} L${cx - 12} ${cy + 12}`, stroke: '#fff', 'stroke-width': 5, 'stroke-linecap': 'round' }, L.ghost);
    }
    let text;
    if (!res.ok) text = '✖ ' + res.reason;
    else if (ghost.pending) text = 'OK? Press ✔ Place wall';
    else text = 'Click to choose this spot';
    const w = text.length * 15 + 34, h = 46;
    const cx = R.x + R.width / 2, cy = R.y + R.height / 2;
    const x = Math.min(Math.max(cx - w / 2, 6), VB - w - 6);
    let y = cy - (ghost.o === 'V' ? 120 : 60) - h / 2;
    if (y < 6) y = cy + (ghost.o === 'V' ? 120 : 60) - h / 2;
    el('rect', { x, y, width: w, height: h, rx: 23, fill: colr, stroke: '#fff', 'stroke-width': 3 }, L.chip);
    el('text', { x: x + w / 2, y: y + h / 2 + 1, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 24, fill: '#fff' }, L.chip).textContent = text;
    updatePlaceBtn();
}

/* =====================================================================
   PARTICLES (landing dust, wall sparks)
   ===================================================================== */
const parts = [];
let fxRaf = 0, fxLast = 0;
function spawn(x, y, n, kind) {
    if (REDUCED || !L.fx) return;
    for (let j = 0; j < n; j++) {
        const a = kind === 'dust' ? (j % 2 ? 0 : Math.PI) + (Math.random() - .5) * .9 : -Math.PI / 2 + (Math.random() - .5) * 2.6;
        const sp = kind === 'dust' ? 40 + Math.random() * 50 : 120 + Math.random() * 220;
        const e = el('circle', { cx: x, cy: y, r: kind === 'dust' ? 4 + Math.random() * 3 : 2 + Math.random() * 2,
            fill: kind === 'dust' ? '#cbd5e1' : ['#fde68a', '#facc15', '#fb923c', '#fff'][j % 4], opacity: kind === 'dust' ? .5 : 1 }, L.fx);
        parts.push({ e, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * (kind === 'dust' ? .25 : 1), g: kind === 'dust' ? -10 : 520,
            life: 0, max: kind === 'dust' ? .55 : .5 + Math.random() * .3, grow: kind === 'dust' ? 9 : 0, kind });
    }
    if (!fxRaf) { fxLast = performance.now(); fxRaf = requestAnimationFrame(fxLoop); }
}
function fxLoop(now) {
    const dt = Math.min(.05, (now - fxLast) / 1000); fxLast = now;
    for (let j = parts.length - 1; j >= 0; j--) {
        const p = parts[j];
        p.life += dt;
        if (p.life >= p.max || !p.e.isConnected) { p.e.remove(); parts.splice(j, 1); continue; }
        p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        const k = 1 - p.life / p.max;
        p.e.setAttribute('cx', p.x.toFixed(1)); p.e.setAttribute('cy', p.y.toFixed(1));
        p.e.setAttribute('opacity', ((p.kind === 'dust' ? .5 : 1) * k).toFixed(2));
        if (p.grow) p.e.setAttribute('r', (4 + p.grow * (1 - k)).toFixed(1));
    }
    fxRaf = parts.length ? requestAnimationFrame(fxLoop) : 0;
}

/* =====================================================================
   ROBOT MOVEMENT ANIMATION
   crouch → hop/fly along the path → land with a squash, dust and a clank
   ===================================================================== */
const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;

function animateMove(i, from, to, kind, via, onDone) {
    const A = botCenter(from), B = botCenter(to), V = via ? botCenter(via) : null;
    const dur = REDUCED ? 170 : kind === 'step' ? 560 : 780;
    const peak = REDUCED ? 0 : kind === 'step' ? 15 : kind === 'jump' ? 82 : 60;
    const dx = Math.sign(B.x - A.x), dy = Math.sign(B.y - A.y);
    const b = botEls[i];
    const a = { i, A, B, V, dur, peak, kind, dx, dy, onDone, start: performance.now(), landed: false, raf: 0, fallback: 0 };
    anim = a;
    lookAt(i, dx, dy);
    b.g.classList.add('moving');
    b.g.classList.remove('active');
    orderBots();
    if (kind === 'step') sfx.move(dur / 1000); else sfx.jump(dur / 1000);
    const frame = now => {
        if (anim !== a) return;
        const t = Math.min(1, (now - a.start) / a.dur);
        let x = A.x, y = A.y, h = 0, lean = 0, sx = 1, sy = 1;
        if (REDUCED) {
            const u = ease(t); x = A.x + (B.x - A.x) * u; y = A.y + (B.y - A.y) * u;
        } else if (t < .16) {                                  // crouch
            const v = Math.sin((t / .16) * Math.PI / 2); sy = 1 - .14 * v; sx = 1 + .08 * v;
        } else if (t < .84) {                                  // travel
            const u = (t - .16) / .68, e = ease(u);
            if (V) { const m = 1 - e; x = m * m * A.x + 2 * m * e * V.x + e * e * B.x; y = m * m * A.y + 2 * m * e * V.y + e * e * B.y; }
            else { x = A.x + (B.x - A.x) * e; y = A.y + (B.y - A.y) * e; }
            h = peak * Math.sin(Math.PI * u);
            sy = 1.07; sx = .95;
            lean = (dx || 0) * 11 * Math.sin(Math.PI * u);
            if (b.flame) b.flame.setAttribute('opacity', kind === 'step' ? 0 : Math.min(1, Math.sin(Math.PI * u) * 2.2).toFixed(2));
        } else {                                               // land
            x = B.x; y = B.y;
            const v = (t - .84) / .16;
            sy = 1 - .16 * Math.sin(Math.PI * v); sx = 1 + .1 * Math.sin(Math.PI * v);
            if (!a.landed) {
                a.landed = true;
                if (b.flame) b.flame.setAttribute('opacity', 0);
                b.g.classList.remove('moving');
                sfx.land();
                spawn(B.x, B.y + 35, kind === 'step' ? 8 : 14, 'dust');
            }
        }
        setBot(i, x, y, h, lean, sx, sy);
        if (t < 1) a.raf = requestAnimationFrame(frame);
        else finishAnim(true);
    };
    a.raf = requestAnimationFrame(frame);
    // Safety net: if frames stall (background tab, slow PC), land the robot anyway.
    a.fallback = setTimeout(() => { if (anim === a) finishAnim(true); }, dur + 600);
}

// Land the moving robot immediately. runCallback=false is used by Undo/Restart.
function finishAnim(runCallback) {
    const a = anim;
    if (!a) { busy = false; return; }
    anim = null; busy = false;
    cancelAnimationFrame(a.raf); clearTimeout(a.fallback);
    const b = botEls[a.i];
    if (b) {
        b.g.classList.remove('moving');
        if (b.flame) b.flame.setAttribute('opacity', 0);
        setBot(a.i, a.B.x, a.B.y, 0, 0, 1, 1);
        if (runCallback && !a.landed) sfx.land();
        setTimeout(() => { if (!anim || anim.i !== a.i) lookAt(a.i, 0, 0); }, 650);
    }
    if (runCallback && a.onDone) a.onDone();
}

/* =====================================================================
   UI RENDERING (banner, trays, buttons)
   ===================================================================== */
let trayEls = [];

function buildTrays() {
    const L_ = $('sideL'), R_ = $('sideR');
    L_.innerHTML = ''; R_.innerHTML = '';
    trayEls = S.players.map(p => {
        const k = COLORS[p.colorIdx];
        const t = document.createElement('div');
        t.className = 'tray';
        t.style.setProperty('--pc', k.hex);
        t.innerHTML = `
            <div class="tray-head"><div class="tray-bot">${robotIcon(p.colorIdx, 64)}</div>
                <div class="tray-info"><div class="tray-name"></div><div class="tray-edge">Starts ${p.edge} · Goal: ${p.goal} ${ARROW[p.goal]}</div></div></div>
            <div class="tiles" style="grid-template-columns:repeat(${p.wallsTotal},minmax(0,1fr))">${'<div class="tile"></div>'.repeat(p.wallsTotal)}</div>
            <div class="tray-foot"><span class="wcount"></span><span class="pathbadge hidden"></span></div>`;
        t.querySelector('.tray-name').textContent = p.name;
        return t;
    });
    // Left column: left-edge then bottom-edge players. Right column: top-edge then right-edge players.
    const order = { left: 0, bottom: 1, top: 2, right: 3 };
    S.players.map((p, i) => i).sort((a, b) => order[S.players[a].edge] - order[S.players[b].edge]).forEach(i => {
        const e = S.players[i].edge;
        (e === 'left' || e === 'bottom' ? L_ : R_).appendChild(trayEls[i]);
    });
}

function renderTrays() {
    S.players.forEach((p, i) => {
        const t = trayEls[i];
        t.classList.toggle('active', i === S.current && S.winner === null);
        t.classList.toggle('won', i === S.winner);
        t.querySelectorAll('.tile').forEach((tile, j) => tile.classList.toggle('used', j >= p.wallsLeft));
        t.querySelector('.wcount').textContent = p.wallsLeft === 1 ? '1 wall left' : `${p.wallsLeft} walls left`;
        const b = t.querySelector('.pathbadge');
        if (settings.paths) {
            const d = shortestPath(S.walls, p.pos, p.goal);
            b.textContent = `🧭 ${d} step${d === 1 ? '' : 's'}`;
            b.classList.remove('hidden');
        } else b.classList.add('hidden');
    });
}

let bannerFor = -1;
function renderBanner() {
    const p = S.players[S.current], k = COLORS[p.colorIdx];
    const ban = $('banner');
    document.body.style.setProperty('--pc', k.hex);
    document.body.style.setProperty('--pink', k.ink);
    if (bannerFor !== p.colorIdx) { $('bannerIcon').innerHTML = robotIcon(p.colorIdx, 52); bannerFor = p.colorIdx; }
    const moves = legalMoves(S.players, S.walls, S.current);
    if (S.winner !== null) {
        const w = S.players[S.winner];
        $('bannerMain').textContent = `${w.name} wins!`;
        $('bannerSub').textContent = 'Play again, start a new game, or undo.';
    } else {
        $('bannerMain').textContent = `${p.name}'s turn — ${mode === 'wall' ? 'Place a wall' : p.wallsLeft > 0 ? 'Move or place a wall' : 'Move your robot'}`;
        if (!moves.length) $('bannerSub').textContent = p.wallsLeft > 0 ? 'No legal move: place a wall (or pass).' : 'No legal move: pass your turn.';
        else if (mode === 'move') $('bannerSub').textContent = 'Tap a glowing pad to move your robot.';
        else $('bannerSub').textContent = 'Tap or drag to move the wall. Then press ✔ Place wall.';
    }
    $('btnMove').classList.toggle('on', mode === 'move');
    $('btnWall').classList.toggle('on', mode === 'wall');
    const noWalls = p.wallsLeft <= 0;
    $('btnWall').disabled = noWalls || S.winner !== null;
    $('wallLbl').innerHTML = noWalls ? 'Wall <small>0 walls left</small>' : `Wall <small>${p.wallsLeft} left</small>`;
    $('btnMove').disabled = S.winner !== null;
    $('orient').classList.toggle('hidden', mode !== 'wall' || S.winner !== null);
    $('orient').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.o === orientMode));
    $('btnPass').classList.toggle('hidden', !!moves.length || S.winner !== null);
    $('btnUndo').disabled = S.history.length === 0;
    ban.classList.toggle('flash', timeUp);
}

function updatePlaceBtn() {
    const inWall = mode === 'wall' && S.winner === null;
    $('btnPlace').classList.toggle('hidden', !inWall);
    $('btnPlace').disabled = !(inWall && ghost && ghost.pending && ghost.ok);
}

function render() {
    renderBoard();
    renderTrays();
    renderBanner();
    renderTimer();
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function pushHistory() { S.history.push(snapshot()); if (S.history.length > 300) S.history.shift(); }

// Rules state changes at once (so the game logic never waits on graphics);
// the board, banner and win screen update when the robot lands.
function doMove(dest) {
    if (busy || S.winner !== null) return;
    const i = S.current, p = S.players[i];
    pushHistory();
    const from = { ...p.pos };
    S.last = { type: 'move', from, player: i };
    p.pos = { r: dest.r, c: dest.c };
    const kind = dest.kind || (Math.abs(dest.r - from.r) + Math.abs(dest.c - from.c) === 1 ? 'step' : 'jump');
    let via = null;
    if (kind === 'side') {
        via = [{ r: from.r, c: dest.c }, { r: dest.r, c: from.c }]
            .find(q => S.players.some((o, j) => j !== i && o.pos.r === q.r && o.pos.c === q.c)) || null;
    }
    const won = atGoal(p.goal, p.pos);
    mode = 'move'; ghost = null;
    if (won) S.winner = i;
    else { S.current = (S.current + 1) % S.n; resetTimer(); }
    busy = true;
    L.hl.innerHTML = '';
    renderGhost();
    animateMove(i, from, p.pos, kind, via, () => {
        render();
        if (won) showWin(); else sfx.turn();
    });
}

function tryPlaceWall(r, c, o) {
    if (busy || S.winner !== null) return false;
    const p = S.players[S.current];
    if (p.wallsLeft <= 0) { sfx.buzz(); return false; }
    const res = canPlaceWall(S.players, S.walls, r, c, o);
    if (!res.ok) { sfx.buzz(); flashChip(); return false; }
    pushHistory();
    const k = wkey(r, c, o);
    S.walls.set(k, S.current);
    p.wallsLeft--;
    S.last = { type: 'wall', key: k, player: S.current };
    justPlaced = k;
    const R = wallRect(r, c, o);
    const impact = REDUCED ? 0 : 200;
    setTimeout(() => { sfx.wall(); spawn(R.x + R.width / 2, R.y + R.height / 2, 18, 'spark'); }, impact);
    nextTurn();
    return true;
}

function nextTurn() {
    S.current = (S.current + 1) % S.n;
    mode = 'move'; ghost = null;
    resetTimer();
    render();
}

function passTurn() {
    if (busy || S.winner !== null || legalMoves(S.players, S.walls, S.current).length) return;
    pushHistory();
    S.last = null;
    nextTurn();
}

function undo() {
    finishAnim(false);
    if (!S.history.length) { sfx.buzz(); return; }
    restore(S.history.pop());
    S.winner = null;
    $('winOv').classList.remove('show');
    mode = 'move'; ghost = null;
    sfx.select();
    resetTimer();
    render();
}

function setMode(m) {
    if (busy || S.winner !== null) return;
    if (m === 'wall' && S.players[S.current].wallsLeft <= 0) { sfx.buzz(); return; }
    if (mode !== m) sfx.select();
    mode = m; ghost = null;
    render();
}

function setOrient(o) {
    orientMode = o;
    if (ghost && o !== 'auto') { ghost.o = o; ghost.since = performance.now(); }
    renderBanner(); renderGhost();
}
function rotate() {
    if (mode !== 'wall') return;
    const curO = ghost ? ghost.o : (orientMode === 'auto' ? 'V' : orientMode);
    setOrient(curO === 'H' ? 'V' : 'H');
    sfx.select();
}

let chipTimer = null;
function flashChip() {
    L.chip.style.transition = 'none';
    L.chip.style.opacity = '.2';
    clearTimeout(chipTimer);
    chipTimer = setTimeout(() => { L.chip.style.transition = 'opacity .15s'; L.chip.style.opacity = '1'; }, 90);
}

/* =====================================================================
   POINTER INPUT
   ===================================================================== */
function svgPoint(evt) {
    const ctm = board.getScreenCTM();
    if (!ctm) return { x: 0, y: 0 };
    const pt = board.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const q = pt.matrixTransform(ctm.inverse());
    return { x: q.x, y: q.y };
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Nearest wall slot to a point. Orientation: manual lock, or inferred from the nearer groove.
function slotAt(x, y) {
    const c = clamp(Math.round((x - M - C - G / 2) / P), 0, N - 2);
    const r = clamp(Math.round((y - M - C - G / 2) / P), 0, N - 2);
    let o = orientMode;
    if (o === 'auto') {
        const kx = clamp(Math.round((x - M + G / 2) / P), 1, N - 1), dV = Math.abs(x - (M + kx * P - G / 2));
        const ky = clamp(Math.round((y - M + G / 2) / P), 1, N - 1), dH = Math.abs(y - (M + ky * P - G / 2));
        const near = G / 2 + 6;
        if (dV < near && dH < near) o = ghost ? ghost.o : 'H';
        else o = dV < dH ? 'V' : 'H';
    }
    return { r, c, o };
}
function cellAt(x, y) {
    const c = Math.floor((x - M + G / 2) / P), r = Math.floor((y - M + G / 2) / P);
    return inBounds(r, c) ? { r, c } : null;
}

board.addEventListener('contextmenu', e => { e.preventDefault(); });

let dragging = null; // pointerId while a finger/pen/mouse button is down in wall mode

function setPreview(s, ptr) {
    if (ghost && ghost.pending && ghost.r === s.r && ghost.c === s.c && ghost.o === s.o) return;
    const moved = !!ghost && ghost.pending;
    ghost = { ...s, since: performance.now(), pending: true, ptr };
    if (moved) sfx.preview();
    renderGhost();
}

board.addEventListener('pointermove', e => {
    if (!S || mode !== 'wall' || S.winner !== null || busy) return;
    const { x, y } = svgPoint(e);
    const s = slotAt(x, y);
    if (dragging === e.pointerId) { setPreview(s, e.pointerType); return; }
    // Mouse hover only: show a faint preview, but never replace a chosen (pending) wall.
    if (e.pointerType !== 'mouse' || (ghost && ghost.pending)) return;
    if (!ghost || ghost.r !== s.r || ghost.c !== s.c || ghost.o !== s.o) {
        ghost = { ...s, since: performance.now(), pending: false, ptr: 'mouse' };
        renderGhost();
    }
});
const endDrag = e => { if (dragging === e.pointerId) dragging = null; };
board.addEventListener('pointerup', endDrag);
board.addEventListener('pointercancel', endDrag);
board.addEventListener('pointerleave', e => {
    if (e.pointerType === 'mouse' && ghost && !ghost.pending) { ghost = null; renderGhost(); }
});

board.addEventListener('pointerdown', e => {
    if (!S || S.winner !== null || busy || anyOverlayOpen()) return;
    if (e.button === 2) { e.preventDefault(); rotate(); return; }
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const { x, y } = svgPoint(e);
    ac(); // unlock audio on first gesture
    if (mode === 'move') {
        const sq = cellAt(x, y);
        if (!sq) return;
        const m = legalMoves(S.players, S.walls, S.current).find(m => m.r === sq.r && m.c === sq.c);
        if (m) doMove(m);
        return;
    }
    // Wall mode: a tap (or drag) only moves the preview. Nothing is placed until ✔ Place wall.
    dragging = e.pointerId;
    try { board.setPointerCapture(e.pointerId); } catch (err) {}
    const s = slotAt(x, y);
    const fresh = !ghost || !ghost.pending;
    setPreview(s, e.pointerType);
    if (fresh) sfx.select();
});

/* =====================================================================
   TIMER (never skips a turn: teacher is the referee)
   ===================================================================== */
function anyOverlayOpen() { return ['setup', 'rulesOv', 'winOv', 'confirmOv'].some(id => $(id).classList.contains('show')); }
function resetTimer() {
    timeUp = false;
    timerLeft = settings.timer;
    $('banner').classList.remove('flash');
    renderTimer();
}
function renderTimer() {
    const t = $('timer');
    t.classList.toggle('hidden', !settings.timer || !S);
    if (!settings.timer) return;
    t.textContent = timeUp ? '⏰ 0' : `⏱ ${timerLeft}`;
    t.classList.toggle('low', timerLeft <= 10);
}
function tick() {
    if (!S || !settings.timer || S.winner !== null || timeUp || anyOverlayOpen()) return;
    timerLeft = Math.max(0, timerLeft - 1);
    if (timerLeft === 0) {
        timeUp = true;
        sfx.timeout();
        const b = $('banner'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    } else if (timerLeft <= 5) { try { tone(1000, 0.04, 'sine', 0.05); } catch (e) {} }
    renderTimer();
}
timerId = setInterval(tick, 1000);

/* =====================================================================
   OVERLAYS: setup, rules, win, confirm
   ===================================================================== */
function buildNameFields() {
    const box = $('nameFields');
    box.innerHTML = '';
    SEATS[settings.n].forEach(seat => {
        const row = document.createElement('div');
        row.className = 'nameRow';
        row.style.setProperty('--pc', COLORS[seat.color].hex);
        row.innerHTML = `${robotIcon(seat.color, 42)}<input maxlength="14" aria-label="${COLORS[seat.color].name} player name"><span class="edge">starts ${seat.edge}</span>`;
        const inp = row.querySelector('input');
        inp.value = settings.names[seat.color];
        inp.addEventListener('input', () => {
            settings.names[seat.color] = inp.value;
            if (seat.color === 0) $('firstLbl').textContent = `${inp.value.trim() || 'Red'} first`;
        });
        box.appendChild(row);
    });
    $('firstLbl').textContent = `${(settings.names[0] || 'Red').trim() || 'Red'} first`;
    $('setupBots').innerHTML = SEATS[settings.n].map(s => robotIcon(s.color, 58)).join('');
}
function bindSeg(id, fn) {
    $(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        fn(b.dataset.v); sfx.select();
    }));
}
bindSeg('segN', v => { settings.n = +v; buildNameFields(); });
bindSeg('segFirst', v => { settings.randomFirst = v === '1'; });
bindSeg('segTimer', v => { settings.timer = +v; });
bindSeg('segPaths', v => { settings.paths = v === '1'; });

function clearFx() { parts.splice(0).forEach(p => p.e.remove()); $('confetti').innerHTML = ''; }

function startGame() {
    finishAnim(false);
    clearFx();
    S = newState();
    mode = 'move'; ghost = null; orientMode = 'auto'; bannerFor = -1;
    buildBoard(); buildTrays();
    $('setup').classList.remove('show');
    $('winOv').classList.remove('show');
    $('btnPaths').classList.toggle('on', settings.paths);
    resetTimer();
    render();
}
$('startBtn').addEventListener('click', () => { ac(); sfx.select(); startGame(); });

function openSetup() {
    finishAnim(false);
    $('winOv').classList.remove('show');
    document.querySelectorAll('#segN button').forEach(b => b.classList.toggle('on', +b.dataset.v === settings.n));
    buildNameFields();
    $('setup').classList.add('show');
}
function inProgress() { return S && S.history.length > 0 && S.winner === null; }
function askConfirm(msg, yesLabel, onYes) {
    $('confirmMsg').textContent = msg;
    $('confirmYes').textContent = yesLabel;
    $('confirmOv').classList.add('show');
    $('confirmYes').onclick = () => { $('confirmOv').classList.remove('show'); onYes(); };
    $('confirmNo').onclick = () => $('confirmOv').classList.remove('show');
}

function confetti(hexes) {
    if (REDUCED) return;
    const box = $('confetti');
    box.innerHTML = '';
    for (let j = 0; j < 70; j++) {
        const c = document.createElement('i');
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = hexes[j % hexes.length];
        c.style.setProperty('--dx', (Math.random() * 30 - 15) + 'vw');
        c.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
        c.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
        c.style.animationDelay = (Math.random() * .5) + 's';
        if (j % 3 === 0) { c.style.width = '8px'; c.style.height = '8px'; c.style.borderRadius = '50%'; }
        box.appendChild(c);
    }
    setTimeout(() => { box.innerHTML = ''; }, 4500);
}

function showWin() {
    if (S.winner === null) return;
    $('rulesOv').classList.remove('show');
    $('confirmOv').classList.remove('show');
    const w = S.players[S.winner], k = COLORS[w.colorIdx];
    $('winIcon').innerHTML = robotIcon(w.colorIdx, 170, 'big celebrate');
    $('winIcon').style.setProperty('--wc', k.hex);
    $('winTitle').textContent = `🏆 ${w.name} wins!`;
    $('winTitle').style.color = k.hex;
    $('winSub').textContent = `${w.name}'s robot reached the ${w.goal} side of the board.`;
    $('winOv').classList.add('show');
    renderBoard();
    sfx.win();
    confetti([k.hex, k.light, '#ffffff', '#22d3ee', '#facc15']);
    console.log(`Maze Race: ${w.name} wins`);
}
$('winUndo').addEventListener('click', undo);
$('winAgain').addEventListener('click', () => { sfx.select(); startGame(); });
$('winNew').addEventListener('click', () => { sfx.select(); openSetup(); });

/* ---------- Rules panel (A2–B1 English, illustrated) ---------- */
function mini(spec) {
    const n = spec.n || 3, c = 40, g = 8, p = c + g, m = 8, w = n * c + (n - 1) * g + 2 * m;
    const x = i => m + i * p;
    let s = `<svg viewBox="0 0 ${w} ${w}" xmlns="${SVGNS}"><rect width="${w}" height="${w}" rx="10" style="fill:var(--groove)"/>`;
    for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) s += `<rect x="${x(cc)}" y="${x(r)}" width="${c}" height="${c}" rx="5" fill="url(#gPlate)"/>`;
    for (const d of spec.dots || []) s += `<circle cx="${x(d.c) + c / 2}" cy="${x(d.r) + c / 2}" r="14" fill="#22c55e" opacity=".35"/><circle cx="${x(d.c) + c / 2}" cy="${x(d.r) + c / 2}" r="16" fill="none" stroke="#22c55e" stroke-width="4" stroke-dasharray="7 4"/>`;
    for (const d of spec.nos || []) { const cx = x(d.c) + c / 2, cy = x(d.r) + c / 2; s += `<path d="M${cx - 9} ${cy - 9}L${cx + 9} ${cy + 9}M${cx + 9} ${cy - 9}L${cx - 9} ${cy + 9}" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>`; }
    for (const wl of spec.walls || []) {
        const st = wl.bad ? 'fill:#ef4444;opacity:.85' : 'fill:url(#pHazard);stroke:#0b1120;stroke-width:1.5';
        if (wl.o === 'H') s += `<rect x="${x(wl.c) + 1}" y="${x(wl.r) + c - 2}" width="${2 * c + g - 2}" height="${g + 4}" rx="3" style="${st}"/>`;
        else s += `<rect x="${x(wl.c) + c - 2}" y="${x(wl.r) + 1}" width="${g + 4}" height="${2 * c + g - 2}" rx="3" style="${st}"/>`;
    }
    for (const pw of spec.pawns || []) s += `<g transform="translate(${x(pw.c) + c / 2} ${x(pw.r) + c / 2}) scale(.42)">${robotParts(pw.k)}</g>`;
    return s + '</svg>';
}
function buildRules() {
    const four = S && S.n === 4;
    const per = S ? S.players[0].wallsTotal : (settings.n === 2 ? 10 : 5);
    const rules = [
        ['🎯 The goal', '<p>Be the <b>first</b> robot to reach the other side of the board. The glowing dock shows where each robot must go.</p>',
            mini({ n: 3, pawns: [{ r: 2, c: 1, k: 0 }], dots: [{ r: 0, c: 0 }, { r: 0, c: 1 }, { r: 0, c: 2 }] })],
        ['🔁 Your turn', `<p>Do <b>one</b> thing: <b>move</b> your robot <b>or</b> place a <b>wall</b>.</p><p>Each player has ${per} walls. No walls left? Then you must move.</p>`,
            mini({ n: 3, pawns: [{ r: 1, c: 1, k: 1 }], walls: [{ r: 0, c: 0, o: 'H' }] })],
        ['🤖 Moving', '<p>Move <b>one square</b>: up, down, left or right.</p><p>You <b>cannot</b> move diagonally. You <b>cannot</b> go through a wall.</p>',
            mini({ n: 3, pawns: [{ r: 1, c: 1, k: 0 }], walls: [{ r: 1, c: 0, o: 'H' }], dots: [{ r: 0, c: 1 }, { r: 1, c: 0 }, { r: 1, c: 2 }], nos: [{ r: 2, c: 1 }] })],
        ['🚀 Jumping', '<p>Is another robot <b>next to you</b>? You can <b>jump over it</b>.</p><p>Jumping is never required.</p>',
            mini({ n: 3, pawns: [{ r: 2, c: 1, k: 0 }, { r: 1, c: 1, k: 1 }], dots: [{ r: 0, c: 1 }, { r: 2, c: 0 }, { r: 2, c: 2 }] })],
        ['↗ Side jump', `<p>Is there a <b>wall behind</b> that robot? Then you can move to its <b>left or right</b> side.</p><p class="note">In this game, the <b>edge of the board</b> or <b>another robot</b> behind it counts like a wall too (the common online rule).${four ? ' You can only jump over <b>one</b> robot at a time.' : ''}</p>`,
            mini({ n: 3, pawns: [{ r: 2, c: 1, k: 0 }, { r: 1, c: 1, k: 1 }], walls: [{ r: 0, c: 1, o: 'H' }], dots: [{ r: 1, c: 0 }, { r: 1, c: 2 }], nos: [{ r: 0, c: 1 }] })],
        ['🚧 Walls', '<p>A wall is <b>two squares</b> long. Put it in the grooves between squares.</p><p>Walls <b>cannot overlap</b> and <b>cannot cross</b>. You cannot move or remove a wall.</p>',
            mini({ n: 3, walls: [{ r: 0, c: 0, o: 'H' }, { r: 0, c: 0, o: 'V', bad: true }] })],
        ['🚫 Never close the road', '<p>Every robot must <b>always</b> have a way to its goal — <b>your own robot too</b>.</p><p>The game will not let you place a wall that closes the road.</p>',
            mini({ n: 3, pawns: [{ r: 2, c: 0, k: 0 }], walls: [{ r: 1, c: 0, o: 'H' }, { r: 0, c: 1, o: 'V', bad: true }] })]
    ];
    $('rulesCard').innerHTML = `
        <button class="btn closeX" id="rulesClose">✕ Close</button>
        <h2>📖 How to play Maze Race</h2>
        ${rules.map(([h, b, svg]) => `<div class="rule"><div><h3>${h}</h3>${b}</div>${svg}</div>`).join('')}
        <div class="rule"><div><h3>🖐️ Controls</h3>
            <p><b>🤖 Move</b> (M): tap a glowing pad.</p>
            <p><b>🚧 Wall</b> (W): tap near a groove to see the wall. Tap somewhere else or drag to move it. When it is right, press <b>✔ Place wall</b>. Green = OK. Red = not allowed.</p>
            <p><b>Auto / ↔ / ↕</b> (R or right-click): turn the wall. <b>↶ Undo</b> (U) takes back the last action.</p>
            <div class="legend">${COLORS.map(k => `<span>${k.letter} = ${k.name}, ${k.head}</span>`).join('')}</div>
        </div><div></div></div>`;
    $('rulesClose').addEventListener('click', closeRules);
}
function openRules() { buildRules(); $('rulesOv').classList.add('show'); }
function closeRules() { $('rulesOv').classList.remove('show'); }
$('rulesOv').addEventListener('pointerdown', e => { if (e.target.id === 'rulesOv') closeRules(); });

/* =====================================================================
   BUTTONS, THEME, KEYBOARD
   ===================================================================== */
// Fallback only: the shared leaf.v1.js (HUBGEN:leaf) replaces window.toggleTheme
// with the ecosystem-wide dark/light/system cycle on the arschul:theme key.
function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    html.setAttribute('data-theme', next);
    try { localStorage.setItem('arschul:theme', next); } catch (e) {}
}
function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('mazerace:mute', muted ? '1' : '0'); } catch (e) {}
    $('btnMute').textContent = muted ? '🔇' : '🔊';
    if (!muted) sfx.select();
}
function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}

$('btnMove').addEventListener('click', () => setMode('move'));
$('btnWall').addEventListener('click', () => setMode('wall'));
$('orient').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setOrient(b.dataset.o); sfx.select(); }));
$('btnPlace').addEventListener('click', () => { if (ghost) tryPlaceWall(ghost.r, ghost.c, ghost.o); });
$('btnPass').addEventListener('click', passTurn);
$('btnUndo').addEventListener('click', undo);
$('btnRules').addEventListener('click', openRules);
$('setupRules').addEventListener('click', openRules);
$('btnPaths').addEventListener('click', () => {
    settings.paths = !settings.paths;
    $('btnPaths').classList.toggle('on', settings.paths);
    document.querySelectorAll('#segPaths button').forEach(b => b.classList.toggle('on', (b.dataset.v === '1') === settings.paths));
    if (S) renderTrays();
});
$('btnMute').addEventListener('click', toggleMute);
$('btnFull').addEventListener('click', toggleFull);
$('btnRestart').addEventListener('click', () => askConfirm('Restart this game? The board will be cleared.', '🔄 Restart', startGame));
$('btnNew').addEventListener('click', () => inProgress() ? askConfirm('Leave this game and go back to setup?', '⚙ New game', openSetup) : openSetup());

document.addEventListener('keydown', e => {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') {
        if (e.key === 'Enter' && $('setup').classList.contains('show')) startGame();
        return;
    }
    const k = e.key.toLowerCase();
    if (k === 'escape') {
        if ($('confirmOv').classList.contains('show')) $('confirmOv').classList.remove('show');
        else if ($('rulesOv').classList.contains('show')) closeRules();
        else if (ghost) { ghost = null; renderGhost(); }
        return;
    }
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (S && !$('setup').classList.contains('show')) undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if ($('setup').classList.contains('show')) { if (k === 'enter') startGame(); return; }
    if ($('confirmOv').classList.contains('show') || $('rulesOv').classList.contains('show')) return;
    if (k === 'u') undo();
    else if (k === 'h') openRules();
    else if ($('winOv').classList.contains('show')) return;
    else if (k === 'm') setMode('move');
    else if (k === 'w') setMode('wall');
    else if (k === 'r') rotate();
    else if (k === 'a' && mode === 'wall') { setOrient('auto'); sfx.select(); }
    else if (k === 'enter' && ghost && ghost.pending) tryPlaceWall(ghost.r, ghost.c, ghost.o);
});

/* =====================================================================
   INIT: draw a preview board behind the setup screen (never blank)
   ===================================================================== */
runSelfTests();
buildDefs();
$('titleBot').innerHTML = robotIcon(0, 38);
$('btnMute').textContent = muted ? '🔇' : '🔊';
buildNameFields();
S = newState();
buildBoard(); buildTrays(); resetTimer(); render();
</script>
