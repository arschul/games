<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Up! — Team Ranking Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Red+Hat+Text:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --s:1;
  --display:'Titan One','Arial Black',sans-serif;
  --ui:'Red Hat Text','Segoe UI',sans-serif;
  /* diner materials (same in both themes) */
  --paper:#f4ecd8;--paper-lo:#ddd0b2;--ink:#2a2420;
  --steel:#b9c3c9;--steel-hi:#e3e9ec;--steel-lo:#7d8a92;--steel-dk:#4c575d;
  --mustard:#e8b13a;--mustard-lo:#a8761a;
  --ketchup:#e23b2e;--ketchup-lo:#9e1f16;
  --pickle:#3dbb73;--pickle-lo:#227a47;
  --amber:#ff9a3c;
  --felt:#151515;--felt-line:#0a0a0a;--peg:#f7f4ee;
  /* scene: late-night kitchen */
  --wall-a:#0e1b20;--wall-b:#14282e;--grout:rgba(0,0,0,.35);--tile-hi:rgba(160,230,230,.05);
  --lamp:rgba(255,154,60,.20);--scene-ink:#eef3f4;--scene-muted:#9fb3b8;--floor-a:#1a1a1a;--floor-b:#e9e4da;
  --neon:#ff4b3e;--neon-glow:rgba(255,75,62,.75);
}
:root[data-theme="light"]{
  --wall-a:#cfe6e2;--wall-b:#e5f2ef;--grout:rgba(40,80,80,.16);--tile-hi:rgba(255,255,255,.5);
  --lamp:rgba(255,214,120,.30);--scene-ink:#13262b;--scene-muted:#41595f;--floor-a:#2b2b2b;--floor-b:#f4efe6;
  --neon:#d8261b;--neon-glow:rgba(216,38,27,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05090b}
:root[data-theme="light"] body{background:#9fbcb7}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:4px solid var(--mustard);outline-offset:3px}

#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:hidden;
  font-family:var(--ui);color:var(--scene-ink);
  background:
    radial-gradient(ellipse 34% 26% at 50% 0%,var(--lamp),transparent 70%),
    radial-gradient(ellipse 22% 20% at 16% 0%,var(--lamp),transparent 70%),
    radial-gradient(ellipse 22% 20% at 84% 0%,var(--lamp),transparent 70%),
    linear-gradient(90deg,var(--grout) 0 2px,transparent 2px) 0 0/64px 32px,
    linear-gradient(180deg,var(--grout) 0 2px,var(--tile-hi) 2px 4px,transparent 4px) 0 0/64px 32px,
    linear-gradient(180deg,var(--wall-b),var(--wall-a))}
/* checker floor strip behind the bottom bar */
#stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:128px;pointer-events:none;z-index:0;opacity:.5;
  background:conic-gradient(var(--floor-a) 25%,var(--floor-b) 0 50%,var(--floor-a) 0 75%,var(--floor-b) 0) 0 0/64px 64px;
  -webkit-mask:linear-gradient(180deg,transparent,#000 70%);mask:linear-gradient(180deg,transparent,#000 70%)}
#shaker{position:absolute;inset:0;z-index:1;will-change:transform}
#fx{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:60}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:55;background:radial-gradient(ellipse at center,rgba(226,59,46,0) 30%,rgba(226,59,46,.55) 75%,rgba(160,20,10,.85))}

/* ── top bar ── */
#top{position:absolute;left:0;right:0;top:0;height:96px;display:flex;align-items:center;gap:18px;padding:0 34px;z-index:20}
.back-link{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;text-decoration:none;font:700 20px var(--ui);color:var(--scene-ink);
  background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.14)}
:root[data-theme="light"] .back-link{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.12)}
.neon{font:400 58px/1 var(--display);color:#fff6ef;letter-spacing:1px;margin-left:8px;
  text-shadow:0 0 4px #fff,0 0 12px var(--neon),0 0 26px var(--neon-glow),0 0 48px var(--neon-glow);-webkit-text-stroke:2px var(--neon)}
:root[data-theme="light"] .neon{color:var(--neon);-webkit-text-stroke:0;text-shadow:0 3px 0 #fff,0 0 18px var(--neon-glow)}
.neon b{font-weight:400;color:#fff3c9;-webkit-text-stroke-color:var(--amber);text-shadow:0 0 4px #fff,0 0 12px var(--amber),0 0 26px rgba(255,154,60,.7)}
:root[data-theme="light"] .neon b{color:var(--mustard-lo);-webkit-text-stroke:0;text-shadow:0 3px 0 #fff}
.spacer{flex:1}
.ib{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#22292d;
  background:radial-gradient(circle at 35% 28%,#fff,var(--steel) 45%,var(--steel-lo));
  box-shadow:0 4px 0 var(--steel-dk),0 8px 14px rgba(0,0,0,.4),inset 0 1px 0 #fff;transition:transform .1s,box-shadow .1s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--steel-dk),0 4px 8px rgba(0,0,0,.4)}
.ib svg{width:28px;height:28px}
.ib.off{opacity:.5}
.ib.txt{font:400 28px var(--display)}
#dial{position:relative;width:104px;height:104px;margin-left:8px;flex:none}
#dial .bezel{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,var(--steel) 40%,var(--steel-dk));box-shadow:0 6px 14px rgba(0,0,0,.5)}
#dial .face{position:absolute;inset:9px;border-radius:50%;background:conic-gradient(var(--dc,var(--ketchup)) calc(var(--f,1)*360deg),var(--paper) 0);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}
#dial .hub{position:absolute;inset:26px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:400 22px var(--display);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.35)}
#dial.warn{animation:rattle .25s linear infinite}
#dial.paused .hub{color:var(--mustard-lo)}
@keyframes rattle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* ── order ticket (header) ── */
#order{position:absolute;left:400px;top:106px;width:1120px;height:108px;z-index:6;display:flex;align-items:center;gap:22px;padding:0 30px 0 26px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 26px,rgba(0,0,0,.035) 26px 27px),var(--paper);color:var(--ink);border-radius:6px;
  box-shadow:0 4px 0 var(--paper-lo),0 16px 28px rgba(0,0,0,.45);transform:rotate(-.4deg)}
#order::before{content:"";position:absolute;left:50%;top:-18px;width:140px;height:30px;transform:translateX(-50%);border-radius:8px;
  background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo));box-shadow:0 3px 6px rgba(0,0,0,.4)}
#order::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:9px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/16px 9px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/16px 9px}
#order .who{display:flex;align-items:center;gap:12px;flex:none;padding-right:22px;border-right:3px dashed rgba(42,36,32,.25);height:70%}
#order .who .emb{width:62px;height:62px;font-size:36px}
#order .who span{font:400 30px var(--display)}
#order .cat{flex:1;font:900 38px/1.12 var(--ui);text-align:center;padding-right:40px}
#order .asof{display:inline-block;margin-left:12px;padding:3px 12px;border-radius:999px;background:rgba(42,36,32,.1);font:700 20px var(--ui);vertical-align:middle;white-space:nowrap}
#order .num{position:absolute;right:16px;bottom:10px;font:700 16px var(--ui);opacity:.45}

/* team emblem disc */
.emb{display:inline-grid;place-items:center;border-radius:50%;flex:none;line-height:1;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,var(--tc),color-mix(in srgb,var(--tc) 55%,#000) 110%);
  box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 45%,#000),0 6px 10px rgba(0,0,0,.4),inset 0 -3px 5px rgba(0,0,0,.2)}

/* ── printer + tray ── */
#printer{position:absolute;left:40px;top:232px;width:540px;height:66px;border-radius:14px;z-index:3;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:linear-gradient(180deg,#3d474d,#20272b);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 20px rgba(0,0,0,.4);color:#dfe6e9}
#printer .slotline{position:absolute;left:30px;right:30px;bottom:6px;height:6px;border-radius:3px;background:#05080a;box-shadow:inset 0 2px 3px #000}
#printer .roll{width:44px;height:44px;border-radius:50%;flex:none;background:radial-gradient(circle,#6b5a3c 0 18%,var(--paper) 20% 70%,var(--paper-lo) 72%);box-shadow:0 2px 4px rgba(0,0,0,.5)}
#printer span{font:400 26px var(--display)}
#printer .led{margin-left:auto;width:14px;height:14px;border-radius:50%;background:#3a0a08;box-shadow:inset 0 1px 2px #000}
#printer.busy .led{background:#ff5a3c;box-shadow:0 0 10px #ff5a3c}
.tslot{position:absolute;left:52px;width:516px;border-radius:10px;border:3px dashed rgba(255,255,255,.12);z-index:2}
:root[data-theme="light"] .tslot{border-color:rgba(0,0,0,.14)}

/* ── the rack (hero) ── */
#rack{position:absolute;left:640px;top:232px;width:640px;height:700px;border-radius:20px;z-index:2;
  background:
    repeating-linear-gradient(180deg,rgba(255,255,255,.07) 0 1px,rgba(0,0,0,.035) 1px 3px,rgba(255,255,255,0) 3px 5px),
    radial-gradient(ellipse 80% 40% at 30% 10%,rgba(255,255,255,.35),transparent 70%),
    linear-gradient(180deg,#cfd7db,#98a4ab 60%,#7f8b92);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.25),0 26px 50px rgba(0,0,0,.5),0 0 0 4px #5f6a70}
#rack .rv{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8c979d 60%,#4a545a);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.axp{position:absolute;left:150px;width:340px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:3;
  background:linear-gradient(180deg,#fffaf0,var(--paper));color:var(--ketchup-lo);font:400 26px var(--display);
  box-shadow:0 3px 0 var(--paper-lo),0 6px 10px rgba(0,0,0,.3),inset 0 0 0 3px var(--ketchup)}
.axp i{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent}
.axp.top{top:-14px}.axp.top i{border-bottom:18px solid var(--ketchup)}
.axp.bot{bottom:-14px}.axp.bot i{border-top:18px solid var(--ketchup)}
.groove{position:absolute;left:12px;width:616px;border-radius:12px;z-index:2;
  background:linear-gradient(180deg,#232a2e,#39444a);box-shadow:inset 0 5px 9px rgba(0,0,0,.75),inset 0 -1px 0 rgba(255,255,255,.12),0 1px 0 rgba(255,255,255,.55)}
.groove .rk{position:absolute;left:8px;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;font:400 28px var(--display);color:var(--ink);
  background:radial-gradient(circle at 35% 28%,#fff,var(--paper) 55%,var(--paper-lo));box-shadow:0 3px 0 #8f8266,0 5px 8px rgba(0,0,0,.5)}
.groove:first-of-type .rk{background:radial-gradient(circle at 35% 28%,#fff6d8,var(--mustard) 55%,var(--mustard-lo))}
.groove.can{box-shadow:inset 0 5px 9px rgba(0,0,0,.75),0 0 0 4px var(--mustard),0 0 22px rgba(232,177,58,.6)}
.groove.over{background:linear-gradient(180deg,#4a3a17,#6b5320);box-shadow:inset 0 5px 9px rgba(0,0,0,.6),0 0 0 5px var(--mustard),0 0 30px rgba(232,177,58,.8)}
.groove .gs{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-7deg);font:400 28px var(--display);color:var(--ketchup);border:5px double var(--ketchup);border-radius:8px;padding:2px 12px;opacity:0}
.groove.empty-stamp .gs{opacity:.9}

/* ── tickets ── */
#tickets{position:absolute;inset:0;z-index:7;pointer-events:none}
.tk{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;padding:0 18px 0 36px;border-radius:5px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 23px,rgba(0,0,0,.04) 23px 24px),linear-gradient(180deg,#fffaf0,var(--paper));
  color:var(--ink);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 3px 0 var(--paper-lo),0 10px 16px rgba(0,0,0,.42);transition:width .3s,height .3s,box-shadow .15s,filter .2s,opacity .25s}
.tk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;border-radius:5px 0 0 5px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 5px,rgba(255,255,255,0) 5px 10px),var(--tc,var(--mustard))}
.tk::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/14px 8px}
.tk .tx{font-weight:700;line-height:1.1;flex:1;min-width:0;overflow-wrap:anywhere}
.tk .no{position:absolute;right:10px;top:5px;font:700 13px var(--ui);opacity:.38}
.tk.inrack .tx{padding-right:108px}
.tk.sel{z-index:3;box-shadow:0 3px 0 var(--paper-lo),0 16px 26px rgba(0,0,0,.5),0 0 0 5px var(--mustard),0 0 28px rgba(232,177,58,.7);transform:translateY(-5px)}
.tk.drag{z-index:5;cursor:grabbing;transition:width .3s,height .3s;box-shadow:0 26px 40px rgba(0,0,0,.55),0 0 0 5px var(--mustard);transform:rotate(2deg) scale(1.04)}
.tk.locked{cursor:default}
.tk.unused{opacity:.45;filter:grayscale(.6)}
.tk.squash{animation:squash .28s ease-out;transform-origin:50% 100%}
@keyframes squash{0%{transform:scale(1.06,.86)}50%{transform:scale(.97,1.04)}100%{transform:none}}
.tk .stamp{position:absolute;right:14px;top:50%;font:400 26px/1 var(--display);padding:6px 12px;border-radius:8px;border:5px double currentColor;opacity:0;transform:translateY(-50%) rotate(-9deg);pointer-events:none;background:rgba(255,255,255,.35)}
.tk.right .stamp{color:var(--pickle-lo);opacity:.95}
.tk.wrong .stamp{color:var(--ketchup);opacity:.95}
.tk.fixed{box-shadow:0 3px 0 var(--paper-lo),0 10px 16px rgba(0,0,0,.42),0 0 0 4px var(--ketchup)}
.tk.fixed .stamp{color:var(--ketchup);opacity:.95}

/* ── side column ── */
#side{position:absolute;left:1330px;top:232px;width:550px;height:700px;z-index:4}
.panel{position:absolute;inset:0;border-radius:20px;padding:26px 28px;background:linear-gradient(180deg,rgba(10,18,22,.72),rgba(10,18,22,.6));border:2px solid rgba(255,255,255,.08);box-shadow:0 18px 40px rgba(0,0,0,.35)}
:root[data-theme="light"] .panel{background:linear-gradient(180deg,rgba(255,255,255,.82),rgba(255,255,255,.7));border-color:rgba(0,0,0,.08)}
.panel h2{font:400 36px/1.1 var(--display);margin-bottom:6px}
.panel .sub{font:500 22px/1.3 var(--ui);color:var(--scene-muted);margin-bottom:18px}
.trow{display:flex;align-items:center;gap:16px;padding:12px 16px;border-radius:14px;margin-bottom:10px;position:relative}
.trow .emb{width:58px;height:58px;font-size:32px}
.trow .nm{flex:1;font:700 30px/1.1 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .sc{font:400 42px var(--display)}
.trow.cur{background:rgba(232,177,58,.16);box-shadow:inset 0 0 0 3px var(--mustard)}
.trow .tag{position:absolute;right:14px;top:-11px;padding:2px 12px;border-radius:999px;background:var(--mustard);color:#2a1d05;font:700 16px var(--ui)}
.brow{padding:12px 0 14px;border-bottom:2px dashed rgba(255,255,255,.12)}
:root[data-theme="light"] .brow{border-color:rgba(0,0,0,.12)}
.brow .bt{display:flex;align-items:center;gap:12px;margin-bottom:10px;font:700 28px var(--ui)}
.brow .bt .emb{width:46px;height:46px;font-size:26px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{width:70px;height:70px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;color:#1f2326;
  background:repeating-conic-gradient(#fff 0 15deg,#d7dde0 15deg 30deg);box-shadow:0 4px 0 #8b979d,0 7px 10px rgba(0,0,0,.4),inset 0 0 0 7px #f1f4f5,inset 0 0 0 9px #9aa5ab;transition:transform .12s,box-shadow .12s}
.chip b{font:400 28px var(--display)}
.chip small{font:700 14px var(--ui);margin-top:2px;opacity:.75}
.chip.sel{background:repeating-conic-gradient(var(--tc) 0 15deg,color-mix(in srgb,var(--tc) 70%,#000) 15deg 30deg);color:var(--ink2,#fff);transform:translateY(-6px);
  box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 45%,#000),0 12px 16px rgba(0,0,0,.45),inset 0 0 0 7px color-mix(in srgb,var(--tc) 85%,#fff),inset 0 0 0 9px rgba(0,0,0,.25)}
.vplate{position:absolute;left:0;width:550px;display:flex;align-items:center;gap:16px;padding:0 20px 0 24px;border-radius:12px;color:var(--ink);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.03) 1px 3px),linear-gradient(180deg,#e6ecef,#b2bdc3);
  box-shadow:inset 0 1px 0 #fff,0 4px 0 #6c787e,0 10px 16px rgba(0,0,0,.4)}
.vplate::before{content:"";position:absolute;left:-46px;top:50%;width:46px;height:14px;margin-top:-7px;background:linear-gradient(180deg,#dfe6e9,#7d8a92);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.vplate .ci{flex:1;font:700 25px/1.12 var(--ui)}
.vplate .vv{font:400 30px var(--display);color:var(--ketchup-lo);white-space:nowrap}
.vplate.empty{opacity:0}

/* tally card (after reveal) */
#tally{position:absolute;left:40px;top:468px;width:540px;height:462px;z-index:9;border-radius:22px;padding:24px 28px;color:var(--ink);
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 31px,rgba(0,0,0,.05) 31px 32px),linear-gradient(180deg,#fffaf0,var(--paper));
  box-shadow:0 5px 0 var(--paper-lo),0 22px 40px rgba(0,0,0,.5);display:none;overflow:hidden}
#tally.on{display:block}
#tally h3{font:400 40px/1.05 var(--display);margin-bottom:12px}
#tally .ln{display:flex;justify-content:space-between;font:500 25px/1.5 var(--ui)}
#tally .tot{border-top:3px solid var(--ink);margin-top:6px;padding-top:6px;font:400 34px var(--display)}
#tally .bets{margin-top:14px;border-top:3px dashed rgba(42,36,32,.3);padding-top:10px}
#tally .bets .ln{font-size:23px}
#tally .bets .ln .emb{width:32px;height:32px;font-size:18px;margin-right:8px;vertical-align:-6px}
#tally .hit{color:var(--pickle-lo);font-weight:900}
#tally .miss{color:#7a6d60}

/* big stamps & time's up */
.bigstamp{position:absolute;z-index:12;pointer-events:none;text-align:center;transform:translate(-50%,-50%) rotate(-8deg)}
.bigstamp b{display:inline-block;font:400 92px/1 var(--display);padding:10px 26px;border:9px double currentColor;border-radius:14px;background:rgba(255,255,255,.08);letter-spacing:1px;white-space:nowrap}
.bigstamp span{display:block;margin-top:12px;font:700 26px var(--ui);color:var(--scene-ink);text-shadow:0 2px 6px rgba(0,0,0,.4)}
.bigstamp.red{color:var(--ketchup)}.bigstamp.green{color:var(--pickle)}.bigstamp.gold{color:var(--mustard)}
:root[data-theme="light"] .bigstamp.green{color:var(--pickle-lo)}:root[data-theme="light"] .bigstamp.gold{color:var(--mustard-lo)}

/* ── bottom bar ── */
#bottom{position:absolute;left:0;right:0;top:952px;height:110px;display:flex;align-items:center;gap:20px;padding:0 40px;z-index:10}
#hint{flex:1;font:600 25px/1.3 var(--ui);color:var(--scene-ink);max-width:820px;background:rgba(6,12,14,.78);padding:10px 18px;border-radius:12px}
#hint:empty{display:none}
:root[data-theme="light"] #hint{background:rgba(255,255,255,.88)}
.act{height:86px;padding:0 38px;border-radius:22px;font:400 32px var(--display);letter-spacing:.5px;display:inline-flex;align-items:center;gap:12px;white-space:nowrap;
  background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--at,#1d1a14);
  box-shadow:0 8px 0 var(--edge),0 18px 26px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s,opacity .2s}
.act:active:not(:disabled){transform:translateY(6px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4)}
.act:disabled{opacity:.4}
.act.brass{--a1:#ffd977;--a2:var(--mustard);--edge:var(--mustard-lo)}
.act.steel{--a1:#eef2f4;--a2:#a8b4ba;--edge:#5f6b71}
.act.green{--a1:#79e0a2;--a2:var(--pickle);--edge:var(--pickle-lo);--at:#0d2b19}
.act.red{--a1:#ff7a6a;--a2:var(--ketchup);--edge:var(--ketchup-lo);--at:#fff}
.act.small{height:70px;font-size:26px;padding:0 26px;border-radius:18px}
.act.breathe{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 8px 0 var(--edge),0 18px 26px rgba(0,0,0,.45),0 0 0 8px rgba(232,177,58,.35),0 0 40px rgba(232,177,58,.6)}}
.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes pop{from{transform:translateY(30px) scale(.92);opacity:0}}

/* ── turn banner ── */
.turnBan{position:absolute;left:-40px;right:-40px;top:420px;height:170px;display:flex;align-items:center;justify-content:center;gap:28px;pointer-events:none;z-index:40;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 85%,#fff),var(--tc) 40%,color-mix(in srgb,var(--tc) 70%,#000));
  box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 4px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.25);transform:skewY(-3deg);animation:ban 1.55s cubic-bezier(.2,.8,.2,1) forwards}
.turnBan .emb{width:120px;height:120px;font-size:70px}
.turnBan span{font:400 92px/1 var(--display);color:var(--ink2,#fff);text-shadow:0 5px 0 rgba(0,0,0,.2)}
@keyframes ban{0%{transform:skewY(-3deg) translateX(-110%)}22%{transform:skewY(-3deg) translateX(0)}78%{transform:skewY(-3deg) translateX(0)}100%{transform:skewY(-3deg) translateX(110%)}}

/* ── overlays: letterboard (setup, scoreboard) ── */
#ov{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(4,8,10,.55)}
#ov.on{display:flex;animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
.lb{position:relative;border-radius:22px;padding:34px 46px;color:var(--peg);
  background:repeating-linear-gradient(180deg,var(--felt) 0 38px,var(--felt-line) 38px 42px);
  box-shadow:0 0 0 16px #2f2f31,0 0 0 18px #77797c,0 0 0 20px #1b1b1c,0 40px 80px rgba(0,0,0,.6);animation:lift .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes lift{from{transform:translateY(40px) scale(.96);opacity:0}}
.lb h1{font:400 70px/1 var(--display);text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.6)}
.lb .lbsub{text-align:center;font:600 24px var(--ui);color:#c8c3b8;margin:10px 0 24px}
.lb h4{font:400 30px var(--display);color:#fff;margin:0 0 12px}
.seg{display:flex;gap:10px;flex-wrap:wrap}
.seg button{min-width:60px;height:60px;padding:0 14px;border-radius:12px;font:400 28px var(--display);color:#f3efe6;background:#2a2a2c;box-shadow:0 4px 0 #050505,inset 0 1px 0 rgba(255,255,255,.12)}
.seg button.sel{background:linear-gradient(180deg,#ffd977,var(--mustard));color:#2a1d05;box-shadow:0 4px 0 var(--mustard-lo),inset 0 1px 0 #fff}
.trw{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.trw .emb{width:68px;height:68px;font-size:38px;cursor:pointer;border:0}
.trw input{flex:1;height:64px;border-radius:12px;border:0;padding:0 18px;font:700 28px var(--ui);color:var(--ink);background:linear-gradient(180deg,#fffaf0,var(--paper));box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.cats{display:flex;flex-wrap:wrap;gap:10px}
.cats button{height:52px;padding:0 18px;border-radius:999px;font:700 21px var(--ui);color:#b9b4aa;background:#262628;box-shadow:inset 0 0 0 2px #3a3a3c}
.cats button.sel{color:#1d1a14;background:var(--paper);box-shadow:inset 0 0 0 3px var(--mustard)}
.cats button small{opacity:.6;margin-left:6px}
.links{display:flex;gap:22px;margin-top:12px;font:600 20px var(--ui);color:#c8c3b8;align-items:center}
.links button{text-decoration:underline;color:var(--mustard);font:600 20px var(--ui)}
.tog{display:flex;align-items:center;gap:16px;width:100%;padding:12px 16px;border-radius:14px;background:#222224;text-align:left;margin-top:10px}
.tog .tt{flex:1}
.tog .tt b{display:block;font:400 26px var(--display);color:#fff}
.tog .tt small{display:block;font:500 18px/1.3 var(--ui);color:#b9b4aa}
.tog .sw{width:72px;height:40px;border-radius:20px;background:#444;position:relative;flex:none;transition:background .15s}
.tog .sw::after{content:"";position:absolute;left:4px;top:4px;width:32px;height:32px;border-radius:50%;background:#eee;transition:transform .15s;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.tog[aria-checked="true"] .sw{background:var(--pickle)}
.tog[aria-checked="true"] .sw::after{transform:translateX(32px)}
#resume{display:none;align-items:center;gap:18px;margin:-6px auto 20px;padding:12px 20px;border-radius:14px;background:rgba(232,177,58,.14);box-shadow:inset 0 0 0 3px var(--mustard);font:600 24px var(--ui);width:fit-content}
#resume.on{display:flex}
.warnmsg{color:#ff8a7e;font:700 20px var(--ui)}

/* scoreboard rows */
.sbrow{display:flex;align-items:center;gap:22px;height:92px;padding:0 24px;margin-bottom:12px;border-radius:14px;background:rgba(255,255,255,.04)}
.sbrow .rkn{width:64px;font:400 46px var(--display);color:#c8c3b8;text-align:center}
.sbrow .emb{width:66px;height:66px;font-size:38px}
.sbrow .nm{flex:1;font:400 44px var(--display);color:#fff}
.sbrow .pts{font:400 54px var(--display);color:#fff}
.sbrow .pts small{font:600 22px var(--ui);color:#c8c3b8;margin-left:6px}
.sbrow.lead{box-shadow:inset 0 0 0 3px var(--mustard);background:rgba(232,177,58,.1)}
.sbrow .gain{font:700 24px var(--ui);color:var(--pickle);width:90px;text-align:right}

/* ── modal cards (menu card with red vinyl edge) ── */
#modal{position:absolute;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(4,8,10,.6)}
#modal.on{display:flex;animation:fadein .2s}
.card{position:relative;max-width:1180px;border-radius:30px;padding:40px 52px 36px;color:var(--ink);
  background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 39px,rgba(0,0,0,.04) 39px 40px),linear-gradient(180deg,#fffaf0,var(--paper));
  box-shadow:0 0 0 14px var(--ketchup),0 0 0 17px var(--ketchup-lo),0 40px 80px rgba(0,0,0,.6);animation:lift .35s cubic-bezier(.3,1.3,.5,1)}
.card::before,.card::after{content:"";position:absolute;top:-24px;width:70px;height:34px;border-radius:8px;background:linear-gradient(180deg,var(--steel-hi),var(--steel-lo));box-shadow:0 3px 6px rgba(0,0,0,.4)}
.card::before{left:60px}.card::after{right:60px}
.card h2{font:400 52px/1.05 var(--display);margin-bottom:14px;color:var(--ketchup-lo)}
.card p,.card li{font:500 28px/1.4 var(--ui)}
.card ul{padding-left:30px;margin:6px 0}
.card .btns{display:flex;gap:18px;justify-content:flex-end;margin-top:28px}
.card kbd{font:700 22px var(--ui);padding:2px 10px;border-radius:6px;background:#e7dcc0;box-shadow:0 2px 0 #b9a985}
.lm{margin:16px 0;padding:16px 20px;border-radius:14px;background:rgba(42,36,32,.06);display:flex;align-items:center;gap:20px}
.lm .q{flex:1;font:600 32px/1.4 var(--ui)}
.lm .blank{display:inline-block;min-width:150px;border-bottom:4px solid var(--ink);text-align:center;color:transparent}
.lm .blank.shown{color:var(--ketchup-lo);border-bottom-style:dashed}
.lm .base{font:600 22px var(--ui);color:#7a6d60}

/* pause veil */
#pause{position:absolute;left:24px;top:98px;width:1290px;height:846px;z-index:25;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;border-radius:24px;
  background:repeating-linear-gradient(180deg,var(--felt) 0 38px,var(--felt-line) 38px 42px);box-shadow:0 0 0 10px #2f2f31,0 30px 60px rgba(0,0,0,.6);color:#fff}
#pause.on{display:flex}
#pause h2{font:400 96px var(--display)}
#pause p{font:600 28px var(--ui);color:#c8c3b8}

/* final */
.final h1{font:400 110px/1 var(--display);color:#fff6ef;-webkit-text-stroke:3px var(--neon);text-shadow:0 0 6px #fff,0 0 18px var(--neon),0 0 44px var(--neon-glow)}

/* debug */
#dbg{position:absolute;right:20px;top:110px;z-index:70;display:none;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:rgba(0,0,0,.85);color:#fff;font:600 18px var(--ui)}
#dbg.on{display:flex}
#dbg button{padding:8px 14px;border-radius:8px;background:#333;color:#fff;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

    if (anim && !reduced) el.querySelector('.stamp').animate([{ transform: 'translateY(-50%) rotate(-9deg) scale(2.6)', opacity: 0 }, { transform: 'translateY(-50%) rotate(-9deg) scale(1)', opacity: 0.95 }], { duration: 260, easing: 'cubic-bezier(.5,0,.7,1.4)' });
  } else { var g = $('grooves').children[r]; if (g) g.classList.add('empty-stamp'); }
  if (!anim) return;
  var tr = rackTicket(r, n());
  if (row.ok) { sfx.right(); emit(14, tr.x + tr.w - 60, tr.y + tr.h / 2, { colors: ['#ffd36e', '#3dbb73', '#ffffff'], speed: 6, g: 0.15, size: 4, decay: 0.03 }); }
  else { sfx.wrong(); shake(6, 260); }
  sfx.stamp();
}
function revealDone() {
  revealTimers = [];
  if (!G || G.phase !== 'reveal') return;
  G.phase = 'revealed'; save();
  showTally(true); renderButtons(); renderHint();
}
function finishRevealNow() {
  clearReveal();
  G.result.rows.forEach(function (row) { revealRow(row.r, false); });
  G.phase = 'reveal'; revealDone();
}
function clearReveal() { revealTimers.forEach(clearTimeout); revealTimers = []; }
function showRevealInstant() {
  $('side').innerHTML = ''; buildPlates();
  Object.keys(TK).forEach(function (k) { if (G.result.rows.every(function (r) { return r.placed !== k; })) TK[k].classList.add('unused'); });
  if (G.phase === 'fixed') { G.result.rows.forEach(function (row) { var p = $('vp-' + row.r); if (p) p.classList.remove('empty'); }); markFixed(); }
  else G.result.rows.forEach(function (row) { revealRow(row.r, false); });
  showTally(false); renderButtons(); renderHint(); lockTickets();
}
function showTally(anim) {
  var R = G.result, t = team(), N = R.n, el = $('tally');
  var h = '<h3>' + esc(t.name) + ': ' + R.correct + ' of ' + N + ' right</h3>' +
    '<div class="ln"><span>' + R.correct + ' right × ' + OU.PTS_PER_ITEM + ' points</span><b>' + R.base + '</b></div>' +
    (R.perfect ? '<div class="ln"><span>Perfect order</span><b>+' + R.perfect + '</b></div>' : '') +
    (R.fast ? '<div class="ln"><span>Speed bonus</span><b>+' + R.fast + '</b></div>' : '') +
    '<div class="ln tot"><span>' + esc(t.name) + '</span><span>+' + R.total + '</span></div>';
  var others = G.teams.map(function (x, i) { return i; }).filter(function (i) { return i !== G.teamIdx; });
  if (others.length) {
    h += '<div class="bets">' + others.map(function (i) {
      var g = G.guesses ? G.guesses[i] : null, w = G.won ? (G.won[i] || 0) : 0, x = G.teams[i];
      return '<div class="ln"><span>' + embHTML(x) + esc(x.name) + (g == null ? ' (no bet)' : ' bet ' + g) + '</span><span class="' + (w ? 'hit' : 'miss') + '">+' + w + '</span></div>';
    }).join('') + '</div>';
  }
  el.innerHTML = h; el.classList.add('on');
  if (anim && !reduced) el.animate([{ transform: 'translateY(40px) scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: 'cubic-bezier(.3,1.3,.5,1)' });
  // the big moment
  var cx = 310, cy = 368;
  if (R.correct === N) {
    bigStamp('ORDER UP!', 'green', 'A perfect order!', cx, cy);
    if (anim) { sfx.bell(); sfx.fanfare(); Music.cue('perfect'); Music.duck(3); shake(10, 450);
      emit(90, 960, 560, { kind: 'confetti', colors: [t.color, '#e8b13a', '#ffffff', '#c9d2d7'], speed: 13, g: 0.22, size: 14, decay: 0.009 });
      setTimeout(function () { emit(60, 960, 300, { kind: 'confetti', colors: [t.color, '#e8b13a', '#ffffff'], speed: 10, g: 0.2, size: 12, decay: 0.01 }); }, 300); }
  } else if (R.correct === 0) {
    bigStamp('SENT BACK', 'red', 'Nothing in the right place.', cx, cy);
    if (anim) { sfx.sentback(); Music.cue('fail'); shake(26, 750); flash();
      emit(60, 960, 900, { kind: 'puff', colors: ['rgba(60,60,60,.55)', 'rgba(110,110,110,.45)', 'rgba(40,40,40,.6)'], speed: 3, g: -0.05, size: 26, decay: 0.012, w: 620, h: 20, spread: 1.2, angle: -Math.PI / 2 }); }
  } else {
    bigStamp(R.correct + ' OF ' + N, 'gold', '', cx, cy);
    if (anim) { sfx.bell(); shake(10, 450); emit(24, cx, cy, { colors: ['#ffd36e', '#ff9a3c', '#fff'], speed: 7, g: 0.15, size: 4, decay: 0.025 }); }
  }
}
function bigStamp(text, color, sub, x, y) {
  removeStamps();
  var s = document.createElement('div'); s.className = 'bigstamp ' + color; s.style.left = x + 'px'; s.style.top = y + 'px';
  s.innerHTML = '<b>' + esc(text) + '</b>' + (sub ? '<span>' + esc(sub) + '</span>' : '');
  $('shaker').appendChild(s);
  if (!reduced) s.animate([{ transform: 'translate(-50%,-50%) rotate(-8deg) scale(3.2)', opacity: 0 }, { transform: 'translate(-50%,-50%) rotate(-8deg) scale(1)', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.5,0,.7,1.3)' });
  sfx.stamp();
}
function removeStamps() { [].forEach.call(document.querySelectorAll('.bigstamp'), function (x) { x.remove(); }); }

function fixOrder() {
  if (!G || G.phase !== 'revealed') return;
  G.board = OU.correctBoard(G.cat); G.phase = 'fixed';
  [].forEach.call($('grooves').children, function (g) { g.classList.remove('empty-stamp'); });
  markFixed();
  layoutTickets(false, { stagger: true }); renderButtons(); renderHint(); save();
}
function markFixed() {
  G.result.rows.forEach(function (row) {
    var el = TK[row.correct]; if (!el) return;
    el.classList.remove('unused', 'wrong', 'right');
    if (row.ok) { el.classList.add('right'); el.querySelector('.stamp').textContent = 'RIGHT'; }
    else { el.classList.add('fixed'); el.querySelector('.stamp').textContent = 'MOVED'; }
  });
}

/* ════════ language moment ════════ */
function showLang() {
  var lm = OU.buildLangMoment(G.cat); if (!lm) return;
  var h = '<div class="card" style="width:1180px"><h2>Language moment</h2><p style="color:#7a6d60;font-size:24px">Fill the gaps with the right form of the adjective. The sentences use the real order.</p>' +
    lm.map(function (p, i) {
      return '<div class="lm"><div class="q">' + esc(p.before) + ' <span class="blank" id="lmb' + i + '">' + esc(p.answer) + '</span> ' + esc(p.after) + ' <span class="base">(' + esc(p.base) + ')</span></div><button class="act steel small" data-lm="' + i + '">Show</button></div>';
    }).join('') + '<div class="btns"><button class="act brass small" id="lm-close">Done</button></div></div>';
  openModal(h);
  $('modal').querySelectorAll('[data-lm]').forEach(function (b) { b.onclick = function () { $('lmb' + b.dataset.lm).classList.add('shown'); b.disabled = true; sfx.select(); }; });
  $('lm-close').onclick = closeModal;
}

/* ════════ scoreboard ════════ */
function showScores(resumed) {
  if (!G) return;
  if (G.phase !== 'scores') { G.turnsPlayed++; G.phase = 'scores'; }
  clearReveal(); removeStamps(); $('tally').classList.remove('on');
  var nT = G.teams.length, tot = OU.turnsTotal(G.maxRounds, nT), isFinal = G.turnsPlayed >= tot;
  var st = OU.standings(G.teams), prev = G.lastOrder || st.rows.map(function (r) { return r.i; });
  musicMode('menu');
  if (isFinal) { clearSave(); showFinal(st); return; }
  save();
  var gain = {}; if (G.result) { gain[G.teamIdx] = G.result.total; Object.keys(G.won || {}).forEach(function (k) { gain[k] = (gain[k] || 0) + G.won[k]; }); }
  var h = '<div class="lb" style="width:1180px"><h1>Scoreboard</h1><div class="lbsub">After turn ' + G.turnsPlayed + ' of ' + tot + '</div><div id="sb-rows">' +
    st.rows.map(function (r) {
      var t = G.teams[r.i];
      return '<div class="sbrow' + (r.rank === 1 ? ' lead' : '') + '" data-i="' + r.i + '"><span class="rkn">' + r.rank + '</span>' + embHTML(t) + '<span class="nm">' + esc(t.name) + '</span><span class="gain">' + (gain[r.i] && !resumed ? '+' + gain[r.i] : '') + '</span><span class="pts">' + t.score + '<small>pts</small></span></div>';
    }).join('') + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:24px"><button class="act steel small" id="sb-end">End game</button>' +
    '<button class="act brass breathe" id="sb-next">Next: ' + esc(G.teams[(G.teamIdx + 1) % nT].name) + '</button></div></div>';
  openOv(h);
  // rows slide from their old places
  if (!reduced && !resumed) {
    $('sb-rows').querySelectorAll('.sbrow').forEach(function (row, k) {
      var old = prev.indexOf(+row.dataset.i); if (old < 0 || old === k) return;
      row.animate([{ transform: 'translateY(' + ((old - k) * 104) + 'px)' }, { transform: 'translateY(' + ((old - k) * 52 - 30) + 'px) scale(1.03)', offset: 0.5 }, { transform: 'none' }], { duration: 650, delay: 250, easing: 'cubic-bezier(.35,.1,.3,1)', fill: 'backwards' });
    });
  }
  endArmed = false;
  $('sb-end').onclick = function () { if (!endArmed) { endArmed = true; this.textContent = 'Click again to end'; return; } clearSave(); renderSetup(); };
  $('sb-next').onclick = function () { G.teamIdx = (G.teamIdx + 1) % nT; G.lastOrder = OU.standings(G.teams).rows.map(function (r) { return r.i; }); startRound(); };
}
function showFinal(st) {
  var w = st.winners.map(function (i) { return G.teams[i]; });
  var title = w.length === 1 ? esc(w[0].name) + (plural(w[0].name) ? ' win!' : ' wins!') : w.map(function (t) { return esc(t.name); }).join(' and ') + ' tie!';
  var h = '<div class="lb final" style="width:1240px;text-align:center"><div style="display:flex;justify-content:center;gap:18px;margin-bottom:16px">' + w.map(function (t) { return embHTML(t).replace('class="emb ', 'class="emb big ').replace('style="', 'style="width:120px;height:120px;font-size:70px;'); }).join('') + '</div>' +
    '<h1>' + title + '</h1><div class="lbsub">Final scores after ' + pluralS(G.maxRounds, 'round') + '</div><div style="text-align:left">' +
    st.rows.map(function (r) { var t = G.teams[r.i]; return '<div class="sbrow' + (r.rank === 1 ? ' lead' : '') + '"><span class="rkn">' + r.rank + '</span>' + embHTML(t) + '<span class="nm">' + esc(t.name) + '</span><span class="pts">' + t.score + '<small>pts</small></span></div>'; }).join('') +
    '</div><div style="display:flex;justify-content:center;margin-top:24px"><button class="act brass" id="fin-new">New game</button></div></div>';
  openOv(h);
  sfx.fanfare(); sfx.bell(0.6); Music.cue('win'); Music.duck(4);
  var t0 = performance.now(), col = w[0].color;
  (function burst() {
    if (performance.now() - t0 > 4200 || !$('fin-new')) return;
    emit(70, 300 + Math.random() * 1320, 150 + Math.random() * 400, { colors: [col, '#e8b13a', '#ffffff', '#ff4b3e', '#7fd3ff'], speed: 9, g: 0.09, size: 4, decay: 0.014 });
    tone(200 + Math.random() * 200, 0.3, 'sine', 0.05);
    setTimeout(burst, 380);
  })();
  $('fin-new').onclick = function () { renderSetup(); };
}

/* ════════ banner, modal, rules ════════ */
function turnBanner() {
  if (reduced || !G) return;
  sfx.whoosh();
  var t = team(), b = document.createElement('div');
  b.className = 'turnBan'; b.style.setProperty('--tc', t.color); b.style.setProperty('--ink2', inkOn(t.color));
  b.innerHTML = embHTML(t) + '<span>' + esc(t.name) + ', you’re up!</span>';
  $('shaker').appendChild(b);
  setTimeout(function () { b.remove(); }, 1600);
}
function openModal(h) { var m = $('modal'); m.innerHTML = h; m.classList.add('on'); lockTickets(); var f = m.querySelector('button'); if (f) setTimeout(function () { try { f.focus(); } catch (e) { } }, 30); }
function closeModal() { var m = $('modal'); m.classList.remove('on'); m.innerHTML = ''; if (G) { lockTickets(); renderSel(); } }
function ask(title, body, buttons) {
  var h = '<div class="card" style="width:900px"><h2>' + esc(title) + '</h2><p>' + esc(body) + '</p><div class="btns">' +
    buttons.map(function (b, i) { return '<button class="act small ' + b[1] + '" data-k="' + i + '">' + esc(b[0]) + '</button>'; }).join('') + '</div></div>';
  openModal(h);
  $('modal').querySelectorAll('[data-k]').forEach(function (el) { el.onclick = function () { closeModal(); var f = buttons[+el.dataset.k][2]; if (f) f(); }; });
}
function showRules() {
  openModal('<div class="card" style="width:1180px"><h2>How to play</h2><ul>' +
    '<li>One team is on the clock. They drag the tickets into order. Row 1 is the top of the scale.</li>' +
    '<li>Other teams bet how many tickets will be right. Rarer results pay more.</li>' +
    '<li>Points: ' + OU.PTS_PER_ITEM + ' for each right ticket, +' + OU.PERFECT_BONUS + ' for a perfect order, +' + OU.SPEED_BONUS + ' for speed (3 or more right with more than half the time left).</li>' +
    '<li>After the reveal, “Fix the order” moves the tickets to the right rows.</li></ul>' +
    '<p style="margin-top:14px;font-size:24px"><kbd>P</kbd> pause &nbsp; <kbd>M</kbd> sound &nbsp; <kbd>Shift</kbd>+<kbd>N</kbd> music &nbsp; <kbd>T</kbd> theme &nbsp; <kbd>H</kbd> this help &nbsp; <kbd>Esc</kbd> close</p>' +
    '<div class="btns"><button class="act brass small" id="rules-close">Got it</button></div></div>');
  $('rules-close').onclick = closeModal;
}

/* ════════ icons, theme, sound ════════ */
var ICON = {
  sound: function (on) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/>' + (on ? '<path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>'; },
  music: function () { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>'; },
  pause: function (p) { return p ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>'; },
  theme: function (light) { return light ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>' : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'; }
};
function isLight() { return document.documentElement.getAttribute('data-theme') === 'light'; }
function paintIcons() {
  $('sound-btn').innerHTML = ICON.sound(SET.sound); $('sound-btn').classList.toggle('off', !SET.sound);
  $('music-btn').innerHTML = ICON.music(); $('music-btn').classList.toggle('off', !SET.music || !SET.sound);
  $('pause-btn').innerHTML = ICON.pause(G && G.paused); $('pause-btn').disabled = !G || (G.phase !== 'play' && G.phase !== 'timesup');
  $('pause-btn').style.opacity = $('pause-btn').disabled ? 0.4 : '';
  $('theme-btn').innerHTML = ICON.theme(isLight());
}
function toggleTheme() {
  var next = isLight() ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('arschul:theme', next); localStorage.setItem('theme', next); } catch (e) { }
  paintIcons();
}
new MutationObserver(paintIcons).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function toggleSound() { SET.sound = !SET.sound; saveSettings(); ac(); applyMusic(); paintIcons(); if (SET.sound) sfx.select(); syncSetupTog(); }
function toggleMusic() { SET.music = !SET.music; if (SET.music && !SET.sound) SET.sound = true; saveSettings(); ac(); applyMusic(); paintIcons(); syncSetupTog(); }
function syncSetupTog() { if ($('s-music')) $('s-music').setAttribute('aria-checked', SET.music); if ($('s-sound')) $('s-sound').setAttribute('aria-checked', SET.sound); }
$('sound-btn').onclick = toggleSound;
$('music-btn').onclick = toggleMusic;
$('theme-btn').onclick = toggleTheme;
$('pause-btn').onclick = function () { if (G) setPaused(!G.paused); };
$('rules-btn').onclick = showRules;

/* ════════ keyboard ════════ */
addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key === 'Escape') { if ($('modal').classList.contains('on')) closeModal(); else if (sel != null) { sel = null; renderSel(); } return; }
  if (e.shiftKey && (e.key === 'D' || e.key === 'd')) { toggleDebug(); e.preventDefault(); return; }
  if (e.shiftKey && (e.key === 'N' || e.key === 'n')) { toggleMusic(); e.preventDefault(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === 'p' && G) { setPaused(!G.paused); e.preventDefault(); }
  else if (k === 'm') { toggleSound(); e.preventDefault(); }
  else if (k === 't') { toggleTheme(); e.preventDefault(); }
  else if (k === 'h') { if ($('modal').classList.contains('on')) closeModal(); else showRules(); e.preventDefault(); }
});

/* ════════ debug (Shift+D) ════════ */
function toggleDebug() {
  var d = $('dbg');
  if (d.classList.contains('on')) { d.classList.remove('on'); return; }
  d.innerHTML = '<b>Debug</b>' + [['solve', 'Solve board'], ['reverse', 'Reverse board'], ['empty', 'Clear one row'], ['t5', '5 s left'], ['plus', 'Active team +5'], ['newcat', 'New category'], ['answer', 'Log answer']].map(function (x) { return '<button data-d="' + x[0] + '">' + x[1] + '</button>'; }).join('');
  d.classList.add('on');
}
$('dbg').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || !G || !G.cat) return;
  var a = b.dataset.d;
  if (a === 'solve' && G.phase === 'play') { G.board = OU.correctBoard(G.cat); layoutTickets(false, { stagger: true }); save(); }
  if (a === 'reverse' && G.phase === 'play') { G.board = OU.correctBoard(G.cat).reverse(); layoutTickets(false, { stagger: true }); save(); }
  if (a === 'empty' && G.phase === 'play') { var i = G.board.findIndex(Boolean); if (i >= 0) { G.board[i] = null; layoutTickets(false); save(); } }
  if (a === 't5' && G.phase === 'play') { G.timeLeft = 5; renderTimer(); }
  if (a === 'plus') { team().score += 5; renderSide(); save(); }
  if (a === 'newcat' && G.phase === 'play') startRound();
  if (a === 'answer') console.log('Answer (top to bottom):', OU.correctBoard(G.cat));
  renderHint();
});

/* ════════ boot ════════ */
addEventListener('resize', function () { fit(); if (G && G.cat) layoutTickets(true); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () {
  if (G && G.cat) { fitHeader(); var h = gh(n()) - 12; Object.keys(TK).forEach(function (k) { TK[k].querySelector('.tx').style.fontSize = fitSize(k, h) + 'px'; }); }
});
window.OUgame = { get G() { return G; }, get sel() { return sel; }, place: function (item, r) { doPlace(item, r); }, tap: tapTicket, sendIt: sendIt, reveal: reveal, rect: { grooveRect: grooveRect, rackTicket: rackTicket, trayTicket: trayTicket }, Music: Music };
paintIcons();
renderSetup();
})();
</script>
