<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Problem Solvers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Inventor's workshop after hours: a birch drafting board under a desk lamp, blueprints, brass stopwatch, copper ballot box. */
:root{
  --s:1;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
  --ui:"Outfit",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  /* the wall (theme-dependent) */
  --body:#120d09; --peg-a:#34291f; --peg-b:#1b140e; --hole:#0b0805; --lamp:rgba(255,184,104,.28);
  --wall-ink:#f3e6cf; --wall-ink-soft:#bca98b;
  /* materials (same in both themes) */
  --birch-hi:#efd7a8; --birch:#d9b77e; --birch-lo:#ad8952; --birch-edge:#6c5030;
  --walnut-hi:#6f4f31; --walnut:#4a321c; --walnut-lo:#25180b;
  --bp:#1e5096; --bp-lo:#123563; --bp-ink:#f1f7ff; --bp-soft:#a9cdfa;
  --copper-hi:#f0a76e; --copper:#c56f36; --copper-lo:#743914;
  --brass-hi:#f8db8a; --brass:#d5a640; --brass-lo:#7e5d19;
  --steel-hi:#f0f3f6; --steel:#aab3bd; --steel-lo:#59626c;
  --manila:#f2e4bf; --manila-lo:#d8c48e; --ink:#2b2117; --ink-soft:#66553f;
  --go:#3a9e58; --go-hi:#58c477; --go-lo:#1c5c30; --ember:#ef7f3a; --ember-lo:#9a3e12;
  --danger:#e2422f; --danger-ink:#9b2414; --amber:#f0a92e;
}
html[data-theme="light"]{
  --body:#b8925f; --peg-a:#dcc093; --peg-b:#c29d6a; --hole:#7a5a36; --lamp:rgba(255,253,240,.55);
  --wall-ink:#2b2117; --wall-ink-soft:#5b4831;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--body)}
body{font-family:var(--ui);color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:hidden;background:var(--peg-b)}
#scene{position:absolute;inset:0;width:100%;height:100%}
#shaker{position:absolute;inset:0}
#defs{position:absolute;width:0;height:0}

/* ---------- header ---------- */
#top{position:absolute;left:34px;right:34px;top:16px;height:76px;display:flex;align-items:center;gap:14px;z-index:5}
.spacer{flex:1}
.back-link{display:inline-flex;align-items:center;height:60px;padding:0 24px;border-radius:14px;text-decoration:none;font:800 22px var(--ui);color:#fff3e6;white-space:nowrap;
  background:linear-gradient(180deg,var(--copper-hi),var(--copper) 55%,#9c5225);box-shadow:0 5px 0 var(--copper-lo),0 10px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.35);text-shadow:0 1px 0 rgba(0,0,0,.3)}
#mark{display:flex;align-items:center;gap:14px;margin-left:12px;color:var(--wall-ink)}
#mark svg{width:56px;height:56px}
#mark span{font:44px/1 var(--display);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.plate{position:relative;height:56px;padding:0 26px;border-radius:10px;display:flex;align-items:center;font:800 25px var(--ui);color:#3a2a08;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 60%,#b88a2c);box-shadow:0 4px 0 var(--brass-lo),0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.plate::before,.plate::after{content:"";position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#8a6a22)}
.plate::before{left:8px}.plate::after{right:8px}
.tbtn{height:62px;min-width:62px;padding:0 20px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 21px var(--ui);color:var(--manila);white-space:nowrap;
  background:repeating-linear-gradient(91deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.06) 3px 9px),linear-gradient(180deg,var(--walnut-hi),var(--walnut));
  box-shadow:0 5px 0 var(--walnut-lo),0 10px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s,box-shadow .12s}
.tbtn.icon{padding:0;width:62px}
.tbtn svg{width:26px;height:26px;flex:none}
.tbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--walnut-lo),0 4px 8px rgba(0,0,0,.4)}
.tbtn.off{opacity:.55}
.tbtn.armed{background:linear-gradient(180deg,#f0634f,var(--danger));box-shadow:0 5px 0 #7a1a0e,0 10px 16px rgba(0,0,0,.4);color:#fff}

/* ---------- drafting board (hero) ---------- */
#board{position:absolute;left:60px;top:112px;width:1800px;height:792px;border-radius:22px;
  background:
    radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%),
    repeating-linear-gradient(91deg,rgba(120,80,30,.07) 0 2px,rgba(255,255,255,0) 2px 11px,rgba(120,80,30,.05) 11px 13px,rgba(255,255,255,0) 13px 29px),
    repeating-linear-gradient(89.3deg,rgba(255,255,255,.07) 0 1px,rgba(255,255,255,0) 1px 17px),
    linear-gradient(180deg,var(--birch-hi),var(--birch) 45%,var(--birch-lo));
  box-shadow:0 0 0 7px #5d4227,0 0 0 9px #2b1d10,0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -5px 0 rgba(108,80,48,.45)}
.clip{position:absolute;top:-22px;width:150px;height:46px;border-radius:10px 10px 14px 14px;background:linear-gradient(180deg,var(--steel-hi),var(--steel) 55%,#7c858f);
  box-shadow:0 6px 10px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 #fff;z-index:3}
.clip::after{content:"";position:absolute;left:50%;top:12px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#6b737c)}
.rule{position:absolute;left:44px;right:44px;bottom:12px;height:22px;border-radius:4px;
  background:repeating-linear-gradient(90deg,rgba(40,40,40,.55) 0 2px,transparent 2px 24px) 0 0/100% 9px no-repeat,repeating-linear-gradient(90deg,rgba(40,40,40,.55) 0 2px,transparent 2px 120px) 0 0/100% 15px no-repeat,linear-gradient(180deg,var(--steel-hi),var(--steel));
  box-shadow:0 3px 5px rgba(0,0,0,.35)}
#view{position:absolute;inset:0}

/* ---------- team rack ---------- */
#rack{position:absolute;left:60px;right:60px;top:926px;height:136px;display:flex;gap:16px;justify-content:center;align-items:center;z-index:4}
.tag{position:relative;flex:1 1 0;max-width:330px;min-width:0;height:116px;border-radius:16px 16px 16px 16px;display:flex;align-items:center;gap:14px;padding:0 18px 0 16px;
  background:repeating-linear-gradient(91deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.07) 3px 10px),linear-gradient(180deg,var(--walnut-hi),var(--walnut));
  box-shadow:0 6px 0 var(--walnut-lo),0 12px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .3s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
.tag::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:6px;border-radius:3px;background:var(--tc);opacity:.85}
.tag.on{transform:translateY(-12px);box-shadow:0 6px 0 var(--walnut-lo),0 0 0 4px var(--tc),0 0 34px color-mix(in srgb,var(--tc) 70%,transparent),0 16px 22px rgba(0,0,0,.45)}
.tag .tx{min-width:0;flex:1}
.tag .nm{font:800 30px/1.05 var(--ui);color:var(--manila);white-space:nowrap;overflow:hidden;text-overflow:clip}
.tag .sc{font:46px/1 var(--display);color:var(--brass-hi);font-variant-numeric:tabular-nums;margin-top:4px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tag .sc small{font:600 20px var(--ui);color:var(--wall-ink-soft);color:#c8b48f;margin-left:6px}

/* ---------- pieces: lacquered pegs ---------- */
.pc{position:relative;flex:none;border-radius:50%}
.pc .body{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),rgba(255,255,255,0) 30%),radial-gradient(circle at 50% 62%,var(--mc),color-mix(in srgb,var(--mc) 50%,#000) 105%);
  box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 45%,#000),0 7px 9px rgba(0,0,0,.5),inset 0 -3px 5px rgba(0,0,0,.25)}
.pc .ico{font-family:var(--emoji);line-height:1;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.pc.dim{filter:saturate(.35) brightness(.75)}

/* ---------- tactile buttons ---------- */
.act{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:100px;padding:0 46px;border-radius:20px;font:800 36px var(--ui);white-space:nowrap;
  background:linear-gradient(180deg,var(--a1),var(--a2));color:var(--fg,#fff);
  box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s,filter .2s}
.act:active{transform:translateY(6px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4)}
.act svg{width:38px;height:38px}
.act.go{--a1:var(--go-hi);--a2:var(--go);--edge:var(--go-lo);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.act.warn{--a1:#ffa364;--a2:var(--ember);--edge:var(--ember-lo);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.act.adv{--a1:var(--brass-hi);--a2:var(--brass);--edge:var(--brass-lo);--fg:#2e2005}
.act.wood{--a1:var(--walnut-hi);--a2:var(--walnut);--edge:var(--walnut-lo);--fg:var(--manila)}
.act.sm{height:72px;padding:0 30px;border-radius:16px;font-size:27px}
.act.sm svg{width:28px;height:28px}
.act.dim{filter:saturate(.35) brightness(.85)}
.act.breathe{animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35),0 0 0 0 rgba(248,219,138,0)}50%{box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35),0 0 34px 8px rgba(248,219,138,.55)}}
.popin{animation:popin .45s cubic-bezier(.3,1.5,.5,1) both}
@keyframes popin{from{opacity:0;transform:translateY(30px) scale(.92)}}
.wobble{animation:wobble .45s}
@keyframes wobble{20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ---------- blueprint ---------- */
.bp{position:absolute;border-radius:6px;color:var(--bp-ink);overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.08),rgba(0,0,0,.28) 100%),
    repeating-linear-gradient(0deg,rgba(200,225,255,.24) 0 2px,transparent 2px 120px),
    repeating-linear-gradient(90deg,rgba(200,225,255,.24) 0 2px,transparent 2px 120px),
    repeating-linear-gradient(0deg,rgba(200,225,255,.1) 0 1px,transparent 1px 24px),
    repeating-linear-gradient(90deg,rgba(200,225,255,.1) 0 1px,transparent 1px 24px),
    linear-gradient(160deg,#2559a3,var(--bp) 50%,var(--bp-lo));
  box-shadow:0 14px 26px rgba(40,25,5,.45),0 2px 0 rgba(0,0,0,.2),inset 0 0 0 2px rgba(255,255,255,.12)}
.bp::before{content:"";position:absolute;inset:18px;border:2px solid rgba(220,236,255,.45);border-radius:2px;pointer-events:none}
.bp.unroll{animation:unroll .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes unroll{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.bp-head{position:absolute;left:58px;top:44px;font:40px/1 var(--display);color:var(--bp-soft)}
.bp-text{position:absolute;left:58px;right:70px;top:112px;bottom:170px;display:flex;align-items:center;overflow:hidden;font:800 64px/1.17 var(--ui);text-wrap:balance;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bp-text.rise{animation:rise .6s .45s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.bp-tb{position:absolute;right:34px;bottom:34px;width:340px;height:112px;border:2px solid rgba(220,236,255,.6);display:grid;grid-template-columns:1fr 1fr;font:600 20px var(--ui);color:var(--bp-soft)}
.bp-tb>div{padding:8px 14px;border-right:2px solid rgba(220,236,255,.35)}
.bp-tb>div:last-child{border-right:0}
.bp-tb b{display:block;font:44px/1.1 var(--display);color:var(--bp-ink)}
.bp-sketch{position:absolute;left:44px;bottom:30px;width:360px;height:130px;opacity:.55}
.stamp-slot{position:absolute;z-index:6;pointer-events:none}

/* ---------- stopwatch gauge ---------- */
.gauge{position:relative;width:400px;height:400px;margin-top:22px}
.gauge::before{content:"";position:absolute;left:50%;top:-24px;width:64px;height:34px;margin-left:-32px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,var(--brass-hi),var(--brass-lo));box-shadow:0 3px 5px rgba(0,0,0,.4)}
.gauge svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(40,25,5,.5))}
.g-read{position:absolute;left:0;right:0;top:238px;text-align:center;font:68px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.gauge.hot .g-read{color:var(--danger-ink)}
.gauge.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.04) rotate(-1deg)}}
.gauge.dead #gNeedle{animation:shudder .7s}
@keyframes shudder{20%{transform:rotate(14deg)}40%{transform:rotate(-10deg)}60%{transform:rotate(6deg)}80%{transform:rotate(-3deg)}}
.g-lbl{font:800 32px var(--ui);color:var(--ink);margin-top:-4px}
.side{position:absolute;display:flex;flex-direction:column;align-items:center;gap:16px}
.side .row{display:flex;gap:16px}
.hint{position:absolute;font:600 30px/1.25 var(--ui);color:var(--ink)}

/* ---------- presenting ---------- */
.presenter{position:absolute;left:60px;top:46px;width:1120px;height:700px}
.p-top{display:flex;align-items:center;gap:40px}
.p-name{font:112px/1 var(--display);color:var(--ink);white-space:nowrap;overflow:hidden;max-width:820px}
.p-line{font:600 38px/1.3 var(--ui);color:var(--ink);margin:34px 0 30px;max-width:1080px}
.bp.strip{position:relative;height:190px;display:flex;align-items:center;padding:0 54px}
.bp.strip .t{font:800 42px/1.2 var(--ui);text-wrap:balance}
.order{display:flex;gap:16px;align-items:center;margin-top:34px;font:700 26px var(--ui);color:var(--ink-soft)}

/* ---------- voting ---------- */
.vhead{position:absolute;left:50px;top:30px;display:flex;align-items:center;gap:26px;width:1320px}
.v-name{font:72px/1 var(--display);color:var(--ink);white-space:nowrap}
.v-sub{font:600 30px/1.25 var(--ui);color:var(--ink);margin-top:8px}
.cards{position:absolute;left:40px;top:196px;width:1320px;height:560px;display:flex;flex-wrap:wrap;gap:30px 28px;justify-content:center;align-content:center}
.card{position:relative;width:300px;height:var(--ch,380px);border-radius:6px;transform:rotate(var(--r,0deg));display:flex;flex-direction:column;align-items:center;cursor:pointer;
  background:linear-gradient(180deg,transparent 0 58px,rgba(214,70,70,.55) 58px 61px,transparent 61px),repeating-linear-gradient(180deg,transparent 0 37px,rgba(70,120,200,.24) 37px 39px) 0 61px/100% 100% no-repeat,#fbf6e8;
  box-shadow:0 12px 20px rgba(40,25,5,.4),0 2px 0 rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s}
.card:active{transform:rotate(var(--r,0deg)) scale(.97)}
.card .pin{position:absolute;top:-12px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--copper-hi),var(--copper) 50%,var(--copper-lo));box-shadow:0 4px 5px rgba(0,0,0,.45)}
.card .pc{margin-top:30px}
.card .cn{font:42px/1.05 var(--display);color:var(--ink);margin-top:14px;width:270px;text-align:center;white-space:nowrap;overflow:hidden}
.card .key{position:absolute;left:12px;top:10px;font:800 24px var(--ui);color:#9a8a70}
.card .slot{position:absolute;left:0;right:0;bottom:16px;height:96px;display:flex;justify-content:center;align-items:center;gap:10px}
.card.p1{box-shadow:0 0 0 5px var(--brass),0 0 30px rgba(248,219,138,.6),0 12px 20px rgba(40,25,5,.4)}
.card.p2{box-shadow:0 0 0 5px var(--steel),0 0 26px rgba(230,236,242,.5),0 12px 20px rgba(40,25,5,.4)}
.card.own{cursor:not-allowed}
.card.own .pc,.card.own .cn{opacity:.45}
.card .tape{position:absolute;left:-14px;right:-14px;top:52%;height:52px;transform:rotate(-12deg);display:flex;align-items:center;justify-content:center;font:800 26px var(--ui);color:#1b1408;
  background:repeating-linear-gradient(-45deg,#f4c430 0 22px,#f7d55e 22px 44px);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.card.cin{animation:cardin .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes cardin{from{opacity:0;transform:translateY(-40px) rotate(calc(var(--r) * 4))}}
.vside{position:absolute;left:1396px;top:40px;width:370px;height:710px;display:flex;flex-direction:column;align-items:center;gap:18px}
.legend{display:flex;flex-direction:column;gap:8px;font:700 26px var(--ui);color:var(--ink);align-self:stretch;padding-left:14px}
.legend div{display:flex;align-items:center;gap:14px}
.nudge{min-height:70px;font:800 26px/1.2 var(--ui);color:var(--danger-ink);text-align:center}
.nudge.show{animation:rise .3s both}

/* gear tokens */
.tok{position:relative;flex:none}
.tok svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.tok b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:var(--tf,26px)/1 var(--display);color:#3a2a08;text-shadow:0 1px 0 rgba(255,255,255,.45)}
.tok.k-silver b{color:#2f3740}
.tok.k-star b{color:#fff3e6;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.tok.drop{animation:drop .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes drop{0%{transform:translateY(-80px) scale(1.3);opacity:0}60%{transform:translateY(0) scale(1.15,.8);opacity:1}80%{transform:scale(.95,1.06)}100%{transform:none}}
.tok.out{animation:tokout .25s both}
@keyframes tokout{to{transform:scale(1.5);opacity:0}}
.squash{animation:squash .32s}
@keyframes squash{35%{transform:scale(1.18,.78)}70%{transform:scale(.94,1.06)}}
.flyer{position:absolute;left:0;top:0;pointer-events:none;z-index:20}
.flyer .tok{width:100%;height:100%}
#tokens{position:absolute;inset:0;pointer-events:none;z-index:15}

/* ballot box */
.box{position:relative;width:290px;height:240px;flex:none}
.box .lid{position:absolute;left:-10px;right:-10px;top:0;height:52px;border-radius:10px;background:linear-gradient(180deg,var(--copper-hi),var(--copper) 60%,#8e4a20);box-shadow:0 5px 0 var(--copper-lo),inset 0 2px 0 rgba(255,255,255,.4)}
.box .slotm{position:absolute;left:50%;top:16px;width:160px;height:20px;margin-left:-80px;border-radius:10px;background:radial-gradient(ellipse at 50% 70%,#1a0d04,#000);box-shadow:inset 0 4px 6px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.35)}
.box .front{position:absolute;left:0;right:0;top:56px;bottom:0;border-radius:4px 4px 14px 14px;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.25),transparent 55%),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),linear-gradient(180deg,var(--copper),#9a5225 70%,var(--copper-lo));
  box-shadow:0 18px 26px rgba(40,25,5,.5),inset 0 -6px 0 rgba(0,0,0,.25)}

.final{width:1560px;display:grid;grid-template-columns:560px 1fr;gap:50px;padding-top:60px}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function (e) {
  var tg = e.target, typing = tg && (tg.tagName === 'INPUT' && tg.type !== 'checkbox' && tg.type !== 'range' || tg.tagName === 'TEXTAREA');
  if (typing) return;
  var setupOpen = !$('setup').classList.contains('hidden');
  if (e.shiftKey && e.code === 'KeyD') { $('debug').classList.toggle('hidden'); paintDebug(); return; }
  if (e.shiftKey && e.code === 'KeyN') { window.toggleMusic(); toast('Music ' + (musicOn ? 'on' : 'off')); return; }
  if (e.shiftKey && (e.code === 'BracketLeft' || e.code === 'BracketRight')) { Music.setLevel(Music.level + (e.code === 'BracketRight' ? 10 : -10)); syncVol(); toast('Music volume ' + Math.round(Music.level) + '%'); e.preventDefault(); return; }
  if (!e.shiftKey && !e.ctrlKey && !e.metaKey && e.code === 'KeyM') { window.toggleMute(); return; }
  if (setupOpen || !G) return;
  if (e.shiftKey && e.code === 'KeyZ') { undo(); return; }
  if (e.shiftKey && e.code === 'KeyS') { openScores(); return; }
  if (e.shiftKey && e.code === 'KeyE') { armEnd(); return; }
  if (e.shiftKey && e.code === 'KeyK') { if (G.phase === 'vote') skipVote(); else if (G.phase === 'present') nextPresenter(); return; }
  if (e.code === 'Escape') { closeScores(); return; }
  if (e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space') { e.preventDefault(); toggleTimer(); return; }
  if (e.code === 'KeyN' || e.code === 'Enter') {
    e.preventDefault();
    if (G.phase === 'problem') toPresent(); else if (G.phase === 'present') nextPresenter(); else if (G.phase === 'vote') confirmVote(); else if (G.phase === 'results') nextRound();
    return;
  }
  var d = /^Digit([1-8])$/.exec(e.code); if (d && G.phase === 'vote') tapCard(+d[1] - 1);
});

/* ---------- debug (Shift+D) ---------- */
function paintDebug() {
  var d = $('debug'); if (d.classList.contains('hidden')) return;
  d.innerHTML = '<b>Debug</b><button onclick="dbg(\'t5\')">Timer: 5 seconds left</button><button onclick="dbg(\'fail\')">Time’s up now</button><button onclick="dbg(\'votes\')">Fill this round’s votes</button><button onclick="dbg(\'claim\')">Round-win effects</button><button onclick="dbg(\'win\')">End game now</button>' +
    '<pre>' + esc(G ? JSON.stringify({ phase: G.phase, round: G.round, scores: G.scores, voter: PS.currentVoter(G), music: Music.state }, null, 1) : 'no game') + '</pre>';
}
window.dbg = function (k) {
  if (!G) return;
  if (k === 't5') { T.left = Math.min(T.left, 5.2); T.lastSec = 6; paintGauge(); }
  if (k === 'fail') { stopTimer(); T.left = 0; T.done = true; paintGauge(); timeUp(); }
  if (k === 'votes') {
    var s = G; if (s.phase === 'problem') s = PS.startPresenting(s);
    while (s.phase === 'present') s = PS.nextPresenter(s);
    while (s.phase === 'vote') { var v = PS.currentVoter(s), need = PS.picksNeeded(s, v), opts = s.teams.map(function (_, i) { return i; }).filter(function (i) { return i !== v; }).sort(function () { return Math.random() - 0.5; }); s = PS.castVote(s, opts.slice(0, need)); }
    commit(s);
  }
  if (k === 'claim') { if (G.phase === 'results') markWinners(true); else { shake(10, 450); SFX.claim(); Music.cue('claim'); } }
  if (k === 'win') commit(PS.endGame(G));
  paintDebug();
};

/* ---------- boot ---------- */
paintMute(); paintMusic(); applyMusic();
showSetup();
render({ force: true });
try { new MutationObserver(function () { syncMusic(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
</script>
</body>
