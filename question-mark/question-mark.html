<style>
  :root {
    --stage: #120d2e; --stage2: #1d1550; --ink: #f4f1ff; --muted: #b9b2dd;
    --panel: #251c63; --panel-edge: #4c3fb0; --face: #fbf8ff; --face-ink: #1b1440;
    --gold: #ffcc33; --gold-ink: #2a1d00; --good: #2fd27a; --bad: #ff4d5e;

    --btn: #34298a; --btn-ink: #fff; --field: #1a1342;
    --display: 'Bungee', 'Arial Black', system-ui, sans-serif;
    --ui: 'Outfit', system-ui, sans-serif;
  }
  html[data-theme="light"] {
    --ink: #1b1440; --muted: #514a78; --chrome: #ffffff; --chrome-line: #d9d3f2;
    --btn: #4a3bc4; --btn-ink: #fff; --field: #f4f1ff;
  }
  html[data-theme="light"] body { background: #efeafd; }
  html[data-theme="light"] body.playing { background: #0d0924; }
  html[data-theme="light"] .title h1 { color: #3a2a9a; }
  html[data-theme="light"] .rank .place { color: #7a5200; }
  html[data-theme="light"] .stage { color: #f4f1ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--stage); color: var(--ink); font-family: var(--ui); overflow-x: hidden; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  .back-link { position: fixed; top: 12px; left: 12px; z-index: 50; padding: 6px 13px; border-radius: 999px;
    background: var(--chrome); border: 1px solid var(--chrome-line); color: var(--ink); text-decoration: none;
    font-weight: 600; font-size: 14px; opacity: .8; }

  body.playing .back-link, body.playing a[title="Classroom Hub"] { display: none !important; }

  /* ---------- setup ---------- */
  .setup { max-width: 1240px; margin: 0 auto; padding: 50px 24px 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 12px; }
  .title { position: relative; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-right: 56px; }
  .title .corner { position: absolute; right: 0; top: 50%; transform: translateY(-50%); }
  .logo { display: inline-flex; align-items: center; justify-content: center; width: 1.15em; height: 1.15em; margin-right: .25em; border-radius: .18em; vertical-align: -.12em;
    background: linear-gradient(180deg, #3d31a4, #1e1660); border: 3px solid #6a5ae0; color: var(--gold); text-shadow: 0 3px 0 #6b4d00; animation: logoFlip 5s ease-in-out infinite; }
  @keyframes logoFlip { 0%, 80% { transform: rotateX(0); } 90% { transform: rotateX(180deg); } 100% { transform: rotateX(360deg); } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  .title h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4vw, 54px); margin: 0; color: var(--gold); letter-spacing: 1px; }
  .title p { margin: 0; color: var(--muted); font-size: 17px; }
  .cols { display: grid; grid-template-columns: minmax(280px, 1fr) 1.9fr; gap: 16px; }
  .card { background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 16px; padding: 14px 16px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
  .row label { min-width: 104px; font-weight: 600; font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--chrome-line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 6px 12px; font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--btn); color: var(--btn-ink); }
  .stepper { display: inline-flex; align-items: center; gap: 8px; }

    border: 1px solid var(--chrome-line); background: var(--field); color: var(--ink); font-weight: 600; font-size: 14px; text-align: left; }
  .chip.on { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
  .chip small { opacity: .75; font-weight: 500; }
  .chip-tools { display: flex; gap: 6px; align-items: center; margin: 2px 0 8px; flex-wrap: wrap; }
  .mini { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--chrome-line); background: transparent; color: var(--ink); font-size: 13px; font-weight: 600; }
  .count { margin-left: auto; font-weight: 700; }
  .count.low { color: var(--bad); }
  .note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  .start-row { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .why { color: var(--muted); font-size: 14px; }
  .big { padding: 12px 26px; border-radius: 14px; border: 0; background: var(--gold); color: var(--gold-ink); font: 400 22px var(--display); letter-spacing: 1px; }
  .ghost { padding: 10px 18px; border-radius: 12px; border: 1px solid var(--chrome-line); background: var(--chrome); color: var(--ink); font-weight: 700; font-size: 16px; }
  .credit { color: var(--muted); font-size: 12px; text-align: right; }

  /* ---------- play: the stage stays dark in both themes ---------- */
  body.playing { background: #0d0924; overflow: hidden; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 0; display: none; overflow: hidden; }
  #fx { display: block; }
  html[data-theme="light"] body:not(.playing) #fx { display: none; }

  #app { position: relative; z-index: 1; }
  .bg { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 50% -5%, #4a33c9 0%, #241a6b 35%, #120d2e 70%, #0b0820 100%); }
  .beam { position: absolute; bottom: -10vh; width: 26vw; height: 140vh; transform-origin: 50% 100%;
    background: linear-gradient(to top, rgba(170,150,255,.0), rgba(170,150,255,.16) 45%, rgba(255,255,255,0));
    clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0); filter: blur(6px); mix-blend-mode: screen; }
  .beam.b1 { left: 2vw; animation: sweepL 11s ease-in-out infinite alternate; }
  .beam.b2 { right: 2vw; animation: sweepR 13s ease-in-out infinite alternate; }
  .beam.b3 { left: 37vw; opacity: .6; animation: sweepC 17s ease-in-out infinite alternate; }
  @keyframes sweepL { from { transform: rotate(18deg); } to { transform: rotate(38deg); } }
  @keyframes sweepR { from { transform: rotate(-18deg); } to { transform: rotate(-40deg); } }
  @keyframes sweepC { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
  .bulbs { position: absolute; left: 0; right: 0; top: 0; height: 12px; }
  .bulbs::before, .bulbs::after { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle, #ffe7a1 0 3px, rgba(255,204,51,.35) 4px, transparent 6px) 0 50% / 24px 12px repeat-x; }
  .bulbs::after { background-position: 12px 50%; animation: chase .9s steps(1) infinite; }
  .bulbs::before { animation: chase .9s steps(1) infinite reverse; }
  @keyframes chase { 0% { opacity: 1; } 50% { opacity: .15; } }
  .cone { position: absolute; top: 0; height: 0; left: 0; width: 0; opacity: 0;
    background: linear-gradient(to bottom, rgba(255,226,140,0), rgba(255,226,140,.22));
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); transition: left .5s cubic-bezier(.3,1.3,.5,1), width .5s, height .3s, opacity .3s; }
  .slam { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0); font: 400 34vh/1 var(--display);
    color: #ff4d5e; text-shadow: 0 0 40px rgba(255,77,94,.7), 0 8px 0 #7a0d1a; opacity: 0; z-index: 5; }
  .slam.go { animation: slam .75s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes slam { 0% { transform: translate(-50%,-50%) scale(2.4) rotate(-12deg); opacity: 0; }
    25% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; } 70% { opacity: 1; } 100% { transform: translate(-50%,-50%) scale(.9); opacity: 0; } }
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 6; }
  #fxtop { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }

  .stage { position: relative; height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto auto; overflow: hidden; color: #f4f1ff; --pm: #c4bdf0; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 18px 16px 6px; }
  .round { font-weight: 700; color: var(--pm); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .catcard { font-family: var(--display); font-size: clamp(18px, 2.4vw, 32px); color: #1b1440; background: var(--gold); padding: 4px 16px 2px;
    border-radius: 10px; box-shadow: 0 4px 0 #b38600, 0 0 24px rgba(255,204,51,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50vw; }
  .catcard.swoop { animation: swoop .6s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes swoop { from { transform: translateX(60vw) rotate(8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .tools { margin-left: auto; display: flex; gap: 6px; }
  .tool { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font-weight: 600; font-size: 14px; }
  .tool:hover:not(:disabled) { background: rgba(255,255,255,.14); }
  .tool.music.off { opacity: .45; text-decoration: line-through; }
  .tool.armed { background: var(--bad); border-color: var(--bad); animation: pulse .6s infinite alternate; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vh; padding: 0 2vw; min-height: 0; }
  .center.enter { animation: slideIn .55s cubic-bezier(.2,1,.3,1) both; }
  @keyframes slideIn { from { transform: translateX(40vw); opacity: 0; } to { transform: none; opacity: 1; } }
  .pot { display: flex; align-items: baseline; gap: 10px; }
  .pot b { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6.5vh, 70px); color: var(--gold); line-height: 1;
    text-shadow: 0 0 22px rgba(255,204,51,.45), 0 4px 0 #8a6400; font-variant-numeric: tabular-nums; display: inline-block; }
  .pot b.bump { animation: bump .45s ease-out; }
  @keyframes bump { 40% { transform: scale(1.18); } }
  @keyframes pulse { to { filter: brightness(1.25); } }
  .pot span { color: var(--pm); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .12em; }
  .board { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.1vh 0.8vw; width: 100%; perspective: 1100px; }
  .board.shake { animation: shake .45s; }
  .tile { position: relative; flex: 0 1 auto; min-width: 0; height: var(--th, 15vh); width: var(--tw, 10vw); padding: 0; border: 0; background: none; color: inherit; }
  .tile:disabled { opacity: 1; cursor: default; }
  .tile.deal { animation: deal .55s cubic-bezier(.2,1.5,.4,1) both; animation-delay: calc(var(--i) * 45ms); }
  @keyframes deal { from { transform: translateY(-60vh) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .flipper { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,1.35,.5,1); }
  .tile.shown .flipper { transform: rotateX(180deg); }
  .face { position: absolute; inset: 0; border-radius: 14px; display: flex; align-items: center; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .front { border: 3px solid #6a5ae0; background-color: #2a1f78; background-image: linear-gradient(180deg, #3d31a4 0%, #2a1f78 55%, #1e1660 100%); color: var(--gold);
    font-family: var(--display); font-size: calc(var(--th, 15vh) * .46); text-shadow: 0 3px 0 #6b4d00;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.25), inset 0 -6px 12px rgba(0,0,0,.35), 0 8px 16px rgba(0,0,0,.45); }
  .front::after { content: ''; position: absolute; inset: -20%; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.22) 50%, transparent 60%);
    transform: translateX(-120%); animation: shimmer 7s ease-in-out infinite; animation-delay: calc(var(--i) * .25s); }
  @keyframes shimmer { 0%, 70% { transform: translateX(-120%); } 85%, 100% { transform: translateX(120%); } }
  .tile.pickable:hover .front { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,204,51,.45), 0 0 26px rgba(255,204,51,.4), inset 0 -6px 12px rgba(0,0,0,.35); }
  .tile.pickable:hover .flipper { transform: translateY(-4px); }
  .back { transform: rotateX(180deg); background-color: #f5f3ff; background-image: linear-gradient(180deg, #ffffff, #ece8ff); border: 3px solid #fff; color: #1b1440;
    font-family: var(--ui); font-weight: 800; font-size: var(--fs, calc(var(--th, 15vh) * .3)); padding: 0 5px;
    box-shadow: 0 0 24px rgba(200,190,255,.35), 0 8px 16px rgba(0,0,0,.4); }
  .back .n { position: absolute; top: 4px; left: 8px; font: 700 calc(var(--th, 15vh) * .11) var(--ui); color: #6a6296; }
  .tile.helper .back { background-color: #dfd9f8; background-image: linear-gradient(180deg, #e6e1fb, #d8d1f6); }
  .tile.fresh .back { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(255,204,51,.55), 0 0 30px rgba(255,204,51,.55); }
  .tile.flash .back::after { content: ''; position: absolute; inset: 0; background: #fff; animation: flash .5s ease-out forwards; }
  @keyframes flash { from { opacity: .9; } to { opacity: 0; } }
  .back .w { white-space: nowrap; overflow: hidden; text-overflow: clip; max-width: 100%; }
  .tile.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
  .entry { height: 28px; font: 800 20px var(--ui); color: var(--gold); letter-spacing: .1em; }
  .answer { min-height: 10vh; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; }
  .answer.rise { animation: rise .6s cubic-bezier(.2,1.3,.4,1) both; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .answer .a { font-family: var(--display); font-size: clamp(26px, 5.2vh, 56px); color: #fff; background: linear-gradient(90deg, rgba(255,204,51,0), rgba(255,204,51,.18), rgba(255,204,51,0)); padding: 0 40px; text-shadow: 0 3px 0 #3a2a9a; }
  .answer .alt { color: var(--pm); font-size: 16px; font-weight: 600; }
  .answer .msg { font-weight: 800; font-size: clamp(18px, 3vh, 28px); color: #fff; }
  .msg.good { color: #3df08c; } .msg.bad { color: #ff7a86; }
  .dock { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 16px; flex-wrap: wrap; }
  .act { padding: 10px 22px; border-radius: 12px; border: 0; font-weight: 800; font-size: 18px; color: #fff; background: #4a3bc4; box-shadow: 0 4px 0 #2a1f78; transition: transform .1s; }
  .act:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a1f78; }
  .act.ok { background: #2fd27a; color: #062a15; box-shadow: 0 4px 0 #17864a; } .act.no { background: #ff4d5e; color: #2a0006; box-shadow: 0 4px 0 #a01523; }
  .act.next { background: var(--gold); color: var(--gold-ink); box-shadow: 0 4px 0 #b38600; }
  .hint { color: var(--pm); font-size: 15px; font-weight: 600; }
  .clock { min-width: 70px; padding: 8px 12px; border-radius: 12px; border: 2px solid rgba(255,255,255,.35); background: rgba(0,0,0,.25); color: #fff; font: 800 20px var(--ui); }
  .clock.low { border-color: #ff4d5e; color: #ff7a86; animation: pulse .3s infinite alternate; }
  .clock.paused { opacity: .7; }
  .teams { display: flex; gap: 10px; justify-content: center; padding: 14px 12px 24px; flex-wrap: wrap; }
  .team { position: relative; min-width: 150px; flex: 0 1 200px; padding: 8px 14px 10px; border-radius: 14px 14px 10px 10px;
    background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.04)); border: 2px solid rgba(255,255,255,.08); border-top: 6px solid var(--tc);
    text-align: center; color: #fff; transition: transform .35s cubic-bezier(.3,1.5,.5,1), box-shadow .35s, opacity .3s; cursor: pointer; }
  .team.ctrl { transform: translateY(-8px); border-color: var(--gold); border-top-color: var(--tc); box-shadow: 0 0 0 2px rgba(255,204,51,.4), 0 10px 30px rgba(255,204,51,.3); background: linear-gradient(180deg, rgba(255,204,51,.25), rgba(255,204,51,.06)); }
  .team.out { opacity: .45; }
  .team.win { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255,204,51,.5), 0 10px 34px rgba(255,204,51,.4); background: linear-gradient(180deg, rgba(255,204,51,.3), rgba(255,204,51,.06)); }
  .team.win { animation: winpop .7s cubic-bezier(.2,1.6,.4,1); }
  @keyframes winpop { 40% { transform: translateY(-14px) scale(1.06); } }
  .team .tn { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .team .ts { font-family: var(--display); font-size: clamp(24px, 4vh, 36px); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .team .tag { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--gold-ink); font-weight: 800; font-size: 11px; padding: 2px 8px; border-radius: 99px; letter-spacing: .08em; white-space: nowrap; }
  .team .pips { display: flex; gap: 5px; justify-content: center; margin-top: 4px; }
  .team .pips span { width: 11px; height: 11px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); }
  .team .pips span.on { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 8px rgba(255,204,51,.7); }
  .mp { font: 800 13px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: #2a0006; background: #ff7a86; padding: 3px 10px; border-radius: 99px; animation: pulse .6s infinite alternate; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .mp { animation: none; } }
  .team .adj { display: none; gap: 6px; justify-content: center; margin-top: 4px; }
  body.shift .team .adj { display: flex; }
  .team .adj button { padding: 2px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.25); color: #fff; font-weight: 700; font-size: 13px; }
  .peek { position: fixed; right: 14px; bottom: 14px; z-index: 40; background: #000; color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 15px; }
  .keys { position: absolute; left: 12px; right: 12px; text-align: center; bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #9d96c4; font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    .beam, .bulbs::before, .bulbs::after, .front::after, .tool.armed, .clock.low { animation: none !important; }
    .front::after { display: none; }
    .flipper { transition: opacity .25s; }
    .tile.shown .flipper { transform: none; }
    .tile.shown .front { opacity: 0; } .back { transform: none; opacity: 0; transition: opacity .25s; } .tile.shown .back { opacity: 1; }
    .tile.deal, .catcard.swoop, .center.enter, .answer.rise, .team.win, .slam.go, .pot b.bump, .board.shake, .rank { animation-duration: .01ms !important; }
    .team, .cone { transition: none; }
  }

  /* ---------- end ---------- */
  .endwrap { max-width: 1100px; margin: 0 auto; padding: 56px 24px 30px; }

<script>

/* ---------- small helpers ---------- */

/* ---------- content ---------- */
const words = s => s.trim().split(/\s+/);

const POOL_CATS = BANK ? Object.keys(BANK) : [];
function questionsFor(level, cats) {

/* ---------- state ---------- */
let S = null;          // game state (plain JSON)
let undoStack = [];    // JSON strings of S
let setup = null;      // setup-screen settings

const clock = { left: 0, total: 0, running: false, endsAt: 0, tid: 0 };

function defaultSetup() {
  return { teams: ['Team 1', 'Team 2', 'Team 3', 'Team 4', 'Team 5', 'Team 6'], count: 2, level: 'easy',
    cats: POOL_CATS.slice(), showCat: true, helpers: false, target: 5, timer: 0, starter: 0 };
}

  o.teams = o.teams.map((t, i) => String(t || '').slice(0, 20) || 'Team ' + (i + 1));
  o.count = Math.min(6, Math.max(2, o.count | 0));

}

function newGame(st) {
  const T = st.count;
  const starter = (st.starter | 0) % T;
  S = {
    v: 2, gameId: 'g' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
    phase: 'pick',
    teams: Array.from({ length: T }, (_, i) => ({ name: (st.teams[i] || '').trim() || 'Team ' + (i + 1), color: TEAM_COLORS[i], score: 0 })),
    set: { level: st.level, cats: st.cats.slice(), showCat: !!st.showCat, helpers: !!st.helpers, target: st.target, timer: st.timer },

/* Draw the next question. Hard rules: not used this game, not `exclude`.

    id => getQ(id).cat !== lastCat && !usedTexts.some(t => nearTwins(t, getQ(id).text)),

    answer = h('div', { class: 'answer' + (rise ? ' rise' : '') },
      h('div', { class: 'msg ' + (r.winner >= 0 ? 'good' : 'bad'), text: r.winner >= 0 ? `${S.teams[r.winner].name} +${r.pts}` : 'Nobody got it' }),
      h('div', { class: 'a', text: q.a }),
      q.alt.length ? h('div', { class: 'alt', text: 'Also accepted: ' + q.alt.join(', ') }) : null);
    dock = [h('button', { type: 'button', class: 'act next', onclick: nextRound }, gameWon() ? 'Final scores (Space)' : 'Next round (Space)')];
  } else if (S.phase === 'guess') {
    const full = allShown();
    const k = (S.tried ? S.tried.filter(Boolean).length : 0) + 1, T = S.teams.length;
    const miss = S.lastMiss && S.tried && S.tried[S.lastMiss.team] ? S.lastMiss : null;
    answer = h('div', { class: 'answer' },
      miss ? h('div', { class: 'msg bad', text: `${S.teams[miss.team].name}: ${miss.how === 'time' ? 'time\'s up' : miss.how === 'pass' ? 'pass' : 'not it'}` }) : null,
      h('div', { class: 'msg', text: `${ctrlTeam.name}, what's the answer?` }),
      h('div', { class: 'alt', text: `Guess ${k} of ${T}` + (full ? ' · every word is showing' : '') }));
    dock = [
      S.set.timer ? h('button', { type: 'button', class: 'clock', title: 'Pause / start the clock (T)', onclick: toggleClock }) : null,
      h('button', { type: 'button', class: 'act ok', onclick: () => judge(true) }, '✓ Right (Y)'),
      h('button', { type: 'button', class: 'act no', onclick: () => judge(false) }, '✗ Wrong (N)'),
      h('button', { type: 'button', class: 'act', onclick: () => judge(false, 'pass') }, 'Pass (P)')];
  } else {
    const miss = S.lastMiss;
    answer = h('div', { class: 'answer' },
      miss ? h('div', { class: 'msg bad', text: 'Nobody got it on those words.' }) : null,
      h('div', { class: 'msg', text: `${ctrlTeam.name}, pick a number` }));
    dock = [h('span', { class: 'hint', text: S.flips === 0 ? 'Type a number (or click a word). Esc = different question.' : 'Type a number or click a word.' })];
  }

  const ctrlShown = S.phase === 'done' ? -1 : S.ctrl;
  const lift = ctrlShown !== anim.ctrl || newQ ? ctrlShown : -1;
  const teams = h('div', { class: 'teams' }, S.teams.map((t, i) => {
    const isCtrl = i === ctrlShown;
    const out = S.phase === 'guess' && S.tried && S.tried[i];
    return h('div', { class: 'team' + (isCtrl && i !== lift ? ' ctrl' : '') + (out ? ' out' : ''), style: '--tc:' + t.color, 'data-team': i,
      onclick: e => { if (e.target.closest('.adj')) return; giveControl(i); }, title: S.phase === 'pick' ? 'Click to hand this team the flip' : '' },
      isCtrl ? h('span', { class: 'tag', text: S.phase === 'pick' ? 'PICKING' : 'ANSWERING' }) : null,
      h('div', { class: 'tn', text: t.name }),
      h('div', { class: 'ts', text: t.score }),
      h('div', { class: 'pips', 'aria-hidden': 'true' }, Array.from({ length: S.set.target }, (_, k) => h('span', { class: k < t.score ? 'on' : '' }))),
      h('div', { class: 'adj' },
        h('button', { type: 'button', 'aria-label': 'Minus 1 point for ' + t.name, onclick: () => adjust(i, -1) }, '−1'),
        h('button', { type: 'button', 'aria-label': 'Plus 1 point for ' + t.name, onclick: () => adjust(i, 1) }, '+1')));
  }));

  const potLabel = S.phase === 'done' && gameWon() ? 'points — we have a winner!' : (allShown() && S.phase === 'guess' ? 'to win · last chance' : 'points to win');
  const potVal = S.set.target;

  const el = h('div', { class: 'stage' },
    h('div', { class: 'topbar' },
      h('span', { class: 'round', text: `Round ${S.round}` }),
      matchPoint() && S.phase !== 'done' ? h('span', { class: 'mp', text: 'Match point' }) : null,
      h('span', { class: 'catcard' + (newQ ? ' swoop' : ''), text: (S.set.showCat || S.phase === 'done') ? q.cat : '???' }),
      h('div', { class: 'tools' },
        h('button', { type: 'button', class: 'tool', title: 'Undo (Shift+U)', disabled: !undoStack.length, onclick: undo }, '↶ Undo'),
        h('button', { type: 'button', class: 'tool', title: 'New question (S)', disabled: !(S.phase === 'pick' || S.phase === 'guess'), onclick: skipQuestion }, 'Skip'),
        h('button', { type: 'button', class: 'tool' + (ui.endArmed ? ' armed' : ''), title: 'End game (Shift+E twice)', onclick: endGame }, ui.endArmed ? 'Click again to end' : 'End'),
        h('button', { type: 'button', class: 'tool music' + (mus.on ? '' : ' off'), title: mus.on ? 'Music on (B)' : 'Music off (B)', 'aria-label': mus.on ? 'Music on' : 'Music off', 'aria-pressed': String(mus.on), onclick: () => { setMusic(!mus.on); render(); } }, '🎵'),
        h('button', { type: 'button', class: 'tool mute', title: snd.muted ? 'Sound off (M)' : 'Sound on (M)', 'aria-label': snd.muted ? 'Sound off' : 'Sound on', onclick: () => { setMuted(!snd.muted); render(); } }, snd.muted ? '🔇' : '🔊'),
        h('button', { type: 'button', class: 'tool theme-toggle', onclick: () => window.toggleTheme() }))),
    h('div', { class: 'center' + (newQ ? ' enter' : '') },
      h('div', { class: 'pot' }, h('b', { text: potVal }), h('span', { text: potLabel })),
      board,
      h('div', { class: 'entry', text: ui.entry ? 'Word ' + ui.entry + '…' : '' }),
      answer),
    h('div', { class: 'dock' }, dock),
    teams,
    h('div', { class: 'keys', text: 'number = flip · Y/N/P judge · Space next · S skip · hold A peek · M sound · B music · Shift: ±1 · Shift+U undo · Shift+E end' + (S.set.timer ? ' · T clock' : '') }),
    ui.peek && S.phase !== 'done' ? h('div', { class: 'peek', text: 'Answer: ' + q.a + (q.alt.length ? ' (' + q.alt.join(', ') + ')' : '') }) : null
  );
  const plan = { toFlip, potFrom: newQ ? null : anim.pot, potTo: potVal, scores: anim.phase === null ? [] : anim.scores, lift, ctrlShown };
  return { el, plan };
}
function rowsH(n) { return n <= 9 ? 24 : 16; }

function ranking() {
  const order = S.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score || a.i - b.i);
  let place = 0;
  return order.map((t, k) => { if (k === 0 || t.score !== order[k - 1].score) place = k + 1; return { ...t, place }; });
}
function renderEnd() {
  const r = ranking();
  const ord = ['', '1st', '2nd', '3rd', '4th', '5th', '6th'];
  return h('div', { class: 'endwrap' },
    h('div', { class: 'title' }, h('h1', { text: r.filter(t => t.place === 1).length > 1 ? 'It\'s a tie!' : r[0].name + ' wins!' }),
      h('div', { class: 'corner' }, h('button', { type: 'button', class: 'tool theme-toggle', style: 'color:var(--ink);border-color:var(--chrome-line)', onclick: () => window.toggleTheme() }))),
    h('div', { class: 'ranks' }, r.map((t, k) => h('div', { class: 'rank p' + t.place + (t.place === 1 ? ' first' : ''), style: `--tc:${t.color};--k:${r.length - 1 - k}` },
      h('div', { class: 'place', text: ord[t.place] }), h('div', { class: 'tn', text: t.name }), h('div', { class: 'ts', text: t.score })))),
    h('table', { class: 'log' },
      h('thead', {}, h('tr', {}, ['#', 'Category', 'Question', 'Answer', 'Won by', 'Words flipped'].map(x => h('th', { text: x })))),
      h('tbody', {}, S.log.map(l => h('tr', {},
        h('td', { text: l.round }), h('td', { text: l.cat }), h('td', { text: l.q }), h('td', { text: l.a }),
        h('td', { text: l.winner >= 0 ? S.teams[l.winner].name : '—' }), h('td', { text: `${l.flips} of ${l.words}` }))))),
    h('div', { class: 'end-actions' },
      h('button', { type: 'button', class: 'ghost', disabled: !undoStack.length, onclick: undo }, '↶ Undo'),
      h('button', { type: 'button', class: 'big', onclick: rematch }, 'Rematch'),
      h('button', { type: 'button', class: 'ghost', onclick: toSetup }, 'New game')));
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
function typeDigit(d) {
  if (!S || S.phase !== 'pick') return;
  const n = S.q.words.length;
  const buf = ui.entry + d;
  const v = +buf;
  if (buf === '0') return;
  if (v > n) { ui.entry = ''; ui.shake = -1; render(); return; }
  if (v * 10 > n || buf.length >= 2) { ui.entry = ''; flip(v - 1); return; }
  ui.entry = buf; render();
}
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'Shift') { document.body.classList.add('shift'); return; }
  if (!S || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (e.shiftKey) {
    if (k === 'U' || k === 'u') { e.preventDefault(); undo(); }
    else if (k === 'E' || k === 'e') { e.preventDefault(); endGame(); }
    return;
  }
  if (S.phase === 'end') return;
  if (/^[0-9]$/.test(k)) { e.preventDefault(); typeDigit(k); return; }
  if (k === 'Enter') { e.preventDefault(); if (ui.entry) { const v = +ui.entry; ui.entry = ''; flip(v - 1); } return; }
  if (k === 'Backspace') { if (ui.entry) { ui.entry = ''; render(); } return; }
  if (k === 'Escape') { if (ui.entry) { ui.entry = ''; render(); } else cancelQuestion(); return; }
  if (k === ' ') { e.preventDefault(); if (S.phase === 'done') nextRound(); return; }
  const lk = k.toLowerCase();
  if (lk === 'y') judge(true);
  else if (lk === 'n') judge(false);
  else if (lk === 'p') judge(false, 'pass');
  else if (lk === 's') skipQuestion();
  else if (lk === 'm') { setMuted(!snd.muted); render(); }
  else if (lk === 'b') { setMusic(!mus.on); render(); }
  else if (lk === 't') { if (S.phase === 'guess' && S.set.timer) toggleClock(); }
  else if (lk === 'a' && !e.repeat) { ui.peek = true; render(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') document.body.classList.remove('shift');
  if ((e.key === 'a' || e.key === 'A') && ui.peek) { ui.peek = false; render(); }
});
window.addEventListener('blur', () => { document.body.classList.remove('shift'); if (ui.peek) { ui.peek = false; render(); } });

/* ---------- boot ---------- */
setup = BANK ? loadSetup() : null;
render();

/* test hooks */
window.QM = {
  get S() { return S; }, set S(v) { S = v; }, get undoStack() { return undoStack; }, get ui() { return ui; }, clock,
  setSilent(v) { silent = v; }, newGame, flip, judge, nextRound, skipQuestion, cancelQuestion, adjust, giveControl, endGame, undo,
  rematch, resume, toSetup, render, pot, hidden, questionsFor, getQ, nearTwins, tileSize, ranking, POOL_CATS,
  get setup() { return setup; }, set setup(v) { setup = v; }, snd, setMuted, mus, setMusic
};
