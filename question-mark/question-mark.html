<script>
'use strict';
/* =====================================================================
   QUESTION MARK — the question is hidden word by word.
   State lives in one plain-JSON object S. Every scoring/turn action
   snapshots S first (undo, 30 deep) and autosaves afterwards.
   ===================================================================== */
const SAVE_KEY = 'questionmark:save', SETUP_KEY = 'questionmark:setup', HIST_KEY = 'questionmark:history';
const THEME_KEY = 'arschul:theme';
const TEAM_COLORS = ['#ff5d5d', '#4dabff', '#3ddc84', '#ffb020', '#c77dff', '#2ee6d6'];
const TEAM_INK = ['#fff', '#062033', '#062a15', '#2a1d00', '#fff', '#062a28'];
const LEVELS = { easy: 5, medium: 10, all: 15 };
const LEVEL_LABEL = { easy: 'Easy', medium: 'Medium', all: 'All' };
const HELPER_WORDS = new Set(['a', 'an', 'the', 'is', 'are', 'was', 'were', 'do', 'does', 'did', 'of', 'in', 'on', 'at', 'to', 'for']);
const UNDO_DEPTH = 30, HISTORY_GAMES = 3;

const BANK = window.JEOPARDY_BANK;
const app = document.getElementById('app');

/* ---------- small helpers ---------- */

    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

const words = s => s.trim().split(/\s+/);
const norm = w => w.toLowerCase().replace(/[^a-z0-9']/g, '');
const POOL_CATS = BANK ? Object.keys(BANK.categories).filter(c => BANK.groups[c] !== 'Grammar' && !BANK.frame.includes(c)) : [];
const FRAME_CATS = BANK ? Object.keys(BANK.categories).filter(c => BANK.groups[c] !== 'Grammar' && BANK.frame.includes(c)) : [];
function questionsFor(level, cats) {
  const max = LEVELS[level] || 5, out = [];
  for (const c of cats) {
    if (!POOL_CATS.includes(c)) continue;
    for (const q of BANK.categories[c]) if (q.rank <= max) out.push(c + '#' + q.rank);
  }
  return out;
}
function getQ(id) {
  const i = id.lastIndexOf('#'), cat = id.slice(0, i), rank = +id.slice(i + 1);
  const q = BANK.categories[cat].find(x => x.rank === rank);
  return { id, cat, rank, cefr: q.cefr, text: q.reveal || q.q, a: q.a, alt: q.alt || [] };

function nearTwins(a, b) {
  const A = words(a).map(norm), B = words(b).map(norm);
  return A.length === B.length && A.filter((w, k) => w !== B[k]).length <= 1;

/* ---------- state ---------- */
let S = null;          // game state (plain JSON)
let undoStack = [];    // JSON strings of S
let setup = null;      // setup-screen settings
let ui = { entry: '', shake: -1, endArmed: 0, peek: false, fresh: -1 };
const clock = { left: 0, total: 0, running: false, endsAt: 0, tid: 0 };
let silent = false;    // tests: skip rendering

function defaultSetup() {
  return { teams: ['Team 1', 'Team 2', 'Team 3', 'Team 4', 'Team 5', 'Team 6'], count: 2, level: 'easy',
    cats: POOL_CATS.slice(), showCat: true, helpers: false, rounds: 10, timer: 0, starter: 0 };
}
function loadSetup() {
  const d = defaultSetup(), s = store.get(SETUP_KEY, null);
  if (!s || typeof s !== 'object') return d;
  const o = Object.assign(d, s);

  o.teams = o.teams.map((t, i) => String(t || '').slice(0, 20) || 'Team ' + (i + 1));
  o.count = Math.min(6, Math.max(2, o.count | 0));
  if (!LEVELS[o.level]) o.level = 'easy';
  o.cats = Array.isArray(o.cats) ? o.cats.filter(c => POOL_CATS.includes(c)) : d.cats;
  if (![6, 10, 15].includes(o.rounds)) o.rounds = 10;
  if (![0, 10, 15, 20].includes(o.timer)) o.timer = 0;
  o.starter = (o.starter | 0) % 6;

}
function saveSetup() { store.set(SETUP_KEY, setup); }

function newGame(st) {
  const T = st.count;
  const starter = (st.starter | 0) % T;
  S = {
    v: 1, gameId: 'g' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
    phase: 'pick',
    teams: Array.from({ length: T }, (_, i) => ({ name: (st.teams[i] || '').trim() || 'Team ' + (i + 1), color: TEAM_COLORS[i], score: 0 })),
    set: { level: st.level, cats: st.cats.slice(), showCat: !!st.showCat, helpers: !!st.helpers, rounds: st.rounds, timer: st.timer },
    round: 1, starter, ctrl: starter, picker: starter, nextStarter: starter, firstStarter: starter,
    q: null, flips: 0, tried: null, result: null, used: [], log: []

   not seen in the last 3 games, not the same category as the last round. */

  const used = new Set(S.used), ex = new Set(exclude);
  const recent = new Set(recentHistory());
  const lastCat = S.q ? S.q.cat : (S.log.length ? S.log[S.log.length - 1].cat : null);
  const usedTexts = S.used.map(id => getQ(id).text);
  const base = all.filter(id => !used.has(id) && !ex.has(id));
  const tiers = [
    id => !recent.has(id) && getQ(id).cat !== lastCat && !usedTexts.some(t => nearTwins(t, getQ(id).text)),
    id => getQ(id).cat !== lastCat && !usedTexts.some(t => nearTwins(t, getQ(id).text)),
    id => !usedTexts.some(t => nearTwins(t, getQ(id).text)),
    () => true
  ];
  let pick = null;
  for (const f of tiers) { const c = base.filter(f); if (c.length) { pick = c[Math.floor(Math.random() * c.length)]; break; } }
  if (!pick) { // every question used: allow repeats rather than stall
    const c = all.filter(id => !ex.has(id));

}

const pot = () => Math.max(1, hidden()) * 100;

/* ---------- cross-game history ---------- */
function recentHistory() {

    else if (allShown()) { S.result = { winner: -1, pts: 0 }; finishRound(-1); sfx('none'); }

    h('div', { class: 'title' }, h('h1', { text: r.filter(t => t.place === 1).length > 1 ? 'It\'s a tie!' : r[0].name + ' wins!' }),

    h('div', { class: 'ranks' }, r.map(t => h('div', { class: 'rank' + (t.place === 1 ? ' first' : ''), style: '--tc:' + t.color },
      h('div', { class: 'place', text: ord[t.place] }), h('div', { class: 'tn', text: t.name }), h('div', { class: 'ts', text: t.score })))),
    h('table', { class: 'log' },
      h('thead', {}, h('tr', {}, ['#', 'Category', 'Question', 'Answer', 'Won by', 'Words flipped', 'Points'].map(x => h('th', { text: x })))),
      h('tbody', {}, S.log.map(l => h('tr', {},
        h('td', { text: l.round }), h('td', { text: l.cat }), h('td', { text: l.q }), h('td', { text: l.a }),
        h('td', { text: l.winner >= 0 ? S.teams[l.winner].name : '—' }), h('td', { text: `${l.flips} of ${l.words}` }), h('td', { text: l.pts }))))),
    h('div', { class: 'end-actions' },
      h('button', { type: 'button', class: 'ghost', disabled: !undoStack.length, onclick: undo }, '↶ Undo'),
      h('button', { type: 'button', class: 'big', onclick: rematch }, 'Rematch'),
      h('button', { type: 'button', class: 'ghost', onclick: toSetup }, 'New game')));
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
function typeDigit(d) {
  if (!S || S.phase !== 'pick') return;
  const n = S.q.words.length;
  const buf = ui.entry + d;
  const v = +buf;
  if (buf === '0') return;
  if (v > n) { ui.entry = ''; ui.shake = -1; render(); return; }
  if (v * 10 > n || buf.length >= 2) { ui.entry = ''; flip(v - 1); return; }
  ui.entry = buf; render();
}
document.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
  if (e.key === 'Shift') { document.body.classList.add('shift'); return; }
  if (!S || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (e.shiftKey) {
    if (k === 'U' || k === 'u') { e.preventDefault(); undo(); }
    else if (k === 'E' || k === 'e') { e.preventDefault(); endGame(); }
    return;
  }
  if (S.phase === 'end') return;
  if (/^[0-9]$/.test(k)) { e.preventDefault(); typeDigit(k); return; }
  if (k === 'Enter') { e.preventDefault(); if (ui.entry) { const v = +ui.entry; ui.entry = ''; flip(v - 1); } return; }
  if (k === 'Backspace') { if (ui.entry) { ui.entry = ''; render(); } return; }
  if (k === 'Escape') { if (ui.entry) { ui.entry = ''; render(); } else cancelQuestion(); return; }
  if (k === ' ') { e.preventDefault(); if (S.phase === 'done') nextRound(); return; }
  const lk = k.toLowerCase();
  if (lk === 'y') judge(true);
  else if (lk === 'n') judge(false);
  else if (lk === 'p') judge(false, 'pass');
  else if (lk === 's') skipQuestion();
  else if (lk === 't') { if (S.phase === 'guess' && S.set.timer) toggleClock(); }
  else if (lk === 'a' && !e.repeat) { ui.peek = true; render(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'Shift') document.body.classList.remove('shift');
  if ((e.key === 'a' || e.key === 'A') && ui.peek) { ui.peek = false; render(); }
});
window.addEventListener('blur', () => { document.body.classList.remove('shift'); if (ui.peek) { ui.peek = false; render(); } });

/* ---------- boot ---------- */
setup = BANK ? loadSetup() : null;
render();

/* test hooks */
window.QM = {
  get S() { return S; }, set S(v) { S = v; }, get undoStack() { return undoStack; }, get ui() { return ui; }, clock,
  setSilent(v) { silent = v; }, newGame, flip, judge, nextRound, skipQuestion, cancelQuestion, adjust, giveControl, endGame, undo,
  rematch, resume, toSetup, render, pot, hidden, questionsFor, getQ, nearTwins, tileSize, ranking, POOL_CATS, FRAME_CATS,
  get setup() { return setup; }, set setup(v) { setup = v; }
};
</script>
