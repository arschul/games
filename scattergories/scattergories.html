<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scattergories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Figtree:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --s:1;
  --disp:'Anton',Impact,'Arial Narrow',sans-serif;
  --ui:'Figtree',system-ui,sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
  /* scene (swaps with theme) */
  --desk-a:#1d2740; --desk-b:#0d1322; --lamp:rgba(255,190,100,.22); --stitch:rgba(201,154,59,.38);
  --chrome:#efe5cb; --chrome-dim:#a8a28f; --leather:#2a3350; --leather-edge:#121827;
  /* materials (fixed) */
  --paper:#f4df7a; --paper-2:#ebcf5f; --rule:#7aa6d6; --margin:#d2352b; --ink:#1d2742; --ink-2:#4b5573;
  --brass:#c99a3b; --brass-hi:#f3d68a; --brass-edge:#76561a;
  --green:#2f9e6a; --green-hi:#5bc690; --green-edge:#17583a;
  --ember:#e0612b; --ember-hi:#f6995f; --ember-edge:#8a3210;
  --card:#fbf7ec; --card-line:#c3d6ea; --danger:#d2352b;
}
:root[data-theme="light"]{
  --desk-a:#9aa7bd; --desk-b:#6d7b93; --lamp:rgba(255,240,200,.45); --stitch:rgba(255,255,255,.55);
  --chrome:#17203a; --chrome-dim:#33405f; --leather:#e8e0cb; --leather-edge:#9c927a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--desk-b)}
button{font-family:var(--ui);cursor:pointer}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s));overflow:hidden;font-family:var(--ui);color:var(--chrome);user-select:none}
#scene{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 980px 760px at 64% 40%,var(--lamp),transparent 70%),
    repeating-linear-gradient(37deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(-53deg,rgba(0,0,0,.05) 0 1px,transparent 1px 5px),
    linear-gradient(160deg,var(--desk-a),var(--desk-b))}
#scene::after{content:"";position:absolute;inset:16px;border:2px dashed var(--stitch);border-radius:28px;pointer-events:none}
#shaker{position:absolute;inset:0}

/* ---------- top bar ---------- */
.top{position:absolute;left:44px;right:44px;top:28px;height:72px;display:flex;align-items:center;gap:22px}
.leatherbtn{background:linear-gradient(180deg,color-mix(in srgb,var(--leather) 88%,#fff),var(--leather));color:var(--chrome);border:none;
  box-shadow:0 4px 0 var(--leather-edge),0 10px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s,box-shadow .12s}
.leatherbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--leather-edge),0 4px 8px rgba(0,0,0,.3)}
.back-link{display:inline-flex;align-items:center;height:56px;padding:0 24px;border-radius:999px;text-decoration:none;font:700 22px var(--ui);white-space:nowrap}
.top h1{margin:0 0 0 6px;font:400 66px/1 var(--disp);color:var(--paper);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.35)}
:root[data-theme="light"] .top h1{color:#2a2410;text-shadow:0 2px 0 rgba(255,255,255,.4)}
.roundchip{margin-left:8px;height:52px;padding:0 24px;border-radius:14px;display:flex;align-items:center;font:800 26px var(--ui);color:#2a1d05;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 4px 0 var(--brass-edge),0 10px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.tools{margin-left:auto;display:flex;gap:14px}
.tbtn{width:60px;height:60px;border-radius:50%;display:grid;place-items:center}
.tbtn svg{width:28px;height:28px}
.tbtn.off{opacity:.55}

/* ---------- left column: letter flap + sand timer ---------- */
#left{position:absolute;left:48px;top:122px;width:600px;height:816px}
.flapbox{position:absolute;left:0;top:0;width:340px;height:410px;border-radius:26px;
  background:linear-gradient(180deg,#2c313b,#15181e);
  box-shadow:0 0 0 7px var(--brass),0 0 0 9px var(--brass-edge),0 18px 30px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.1);transition:box-shadow .4s}
.flapbox.live{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 7px var(--brass-hi),0 0 0 9px var(--brass-edge),0 0 46px 10px rgba(243,214,138,.45),0 18px 30px rgba(0,0,0,.55)}}
.flapcard{position:absolute;left:35px;top:26px;width:270px;height:320px;perspective:900px}
.half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;backface-visibility:hidden}
.half.top{top:0;border-radius:14px 14px 0 0;background:linear-gradient(#3d424d,#2e323b);transform-origin:50% 100%}
.half.bot{top:50%;border-radius:0 0 14px 14px;background:linear-gradient(#2a2e36,#1e2229);transform-origin:50% 0}
.half .ch{position:absolute;left:0;width:100%;height:320px;text-align:center;font:400 200px/404px var(--disp);color:#f3e9cf}
.half.bot .ch{top:-160px}
.flip{visibility:hidden;z-index:2}
.flip.top{box-shadow:inset 0 -20px 30px rgba(0,0,0,.25)}
.hinge{position:absolute;left:-6px;right:-6px;top:159px;height:3px;background:#0c0e12;z-index:3}
.hinge::before,.hinge::after{content:"";position:absolute;top:-6px;width:12px;height:15px;border-radius:4px;background:linear-gradient(180deg,var(--brass-hi),var(--brass-edge))}
.hinge::before{left:-4px}.hinge::after{right:-4px}
.nameplate{position:absolute;left:95px;top:358px;width:150px;height:38px;border-radius:8px;display:grid;place-items:center;font:400 24px var(--disp);color:#2a1d05;letter-spacing:.5px;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 2px 0 var(--brass-edge),inset 0 1px 0 rgba(255,255,255,.5)}
.glass{position:absolute;left:372px;top:-8px;width:228px;height:420px}
.glass svg{position:absolute;left:4px;top:0;width:220px;height:320px;overflow:visible}
#hg{transform-origin:110px 160px;transition:transform .9s cubic-bezier(.3,1.5,.5,1)}
#hg.tipped{transform:rotate(90deg) scale(.68)}
.timeNum{position:absolute;left:0;right:0;top:318px;text-align:center;font:400 82px/1 var(--disp);color:var(--chrome);letter-spacing:1px}
.timeNum.warn{color:var(--brass-hi)}
:root[data-theme="light"] .timeNum.warn{color:#8a5b00}
.timeNum.danger{color:#ff5a4a;animation:tpulse 1s ease-in-out infinite}
@keyframes tpulse{50%{transform:scale(1.08)}}

/* ---------- action buttons ---------- */
.actions{position:absolute;left:0;top:438px;width:600px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:104px;border:none;border-radius:22px;color:#fff;
  font:400 48px/1 var(--disp);letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25);
  background:linear-gradient(180deg,var(--a1),var(--a2));
  box-shadow:0 9px 0 var(--edge),0 20px 30px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .12s,box-shadow .12s}
.act:active{transform:translateY(7px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4)}
.act small{font:700 22px var(--ui);letter-spacing:0;margin-top:6px;opacity:.92;text-shadow:none}
.act.brass{--a1:var(--brass-hi);--a2:var(--brass);--edge:var(--brass-edge);color:#2a1d05;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.act.green{--a1:var(--green-hi);--a2:var(--green);--edge:var(--green-edge)}
.act.ember{--a1:var(--ember-hi);--a2:var(--ember);--edge:var(--ember-edge)}
.act.glow{animation:aglow 2.2s ease-in-out infinite}
@keyframes aglow{50%{box-shadow:0 9px 0 var(--edge),0 0 40px 8px color-mix(in srgb,var(--a1) 60%,transparent),inset 0 2px 0 rgba(255,255,255,.35)}}
.act.pop{animation:apop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes apop{from{transform:translateY(30px) scale(.92);opacity:0}}
.sec{display:flex;gap:14px;margin-top:18px;min-height:64px}
.sbtn{flex:1;height:64px;border-radius:16px;font:800 24px var(--ui)}
.sbtn:empty{display:none}

/* ---------- scoring key (index card) ---------- */
.indexcard{background:repeating-linear-gradient(180deg,transparent 0 41px,var(--card-line) 41px 43px) 0 52px/100% calc(100% - 52px) no-repeat,var(--card);
  color:var(--ink);border-radius:6px;box-shadow:0 14px 24px rgba(0,0,0,.45),0 2px 0 rgba(0,0,0,.08)}
.indexcard::before{content:"";position:absolute;left:0;right:0;top:50px;height:2px;background:#e27a74}
.keycard{position:absolute;left:0;top:634px;width:600px;height:190px;padding:8px 22px 0;transform:rotate(-1.2deg)}
.clip{position:absolute;left:50%;top:-16px;width:90px;height:30px;margin-left:-45px;border-radius:6px;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass) 60%,var(--brass-edge));box-shadow:0 3px 5px rgba(0,0,0,.4)}
.keycard h3{margin:0;height:42px;font:400 32px/42px var(--disp);color:var(--ink)}
.keycard h3 span{font:700 28px var(--hand);color:var(--margin);margin-left:10px}
.keyrows{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:6px}
.krow{display:flex;align-items:center;gap:12px;height:43px;font:700 23px var(--ui);color:var(--ink)}
.knote{position:absolute;left:22px;right:22px;bottom:2px;font:700 25px/1.05 var(--hand);color:var(--ink-2)}
.coin{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:400 22px var(--disp);color:#2a1d05;
  background:radial-gradient(circle at 35% 30%,#fff6d6,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,var(--brass-hi),var(--brass) 75%);
  box-shadow:0 2px 0 var(--brass-edge),inset 0 0 0 3px rgba(118,86,26,.35)}
.coin.c3{background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,#ffe58a,#d9a52a 75%)}
.coin.c1{background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 60%,#e9d6b0,#b8935a 75%)}
.xmark{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:400 24px var(--disp);color:var(--danger);border:3px solid var(--danger);transform:rotate(-8deg)}

/* ---------- legal pad ---------- */
#pad{position:absolute;left:690px;top:120px;width:1186px;height:818px}
.stack{position:absolute;inset:10px -8px -10px 8px;border-radius:4px 4px 10px 10px;background:#d9be55;box-shadow:0 20px 34px rgba(0,0,0,.5);transform:rotate(.6deg)}
.sheet{position:absolute;inset:0;border-radius:4px 4px 8px 8px;background:linear-gradient(180deg,var(--paper),var(--paper-2));box-shadow:0 2px 0 rgba(0,0,0,.08),0 10px 18px rgba(0,0,0,.25);overflow:hidden}
.sheet::before{content:"";position:absolute;left:96px;top:0;bottom:0;width:7px;border-left:2px solid var(--margin);border-right:2px solid var(--margin);opacity:.75;z-index:1;pointer-events:none}
.binding{position:absolute;left:-6px;right:-6px;top:-12px;height:58px;border-radius:10px 10px 4px 4px;z-index:3;
  background:linear-gradient(180deg,#7a2a26,#511a18);box-shadow:0 6px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.15)}
.binding i{position:absolute;top:40px;width:38px;height:8px;border-radius:2px;background:linear-gradient(180deg,#e8e2d6,#9d978b)}
.padhead{position:absolute;left:0;right:0;top:46px;height:76px;display:flex;align-items:flex-end;padding:0 30px 6px 122px;border-bottom:2px solid var(--rule);z-index:2}
.padhead .lt{font:700 40px var(--hand);color:var(--ink-2)}
.padhead .lt b{font:400 54px/1 var(--disp);color:var(--margin);margin-left:12px}
.padhead .note{margin-left:auto;font:700 30px var(--hand);color:var(--ink-2)}
#padBody{position:absolute;left:0;right:0;top:124px;bottom:0}
.row{position:relative;display:flex;align-items:center;border-bottom:2px solid var(--rule)}
.row .num{flex:none;width:96px;text-align:center;font:700 46px var(--hand);color:var(--margin)}
.row .cat{flex:1;padding-left:30px;font:800 42px/1.1 var(--ui);color:var(--ink)}
.row.deal{animation:deal .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes deal{from{transform:translateX(70px) rotate(1.5deg);opacity:0}}
.reroll{margin-right:26px;width:52px;height:52px;border-radius:50%;border:2px solid rgba(29,39,66,.25);background:rgba(255,255,255,.35);color:var(--ink-2);display:grid;place-items:center}
.reroll svg{width:24px;height:24px}
.reroll:hover{background:rgba(255,255,255,.7)}
.empty{padding:60px 0 0 130px;font:700 54px var(--hand);color:var(--ink-2)}

/* scoring grid */
.grid{display:grid;align-items:stretch}
.grid > div{border-bottom:2px solid var(--rule);display:flex;align-items:center;min-width:0}
.gh{justify-content:center;flex-direction:column;gap:2px;padding-top:4px}
.gh .em{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--tc);box-shadow:0 2px 0 color-mix(in srgb,var(--tc) 50%,#000)}
.gh .nm{font:800 19px var(--ui);color:var(--ink);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px}
.gnum{justify-content:center;font:700 40px var(--hand);color:var(--margin)}
.gcat{padding:0 14px 0 26px;font:800 27px/1.1 var(--ui);color:var(--ink)}
.cell{justify-content:center;flex-direction:column;gap:2px;cursor:pointer;position:relative;border-left:1px dashed rgba(122,166,214,.6)}
.cell:hover{background:rgba(255,255,255,.22)}
.cell.sel{background:rgba(255,255,255,.42);box-shadow:inset 0 0 0 4px var(--tc)}
.cell .slot{width:40px;height:40px;border-radius:50%;border:3px dashed rgba(29,39,66,.25);display:grid;place-items:center}
.cell .coin{width:42px;height:42px;font-size:25px}
.cell .xmark{width:40px;height:40px;font-size:24px}
.cell .ans{font:700 22px/1 var(--hand);color:var(--ink);max-width:100%;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.dup .coin{filter:grayscale(1) opacity(.55)}
.cell.dup .ans{text-decoration:line-through;color:var(--margin)}
.cell .stampin{animation:stampin .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes stampin{from{transform:scale(2.2) rotate(-14deg);opacity:0}}
.gtot{justify-content:center;font:400 40px var(--disp);color:var(--ink)}
.gtotl{padding-left:26px;font:700 34px var(--hand);color:var(--ink-2)}

/* ---------- scoreboard (team name tents) ---------- */
#board{position:absolute;left:48px;right:44px;top:958px;height:96px;display:flex;gap:18px}
.plaque{flex:1;min-width:0;border-radius:18px;display:flex;align-items:center;gap:14px;padding:0 20px 0 14px;color:var(--ti);position:relative;
  background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 82%,#fff),var(--tc) 40%,color-mix(in srgb,var(--tc) 72%,#000));
  box-shadow:0 7px 0 color-mix(in srgb,var(--tc) 42%,#000),0 16px 22px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.plaque .em{flex:none;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:40px;
  background:radial-gradient(circle at 35% 30%,#fff,#ebe4d2);box-shadow:inset 0 -3px 5px rgba(0,0,0,.2),0 3px 0 rgba(0,0,0,.25)}
.plaque .nm{flex:1;min-width:0;font:400 38px/1 var(--disp);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;letter-spacing:.3px}
.plaque .tot{font:400 62px/1 var(--disp)}
.plaque.lead{outline:5px solid var(--brass-hi);outline-offset:3px}
.plaque .plus{position:absolute;right:16px;top:-46px;font:400 40px var(--disp);color:var(--brass-hi);text-shadow:0 3px 0 rgba(0,0,0,.4);pointer-events:none}

/* ---------- overlays ---------- */
#ov{position:absolute;inset:0;z-index:60;display:none;place-items:center;background:rgba(5,9,18,.62)}
#ov.show{display:grid;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
#ov .indexcard{position:relative;width:1080px;padding:8px 54px 40px;animation:lift .45s cubic-bezier(.3,1.35,.5,1)}
@keyframes lift{from{transform:translateY(40px) scale(.96);opacity:0}}
#ov h2{margin:0;height:46px;font:400 40px/46px var(--disp);color:var(--ink)}
#ov p{margin:0;font:600 25px/43px var(--ui);color:var(--ink)}
.ovbody{margin-top:18px}
.lab{font:800 22px/1 var(--ui);color:var(--ink-2);margin:16px 0 10px}
.seg{display:inline-flex;gap:8px;margin-right:30px}
.seg button{min-width:86px;height:58px;padding:0 18px;border-radius:14px;border:3px solid rgba(29,39,66,.2);background:#fff;font:800 24px var(--ui);color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.teamrows{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.trow{display:flex;align-items:center;gap:12px}
.trow .em{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--tc);border:none;box-shadow:0 3px 0 color-mix(in srgb,var(--tc) 45%,#000)}
.trow input{flex:1;height:56px;border-radius:12px;border:3px solid rgba(29,39,66,.2);padding:0 16px;font:800 26px var(--ui);color:var(--ink);background:#fff}
.toggle{display:flex;align-items:center;gap:16px;font:700 25px var(--ui);color:var(--ink);cursor:pointer;margin-top:4px}
.toggle .sw{width:76px;height:42px;border-radius:21px;background:#c9ccd4;position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;left:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .2s}
.toggle.on .sw{background:var(--green)}
.toggle.on .sw::after{left:38px}
.ovact{display:flex;gap:18px;margin-top:30px}
.ovact .act{height:96px;font-size:42px}
.ovact .act{flex:1}
.ovact .sbtn{height:96px;flex:0 0 210px;font-size:26px}
.rules li{font:600 25px/43px var(--ui);color:var(--ink)}
.rules ul{margin:0;padding-left:30px}
/* answer card */
.aq{display:flex;align-items:center;gap:18px;margin-top:10px}
.aq .em{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:var(--tc)}
.aq .t{font:800 30px var(--ui);color:var(--ink)}
.aq .lt{margin-left:auto;font:400 64px/1 var(--disp);color:var(--margin)}
#ansIn{width:100%;height:92px;margin-top:18px;border:none;border-bottom:4px solid var(--ink);background:transparent;font:700 66px var(--hand);color:var(--ink);outline:none;padding:0 6px}
.sugg{height:48px;margin-top:10px;font:800 27px/48px var(--ui);color:var(--ink-2)}
.sugg b{color:var(--ink)}
.pick{display:flex;gap:14px;margin-top:18px}
.pick .act{height:96px;font-size:40px}
.pick .sbtn{flex:none;width:96px;height:96px;font:400 44px var(--disp)}
/* final */
.final{display:flex;gap:40px;align-items:flex-start;margin-top:12px}
.rosette{flex:none;width:280px;height:340px}
.rank{flex:1}
.rk{display:flex;align-items:center;gap:16px;height:72px;border-bottom:2px solid var(--card-line)}
.rk .p{width:40px;font:400 34px var(--disp);color:var(--ink-2)}
.rk .em{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:var(--tc)}
.rk .n{flex:1;font:800 30px var(--ui);color:var(--ink)}
.rk .t{font:400 46px var(--disp);color:var(--ink)}
.winline{font:400 72px/1.05 var(--disp);color:var(--ink);margin:6px 0 4px}

/* ---------- banner, stamp, fx ---------- */
#banner{position:absolute;left:-80px;right:-80px;top:410px;height:180px;z-index:55;display:none;align-items:center;justify-content:center;gap:30px;
  transform:skewX(-12deg);background:linear-gradient(180deg,var(--brass-hi),var(--brass) 55%,var(--brass-edge));box-shadow:0 20px 40px rgba(0,0,0,.5);

}
function timeUp() {
  render(); flash(); shake(26, 750); S.fail();
  stamp('TIME!', 'Pencils down', 'var(--danger)');
  var p = stagePt($('pad'));
  emit(50, p.x, 930, { kind: 'puff', colors: ['rgba(244,223,122,.5)', 'rgba(255,255,255,.35)', 'rgba(210,180,120,.45)'], speed: 3, size: 22, decay: .012, g: -.02, w: 1100, spread: Math.PI, angle: -Math.PI / 2 });
}
function doStop() {
  if (!G || !E.stop(G)) return;
  clearInterval(clock); save(); render(); S.stamp(); shake(10, 450);
  stamp('STOP', 'Pencils down', 'var(--brass-edge)');
}
function togglePause() { if (!G) return; E.setPaused(G, !G.paused); save(); render(); if (!G.paused) startClock(); }
function doBeginScoring() {
  if (!G || !E.beginScoring(G)) return;
  hideStamp(); sel = { c: 0, t: 0 }; save(); render(); S.deal(0);
  if (!reduced) $('padBody').animate([{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'ease-out' });
}
function doLock() {
  if (!G || G.phase !== 'scoring') return;
  var before = G.totals.slice(), sc = E.lockRound(G);
  closeOv(); save(); render(); renderBoard(before);
  var best = Math.max.apply(null, sc);
  S.bank();
  G.teams.forEach(function (t, i) {
    setTimeout(function () {
      var el = $('tot-' + i), plq = $('plq-' + i); if (!el || !plq) return;
      var from = before[i], to = G.totals[i], t0 = performance.now(), dur = reduced ? 0 : 700;
      (function step(now) {
        var k = dur ? Math.min(1, (now - t0) / dur) : 1;
        el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step);
      })(t0);
      var p = stagePt(plq);
      if (sc[i] > 0) {
        var plus = document.createElement('span'); plus.className = 'plus'; plus.textContent = '+' + sc[i]; plq.appendChild(plus);
        if (!reduced) plus.animate([{ transform: 'translateY(20px)', opacity: 0 }, { transform: 'none', opacity: 1, offset: .25 }, { transform: 'translateY(-18px)', opacity: 0 }], { duration: 1500, fill: 'forwards' });
        else setTimeout(function () { plus.remove(); }, 1500);
        emit(14, p.x, p.y, { colors: WARM, speed: 7, size: 5, decay: .03, g: .2 });
      }
      if (best > 0 && sc[i] === best) emit(60, p.x, p.y - 30, { kind: 'confetti', colors: [t.color, '#f3d68a', '#ffffff'], speed: 11, size: 12, decay: .012, g: .22, spread: 1.6 });
    }, reduced ? 0 : 200 + i * 160);
  });
  setTimeout(function () { renderBoard(); }, reduced ? 50 : 200 + G.teams.length * 160 + 900);
  if (best > 0) shake(10, 450);
}
function doNext() {
  if (!G || !E.nextRound(G)) return;
  save(); hideStamp(); setFlap('?'); render(); renderPad(true);
  banner('Round ' + G.round, 'Spin the letter');
}
function doFinish() { if (!G || !E.finish(G)) return; save(); render(); openFinal(); }

/* ---------- overlays ---------- */
function openOv(mode, html) {
  ovMode = mode; $('ovCard').innerHTML = '<div class="clip"></div>' + html; $('ov').classList.add('show');
  var c = $('ovCard'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
}
function closeOv() {
  $('ov').classList.remove('show'); ovMode = '';
  clearInterval(fireworkT); fireworkT = null;
}
$('ov').addEventListener('pointerdown', function (e) { if (e.target === $('ov') && ovMode !== 'setup-first') closeOv(); });

window.openSetup = function (fromGame) {
  var base = G ? G.teams : E.TEAM_PRESETS.slice(0, 4);
  setupDraft = {
    teams: E.TEAM_PRESETS.map(function (p, i) { return { name: base[i] ? base[i].name : p.name, emoji: p.emoji, color: p.color }; }),
    n: G ? G.teams.length : 4,
    secs: G ? G.settings.secs : 120, cats: G ? G.settings.cats : 5, rounds: G ? G.settings.rounds : 5,
    unique: G ? G.settings.unique : false, fromGame: !!(fromGame && G)
  };
  drawSetup();
};
function segHTML(id, vals, cur, fmt) {
  return '<div class="seg" data-seg="' + id + '">' + vals.map(function (v) { return '<button data-v="' + v + '" class="' + (v === cur ? 'on' : '') + '">' + fmt(v) + '</button>'; }).join('') + '</div>';
}
function drawSetup() {
  var d = setupDraft;
  var rows = '';
  for (var i = 0; i < d.n; i++) {
    var t = d.teams[i];
    rows += '<div class="trow" style="--tc:' + t.color + '"><span class="em">' + t.emoji + '</span><input data-i="' + i + '" maxlength="18" value="' + esc(t.name) + '" aria-label="Team ' + (i + 1) + ' name"></div>';
  }
  openOv(G ? 'setup' : 'setup-first',
    '<h2>' + (d.fromGame ? 'New game' : 'Set up the game') + '</h2>' +
    (d.fromGame ? '<p>Starting a new game ends the current one.</p>' : '<p>Name your teams, then choose the timer and the number of categories.</p>') +
    '<div class="ovbody">' +
    '<div class="lab">Teams</div>' + segHTML('n', [2, 3, 4, 5, 6], d.n, String) +
    '<div class="teamrows" style="margin-top:14px">' + rows + '</div>' +
    '<div style="display:flex;flex-wrap:wrap;margin-top:6px">' +
      '<div><div class="lab">Timer</div>' + segHTML('secs', E.SECS, d.secs, function (v) { return (v / 60) + ' min'; }) + '</div>' +
      '<div><div class="lab">Categories</div>' + segHTML('cats', E.CATS, d.cats, String) + '</div>' +
      '<div><div class="lab">Rounds</div>' + segHTML('rounds', [3, 5, 8], d.rounds, String) + '</div>' +
    '</div>' +
    '<div class="lab">Extra rule</div>' +
    '<div class="toggle' + (d.unique ? ' on' : '') + '" id="uniqT" role="switch" aria-checked="' + d.unique + '" tabindex="0"><span class="sw"></span>Same answer as another team scores 0 (when you type the answers)</div>' +
    '</div>' +
    '<div class="ovact"><button class="act brass" id="startBtn">Start game</button>' + (G ? '<button class="sbtn leatherbtn" id="cancelBtn">Cancel</button>' : '') + '</div>');
  var card = $('ovCard');
  card.querySelectorAll('.seg').forEach(function (sg) {
    sg.querySelectorAll('button').forEach(function (b) {
      b.onclick = function () { syncNames(); d[sg.dataset.seg] = +b.dataset.v; drawSetup(); };
    });
  });
  $('uniqT').onclick = function () { syncNames(); d.unique = !d.unique; drawSetup(); };
  $('uniqT').onkeydown = function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.click(); } };
  $('startBtn').onclick = startGame;
  if ($('cancelBtn')) $('cancelBtn').onclick = closeOv;
}
function syncNames() {
  $('ovCard').querySelectorAll('.trow input').forEach(function (inp) { setupDraft.teams[+inp.dataset.i].name = inp.value; });
}
function startGame() {
  syncNames();
  var d = setupDraft;
  clearInterval(clock); hideStamp();
  G = E.newGame({ teams: d.teams.slice(0, d.n), secs: d.secs, cats: d.cats, rounds: d.rounds, unique: d.unique });
  save(); closeOv(); setFlap('?'); render(); renderPad(true);
  banner('Round 1', 'Spin the letter');
}

window.openRules = function () {
  openOv('rules', '<h2>How to play</h2><div class="rules ovbody"><ul>' +
    '<li>Spin the letter. The timer starts.</li>' +
    '<li>Each team writes one answer for every category.</li>' +
    '<li>When time is up, each team reads its answers out loud.</li>' +
    '<li>The teacher decides if each answer is correct.</li>' +
    '<li>Correct and starts with the letter: <b>3 points</b>.</li>' +
    '<li>Correct and has the letter inside: <b>2 points</b>.</li>' +
    '<li>Correct but no letter: <b>1 point</b>. Wrong: <b>0</b>.</li>' +
    '<li>a, an and the don’t count: “the bus” starts with B.</li>' +
    (G && G.settings.unique ? '<li>Same answer as another team: <b>0 points</b>.</li>' : '') +
    '</ul><p style="margin-top:12px;color:var(--ink-2)">Teacher tips: click an answer box to type the answer or choose points. Keys: arrows move, 3 2 1 give points, X marks wrong, Enter types.</p></div>' +
    '<div class="ovact"><button class="act brass" id="okBtn">Got it</button></div>');
  $('okBtn').onclick = closeOv;
};

function openAnswer() {
  if (!G || G.phase !== 'scoring') return;
  var ci = sel.c, ti = sel.t, t = G.teams[ti], c = G.grid[ci][ti];
  openOv('answer',
    '<h2>' + esc(G.cats[ci]) + '</h2>' +
    '<div class="aq"><span class="em" style="--tc:' + t.color + '">' + t.emoji + '</span><span class="t">' + esc(t.name) + '</span><span class="lt">' + G.letter + '</span></div>' +
    '<input id="ansIn" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Type the answer (optional)" value="' + esc(c.a || '') + '">' +
    '<div class="sugg" id="sugg"></div>' +
    '<div class="pick"><button class="act green" id="okA"></button><button class="act ember" id="badA" style="flex:.55">Wrong</button></div>' +
    '<div class="pick" style="margin-top:14px">' +
      '<button class="sbtn leatherbtn" data-p="3">3</button><button class="sbtn leatherbtn" data-p="2">2</button><button class="sbtn leatherbtn" data-p="1">1</button>' +
      '<button class="sbtn leatherbtn" data-p="clear" style="width:auto;flex:1;font:800 26px var(--ui)">Clear</button></div>');
  var inp = $('ansIn');
  function upd() {
    var v = inp.value, tr = E.tier(v, G.letter), s = $('sugg'), ok = $('okA');
    if (tr === null) {
      s.innerHTML = 'Type the answer, or choose the points below.';
      ok.innerHTML = 'Correct<small>choose 3, 2 or 1 below</small>'; ok.disabled = true; ok.style.opacity = .5;
    } else {
      var why = tr === 3 ? 'Starts with ' + G.letter : tr === 2 ? 'Has ' + G.letter + ' inside' : 'No ' + G.letter;
      var dupWith = '';
      if (G.settings.unique) {
        var n = E.normalize(v);
        G.grid[ci].forEach(function (o, j) { if (j !== ti && o.p > 0 && E.normalize(o.a) === n) dupWith = G.teams[j].name; });
      }
      s.innerHTML = '<b>' + esc(why) + '</b>: ' + tr + (tr === 1 ? ' point' : ' points') + (dupWith ? ' <span style="color:var(--margin)">but same as ' + esc(dupWith) + ': 0</span>' : '');
      ok.innerHTML = 'Correct +' + (dupWith ? 0 : tr); ok.disabled = false; ok.style.opacity = 1;
    }
  }
  inp.oninput = upd; upd();
  function commit(p) { var a = inp.value.trim(); closeOv(); markCell(ci, ti, p, a); if (p !== null) advanceSel(); }
  $('okA').onclick = function () { var tr = E.tier(inp.value, G.letter); if (tr !== null) commit(tr); };
  $('badA').onclick = function () { commit(0); };
  $('ovCard').querySelectorAll('[data-p]').forEach(function (b) {
    b.onclick = function () { commit(b.dataset.p === 'clear' ? null : +b.dataset.p); };
  });
  inp.onkeydown = function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('okA').click(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeOv(); }
    e.stopPropagation();
  };
  setTimeout(function () { inp.focus(); inp.select(); }, 30);
}

function rosetteSVG(color, emoji) {
  var petals = '';
  for (var i = 0; i < 16; i++) petals += '<ellipse cx="140" cy="62" rx="22" ry="52" fill="' + (i % 2 ? color : '#f3d68a') + '" transform="rotate(' + (i * 22.5) + ' 140 120)" stroke="rgba(0,0,0,.18)"/>';
  return '<svg class="rosette" viewBox="0 0 280 340">' +
    '<path d="M100 170 L70 330 L100 305 L120 336 L135 180Z" fill="' + color + '" stroke="rgba(0,0,0,.25)"/>' +
    '<path d="M180 170 L210 330 L180 305 L160 336 L145 180Z" fill="' + color + '" stroke="rgba(0,0,0,.25)"/>' +
    petals + '<circle cx="140" cy="120" r="62" fill="#fbf7ec" stroke="#c99a3b" stroke-width="8"/>' +
    '<text x="140" y="146" text-anchor="middle" font-size="72">' + emoji + '</text></svg>';
}
function openFinal() {
  if (!G) return;
  var st = E.standings(G), w = E.winners(G);
  var top = G.teams[w[0]], line;
  if (w.length === 1) line = top.name + ' ' + verb(top.name, 'win!', 'wins!');
  else line = w.map(function (i) { return G.teams[i].name; }).join(' and ') + ' tie!';
  var rank = st.map(function (r, k) {
    var place = 1 + st.filter(function (o) { return o.total > r.total; }).length;
    return '<div class="rk"><span class="p">' + place + '</span><span class="em" style="--tc:' + r.team.color + '">' + r.team.emoji + '</span><span class="n">' + esc(r.team.name) + '</span><span class="t">' + r.total + '</span></div>';
  }).join('');
  openOv('final', '<h2>Final results</h2><div class="final">' + rosetteSVG(top.color, top.emoji) +
    '<div class="rank"><div class="winline">' + esc(line) + '</div>' + rank + '</div></div>' +
    '<div class="ovact"><button class="act brass" id="moreBtn">Play 3 more rounds</button><button class="sbtn leatherbtn" id="newBtn">New game</button><button class="sbtn leatherbtn" id="closeBtn">Close</button></div>');
  $('moreBtn').onclick = function () { if (E.extend(G, 3)) { save(); closeOv(); hideStamp(); setFlap('?'); render(); renderPad(true); banner('Round ' + G.round, 'Three more rounds'); } };
  $('newBtn').onclick = function () { openSetup(true); };
  $('closeBtn').onclick = closeOv;
  S.fanfare(); shake(10, 450);
  if (!reduced) {
    var n = 0, cols = w.map(function (i) { return G.teams[i].color; }).concat(['#f3d68a', '#ffffff']);
    clearInterval(fireworkT);
    fireworkT = setInterval(function () {
      emit(70, 200 + Math.random() * 1520, 140 + Math.random() * 380, { kind: n % 2 ? 'confetti' : 'dot', colors: cols, speed: 10, size: n % 2 ? 12 : 5, decay: .018, g: .14 });
      if (++n > 10) { clearInterval(fireworkT); fireworkT = null; }
    }, 380);
  }
}

/* ---------- keyboard ---------- */
addEventListener('keydown', function (e) {
  if (e.shiftKey && (e.key === 'D' || e.key === 'd')) { e.preventDefault(); toggleDebug(); return; }
  if (ovMode) { if (e.key === 'Escape' && ovMode !== 'setup-first') closeOv(); return; }
  if (!G || G.phase !== 'scoring') return;
  var n = G.teams.length, r = G.cats.length;
  if (e.key === 'ArrowRight') { sel.t = (sel.t + 1) % n; paintSel(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { sel.t = (sel.t - 1 + n) % n; paintSel(); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { sel.c = (sel.c + 1) % r; paintSel(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { sel.c = (sel.c - 1 + r) % r; paintSel(); e.preventDefault(); }
  else if (e.key === '3' || e.key === '2' || e.key === '1') { markCell(sel.c, sel.t, +e.key); advanceSel(); }
  else if (e.key === '0' || e.key === 'x' || e.key === 'X') { markCell(sel.c, sel.t, 0); advanceSel(); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { markCell(sel.c, sel.t, null, ''); }
  else if (e.key === 'Enter') { e.preventDefault(); openAnswer(); }
});

/* ---------- debug (Shift+D) ---------- */
function toggleDebug() {
  var d = $('debug');
  if (d.classList.contains('show')) { d.classList.remove('show'); return; }
  d.innerHTML = '<h3>Debug (Shift+D closes)</h3>' +
    '<button data-a="t5">Timer to 5 s</button><button data-a="stop">Stop now</button><button data-a="rand">Random marks</button>' +
    '<button data-a="last">Jump to last round</button><button data-a="clear">Clear save + reload</button>' +
    '<div id="dbgInfo" style="margin-top:10px;font:600 15px var(--ui);opacity:.8"></div>';
  d.classList.add('show');
  $('dbgInfo').textContent = G ? ('phase ' + G.phase + ', letter ' + (G.letter || '-') + ', time ' + G.timeLeft + ', totals ' + G.totals.join('/')) : 'no game';
  d.querySelectorAll('button').forEach(function (b) {
    b.onclick = function () {
      var a = b.dataset.a;
      if (a === 'clear') { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); return; }
      if (!G) return;
      if (a === 't5' && G.phase === 'writing') { G.timeLeft = 5; renderGlass(); }
      if (a === 'stop' && G.phase === 'writing') { G.timeLeft = 1; E.tick(G); clearInterval(clock); save(); timeUp(); }
      if (a === 'rand' && G.phase === 'scoring') {
        G.grid.forEach(function (row, ci) { row.forEach(function (c, ti) { E.setCell(G, ci, ti, [0, 1, 2, 3, 3][Math.floor(Math.random() * 5)]); }); });
        save(); refreshGrid(); renderActions();
      }
      if (a === 'last') { G.settings.rounds = G.round; save(); render(); }
      $('dbgInfo').textContent = 'phase ' + G.phase + ', letter ' + (G.letter || '-') + ', time ' + G.timeLeft + ', totals ' + G.totals.join('/');
    };
  });
}

/* ---------- boot ---------- */
G = load();
if (G) { setFlap(G.letter || '?'); render(); if (G.phase === 'writing' && G.paused) { /* resumed paused */ } }
else { render(); openSetup(false); }
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (G && (G.phase === 'scoring' || G.phase === 'scored')) refreshGrid(); });
window.__sg = { get G() { return G; }, E: E };
})();
</script>
