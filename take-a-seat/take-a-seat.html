<script>
'use strict';
/* =====================================================================
   TAKE A SEAT — whole-class elimination word game.
   One student at the front gets a prompt ("A VERB starting with G").
   Correct: the circle moves on. Wrong or too slow: "Please have a seat."
   Single file, vanilla JS. Prompts come from ../shared/word-banks.js.
   ===================================================================== */

const LEVELS = ['A1', 'A2', 'B1'];
const LEVEL_LABEL = { A1: 'A1', A2: 'Up to A2', B1: 'All' };
const TIMES = [8, 10, 15, 20];
const MIN_TIME = 5;
const MAX_PLAYERS = 40;
const UNDO_DEPTH = 30;
const COMEBACK_MIN_STANDING = 4;   // comebacks are open while at least this many are still standing
const SETUP_KEY = 'takeaseat:setup';
const CLASSES_KEY = 'takeaseat:classes';
const SAVE_KEY = 'takeaseat:save';
const MUTE_KEY = 'takeaseat:mute';
const THEME_KEY = 'arschul:theme';

/* ---------- word lists ---------- */
function plain(w) { return String(w || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
/** First letter after any leading a / an / the (same filing rule as Alphabet Grab). */
function headLetter(w) {
  let s = plain(w).replace(/^[^a-z]+/, '');
  const m = s.match(/^(a|an|the)\s+(?=[a-z])/);
  if (m) s = s.slice(m[0].length);
  const ch = s.charAt(0);
  return /[a-z]/.test(ch) ? ch.toUpperCase() : null;
}
const BANKS = (window.WORD_BANKS || []).map(c => {
  const b = { id: c.id, label: c.label, icon: c.icon, prompt: c.prompt || c.label, words: {} };
  for (const lvl of LEVELS) for (const raw of String(c[lvl] || '').split(/\s+/).filter(Boolean)) {
    const w = raw.replace(/_/g, ' '), L = headLetter(w);
    if (L) (b.words[L] = b.words[L] || []).push([w, lvl]);
  }
  return b;
});
const bank = id => BANKS.find(b => b.id === id);
const tierOf = n => n >= 5 ? 'easy' : n >= 3 ? 'medium' : 'hard';
/** Every playable (list, letter) pair for a level and a set of lists. */
function pairsFor(level, cats) {
  const max = LEVELS.indexOf(level);
  const out = [];
  for (const id of cats) {
    const b = bank(id); if (!b) continue;
    for (const L of Object.keys(b.words).sort()) {
      const ws = b.words[L];
      if (!ws.some(([, l]) => LEVELS.indexOf(l) <= max)) continue;
      out.push({ c: id, L, tier: tierOf(ws.length) });
    }
  }
  return out;
}
function examplesFor(c, L, level) {
  const b = bank(c); if (!b || !b.words[L]) return [];
  const max = LEVELS.indexOf(level);
  const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
  const at = shuffle(b.words[L].filter(([, l]) => LEVELS.indexOf(l) <= max).map(x => x[0]));
  const above = shuffle(b.words[L].filter(([, l]) => LEVELS.indexOf(l) > max).map(x => x[0]));
  return at.concat(above).slice(0, 3);
}

/* ---------- storage ---------- */
const store = {

/* =====================================================================

   ===================================================================== */

const ui = { endArmed: 0, delArmed: 0, swapPick: null, help: false, comebackKey: false, comebackNum: '', toast: null, addOpen: false, shift: false };

}

    players, line: order, queue: order.slice(),

/* ---------- undo / save ---------- */

/* ---------- clock (deadline-based; only the remaining ms is ever stored) ---------- */

/* =====================================================================

  if (!pool.length && S.final) {   // the final category ran dry: carry on with every chosen list
    const wide = pairsFor(S.settings.level, S.settings.cats);

    const cand = pool.filter(p => tiers.includes(p.tier));
    if (cand.length) {

/* =====================================================================

/* ---------- roster changes ---------- */

  const first = rows[0];
  const ord = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
  const podium = rows.length >= 3 ? [rows[1], rows[0], rows[2]] : rows.length === 2 ? [rows[1], rows[0]] : rows.slice(0, 1);
  return h('div', { class: 'end' },
    h('div', { class: 'kicker' }, S.endedEarly ? 'Game ended' : 'Last one standing'),
    first ? h('div', { class: 'winner anim' }, first.ids.length > 1 ? first.ids.map(nameOf).join(' · ') : '🏆 ' + nameOf(first.ids[0])) : h('div', { class: 'winner' }, 'No winner'),
    h('div', { class: 'podium' }, podium.map(r => h('div', { class: 'step p' + Math.min(3, r.place) },
      h('div', { class: 'place' }, ord(r.place)), h('div', { class: 'names' }, r.ids.map(nameOf).join(', '))))),
    rows.length > 3 ? h('div', { class: 'finish' }, rows.slice(3).map(r => h('span', null, ord(r.place) + ' ', h('b', null, r.ids.map(nameOf).join(', '))))) : null,
    h('div', { class: 'stats' }, (S.final ? 'Final played · ' : '') + 'Laps: ' + S.lap + ' · Prompts: ' + S.stats.prompts + ' · Correct: ' + S.stats.correct + ' · Comebacks: ' + S.stats.comebacks),
    h('div', { class: 'row', style: 'justify-content:center' },
      UNDO.length ? h('button', { class: 'btn', type: 'button', onclick: undo }, '↶ Undo') : null,
      h('button', { class: 'btn primary big', type: 'button', id: 'again', onclick: playAgain }, 'Play again ▶'),
      h('button', { class: 'btn big', type: 'button', onclick: newSetup }, 'New game')),
    h('div', { class: 'tools', style: 'position:fixed;top:10px;right:12px' }, utilButtons()));
}

function renderHelp() {
  const rows = [
    ['Space', 'Show the prompt · next · start'], ['Y or Enter', 'Correct'], ['N', 'Out'], ['S', 'New prompt for the same student (no penalty)'],
    ['P', 'Pause / restart the clock'], ['C, number, Enter', 'Comeback for that seated student'], ['0', 'No comeback'],
    ['Shift+U', 'Undo'], ['Shift+E twice', 'End the game'], ['A', 'Add a late arrival'],
    ['Click a standing name', 'Make them up now (if they haven’t played this lap)'], ['Shift+click a name', 'Standing: remove (absent) · Seated: put back in'],
  ];
  return h('div', { class: 'help', onclick: e => { if (e.target.classList.contains('help')) { ui.help = false; render(); } } },
    h('div', { class: 'card', role: 'dialog', 'aria-label': 'Keys and rules' },
      h('h2', null, 'How it works'),
      h('div', { class: 'note', style: 'font-size:15px' }, 'One student stands at the front and gets a prompt. A good answer before the clock runs out: the circle moves on. A wrong answer or no answer: “Please have a seat.” The clock gets 1 s shorter each lap. Last one standing wins.'),
      h('table', null, rows.map(([k, v]) => h('tr', null, h('td', null, h('kbd', null, k)), h('td', null, v)))),
      h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { class: 'btn primary', type: 'button', onclick: () => { ui.help = false; render(); } }, 'Close'))));
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
function onKey(e) {
  actx();
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
  if (e.key === 'Escape') { if (ui.help) { ui.help = false; render(); } else if (ui.comebackKey) { ui.comebackKey = false; ui.comebackNum = ''; render(); } else if (ui.addOpen) { ui.addOpen = false; render(); } return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!S || S.phase === 'end') return;
  const k = e.key;
  if (e.shiftKey && (k === 'U' || k === 'u')) { e.preventDefault(); undo(); return; }
  if (e.shiftKey && (k === 'E' || k === 'e')) { e.preventDefault(); endGame(); return; }
  if (e.shiftKey) return;
  if (ui.comebackKey) {
    if (/^[0-9]$/.test(k)) { e.preventDefault(); ui.comebackNum = (ui.comebackNum + k).slice(0, 2); render(); return; }
    if (k === 'Backspace') { e.preventDefault(); ui.comebackNum = ui.comebackNum.slice(0, -1); render(); return; }
    if (k === 'Enter') {
      e.preventDefault();
      const el = comebackList(S.miss.id);
      const n = parseInt(ui.comebackNum, 10);
      ui.comebackKey = false; ui.comebackNum = '';
      if (n >= 1 && n <= el.length) comeback(el[n - 1]); else { render(); toast('No seated student with that number'); }
      return;
    }
  }
  const ph = S.phase;
  if (k === ' ' || k === 'Spacebar') {
    e.preventDefault();
    if (t && t.tagName === 'BUTTON') t.blur();
    if (ph === 'lineup') beginGame();
    else if (ph === 'ready') reveal();
    else if (ph === 'prompt' && !S.clock.running) { S.paused = false; startClock(); render(); }
    else if (ph === 'miss' && !S.miss.open) afterMiss();
    else if (ph === 'finalIntro') startFinal();
    return;
  }
  if (ph === 'prompt') {
    if (k === 'y' || k === 'Y' || k === 'Enter') { e.preventDefault(); correct(); }
    else if (k === 'n' || k === 'N') { e.preventDefault(); miss('wrong'); }
    else if (k === 's' || k === 'S') { e.preventDefault(); skipPrompt(); }
    else if (k === 'p' || k === 'P') { e.preventDefault(); togglePause(); }
    return;
  }
  if (ph === 'miss' && S.miss.open) {
    if (k === 'c' || k === 'C') { e.preventDefault(); ui.comebackKey = true; ui.comebackNum = ''; render(); }
    else if (k === '0' && !ui.comebackKey) { e.preventDefault(); noComeback(); }
    return;
  }
  if (ph === 'miss' && k === 'Enter') { e.preventDefault(); afterMiss(); return; }
  if ((k === 'a' || k === 'A') && canEditRoster() && ph !== 'lineup') { e.preventDefault(); ui.addOpen = true; render(); const el = $('addName'); if (el) el.focus(); }
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.addEventListener('keydown', onKey);
document.addEventListener('pointerdown', () => actx(), { once: true });
window.addEventListener('pagehide', () => save());
if (!BANKS.length) {
  $('app').append(h('div', { class: 'setup' }, h('h1', { class: 'logo' }, 'Take a ', h('span', null, 'Seat')),
    h('p', { class: 'note warn' }, 'The word lists did not load (../shared/word-banks.js). Check your connection and reload.')));
} else {
  render();
}

</script>
</body>
