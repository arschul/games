<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordQuest — Teacher's Wordle</title>
<script>
  // localStorage throws on file:// and in private-mode Safari — never let it break the game
  window.WQ_STORE = (function () {
    var mem = {};
    var live = false;
    try { window.localStorage.setItem('__wq', '1'); window.localStorage.removeItem('__wq'); live = true; } catch (e) {}
    return {
      get: function (k) { try { return live ? window.localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } },
      set: function (k, v) { try { live ? window.localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } }
    };
  })();
  (function () {
    var saved = window.WQ_STORE.get('theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
    if (window.WQ_STORE.get('wq-cb') === '1') {
      document.documentElement.setAttribute('data-cb', 'on');
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap');

  :root, html[data-theme="dark"] {
    --bg: #0f0e17;
    --surface: #1a1930;
    --border: #2e2c50;
    --text: #fffffe;
    --muted: #6b6a8a;
    --correct: #2cb67d;
    --present: #f4a127;
    /* Absent must be clearly distinct from both --border (empty tile) and --key-bg */
    --absent: #100f1e;
    --absent-border: #3d3a68;
    --absent-text: #57567a;
    --key-bg: #2e2c50;
    --key-absent-bg: #14132a;
    --badge-checking-bg: #2e2c50;
    --correct-text: #fffffe;
    --tile-size: 58px;
    --tile-gap: 6px;
    --accent: #7f5af0;
  }

  /* Colour-blind safe mode: green/orange is the worst pairing for deuteranopia.
     Blue/orange separates cleanly, and glyphs cover every remaining case. */
  html[data-cb="on"] {
    --correct: #4a9eff;
    --present: #f0871a;
  }
  html[data-cb="on"][data-theme="light"] {
    --correct: #1f6fd0;
    --present: #c96a05;
  }

  html[data-theme="light"] {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --border: #d5d5e2;
    --text: #16151f;
    --muted: #6f6e88;
    --correct: #1a9c66;
    --present: #d1830f;
    --absent: #b9b9c9;
    --absent-border: #a4a4b8;
    --absent-text: #4a4960;
    --key-bg: #dedeea;
    --key-absent-bg: #c2c2d1;
    --badge-checking-bg: #e4e4ee;
    --correct-text: #ffffff;
    --accent: #6841dd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── Setup Screen ── */
  #setup-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 4.5rem 2rem 2rem;
    gap: 2rem;
    animation: fadeIn .5s ease;
  }

  .logo {
    font-size: 3rem;
    font-weight: 800;
    letter-spacing: -2px;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-family: 'Space Mono', monospace;
    color: var(--muted);
    font-size: .85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: -.5rem;
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2.5rem 2rem;
    width: min(420px, 95vw);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .field-label {
    font-size: .7rem;
    font-family: 'Space Mono', monospace;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .5rem;
  }

  .word-input-wrap {
    position: relative;
  }

  #secret-word {
    width: 100%;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    padding: .7rem 3rem .7rem 1.2rem;
    outline: none;
    transition: border-color .2s;
  }
  #secret-word:focus { border-color: var(--accent); }
  #secret-word::placeholder { letter-spacing: 2px; font-size: 1rem; color: var(--muted); }

  #toggle-vis {
    position: absolute;
    right: .9rem; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 1.2rem; padding: 0;
    transition: color .2s;
  }
  #toggle-vis:hover { color: var(--text); }

  .info-row {
    display: flex;
    gap: 1rem;
    align-items: center;
    background: var(--bg);
    border-radius: 10px;
    padding: .8rem 1rem;
    border: 1px solid var(--border);
  }
  .info-badge {
    font-family: 'Space Mono', monospace;
    font-size: .8rem;
    color: var(--muted);
  }
  .info-badge span {
    color: var(--text);
    font-weight: 700;
  }

  .error-msg {
    font-size: .8rem;
    color: #ff6b6b;
    font-family: 'Space Mono', monospace;
    min-height: 1rem;
    text-align: center;
  }

  .btn-start {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity .2s, transform .15s;
  }
  .btn-start:hover { opacity: .9; transform: translateY(-1px); }
  .btn-start:active { transform: translateY(0); }
  .btn-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .valid-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-family: 'Space Mono', monospace;
    font-size: .72rem;
    letter-spacing: 1px;
    padding: .3rem .7rem;
    border-radius: 999px;
    font-weight: 700;
  }
  .valid-badge.checking { background: var(--badge-checking-bg); color: var(--muted); }
  .valid-badge.valid    { background: #0e3d2a; color: var(--correct); border: 1px solid var(--correct); }
  .valid-badge.invalid  { background: #3d1010; color: #ff6b6b;        border: 1px solid #ff6b6b; }

  .checking-spinner {
    width: 10px; height: 10px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Game Screen ── */
  #game-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 4.2rem 1rem 2rem;
    gap: 1rem;
    animation: fadeIn .4s ease;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: min(1100px, 94vw);
  }

  .game-logo {
    font-size: clamp(1.6rem, 2.6vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .guess-counter {
    font-family: 'Space Mono', monospace;
    font-size: clamp(.75rem, 1.2vw, 1.1rem);
    color: var(--muted);
    letter-spacing: 1px;
  }
  .guess-counter span { color: var(--text); font-weight: 700; }

  #board {
    display: flex;
    flex-direction: column;
    gap: var(--tile-gap);
  }

  .row {
    display: flex;
    gap: var(--tile-gap);
  }

  .tile {
    width: var(--tile-size);
    height: var(--tile-size);
    border: 2px solid var(--border);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Space Mono', monospace;
    font-size: calc(var(--tile-size) * 0.52);
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text);
    background: var(--surface);
    transition: border-color .1s;
    position: relative;
    user-select: none;
  }

  /* State glyphs — only rendered in colour-blind mode */
  .tile::after, .key::after {
    display: none;
    position: absolute;
    top: 3px; right: 5px;
    font-size: .42em;
    line-height: 1;
    opacity: .9;
    pointer-events: none;
  }
  html[data-cb="on"] .tile.correct::after,
  html[data-cb="on"] .tile.present::after,
  html[data-cb="on"] .tile.absent::after,
  html[data-cb="on"] .key.correct::after,
  html[data-cb="on"] .key.present::after,
  html[data-cb="on"] .key.absent::after { display: block; }

  html[data-cb="on"] .tile.correct::after, html[data-cb="on"] .key.correct::after { content: '\25CF'; }
  html[data-cb="on"] .tile.present::after, html[data-cb="on"] .key.present::after { content: '\25B2'; }
  html[data-cb="on"] .tile.absent::after,  html[data-cb="on"] .key.absent::after  { content: '\00D7'; }
  html[data-cb="on"] .key::after { top: 2px; right: 3px; font-size: .6em; }

  .tile.filled { border-color: var(--muted); animation: pop .1s ease; }

  .tile.correct  { background: var(--correct);  border-color: var(--correct);  color: #fff; }
  .tile.present  { background: var(--present);  border-color: var(--present);  color: #fff; }
  .tile.absent   { background: var(--absent);   border-color: var(--absent-border); color: var(--absent-text); }

  .tile.flip {
    animation: flip .5s ease forwards;
  }

  .tile.shake { animation: shake .4s ease; }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  @keyframes flip {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-6px); }
    40%,80% { transform: translateX(6px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Keyboard ── */
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }

  .kb-row {
    display: flex;
    gap: 5px;
  }

  .key {
    height: 52px;
    min-width: 36px;
    padding: 0 6px;
    background: var(--key-bg);
    border: none;
    border-radius: 8px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: .85rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    transition: background .15s, color .15s, transform .1s;
    display: flex; align-items: center; justify-content: center;
  }
  .key { position: relative; }
  .key:active { transform: scale(.93); }

  @media (min-width: 1000px) {
    .key      { height: 64px; min-width: 48px; font-size: 1.1rem; padding: 0 10px; }
    .key.wide { min-width: 82px; font-size: .95rem; }
    .kb-row   { gap: 7px; }
  }
  .key.wide { min-width: 58px; font-size: .72rem; letter-spacing: 1px; }
  .key.correct { background: var(--correct); color: #fff; }
  .key.present { background: var(--present); color: #fff; }
  .key.absent  { background: var(--key-absent-bg); color: var(--absent-text); }

  /* ── Toast ── */
  #toast {
    position: fixed;
    top: 4.4rem;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--text);
    color: var(--bg);
    font-family: 'Space Mono', monospace;
    font-size: .85rem;
    font-weight: 700;
    padding: .7rem 1.5rem;
    border-radius: 999px;
    letter-spacing: 1px;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    z-index: 100;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ── Result Banner ── */
  #result-banner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: .8rem;
    padding: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: min(560px, 92vw);
    animation: fadeIn .5s ease .2s both;
  }
  .result-label {
    font-family: 'Space Mono', monospace;
    font-size: clamp(.7rem, 1.1vw, 1rem);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .result-word {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 800;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #7f5af0, #2cb67d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .btn-again {
    padding: .7rem 2rem;
    background: transparent;
    border: 2px solid var(--accent);
    border-radius: 10px;
    color: var(--accent);
    font-family: 'Syne', sans-serif;
    font-size: .9rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .btn-again:hover { background: var(--accent); color: #fff; }

  /* ── Chrome: back-link, top controls, offline badge ── */
  .back-link {
    position: fixed;
    top: 1rem; left: 1rem;
    z-index: 200;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .5rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    text-decoration: none;
    font-family: 'Space Mono', monospace;
    font-size: .72rem;
    letter-spacing: 1px;
    transition: color .2s, border-color .2s;
  }
  .back-link:hover { color: var(--text); border-color: var(--accent); }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  .top-controls {
    position: fixed;
    top: 1rem; right: 1rem;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: .5rem;
  }

  .icon-btn {
    width: 38px; height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, transform .1s;
  }
  .icon-btn:hover  { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn.off    { opacity: .5; }

  #offline-badge {
    display: none;
    align-items: center;
    gap: .4rem;
    padding: .45rem .8rem;
    border-radius: 999px;
    background: #3d2a10;
    border: 1px solid var(--present);
    color: var(--present);
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  html[data-theme="light"] #offline-badge { background: #fdf1dc; }

  @media (max-width: 560px) {
    .back-link { font-size: .62rem; padding: .4rem .7rem; }
    .icon-btn  { width: 32px; height: 32px; font-size: .85rem; }
    #offline-badge { font-size: .55rem; padding: .35rem .6rem; }
  }

  /* ── P3: mode tabs, level chips, options ── */
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 5px;
  }
  .mode-tab {
    flex: 1;
    padding: .65rem .5rem;
    background: none;
    border: none;
    border-radius: 8px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active { background: var(--accent); color: #fff; font-weight: 700; }

  .level-chips { display: flex; gap: 8px; }
  .level-chip {
    flex: 1;
    padding: .8rem .3rem;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .level-chip:hover { color: var(--text); border-color: var(--muted); }
  .level-chip.active { border-color: var(--accent); color: var(--text); background: var(--surface); }

  .level-desc {
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
    min-height: 2.4rem;
  }
  .level-desc b { color: var(--text); }

  .opt-row {
    display: flex;
    align-items: center;
    gap: .5rem;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .opt-row input { accent-color: var(--accent); cursor: pointer; }

  /* ── P3: hint bar & skeleton ── */
  #hint-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hint-btn {
    padding: .45rem .85rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }
  .hint-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .hint-btn:disabled { opacity: .35; cursor: not-allowed; }

  #hint-skeleton {
    display: none;
    gap: 8px;
    font-family: 'Space Mono', monospace;
    font-size: clamp(1.1rem, 2vw, 1.6rem);
    font-weight: 700;
    letter-spacing: 2px;
  }
  .skel { color: var(--border); min-width: 1ch; text-align: center; }
  .skel.on { color: var(--present); }

  #hint-panel {
    display: none;
    max-width: min(700px, 92vw);
    background: var(--surface);
    border: 1px solid var(--present);
    border-left: 4px solid var(--present);
    border-radius: 10px;
    padding: .8rem 1.1rem;
    font-size: clamp(.9rem, 1.5vw, 1.15rem);
    line-height: 1.5;
    text-align: center;
  }
  .hp-pos {
    font-family: 'Space Mono', monospace;
    font-size: .7em;
    color: var(--present);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-right: .4rem;
  }

  /* ── P3: word card ── */
  #word-card {
    display: none;
    flex-direction: column;
    gap: .55rem;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    text-align: left;
  }
  .wc-top {
    display: flex;
    align-items: center;
    gap: .6rem;
    flex-wrap: wrap;
  }
  #wc-phon {
    font-family: 'Space Mono', monospace;
    font-size: .95rem;
    color: var(--correct);
  }
  #wc-pos {
    font-family: 'Space Mono', monospace;
    font-size: .68rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .15rem .6rem;
  }
  #wc-speak {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    width: 32px; height: 32px;
    color: var(--text);
    cursor: pointer;
    font-size: .9rem;
    transition: border-color .2s;
  }
  #wc-speak:hover { border-color: var(--accent); }
  #wc-def { font-size: 1rem; line-height: 1.55; }
  #wc-ex {
    font-size: .92rem;
    line-height: 1.5;
    color: var(--muted);
    font-style: italic;
    border-left: 2px solid var(--border);
    padding-left: .7rem;
  }
  #hint-summary {
    font-family: 'Space Mono', monospace;
    font-size: .65rem;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }

<script>

// ── CEFR word banks (4–8 letters, teen-appropriate, no spelling variants) ──
const WORD_BANKS = {
  A1: ["apple", "beach", "bicycle", "black", "blue", "book", "bread", "brother", "cake", "chair", "chicken", "city", "class", "clean", "cloud", "cold", "dance", "dark", "door", "dream", "drink", "easy", "evening", "every", "farm", "fish", "food", "fruit", "girl", "glass", "gold", "grass", "green", "hand", "happy", "head", "heart", "help", "holiday", "home", "horse", "hour", "house", "juice", "jump", "kind", "lamp", "large", "laugh", "learn", "light", "milk", "money", "month", "moon", "morning", "mouse", "music", "name", "nice", "night", "open", "park", "party", "phone", "pink", "plant", "play", "rain", "read", "ride", "river", "road", "room", "sand", "ship", "shoe", "sing", "sleep", "small", "smile", "snake", "sport", "star", "swim", "table", "talk", "teach", "teacher", "time", "tree", "walk", "warm", "watch", "water", "week", "weekend", "white", "wind", "world", "write", "year", "young"],
  A2: ["active", "afraid", "agree", "animal", "answer", "arrive", "autumn", "basket", "better", "bottle", "bridge", "bright", "camera", "candle", "castle", "change", "cheese", "choose", "circle", "clever", "coffee", "corner", "couple", "course", "cousin", "danger", "decide", "desert", "dinner", "doctor", "engine", "enough", "famous", "farmer", "father", "finger", "finish", "flower", "follow", "forest", "forget", "friend", "garden", "guitar", "health", "hungry", "island", "jacket", "jungle", "ladder", "letter", "listen", "market", "matter", "member", "minute", "mirror", "modern", "mother", "narrow", "nature", "notice", "ocean", "office", "orange", "palace", "parent", "pencil", "people", "person", "picnic", "planet", "pocket", "poster", "prize", "public", "quiet", "rabbit", "reason", "record", "repeat", "report", "return", "ribbon", "rocket", "safety", "school", "season", "second", "secret", "silver", "simple", "singer", "sister", "soccer", "spider", "spring", "square", "statue", "street", "strong", "studio", "summer", "sunny", "sweet", "ticket", "tiger", "travel", "tunnel", "uncle", "valley", "video", "visit", "voice", "waiter", "wallet", "window", "winter", "wonder", "yellow"],

  B2: ["abandon", "absolute", "abundant", "accurate", "adequate", "advocate", "alliance", "apparent", "assemble", "beneath", "coherent", "coincide", "collapse", "commence", "compound", "conceal", "conclude", "conflict", "consent", "constant", "contrary", "convince", "credible", "critical", "decisive", "dedicate", "delicate", "deputy", "derive", "detailed", "deviate", "dilemma", "diminish", "distinct", "dominant", "dramatic", "eloquent", "embrace", "eminent", "emphasis", "enormous", "entitled", "eventual", "evidence", "exceed", "exclude", "explicit", "fatigue", "fragile", "frequent", "generate", "grateful", "hesitate", "imminent", "implicit", "indicate", "inherent", "initial", "innovate", "integral", "intense", "isolate", "legacy", "liberal", "margin", "mediate", "minimal", "moderate", "momentum", "notable", "obstacle", "occupy", "optimal", "overcome", "paradox", "perceive", "persist", "precise", "predict", "preserve", "prestige", "previous", "priority", "profound", "pursue", "radical", "rational", "resemble", "resolve", "restrain", "retain", "reverse", "rigorous", "scenario", "scrutiny", "simulate", "spectrum", "straight", "strategy", "subtle", "superior", "sustain", "tangible", "ultimate", "uniform", "unique", "valid", "verify", "viable", "yield"],
};

const LEVEL_INFO = {
  A1: 'Everyday concrete words — <b>4–7 letters</b>. Family, food, school, weather.',
  A2: 'Common words — <b>5–6 letters</b>. Places, jobs, feelings, free time.',
  B1: 'Wider everyday range — <b>5–8 letters</b>. Opinions, plans, abstract ideas.',
  B2: 'Advanced and abstract — <b>5–8 letters</b>. Argument, nuance, academic use.'
};

const DICT_API = 'https://api.dictionaryapi.dev/api/v2/entries/en/';
const DICT_TIMEOUT = 3000;      // never let a hung fetch lock the game
const DICT_FAIL_LIMIT = 2;      // two strikes → stop waiting for the rest of the session
const wordCache = {};           // word → true/false
let dictFailures = 0;
let dictOffline  = false;

function goOffline() {
  if (dictOffline) return;
  dictOffline = true;
  const badge = document.getElementById('offline-badge');
  if (badge) badge.style.display = 'inline-flex';
}

const entryCache = {};          // word → parsed entry, or null when not a word

// Pull the useful teaching data out of the dictionaryapi.dev payload
function parseEntry(json) {
  if (!Array.isArray(json) || !json.length) return null;
  const e = json[0];
  let phonetic = e.phonetic || '';
  if (!phonetic && Array.isArray(e.phonetics)) {
    const p = e.phonetics.find(p => p && p.text);
    if (p) phonetic = p.text;
  }
  const senses = [];
  (e.meanings || []).forEach(m => {
    (m.definitions || []).forEach(d => {
      if (d && d.definition) {
        senses.push({ pos: m.partOfSpeech || '', def: d.definition, ex: d.example || '' });
      }
    });
  });
  if (!senses.length) return null;
  // Prefer a sense that ships an example sentence — far more useful in class
  senses.sort((x, y) => (y.ex ? 1 : 0) - (x.ex ? 1 : 0));
  return { word: e.word || '', phonetic, senses };
}

// Returns an entry object, null (not a word), or undefined (couldn't check)
async function lookupWord(word) {
  const key = word.toLowerCase();
  if (key in entryCache) return entryCache[key];
  if (dictOffline) return undefined;

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), DICT_TIMEOUT);
  try {
    const res = await fetch(DICT_API + encodeURIComponent(key), { signal: controller.signal });
    if (res.status >= 500) throw new Error('dictionary server error');
    dictFailures = 0;
    if (!res.ok) { wordCache[key] = false; entryCache[key] = null; return null; }
    const entry = parseEntry(await res.json());
    wordCache[key] = true;
    entryCache[key] = entry;
    return entry;
  } catch {
    dictFailures++;
    if (dictFailures >= DICT_FAIL_LIMIT) goOffline();
    return undefined;
  } finally {
    clearTimeout(timer);
  }
}

// Returns true (real word), false (not found), or null (unknown — allow it through)
async function isRealWord(word) {
  const key = word.toLowerCase();
  if (key in wordCache) return wordCache[key];
  const entry = await lookupWord(word);
  if (entry === undefined) return null;
  return entry !== null;
}

// Never let a definition or example hand the answer over mid-game
function maskWord(text, word) {
  if (!text || !word) return text || '';
  const w = word.toLowerCase();
  const stem = w.length > 5 ? w.slice(0, w.length - 2) : w;
  try {
    return text.replace(new RegExp('\\b' + stem + '[a-z]*', 'gi'), '\u2581\u2581\u2581\u2581\u2581');
  } catch {
    return text;
  }
}

// ── State ──
let screen = 'setup';   // 'setup' | 'game' — never infer this from DOM styles
let mode = 'type';      // 'type' | 'random'
let level = 'A2';
let fromBank = false;   // was this round drawn from a CEFR bank?
let revealed = new Set();
let hintsUsed = 0;
let defHintUsed = false;
let gaveUp = false;
let secretWord = '';
let wordLen = 0;
let maxGuesses = 0;
let currentRow = 0;
let currentCol = 0;
let currentGuess = [];
let board = [];
let gameOver = false;
let keyMap = {};
let submitting = false;

// ── Setup ──
const setupScreen  = document.getElementById('setup-screen');
const gameScreen   = document.getElementById('game-screen');
const secretInput  = document.getElementById('secret-word');
const toggleVisBtn = document.getElementById('toggle-vis');
const letterCount  = document.getElementById('letter-count');
const guessCount   = document.getElementById('guess-count');
const setupError   = document.getElementById('setup-error');
const btnStart     = document.getElementById('btn-start');
const toastEl      = document.getElementById('toast');
const validBadge   = document.getElementById('word-valid-badge');
const bypassCheck  = document.getElementById('bypass-dict');

const btnMute      = document.getElementById('btn-mute');
const btnCb        = document.getElementById('btn-cb');
const tabType      = document.getElementById('tab-type');
const tabRandom    = document.getElementById('tab-random');
const modeType     = document.getElementById('mode-type');
const modeRandom   = document.getElementById('mode-random');
const levelDesc    = document.getElementById('level-desc');
const optFirst     = document.getElementById('opt-first-letter');
const hintBar      = document.getElementById('hint-bar');
const hintDefBtn   = document.getElementById('hint-def');
const hintLetBtn   = document.getElementById('hint-letter');
const hintWordBtn  = document.getElementById('hint-word');
const hintPanel    = document.getElementById('hint-panel');
const hintSkel     = document.getElementById('hint-skeleton');
const btnRepeat    = document.getElementById('btn-repeat');
const srLive       = document.getElementById('sr-live');
const btnTheme     = document.getElementById('btn-theme');

let validationTimer = null;
let pendingLaunch   = false;   // Enter pressed while the dictionary check was still running

function setBadge(state, text) {
  validBadge.className = 'valid-badge ' + state;
  validBadge.innerHTML = state === 'checking'
    ? `<span class="checking-spinner"></span> CHECKING…`
    : text;
}

bypassCheck.addEventListener('change', () => {
  const val = secretInput.value.replace(/[^a-zA-Z]/g, '');
  if (bypassCheck.checked && val.length >= 2) {
    validBadge.innerHTML = '';
    setupError.textContent = '';
    btnStart.disabled = false;
  } else {
    // re-trigger validation
    secretInput.dispatchEvent(new Event('input'));
  }
});

secretInput.addEventListener('input', () => {
  const val = secretInput.value.replace(/[^a-zA-Z]/g, '');
  secretInput.value = val;
  const len = val.length;
  letterCount.textContent = len || '—';
  guessCount.textContent  = len >= 2 ? (len + 1) : '—';
  setupError.textContent  = '';
  validBadge.innerHTML    = '';
  btnStart.disabled       = true;
  pendingLaunch           = false;
  clearTimeout(validationTimer);

  if (len < 2) return;

  if (bypassCheck.checked || dictOffline) {
    btnStart.disabled = false;
    return;
  }

  setBadge('checking', '');
  validationTimer = setTimeout(async () => {
    const result = await isRealWord(val);
    if (result === true) {
      setBadge('valid', '✓ VALID WORD');
      btnStart.disabled = false;
    } else if (result === false) {
      setBadge('invalid', '✗ NOT FOUND');
      setupError.textContent = 'Word not found. Use SKIP CHECK to override.';
      btnStart.disabled = true;
      pendingLaunch = false;
    } else {
      // Unreachable or timed out — never block the teacher on a flaky network
      setBadge('invalid', '⚠ NO CONNECTION');
      setupError.textContent = 'Dictionary unreachable — starting anyway is fine.';
      btnStart.disabled = false;
    }
    if (pendingLaunch && !btnStart.disabled) {
      pendingLaunch = false;
      launchGame();
    }
  }, 600);
});

// Enter launches the game from the setup screen
secretInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!btnStart.disabled) {
    launchGame();
  } else if (secretInput.value.replace(/[^a-zA-Z]/g, '').length >= 2) {
    // Validation still in flight — launch as soon as it clears
    pendingLaunch = true;
    showToast('Checking word…', 3000);
  } else {
    setupError.textContent = 'Enter at least 2 letters.';
  }
});

toggleVisBtn.addEventListener('click', () => {
  secretInput.type = secretInput.type === 'password' ? 'text' : 'password';
  toggleVisBtn.textContent = secretInput.type === 'password' ? '👁' : '🙈';
});

// ══════════════════════════════════════════
// ── Mode switching & CEFR level picker ──
// ══════════════════════════════════════════
function setMode(next) {
  mode = next;
  const typing = mode === 'type';
  tabType.classList.toggle('active', typing);
  tabRandom.classList.toggle('active', !typing);
  tabType.setAttribute('aria-selected', typing ? 'true' : 'false');
  tabRandom.setAttribute('aria-selected', typing ? 'false' : 'true');
  modeType.style.display   = typing ? 'block' : 'none';
  modeRandom.style.display = typing ? 'none'  : 'block';
  setupError.textContent = '';
  pendingLaunch = false;

  if (typing) {
    btnStart.textContent = 'Launch Game →';
    secretInput.dispatchEvent(new Event('input'));   // recompute validity
    secretInput.focus();
  } else {
    btnStart.textContent = '🎲 Draw & Launch →';
    btnStart.disabled = false;                       // never a blank state
    renderLevelDesc();
  }
}

tabType.addEventListener('click',   () => setMode('type'));
tabRandom.addEventListener('click', () => setMode('random'));

function renderLevelDesc() {
  levelDesc.innerHTML = `${LEVEL_INFO[level]}<br><b>${WORD_BANKS[level].length}</b> words in this bank.`;
}

document.querySelectorAll('.level-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    level = chip.dataset.level;
    document.querySelectorAll('.level-chip').forEach(c => c.classList.toggle('active', c === chip));
    renderLevelDesc();
    SFX.keyPress();
  });
});

// Avoid repeats within a session so a class doesn't get the same word twice
const usedFromBank = { A1: new Set(), A2: new Set(), B1: new Set(), B2: new Set() };

function drawWord(lvl) {
  const bank = WORD_BANKS[lvl];
  const used = usedFromBank[lvl];
  if (used.size >= bank.length) used.clear();
  let pick;
  do { pick = bank[Math.floor(Math.random() * bank.length)]; } while (used.has(pick));
  used.add(pick);
  return pick.toUpperCase();
}

btnStart.addEventListener('click', () => launchGame());

function launchGame(forcedWord) {
  let val;
  if (forcedWord) {
    val = forcedWord;
    fromBank = true;
  } else if (mode === 'random') {
    val = drawWord(level);
    fromBank = true;
  } else {
    val = secretInput.value.trim().toUpperCase().replace(/[^A-Z]/g, '');
    fromBank = false;
    if (val.length < 2) {
      setupError.textContent = 'Enter at least 2 letters.';
      return;
    }
  }
  secretWord  = val;
  wordLen     = val.length;
  maxGuesses  = wordLen + 1;
  currentRow  = 0;
  currentCol  = 0;
  currentGuess = [];
  board       = [];
  gameOver    = false;
  keyMap      = {};
  submitting  = false;
  pendingLaunch = false;
  screen      = 'game';
  revealed    = new Set();
  hintsUsed   = 0;
  defHintUsed = false;
  gaveUp      = false;

  if (optFirst.checked) revealed.add(0);   // 3.4 — scaffolding for lower levels

  resetHintUI();
  setupScreen.style.display = 'none';
  gameScreen.style.display  = 'flex';
  document.getElementById('result-banner').style.display = 'none';

  buildBoard();
  buildKeyboard();
  updateHeader();
  renderSkeleton();
  // Warm the cache so the word card appears instantly when the round ends
  lookupWord(secretWord).catch(() => {});
  SFX.launch();
}

// ── Board ──
function sizeBoard() {
  if (!wordLen) return;
  const gap = 6;
  // Width budget
  const maxW = Math.min(window.innerWidth - 32, 1100);
  const byWidth = Math.floor((maxW - (wordLen - 1) * gap) / wordLen);
  // Height budget — reserve top chrome, header, keyboard and padding so tall
  // boards (long words = many rows) never overflow the projected screen
  const reserved = window.innerWidth >= 1000 ? 380 : 320;  // header + keyboard + padding
  const availH = Math.max(150, window.innerHeight - reserved);
  const byHeight = Math.floor((availH - (maxGuesses - 1) * gap) / maxGuesses);
  const size = Math.max(26, Math.min(92, byWidth, byHeight));
  document.documentElement.style.setProperty('--tile-size', size + 'px');
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(sizeBoard, 100);
});

function buildBoard() {
  const boardEl = document.getElementById('board');
  boardEl.innerHTML = '';
  sizeBoard();

  for (let r = 0; r < maxGuesses; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.id = `row-${r}`;
    row.setAttribute('role', 'row');
    row.setAttribute('aria-label', `Guess ${r + 1}`);
    board.push([]);
    for (let c = 0; c < wordLen; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = `tile-${r}-${c}`;
      tile.setAttribute('role', 'gridcell');
      tile.setAttribute('aria-label', `Letter ${c + 1}, empty`);
      row.appendChild(tile);
      board[r].push({ el: tile, letter: '', state: '' });
    }
    boardEl.appendChild(row);
  }
}

// ── Keyboard ──
function buildKeyboard() {
  KB_ROWS.forEach((row, i) => {
    const rowEl = document.getElementById(`kb-row-${i + 1}`);
    rowEl.innerHTML = '';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.setAttribute('aria-label', k === '⌫' ? 'Backspace' : k === 'ENTER' ? 'Submit guess' : `Letter ${k}`);
      btn.addEventListener('click', () => handleKey(k));
      rowEl.appendChild(btn);
    });
  });
}

// ── Input ──
document.addEventListener('keydown', e => {
  if (screen !== 'game' || gameOver) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    handleKey('ENTER');
  } else if (e.key === 'Backspace') {
    e.preventDefault();               // stop stray back-navigation
    handleKey('⌫');
  } else if (/^[a-zA-Z]$/.test(e.key)) {
    handleKey(e.key.toUpperCase());
  }
});

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫') {
    deleteLetter();
  } else if (k === 'ENTER') {
    submitGuess();
  } else if (/^[A-Z]$/.test(k) && currentCol < wordLen) {
    addLetter(k);
  }
}

function addLetter(letter) {
  if (currentCol >= wordLen) return;
  const tile = board[currentRow][currentCol].el;
  tile.textContent = letter;
  tile.setAttribute('aria-label', `Letter ${currentCol + 1}, ${letter}`);
  tile.classList.add('filled');
  board[currentRow][currentCol].letter = letter;
  currentGuess.push(letter);
  currentCol++;
  SFX.keyPress();
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  const tile = board[currentRow][currentCol].el;
  tile.textContent = '';
  tile.setAttribute('aria-label', `Letter ${currentCol + 1}, empty`);
  tile.classList.remove('filled');
  board[currentRow][currentCol].letter = '';
  currentGuess.pop();
  SFX.backspace();
}

async function submitGuess() {
  if (currentCol < wordLen) {
    shakeRow(currentRow);
    showToast(`Need ${wordLen} letters`);
    SFX.invalid();
    return;
  }
  if (submitting) return;

  const guess = currentGuess.join('');

  // Dictionary check for student guess
  let valid = null;
  submitting = true;
  // Only surface "Checking…" if the lookup is actually slow — avoids a flash on every guess
  const checkingToast = setTimeout(() => showToast('Checking…', 4000), 350);
  try {
    valid = await isRealWord(guess);
  } finally {
    clearTimeout(checkingToast);
    submitting = false;          // always unlock, even if the lookup threw
  }
  hideToast();                   // never let "Checking…" linger over the reveal

  if (valid === false) {
    shakeRow(currentRow);
    showToast('Not a real word!');
    SFX.invalid();
    return;
  }
  // valid === null means unreachable/timed out → allow the guess

  const result = evaluate(guess, secretWord);

  revealRow(currentRow, result, guess, () => {
    updateKeyboard(guess, result);

    if (guess === secretWord) {
      gameOver = true;
      setTimeout(() => showResult(true), 400);
    } else if (currentRow >= maxGuesses - 1) {
      gameOver = true;
      setTimeout(() => showResult(false), 400);
    } else {
      currentRow++;
      currentCol = 0;
      currentGuess = [];
      updateHeader();
    }
  });
}

// ── Evaluate (handles duplicate letters correctly) ──
function evaluate(guess, answer) {
  const result   = Array(wordLen).fill('absent');
  const ansArr   = answer.split('');
  const guessArr = guess.split('');
  const used     = Array(wordLen).fill(false);

  // First pass: correct
  for (let i = 0; i < wordLen; i++) {
    if (guessArr[i] === ansArr[i]) {
      result[i] = 'correct';
      used[i] = true;
    }
  }
  // Second pass: present
  for (let i = 0; i < wordLen; i++) {
    if (result[i] === 'correct') continue;
    for (let j = 0; j < wordLen; j++) {
      if (!used[j] && guessArr[i] === ansArr[j]) {
        result[i] = 'present';
        used[j] = true;
        break;
      }
    }
  }
  return result;
}

// ── Reveal animation ──
function revealRow(row, result, guess, callback) {
  const delay = 220;   // setTimeout provides the stagger — SFX must not add its own
  result.forEach((state, col) => {
    setTimeout(() => {
      const tile = board[row][col].el;
      tile.classList.add('flip');
      SFX.tileFlip(col);
      setTimeout(() => {
        tile.classList.add(state);
        tile.classList.remove('filled');
        tile.setAttribute('aria-label', `Letter ${col + 1}, ${guess[col]}, ${STATE_WORD[state]}`);
        if (state === 'correct')       SFX.correct(col);
        else if (state === 'present')  SFX.present();
        else                           SFX.absent();
      }, 150);
    }, col * delay);
  });
  announce(guess.split('').map((l, i) => `${l} ${STATE_WORD[result[i]]}`).join(', '));
  setTimeout(callback, (wordLen - 1) * delay + 450);
}

function shakeRow(row) {
  document.getElementById(`row-${row}`).querySelectorAll('.tile')
    .forEach(t => { t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); });
}

// ══════════════════════════════════════════
// ── Sound Engine (Web Audio API) ──
// ══════════════════════════════════════════
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let ctx = null;
let muted = WQ_STORE.get('wq-muted') === '1';

function getCtx() {
  if (!ctx) ctx = new AudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function playTone({ type = 'sine', freq = 440, freq2, duration = 0.12, volume = 0.18,
                    attack = 0.005, decay = 0.05, sustain = 0.6, release = 0.08,
                    detune = 0, delay = 0 } = {}) {
  if (muted) return;
  const ac = getCtx();
  const t0 = ac.currentTime + delay;

  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.connect(gain);
  gain.connect(ac.destination);

  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, t0 + duration);
  osc.detune.setValueAtTime(detune, t0);

  const peak = volume;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(peak, t0 + attack);
  gain.gain.linearRampToValueAtTime(peak * sustain, t0 + attack + decay);
  gain.gain.setValueAtTime(peak * sustain, t0 + duration - release);
  gain.gain.linearRampToValueAtTime(0, t0 + duration);

  osc.start(t0);
  osc.stop(t0 + duration + 0.01);
}

function playNoise({ duration = 0.08, volume = 0.12, highpass = 800, delay = 0 } = {}) {
  if (muted) return;
  const ac = getCtx();
  const t0 = ac.currentTime + delay;
  const bufSize = ac.sampleRate * duration;
  const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;

  const src = ac.createBufferSource();
  src.buffer = buf;

  const filter = ac.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = highpass;

  const gain = ac.createGain();
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.linearRampToValueAtTime(0, t0 + duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ac.destination);
  src.start(t0);
}

// Individual sound effects
const SFX = {
  keyPress() {
    playTone({ type: 'triangle', freq: 380, duration: 0.07, volume: 0.1, attack: 0.002, decay: 0.02, sustain: 0.3, release: 0.04 });
  },
  backspace() {
    playTone({ type: 'sine', freq: 260, freq2: 180, duration: 0.09, volume: 0.08, attack: 0.002, decay: 0.04, sustain: 0.2 });
  },
  invalid() {
    // Low buzz + noise
    playTone({ type: 'sawtooth', freq: 130, duration: 0.18, volume: 0.12, attack: 0.003, decay: 0.04, sustain: 0.5 });
    playNoise({ duration: 0.15, volume: 0.08, highpass: 400 });
  },
  tileFlip(col) {
    playTone({ type: 'sine', freq: 300 + col * 40, duration: 0.1, volume: 0.1, attack: 0.003, decay: 0.03, sustain: 0.4 });
  },
  correct(col) {
    // Bright chime — pitch still rises across the row, but timing comes from revealRow
    playTone({ type: 'triangle', freq: 520 + col * 60, freq2: 620 + col * 60, duration: 0.18, volume: 0.14, attack: 0.004, decay: 0.04, sustain: 0.5 });
  },
  present() {
    // Warm mid tone
    playTone({ type: 'sine', freq: 400, duration: 0.14, volume: 0.11, attack: 0.005, decay: 0.05, sustain: 0.4 });
  },
  absent() {
    // Dull thud
    playTone({ type: 'triangle', freq: 200, freq2: 160, duration: 0.1, volume: 0.07, attack: 0.003, decay: 0.05, sustain: 0.2 });
    playNoise({ duration: 0.06, volume: 0.05, highpass: 300 });
  },
  win() {
    // Ascending fanfare arpeggio
    const notes = [523, 659, 784, 1047, 1319];
    notes.forEach((freq, i) => {
      playTone({ type: 'triangle', freq, duration: 0.22, volume: 0.15, attack: 0.005, decay: 0.06, sustain: 0.55, release: 0.08, delay: i * 0.1 });
    });
    // Sparkle layer
    [1047, 1319, 1568].forEach((freq, i) => {
      playTone({ type: 'sine', freq, duration: 0.15, volume: 0.08, attack: 0.002, decay: 0.04, sustain: 0.3, delay: 0.5 + i * 0.08 });
    });
  },
  lose() {
    // Descending sad tones
    const notes = [392, 330, 262, 220];
    notes.forEach((freq, i) => {
      playTone({ type: 'sine', freq, duration: 0.28, volume: 0.13, attack: 0.01, decay: 0.08, sustain: 0.5, release: 0.1, delay: i * 0.15 });
    });
  },
  launch() {
    // Quick upward sweep
    playTone({ type: 'sine', freq: 300, freq2: 600, duration: 0.2, volume: 0.12, attack: 0.01, decay: 0.05, sustain: 0.5 });
    playTone({ type: 'triangle', freq: 600, freq2: 900, duration: 0.15, volume: 0.08, attack: 0.01, delay: 0.12 });
  }
};

// ── Screen-reader announcements ──
const STATE_WORD = {
  correct: 'correct position',
  present: 'wrong position',
  absent:  'not in the word'
};

function announce(msg) {
  srLive.textContent = '';
  setTimeout(() => { srLive.textContent = msg; }, 50);
}

// ── Keyboard coloring ──
const STATE_PRIORITY = { correct: 3, present: 2, absent: 1, '': 0 };

function updateKeyboard(guess, result) {
  guess.split('').forEach((letter, i) => {
    const cur = keyMap[letter] || '';
    if ((STATE_PRIORITY[result[i]] || 0) > (STATE_PRIORITY[cur] || 0)) {
      keyMap[letter] = result[i];
    }
  });

  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.key;
    if (k && k.length === 1 && keyMap[k]) {
      btn.className = `key ${keyMap[k]}`;
      btn.setAttribute('aria-label', `Letter ${k}, ${STATE_WORD[keyMap[k]]}`);
    }
  });
}


// ══════════════════════════════════════════
// ── P3: Teacher-controlled hint system ──
// ══════════════════════════════════════════
function resetHintUI() {
  hintPanel.style.display = 'none';
  hintPanel.innerHTML = '';
  hintDefBtn.disabled  = false;
  hintLetBtn.disabled  = false;
  hintWordBtn.disabled = false;
  hintBar.style.display = 'flex';
}

function renderSkeleton() {
  if (!revealed.size) { hintSkel.style.display = 'none'; return; }
  hintSkel.style.display = 'flex';
  hintSkel.innerHTML = '';
  for (let i = 0; i < wordLen; i++) {
    const sp = document.createElement('span');
    const on = revealed.has(i);
    sp.className = 'skel' + (on ? ' on' : '');
    sp.textContent = on ? secretWord[i] : '_';
    hintSkel.appendChild(sp);
  }
  hintSkel.setAttribute('aria-label',
    'Revealed letters: ' + Array.from({ length: wordLen },
      (_, i) => revealed.has(i) ? `position ${i + 1} is ${secretWord[i]}` : '').filter(Boolean).join(', '));
}

hintLetBtn.addEventListener('click', () => {
  if (gameOver) return;
  const open = [];
  for (let i = 0; i < wordLen; i++) if (!revealed.has(i)) open.push(i);
  if (open.length <= 1) {
    showToast('No more letters to reveal');
    hintLetBtn.disabled = true;
    return;
  }
  const i = open[Math.floor(Math.random() * open.length)];
  revealed.add(i);
  hintsUsed++;
  renderSkeleton();
  showToast(`Letter ${i + 1} revealed`);
  announce(`Hint: letter ${i + 1} is ${secretWord[i]}`);
  SFX.present();
});

hintDefBtn.addEventListener('click', async () => {
  if (gameOver || defHintUsed) return;
  hintDefBtn.disabled = true;
  hintPanel.style.display = 'block';
  hintPanel.textContent = 'Looking up definition…';

  const entry = await lookupWord(secretWord);
  if (!entry) {
    hintPanel.textContent = entry === null
      ? 'No dictionary entry for this word.'
      : 'Dictionary unreachable — try again later.';
    hintDefBtn.disabled = entry === null;   // allow a retry if it was only a network blip
    return;
  }

  defHintUsed = true;
  hintsUsed++;
  const sense = entry.senses[0];
  const def = maskWord(sense.def, secretWord);
  hintPanel.innerHTML = `<span class="hp-pos">${sense.pos || 'definition'}</span>${def}`;
  announce('Definition hint: ' + def);
  SFX.present();
});

hintWordBtn.addEventListener('click', () => {
  if (gameOver) return;
  gameOver = true;
  gaveUp = true;
  for (let i = 0; i < wordLen; i++) revealed.add(i);
  renderSkeleton();
  showResult(false);
});

// ══════════════════════════════════════════
// ── P3: Read-aloud (Web Speech) ──
// ══════════════════════════════════════════
let speechPrimed = false;

function pickVoice() {
  // Chrome populates getVoices() lazily — always re-fetch at speak time
  const voices = window.speechSynthesis.getVoices() || [];
  return voices.find(v => /^en[-_](GB|US)/i.test(v.lang))
      || voices.find(v => /^en/i.test(v.lang))
      || null;
}

function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  const synth = window.speechSynthesis;
  try {
    synth.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) { utter.voice = v; utter.lang = v.lang; }
    else   { utter.lang = 'en-US'; }
    utter.rate = 0.9;
    // Chrome races cancel() against speak() — delay the very first utterance
    if (!speechPrimed) {
      speechPrimed = true;
      setTimeout(() => synth.speak(utter), 60);
    } else {
      synth.speak(utter);
    }
  } catch {}
}

if ('speechSynthesis' in window && window.speechSynthesis.getVoices().length === 0) {
  window.speechSynthesis.onvoiceschanged = () => {};   // nudge Chrome to populate the list
}

document.getElementById('wc-speak').addEventListener('click', () => {
  const entry = entryCache[secretWord.toLowerCase()];
  const ex = entry && entry.senses[0] && entry.senses[0].ex;
  speak(ex ? `${secretWord}. ${ex}` : secretWord);
});

// ── Header ──
function updateHeader() {
  document.getElementById('cur-guess').textContent = currentRow + 1;
  document.getElementById('max-guess').textContent = maxGuesses;
}

// ── Toast ──
let toastTimer;
function showToast(msg, duration = 1500) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

function hideToast() {
  clearTimeout(toastTimer);
  toastEl.classList.remove('show');
}

// ── Result ──
function showResult(won) {
  const banner = document.getElementById('result-banner');
  document.getElementById('result-label').textContent = won
    ? `🎉 Got it in ${currentRow + 1}!`
    : gaveUp ? 'Revealed — the word was' : 'The word was';
  document.getElementById('result-word').textContent = secretWord;
  hintBar.style.display = 'none';
  banner.style.display = 'flex';

  // Hint accounting, so the teacher can factor it into scoring
  const bits = [];
  if (won) bits.push(`${currentRow + 1} of ${maxGuesses} guesses`);
  if (hintsUsed) bits.push(`${hintsUsed} hint${hintsUsed > 1 ? 's' : ''} used`);
  if (fromBank) bits.push(`${level} bank`);
  document.getElementById('hint-summary').textContent = bits.join('  ·  ');

  // Offer another draw at the same level without going back to setup
  btnRepeat.style.display = fromBank ? 'inline-block' : 'none';
  btnRepeat.textContent = `🎲 Another ${level} word`;

  announce(won
    ? `Correct! The word was ${secretWord.split('').join(' ')}, solved in ${currentRow + 1} guesses.`
    : `The word was ${secretWord.split('').join(' ')}.`);
  if (won) SFX.win();
  else     SFX.lose();

  renderWordCard();
}

// ── P3: the teaching payload — definition, phonetics, example ──
async function renderWordCard() {
  const card = document.getElementById('word-card');
  const entry = await lookupWord(secretWord);
  if (!entry || !entry.senses.length) { card.style.display = 'none'; return; }

  const sense = entry.senses[0];
  document.getElementById('wc-phon').textContent = entry.phonetic || '';
  document.getElementById('wc-pos').textContent  = sense.pos || '';
  document.getElementById('wc-pos').style.display = sense.pos ? 'inline-block' : 'none';
  document.getElementById('wc-def').textContent  = sense.def;   // round is over — no masking

  const exEl = document.getElementById('wc-ex');
  if (sense.ex) {
    exEl.textContent = '"' + sense.ex + '"';
    exEl.style.display = 'block';
  } else {
    exEl.style.display = 'none';
  }
  card.style.display = 'flex';
}

document.getElementById('btn-again').addEventListener('click', () => {
  screen = 'setup';
  gameOver = true;
  pendingLaunch = false;
  submitting = false;
  hideToast();
  secretInput.value = '';
  letterCount.textContent = '—';
  guessCount.textContent  = '—';
  setupError.textContent  = '';
  secretInput.type        = 'password';
  toggleVisBtn.textContent = '👁';
  validBadge.innerHTML    = '';
  bypassCheck.checked     = false;
  btnStart.disabled       = true;
  hintPanel.style.display = 'none';
  hintSkel.style.display  = 'none';
  document.getElementById('word-card').style.display = 'none';
  document.getElementById('hint-summary').textContent = '';
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch {} }
  setupScreen.style.display = 'flex';
  gameScreen.style.display  = 'none';
  setMode(mode);
});

// Draw another word at the same level without returning to setup
btnRepeat.addEventListener('click', () => {
  if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch {} }
  document.getElementById('result-banner').style.display = 'none';
  document.getElementById('word-card').style.display = 'none';
  launchGame(drawWord(level));
});

// ══════════════════════════════════════════
// ── Chrome: mute + theme ──
// ══════════════════════════════════════════
function renderMute() {
  btnMute.textContent = muted ? '🔇' : '🔊';
  btnMute.classList.toggle('off', muted);
  btnMute.title = muted ? 'Unmute sounds' : 'Mute sounds';
  btnMute.setAttribute('aria-label', btnMute.title);
}

btnMute.addEventListener('click', () => {
  muted = !muted;
  WQ_STORE.set('wq-muted', muted ? '1' : '0');
  renderMute();
  if (!muted) SFX.keyPress();
});

function renderCb() {
  const on = document.documentElement.getAttribute('data-cb') === 'on';
  btnCb.classList.toggle('off', !on);
  btnCb.setAttribute('aria-pressed', on ? 'true' : 'false');
  btnCb.title = on ? 'Colour-blind mode: ON' : 'Colour-blind friendly mode';
}

btnCb.addEventListener('click', () => {
  const html = document.documentElement;
  const on = html.getAttribute('data-cb') === 'on';
  if (on) html.removeAttribute('data-cb');
  else    html.setAttribute('data-cb', 'on');
  WQ_STORE.set('wq-cb', on ? '0' : '1');
  renderCb();
  showToast(on ? 'Colour-blind mode off' : 'Colour-blind mode on');
});

function renderTheme() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  btnTheme.textContent = dark ? '🌙' : '☀️';
}

btnTheme.addEventListener('click', () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  WQ_STORE.set('theme', next);
  renderTheme();
});

renderMute();
renderTheme();
renderCb();
renderLevelDesc();
setMode('type');
