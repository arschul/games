<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Buzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --walnut:#6b3a1f; --walnut-d:#3d1f0e; --chrome:#c9ccd4; --amber:#ffc04a; --glass:#0c0a10;
  --danger:#e8343c; --success:#2fbf71; --brass:#d9a441; --cream:#fff4dc;
  --c-1:#3a1338; --c-2:#1a0619; --c-hi:#5e2357; --floor-1:#1c0a18; --floor-2:#0b0409; --spot:rgba(255,214,150,.20);
  --display:'Bowlby One',Impact,sans-serif; --ui:'Rethink Sans',system-ui,sans-serif;
  --chrome-g:linear-gradient(180deg,#f6f7fa 0%,#c3c7cf 46%,#e6e8ed 54%,#8a8f99 100%);
  --wood:repeating-linear-gradient(91deg,rgba(0,0,0,.09) 0 2px,transparent 2px 9px),
         repeating-linear-gradient(89.3deg,rgba(255,255,255,.05) 0 1px,transparent 1px 13px),
         radial-gradient(ellipse at 30% 18%,rgba(255,220,180,.16),transparent 60%),
         linear-gradient(180deg,#8a4f2a,#6b3a1f 45%,#4a2412);
}
:root[data-theme="light"]{
  --c-1:#b8364f; --c-2:#7a1c36; --c-hi:#de6a7c; --floor-1:#6b2a36; --floor-2:#3d1420; --spot:rgba(255,244,220,.38);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--c-2)}
body{font-family:var(--ui);color:var(--cream);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden}
#shaker{position:absolute;inset:0}

/* scene */
.curtain{position:absolute;inset:0;background:
  radial-gradient(ellipse 55% 70% at 50% 0%,var(--spot),transparent 70%),
  linear-gradient(180deg,rgba(0,0,0,.45),transparent 22%,transparent 68%,rgba(0,0,0,.55)),
  repeating-linear-gradient(90deg,var(--c-2) 0,var(--c-1) 34px,var(--c-hi) 54px,var(--c-1) 74px,var(--c-2) 110px)}
.valance{position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(180deg,var(--c-hi),var(--c-1));box-shadow:0 4px 10px rgba(0,0,0,.45);z-index:1}
.valance::after{content:'';position:absolute;left:0;right:0;top:30px;height:36px;
  background:radial-gradient(circle at 40px 0,var(--c-1) 0 31px,#d9a441 32px 35px,transparent 36px) 0 0/80px 36px repeat-x}
.floor{position:absolute;left:0;right:0;bottom:0;height:290px;background:linear-gradient(180deg,var(--floor-1),var(--floor-2));
  border-top:6px solid rgba(0,0,0,.45);box-shadow:inset 0 14px 30px rgba(0,0,0,.6)}
.floor::before{content:'';position:absolute;left:15%;right:15%;top:10px;height:120px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(255,214,150,.12),transparent 70%)}

.back-link{position:fixed;left:14px;top:12px;z-index:60;padding:8px 14px;border-radius:10px;background:rgba(14,5,12,.72);
  color:var(--cream);font:600 15px/1.2 var(--ui);text-decoration:none;border:1px solid rgba(255,214,150,.28)}
.back-link:hover{background:rgba(14,5,12,.92)}

.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* bulbs */
.bulbs{position:absolute;inset:0;pointer-events:none}
.bulb{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#8f6c4c,#3e2516 72%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.1);transition:background .25s,box-shadow .25s}
.bulb.on{background:radial-gradient(circle at 38% 32%,#fffbe8,#ffd77a 45%,#ffa21a 82%);box-shadow:0 0 10px #ffc04a,0 0 24px rgba(255,170,40,.55)}
.bulbs.warn .bulb.on{background:radial-gradient(circle at 38% 32%,#fff0e8,#ff8a6a 45%,#e8343c 85%);box-shadow:0 0 10px #ff5a4a,0 0 24px rgba(232,52,60,.55)}
.bulbs.team .bulb.on{background:radial-gradient(circle at 38% 32%,#fff,var(--tc) 55%,color-mix(in srgb,var(--tc) 55%,#000));box-shadow:0 0 10px var(--tc),0 0 24px color-mix(in srgb,var(--tc) 60%,transparent)}
.bulbs.chase .bulb{animation:chase 1.2s steps(1) infinite}
.bulbs.chase .bulb:nth-child(3n+1){animation-delay:-.4s}
.bulbs.chase .bulb:nth-child(3n+2){animation-delay:-.8s}
.bulbs.win .bulb{animation:chase .5s steps(1) infinite}
.bulbs.win .bulb:nth-child(2n){animation-delay:-.25s}
@keyframes chase{
  0%,33%{background:radial-gradient(circle at 38% 32%,#fffbe8,#ffd77a 45%,#ffa21a 82%);box-shadow:0 0 10px #ffc04a,0 0 24px rgba(255,170,40,.55)}
  34%,100%{background:radial-gradient(circle at 38% 32%,#8f6c4c,#3e2516 72%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.55)}}

/* marquee sign shared */
.sign{position:absolute;border-radius:24px;background:linear-gradient(180deg,#3b1712,#1f0b08);
  box-shadow:0 0 0 5px #d5d8de,0 0 0 9px #6d727c,0 30px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.12)}
.sign .glass,.glass{position:absolute;border-radius:14px;
  background:radial-gradient(ellipse 90% 80% at 50% 0%,#1d1624,#09070c 70%);
  box-shadow:inset 0 6px 18px rgba(0,0,0,.9),inset 0 0 0 2px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.08);overflow:hidden}
.glass::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.07),transparent 38%);pointer-events:none}
.sign-title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:104px/1 var(--display);color:var(--cream);
  text-shadow:0 0 24px rgba(255,192,74,.5),0 4px 0 #6b3a1f;letter-spacing:.01em;z-index:2}

/* tactile buttons */
.act{--a1:#ffe08a;--a2:#d0922a;--edge:#7a4f10;--ink:#2a1700;--d:0ms;height:84px;padding:0 38px 0 30px;border:0;border-radius:20px;cursor:pointer;
  font:32px/1 var(--display);color:var(--ink);background:linear-gradient(180deg,var(--a1),var(--a2));display:inline-flex;align-items:center;gap:14px;
  box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .12s,box-shadow .12s,filter .12s}
.act:hover{filter:brightness(1.06)}
.act:active{transform:translateY(6px);box-shadow:0 2px 0 var(--edge),0 8px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.act:focus-visible{outline:4px solid #fff;outline-offset:4px}
.act svg{width:34px;height:34px;flex:none}
.act .kc{font:800 17px/1 var(--ui);min-width:30px;height:30px;padding:0 7px;border-radius:7px;background:rgba(0,0,0,.16);display:grid;place-items:center;margin-left:4px}
.act.ok{--a1:#6ae6a6;--a2:#1f9d5a;--edge:#11603a;--ink:#06240f}
.act.no{--a1:#ff6b6f;--a2:#c4202a;--edge:#760d13;--ink:#fff}
.act.no .kc{background:rgba(255,255,255,.18)}
.act.chrome{--a1:#f6f7fa;--a2:#a3a8b2;--edge:#5d626b;--ink:#1b1d22}
.act.red{--a1:#ff7a6a;--a2:#d0282f;--edge:#7a1015;--ink:#fff}
.act.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1) var(--d) both}
.act.rec{animation:pop .38s cubic-bezier(.2,1.4,.4,1) var(--d) both,breathe 2.2s ease-in-out calc(var(--d) + .45s) infinite}
@keyframes pop{from{transform:translateY(30px) scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes breathe{0%,100%{box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4)}
  50%{box-shadow:0 8px 0 var(--edge),0 18px 28px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4),0 0 34px 6px color-mix(in srgb,var(--a1) 70%,transparent)}}
.act[disabled]{filter:grayscale(.7) brightness(.7);cursor:not-allowed}

/* ═══ SETUP ═══ */
.sheet{position:absolute;left:260px;top:96px;width:1400px;height:900px;border-radius:28px;background:var(--wood);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.22),0 0 0 5px #c3c7cf,0 0 0 9px #6d727c,0 40px 80px rgba(0,0,0,.6)}
.panel{position:absolute;border-radius:18px;background:rgba(22,9,4,.58);box-shadow:inset 0 4px 12px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.12)}
.dymo{display:inline-block;background:linear-gradient(180deg,#d42a35,#a8161f);color:#fff;font:800 24px/1 var(--ui);padding:9px 16px 8px;border-radius:4px;
  box-shadow:0 2px 0 #6e0c12,inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.35),0 -1px 0 rgba(255,255,255,.2);letter-spacing:.04em;transform:rotate(-1.2deg)}
.field{height:72px;width:560px;border-radius:14px;background:#120806;border:0;outline:0;color:var(--cream);font:600 32px var(--ui);padding:0 22px;
  box-shadow:inset 0 4px 10px rgba(0,0,0,.85),0 1px 0 rgba(255,255,255,.12)}
.field::placeholder{color:#8a7560}
.field:focus{box-shadow:inset 0 4px 10px rgba(0,0,0,.85),0 0 0 3px var(--amber)}
.tchips{display:flex;flex-wrap:wrap;gap:14px}
.tchip{height:62px;display:flex;align-items:center;gap:12px;padding:0 8px 0 7px;border-radius:31px;background:linear-gradient(180deg,#f6f7fa,#b4b9c3);
  color:#1b1d22;font:26px/1 var(--display);box-shadow:0 4px 0 #5d626b,0 8px 12px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.disc{display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.6),transparent 34%),var(--tc);
  box-shadow:inset 0 -3px 4px rgba(0,0,0,.3),0 2px 0 color-mix(in srgb,var(--tc) 45%,#000)}
.tchip .disc{width:48px;height:48px;font-size:28px}
.tchip .x{width:38px;height:38px;border-radius:50%;border:0;background:#2a2d33;color:#fff;font:700 22px/1 var(--ui);cursor:pointer;margin-left:6px}
.tchip .x:hover{background:var(--danger)}
.keys{display:flex;gap:12px}
.key{min-width:92px;height:70px;padding:0 18px;border:0;border-radius:14px;cursor:pointer;font:26px/1 var(--display);color:#d8c7a8;
  background:linear-gradient(180deg,#3d2c23,#22160f);box-shadow:0 6px 0 #120a06,0 10px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .1s,box-shadow .1s}
.key:active{transform:translateY(5px);box-shadow:0 1px 0 #120a06,0 4px 8px rgba(0,0,0,.5)}
.key.sel{color:#2a1700;background:radial-gradient(circle at 50% 28%,#fff6d6,#ffc04a 55%,#d48a10);
  box-shadow:0 6px 0 #8a5a08,0 0 24px rgba(255,192,74,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.key:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opt{position:absolute;display:flex;align-items:center;gap:22px}
.opt .dymo{min-width:0}
.vol{-webkit-appearance:none;appearance:none;width:260px;height:40px;background:transparent;cursor:pointer;--pct:60%}
.vol:focus{outline:none}
.vol::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--amber) var(--pct),#120806 var(--pct));box-shadow:inset 0 2px 4px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.15)}
.vol::-moz-range-track{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--amber) var(--pct),#120806 var(--pct));box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
.vol::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-10px;border-radius:50%;border:0;
  background:radial-gradient(circle at 36% 30%,#fff,#c3c7cf 55%,#7d828c);box-shadow:0 3px 0 #4e525a,0 6px 10px rgba(0,0,0,.5)}
.vol::-moz-range-thumb{width:34px;height:34px;border-radius:50%;border:0;background:radial-gradient(circle at 36% 30%,#fff,#c3c7cf 55%,#7d828c);box-shadow:0 3px 0 #4e525a,0 6px 10px rgba(0,0,0,.5)}
.vol:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #fff,0 3px 0 #4e525a}
.volpct{font:700 24px var(--ui);color:#e8d6b8;min-width:64px}

/* ═══ GAME ═══ */
.plaque{position:absolute;top:22px;height:56px;padding:0 22px;border-radius:12px;background:var(--chrome-g);color:#1b1d22;
  font:24px/1 var(--display);display:flex;align-items:center;box-shadow:0 4px 0 #5d626b,0 8px 14px rgba(0,0,0,.4)}
.ctrls{position:absolute;right:28px;top:18px;display:flex;gap:14px;z-index:20}
.ibtn{width:64px;height:64px;border-radius:16px;border:0;cursor:pointer;background:var(--chrome-g);color:#1b1d22;display:grid;place-items:center;
  box-shadow:0 5px 0 #5d626b,0 9px 14px rgba(0,0,0,.45);transition:transform .1s,box-shadow .1s}
.ibtn:active{transform:translateY(4px);box-shadow:0 1px 0 #5d626b,0 4px 8px rgba(0,0,0,.4)}
.ibtn svg{width:34px;height:34px}
.ibtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.musicwrap{position:relative}
.volpop{position:absolute;top:76px;right:-70px;display:none;align-items:center;gap:10px;padding:12px 18px;border-radius:16px;background:var(--wood);
  box-shadow:0 0 0 3px #c3c7cf,0 14px 28px rgba(0,0,0,.6)}
.musicwrap:hover .volpop,.musicwrap.open .volpop,.musicwrap:focus-within .volpop{display:flex}
.volpop::before{content:'';position:absolute;left:0;right:0;top:-20px;height:20px}

#board{position:absolute;left:210px;top:110px;width:1500px;height:414px;border-radius:30px;background:linear-gradient(180deg,#3b1712,#1f0b08);
  box-shadow:0 0 0 5px #d5d8de,0 0 0 9px #6d727c,0 30px 60px rgba(0,0,0,.65),inset 0 2px 0 rgba(255,255,255,.12)}
#board .glass{inset:48px;display:flex;align-items:center;justify-content:center;padding:14px 44px}
#def{position:relative;z-index:1;font-weight:600;font-size:var(--fs,56px);line-height:1.28;text-align:center;color:var(--cream);text-shadow:0 0 22px rgba(255,192,74,.28)}
#def .ghost{color:transparent;text-shadow:none}
.caret{display:inline-block;width:.4em;height:.92em;vertical-align:-.1em;margin-right:-.4em;background:var(--amber);border-radius:3px;
  box-shadow:0 0 12px var(--amber);animation:blink .9s steps(1) infinite}
.caret.hide{display:none}
@keyframes blink{50%{opacity:0}}
.lvl{position:absolute;left:50%;top:-32px;transform:translateX(-50%);height:58px;padding:0 26px;border-radius:12px;background:var(--chrome-g);
  color:#1b1d22;font:28px/1 var(--display);display:flex;align-items:center;box-shadow:0 4px 0 #5d626b,0 8px 14px rgba(0,0,0,.45);z-index:3;white-space:nowrap}
.clock{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);height:58px;min-width:132px;padding:0 20px;border-radius:12px;background:#120806;
  color:var(--amber);font:32px/1 var(--display);display:grid;place-items:center;text-shadow:0 0 12px rgba(255,192,74,.6);
  box-shadow:0 0 0 4px #c3c7cf,0 0 0 7px #6d727c,0 10px 18px rgba(0,0,0,.5);z-index:3}
.clock.warn{color:#ff6b6f;text-shadow:0 0 12px rgba(232,52,60,.7)}

#tiles,#stampSlot{position:absolute;left:210px;top:556px;width:1500px;height:108px;display:flex;justify-content:center;align-items:center;gap:8px}
#tiles{perspective:900px}
.tile{position:relative;height:104px;border-radius:10px;display:grid;place-items:center;color:#f6ecd6;font-family:var(--display);line-height:1;
  background:linear-gradient(180deg,#2e2e35 0,#1e1e23 49%,#121216 51%,#19191d 100%);
  box-shadow:0 6px 0 #070709,0 10px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.14);transform-origin:50% 50%}
.tile::after{content:'';position:absolute;left:0;right:0;top:calc(50% - 1px);height:2px;background:rgba(0,0,0,.75)}
.tile.space{background:none;box-shadow:none}
.tile.space::after{display:none}
.stamp{display:flex;align-items:center;gap:28px;pointer-events:none}
.stamp .ink{border:7px double var(--danger);color:var(--danger);font:80px/1 var(--display);padding:8px 26px 4px;border-radius:12px;
  background:rgba(232,52,60,.1);transform:rotate(-6deg);animation:slam .42s cubic-bezier(.2,1.5,.4,1) both;text-shadow:0 0 1px var(--danger)}
.stamp .why{font:700 34px/1.2 var(--ui);color:var(--cream);text-shadow:0 2px 8px #000;animation:pop .4s .2s both}
@keyframes slam{from{transform:rotate(-6deg) scale(3.2);opacity:0}55%{opacity:1}to{transform:rotate(-6deg) scale(1);opacity:1}}

#actions{position:absolute;left:0;right:0;top:676px;height:96px;display:flex;justify-content:center;align-items:center;gap:26px;z-index:5}

#podiums{position:absolute;left:0;right:0;top:784px;height:296px;display:flex;justify-content:center;align-items:flex-end;gap:28px}
.podium{position:relative;height:296px}
.podium::before{content:'';position:absolute;left:50%;bottom:60px;width:560px;height:1000px;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity .3s;
  background:linear-gradient(180deg,transparent,rgba(255,240,200,.16) 70%,rgba(255,240,200,.24));clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.podium.active::before{opacity:1}
.buzzer{position:absolute;left:50%;top:0;transform:translateX(-50%);width:170px;height:98px;border:0;background:none;cursor:pointer;padding:0;z-index:2}
.buzzer .base{position:absolute;left:0;right:0;bottom:6px;height:30px;border-radius:50%;background:linear-gradient(180deg,#f6f7fa,#8d929c);box-shadow:0 4px 0 #4e525a,0 8px 12px rgba(0,0,0,.5)}
.buzzer .cap{position:absolute;left:20px;right:20px;bottom:20px;height:70px;border-radius:70px 70px 14px 14px/64px 64px 14px 14px;
  background:radial-gradient(ellipse at 34% 24%,rgba(255,255,255,.75),rgba(255,255,255,0) 32%),radial-gradient(ellipse at 50% 70%,var(--tc),color-mix(in srgb,var(--tc) 45%,#000) 110%);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.35),0 3px 0 color-mix(in srgb,var(--tc) 40%,#000);transition:transform .1s,filter .25s;transform-origin:50% 100%}
.buzzer:hover .cap{filter:brightness(1.1)}
.buzzer:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:12px}
.buzzer.pressed .cap{transform:translateY(8px) scaleY(.8)}
.podium.locked .buzzer{cursor:default}
.podium.locked .buzzer:hover .cap{filter:none}
.podium.out .cap,.podium.out .buzzer:hover .cap{filter:grayscale(1) brightness(.45)}
.desk{position:absolute;left:0;right:0;top:94px;bottom:0;border-radius:16px 16px 6px 6px;background:var(--wood);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 16px 30px rgba(0,0,0,.55);transition:box-shadow .3s}
.desk::before{content:'';position:absolute;left:-6px;right:-6px;top:-8px;height:14px;border-radius:7px;background:var(--chrome-g);box-shadow:0 3px 4px rgba(0,0,0,.4)}
.desk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;border-radius:0 0 6px 6px;background:var(--tc);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.podium.active .desk{box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 0 0 4px var(--tc),0 0 44px var(--tc)}
.nameplate{margin:18px 14px 0;height:62px;display:flex;align-items:center;gap:10px;padding:0 10px 0 6px;border-radius:12px;
  background:linear-gradient(180deg,#f6f7fa,#b4b9c3);color:#1b1d22;box-shadow:0 3px 0 #5d626b}
.nameplate .disc{flex:0 0 50px;width:50px;height:50px;font-size:29px}
.pname{font-family:var(--display);line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  Music.setMode('lounge'); setBulbs('off'); refreshPodiums(); setButtons(); save();
}
function doSkip() { if (!E.canSkip(S)) return; startWord(); }
function doNext() { if (!E.canNext(S)) return; startWord(); }
function onTimeUp() {
  stopLoops(); SFX.timeup(); Music.cue('timeup'); Music.setMode('lounge'); Music.setIntensity(0);
  stamp("Time's up", 'Nobody got it.'); setBulbs('off'); $('clock').textContent = '0'; $('clock').classList.add('warn');
  shake(8, 300); refreshPodiums(); setButtons(); save();
}
function doWinner() { if (!E.finish(S)) return; save(); showWinner(); }

function showWinner() {
  stopLoops(); screen('winner');
  const w = S.teams[S.winner];
  $('wTitle').textContent = w.name + ' ' + verb(w.name) + '!';
  $('wTitle').style.textShadow = '0 0 28px ' + w.color + ',0 4px 0 #6b3a1f';
  const box = $('wStand'); box.innerHTML = '';
  const rows = E.standings(S), heights = [440, 370, 320, 280, 260, 250];
  rows.forEach((r, k) => {
    const t = S.teams[r.i], d = document.createElement('div');
    d.className = 'stand ' + (k === 0 ? 'r1' : k === 1 ? 'r2' : k === 2 ? 'r3' : 'rx');
    d.style.height = heights[k] + 'px'; d.style.setProperty('--tc', t.color); d.style.setProperty('--d', (k * 120) + 'ms');
    d.innerHTML = '<span class="rank">' + (k + 1) + '</span><span class="disc">' + t.emblem + '</span><span class="sname">' + esc(t.name) + '</span><span class="spts">' + fmt(t.score) + '</span>';
    box.appendChild(d);
  });
  Music.cue('win'); Music.setMode('lounge');
  if (!cfg.music || !Music.state.playing) SFX.fanfare();
  fireworks(4200);
}

function screen(id) {
  ['setup', 'game', 'winner'].forEach(s => $(s).classList.toggle('on', s === id));
  if (id !== 'game') stopLoops();
  if (id === 'setup') { Music.setMode('lounge'); Music.setIntensity(0); renderSetup(); }
}
function enterGame() {
  bank = WORDS[S.level];
  screen('game'); buildPodiums(); S.teams.forEach((_, i) => renderScore(i));
  $('lvl').textContent = 'Level ' + S.level; $('targetPl').textContent = 'First to ' + S.target;
}
function startGame(teamNames) {
  const names = teamNames || cfg.teams;
  if (names.length < 2) return;
  S = E.create({ teams: names, level: cfg.level, timer: cfg.timer, speed: cfg.speed, target: cfg.target }, WORDS[cfg.level].length, Math.random);
  enterGame(); startWord();
}
function resumeGame() {
  const sv = load(SAVE_KEY); if (!validSave(sv)) return;
  S = sv; enterGame();
  $('roundPl').textContent = 'Word ' + S.round;
  fitDef(); setDefText(); refreshPodiums();
  const ph = S.phase;
  if (ph === 'correct' || ph === 'revealed' || ph === 'won') showTiles(S.word.word, false);
  if (ph === 'wrong' || ph === 'allout') stamp('Wrong', ph === 'allout' ? 'No teams left.' : '');
  if (ph === 'timeup') { stamp("Time's up", 'Nobody got it.'); $('clock').textContent = '0'; }
  if (ph === 'buzzed') setBulbs('team', S.timeLeft / (S.timer * 10), S.teams[S.buzzed].color);
  else if (ph === 'correct' || ph === 'won') setBulbs('win');
  else if (ph === 'revealed' || ph === 'timeup' || ph === 'allout') setBulbs('off');
  else if (ph === 'wrong') timerBulbs();
  if (ph !== 'typing' && ph !== 'timeup') $('clock').textContent = Math.ceil(S.timeLeft / 10);
  Music.setMode(ph === 'buzzed' ? 'hold' : (ph === 'typing' || ph === 'running') ? 'think' : 'lounge');
  setButtons(); drive();
}
function validSave(sv) {
  return sv && sv.v === 1 && Array.isArray(sv.teams) && sv.teams.length >= 2 && sv.word && WORDS[sv.level] &&
    E.PHASES.indexOf(sv.phase) >= 0 && sv.phase !== 'over';
}

/* ═══════════════ SETUP SCREEN ═══════════════ */
function keyRow(boxId, opts, cur, onPick) {
  const box = $(boxId); box.innerHTML = '';
  opts.forEach(([val, label]) => {
    const b = document.createElement('button'); b.className = 'key' + (val === cur ? ' sel' : ''); b.textContent = label;
    b.setAttribute('aria-pressed', val === cur ? 'true' : 'false');
    b.addEventListener('click', () => { onPick(val); saveCfg(); renderSetup(); });
    box.appendChild(b);
  });
}
function renderSetup() {
  const box = $('tchips'); box.innerHTML = '';
  cfg.teams.forEach((name, i) => {
    const c = document.createElement('div'); c.className = 'tchip'; c.style.setProperty('--tc', E.TEAM_COLORS[i]);
    c.innerHTML = '<span class="disc">' + E.EMBLEMS[i] + '</span><span>' + esc(name) + '</span><button class="x" aria-label="Remove ' + esc(name) + '">×</button>';
    c.querySelector('.x').addEventListener('click', () => { cfg.teams.splice(i, 1); saveCfg(); renderSetup(); });
    box.appendChild(c);
  });
  if (!cfg.teams.length) box.innerHTML = '<span style="font:600 26px var(--ui);color:#cdb898;line-height:62px">Add 2 to 6 teams. Try Lions, Tigers, Eagles.</span>';
  const full = cfg.teams.length >= 6;
  $('teamInput').disabled = full; $('btnAdd').disabled = full;
  $('teamHint').textContent = full ? '6 teams is the maximum.' : '';
  keyRow('kLevel', [['A1', 'A1'], ['A2', 'A2'], ['B1', 'B1'], ['B2', 'B2']], cfg.level, v => cfg.level = v);
  keyRow('kTimer', [[10, '10 s'], [20, '20 s'], [30, '30 s']], cfg.timer, v => cfg.timer = v);
  keyRow('kSpeed', [['slow', 'Slow'], ['medium', 'Medium'], ['fast', 'Fast']], cfg.speed, v => cfg.speed = v);
  keyRow('kTarget', [[5, '5'], [7, '7'], [10, '10']], cfg.target, v => cfg.target = v);
  const mk = $('musicKey'); mk.textContent = cfg.music ? 'On' : 'Off'; mk.classList.toggle('sel', cfg.music); mk.setAttribute('aria-pressed', cfg.music);
  const st = $('btnStart'), ready = cfg.teams.length >= 2;
  st.disabled = !ready; st.textContent = ready ? 'Start the show' : 'Add ' + (2 - cfg.teams.length) + ' more team' + (cfg.teams.length === 1 ? '' : 's');
  const sv = load(SAVE_KEY), rb = $('btnResume');
  if (validSave(sv)) {
    rb.style.display = '';
    rb.textContent = 'Resume word ' + sv.round + ': ' + sv.teams.map(t => t.name + ' ' + fmt(t.score)).slice(0, 3).join(', ') + (sv.teams.length > 3 ? '…' : '');
  } else rb.style.display = 'none';
  syncVol();
}
function addTeam() {
  const inp = $('teamInput'), name = inp.value.trim().replace(/\s+/g, ' ').slice(0, 16);
  if (!name) { inp.focus(); return; }
  if (cfg.teams.length >= 6) return;
  if (cfg.teams.some(t => t.toLowerCase() === name.toLowerCase())) { $('teamHint').textContent = 'That name is taken.'; inp.select(); return; }
  cfg.teams.push(name); inp.value = ''; saveCfg(); renderSetup(); inp.focus();
}
$('teamInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addTeam(); } });
$('btnAdd').addEventListener('click', addTeam);
$('btnStart').addEventListener('click', () => startGame());
$('btnResume').addEventListener('click', resumeGame);
$('musicKey').addEventListener('click', () => setMusic(!cfg.music));
$('btnAgain').addEventListener('click', () => { const names = S.teams.map(t => t.name); drop(SAVE_KEY); clearInterval(fwH); startGame(names); });
$('btnNewTeams').addEventListener('click', () => { drop(SAVE_KEY); clearInterval(fwH); screen('setup'); });

/* ═══════════════ CONTROLS: sound, music, volume, theme ═══════════════ */
function setMusic(on) {
  cfg.music = !!on; saveCfg();
  if (cfg.music && actx && !cfg.muted) Music.start(actx);
  if (!cfg.music) Music.stop();
  renderIcons(); if ($('setup').classList.contains('on')) renderSetup();
}
function setMuted(m) {
  cfg.muted = !!m; saveCfg();
  if (cfg.muted) Music.stop(); else if (cfg.music && actx) Music.start(actx);
  renderIcons();
}
function setVol(v) {
  cfg.volume = Math.max(0, Math.min(100, Math.round(v))); Music.setVolume(cfg.volume / 100); saveCfg(); syncVol(); renderIcons();
}
function syncVol() {
  [['volSetup', 'volSetupPct'], ['volTop', 'volTopPct']].forEach(([id, pid]) => {
    const s = $(id); s.value = cfg.volume; s.style.setProperty('--pct', cfg.volume + '%'); s.setAttribute('aria-valuetext', cfg.volume + '%'); $(pid).textContent = cfg.volume + '%';
  });
}
['volSetup', 'volTop'].forEach(id => {
  const s = $(id);
  s.addEventListener('input', () => setVol(+s.value));
  s.addEventListener('keydown', e => {
    const d = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5 }[e.key];
    if (d) { e.preventDefault(); e.stopPropagation(); setVol(cfg.volume + d); }
  });
});
function renderIcons() {
  $('soundBtn').innerHTML = '<svg viewBox="0 0 24 24">' + IC.spk + (cfg.muted
    ? '<path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'
    : '<path d="M15.5 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>') + '</svg>';
  const silent = !cfg.music || cfg.muted || cfg.volume === 0;
  $('musicBtn').innerHTML = '<svg viewBox="0 0 24 24">' + IC.note + (silent
    ? '<path d="M3 3l18 18" stroke="#d0282f" stroke-width="2.6" stroke-linecap="round"/>'
    : (cfg.volume < 40 ? '<path d="M21 9.5q1.5 1.5 0 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' : '<path d="M21 8.5q2 2.5 0 5M22.6 6.6q3 4.4 0 8.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>')) + '</svg>';
  $('musicBtn').setAttribute('aria-pressed', cfg.music ? 'true' : 'false');
  $('soundBtn').setAttribute('aria-pressed', cfg.muted ? 'false' : 'true');
}
$('soundBtn').addEventListener('click', () => { setMuted(!cfg.muted); toast(cfg.muted ? 'Sound off' : 'Sound on'); });
$('musicBtn').addEventListener('click', () => { setMusic(!cfg.music); $('musicWrap').classList.add('open'); toast(cfg.music ? 'Music on' : 'Music off'); });
$('musicWrap').addEventListener('mouseleave', () => $('musicWrap').classList.remove('open'));
$('themeBtn').innerHTML = IC.sun;
$('themeBtn').addEventListener('click', () => {
  if (typeof window.toggleTheme === 'function') { window.toggleTheme(); return; }
  const h = document.documentElement, n = h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  h.setAttribute('data-theme', n); try { localStorage.setItem('arschul:theme', n); } catch (e) {}
});
$('menuBtn').innerHTML = IC.menu;
$('menuBtn').addEventListener('click', () => { save(); screen('setup'); });
let toastH = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastH); toastH = setTimeout(() => t.classList.remove('show'), 1100); }

/* ═══════════════ KEYBOARD ═══════════════ */
document.addEventListener('keydown', e => {
  const typing = e.target && e.target.tagName === 'INPUT' && e.target.type === 'text';
  if (typing) return;
  const k = e.key;
  if (e.shiftKey && (k === 'D' || k === 'd')) { e.preventDefault(); toggleDebug(); return; }
  if (e.shiftKey && (k === 'N' || k === 'n')) { e.preventDefault(); setMusic(!cfg.music); toast(cfg.music ? 'Music on' : 'Music off'); return; }
  if (k === '{' || k === '}' || (e.shiftKey && (k === '[' || k === ']'))) {
    e.preventDefault(); setVol(cfg.volume + ((k === ']' || k === '}') ? 10 : -10)); toast('Music volume ' + cfg.volume + '%'); return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if ((k === 'm' || k === 'M') && !e.shiftKey) { setMuted(!cfg.muted); toast(cfg.muted ? 'Sound off' : 'Sound on'); return; }
  if (!S || !$('game').classList.contains('on') || e.shiftKey) return;
  if (/^[1-6]$/.test(k)) { e.preventDefault(); doBuzz(+k - 1); return; }
  if (k === 'Enter' && e.target && e.target.tagName === 'BUTTON') return;
  const l = k.toLowerCase();
  if (l === 'c') act('correct');
  else if (l === 'x') act('wrong');
  else if (l === 'r') act('reveal');
  else if (l === 's') act('skip');
  else if (l === 'n' || k === 'Enter') { const b = E.buttons(S); for (const x of ['continue', 'next', 'winner']) if (b.indexOf(x) >= 0) { e.preventDefault(); act(x); break; } }
});

/* ═══════════════ DEBUG (Shift+D) ═══════════════ */
function toggleDebug() { const d = $('dbg'); d.classList.toggle('on'); if (d.classList.contains('on')) renderDebug(); }
function renderDebug() {
  const d = $('dbg');
  let h = '<b>Word Buzz debug</b><div>phase: ' + (S ? S.phase : '—') + (S && S.word ? ' · ' + esc(S.word.word) : '') + '</div>';
  h += '<div>music: ' + JSON.stringify(Music.state) + '</div>';
  if (S) S.teams.forEach((t, i) => { h += '<div class="row">' + esc(t.name) + ' ' + t.score + ' <button data-d="dec' + i + '">−1</button><button data-d="inc' + i + '">+1</button></div>'; });
  h += '<div class="row"><button data-d="timeup">Time\'s up</button><button data-d="win">Winner now</button></div>';
  h += '<div class="row"><button data-d="clear">Clear save</button><button data-d="close">Close</button></div>';
  d.innerHTML = h;
  d.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.d;
    if (c === 'close') { d.classList.remove('on'); return; }
    if (c === 'clear') { drop(SAVE_KEY); renderDebug(); return; }
    if (!S) return;
    if (c.startsWith('inc') || c.startsWith('dec')) { const i = +c.slice(3); S.teams[i].score += c.startsWith('inc') ? 1 : -1; if (pods[i]) renderScore(i, 'bump'); save(); }
    if (c === 'timeup' && (S.phase === 'running' || S.phase === 'typing')) { S.typePos = S.word.def.length; S.timeLeft = 0; S.phase = 'timeup'; setDefText(); onTimeUp(); }
    if (c === 'win' && S.phase !== 'over') { S.winner = E.standings(S)[0].i; S.phase = 'won'; doWinner(); }
    renderDebug();
  }));
}

/* ═══════════════ BOOT ═══════════════ */
renderIcons(); renderSetup(); Music.setVolume(cfg.volume / 100);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S && S.word && $('game').classList.contains('on') && S.typePos === 0) fitDef(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });
</script>
</body>
</html>
